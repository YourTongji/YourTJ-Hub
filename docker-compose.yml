services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yourtj
      POSTGRES_PASSWORD: yourtj
      POSTGRES_DB: yourtj
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourtj"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: yourtj-dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"


volumes:
  pgdata:
