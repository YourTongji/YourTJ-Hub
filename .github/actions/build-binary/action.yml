name: build-binary
description: Build frontend + Go static binary, upload as yourtj-hub artifact

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 11
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: apps/gooseforum/resource/pnpm-lock.yaml
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: apps/gooseforum/go.mod
        cache-dependency-path: apps/gooseforum/go.sum
    - name: Build frontend
      shell: bash
      working-directory: ${{ github.workspace }}/apps/gooseforum/resource
      run: |
        pnpm install --frozen-lockfile
        pnpm build
    - name: Build binary (static, no cgo for alpine/musl)
      shell: bash
      working-directory: ${{ github.workspace }}/apps/gooseforum
      run: |
        source_sha=$(git rev-parse HEAD)
        CGO_ENABLED=0 go build -tags nodynamic -ldflags "-X github.com/YourTongji/YourTJ-Hub/apps/gooseforum/app/bundles/buildinfo.Version=dev -X github.com/YourTongji/YourTJ-Hub/apps/gooseforum/app/bundles/buildinfo.Commit=$source_sha" -o ../../bin/yourtj-hub .
    - name: Start the artifact in Alpine before upload
      shell: bash
      run: bash deploy/scripts/check-runtime-binary.sh bin/yourtj-hub
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: yourtj-hub
        path: bin/yourtj-hub
        retention-days: 3
