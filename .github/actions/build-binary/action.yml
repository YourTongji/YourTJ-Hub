name: build-binary
description: Build frontend + Go static binary, upload as yourtj-hub artifact

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 11
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: apps/gooseforum/resource/pnpm-lock.yaml
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: "1.26"
        cache-dependency-path: apps/gooseforum/go.sum
    - name: Build frontend
      shell: bash
      working-directory: ${{ github.workspace }}/apps/gooseforum/resource
      run: |
        pnpm install --frozen-lockfile
        pnpm build
    - name: Build binary (static, no cgo for alpine/musl)
      shell: bash
      working-directory: ${{ github.workspace }}/apps/gooseforum
      run: CGO_ENABLED=0 go build -o ../../bin/yourtj-hub .
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: yourtj-hub
        path: bin/yourtj-hub
        retention-days: 3
