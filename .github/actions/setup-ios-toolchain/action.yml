name: Select the reviewed iOS toolchain
description: Pin Xcode 27.2 (27B52) and verify the device SDK before signing a new iOS build.
runs:
  using: composite
  steps:
    - name: Select Xcode 27.2 release
      shell: bash
      env:
        DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      run: |
        test -d "$DEVELOPER_DIR"
        xcode_version="$(xcodebuild -version)"
        printf '%s\n' "$xcode_version"
        if [[ "$xcode_version" != $'Xcode 27.2\nBuild version 27B52' ]]; then
          echo 'Expected Xcode 27.2 release (27B52); RC and beta builds are not approved.' >&2
          exit 1
        fi
        sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
        if [[ "$sdk_version" != '27.2' ]]; then
          echo "Expected iOS 27.2 SDK, found $sdk_version" >&2
          exit 1
        fi
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
