name: Select the reviewed iOS toolchain
description: Select Xcode 27.2 and verify the device SDK; only dev previews may use the reviewed RC.
inputs:
  purpose:
    description: dev permits RC 27B48; production and its rehearsals require release 27B52.
    default: production
runs:
  using: composite
  steps:
    - name: Select reviewed Xcode 27.2 toolchain
      shell: bash
      env:
        DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        YOURTJ_IOS_BUILD_PURPOSE: ${{ inputs.purpose }}
      run: |
        bash "${{ github.action_path }}/../../../scripts/mobile-release/select_ios_toolchain.sh"
