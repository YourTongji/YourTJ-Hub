name: Select the reviewed iOS toolchain
description: Select an approved Xcode 27.2 build and verify the device SDK before signing.
inputs:
  purpose:
    description: Build purpose (dev or production); both require reviewed Xcode 27.2 build 27B52 or 27B48.
    default: production
runs:
  using: composite
  steps:
    - name: Select reviewed Xcode 27.2 toolchain
      shell: bash
      env:
        DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        YOURTJ_IOS_BUILD_PURPOSE: ${{ inputs.purpose }}
      run: |
        bash "${{ github.action_path }}/../../../scripts/mobile-release/select_ios_toolchain.sh"
