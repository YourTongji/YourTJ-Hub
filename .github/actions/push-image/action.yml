name: push-image
description: Stage the built binary and push the GHCR image with a parameterized tag

inputs:
  tag:
    description: Image tag suffix, e.g. dev-<sha> or main-<sha>
    required: true
  github-token:
    description: GITHUB_TOKEN for GHCR login (composite actions cannot read the secrets context directly)
    required: true
  immutable:
    description: Refuse a release-tag push unless the registry proves the tag is absent
    default: 'false'

outputs:
  digest:
    description: Immutable pushed image digest
    value: ${{ steps.image.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: yourtj-hub
        path: ./bin
    - name: Stage binary into build context
      shell: bash
      run: |
        cp bin/yourtj-hub deploy/yourtj-hub
        # upload/download-artifact 不保留 Unix 执行位, 必须显式恢复,
        # 否则镜像入口 /app/yourtj-hub 无执行权限导致部署回滚
        chmod +x deploy/yourtj-hub
    - name: Log in to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    # GHCR 包首次创建默认 private: 首次运行后需手动把包设为 public,
    # 否则服务器匿名 pull 401(见 docs/operations/deployment.md 迁移 runbook)
    - name: Reject uncertain or existing immutable image
      if: inputs.immutable == 'true'
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.tag }}
      run: python3 scripts/release/image_guard.py "ghcr.io/yourtongji/yourtj-hub:$IMAGE_TAG"
    - name: Build and push image
      id: image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: deploy/
        file: deploy/Dockerfile
        push: true
        tags: ghcr.io/yourtongji/yourtj-hub:${{ inputs.tag }}
