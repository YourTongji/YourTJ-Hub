# GitHub Dependabot (issue #410): 自动升级 apps/gooseforum 的 Go 依赖(含间接依赖)。
# 分工: govulncheck(ci-govulncheck.yml 的 ci-backend-govulncheck job)负责"可达漏洞"告警,
# Dependabot 负责把 go.mod/go.sum 及时升到含修复的版本, 缩小漏洞窗口。
# 升级 PR 会触发 ci-backend 全量测试与 govulncheck, 两者通过才可合并。
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/apps/gooseforum"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  # GitHub Actions 的 pin 分布在两处: 仓库根部 .github/workflows/** 与本地 composite action
  # (.github/actions/*/action.yml)。github-actions 生态下 directory "/" 只覆盖前者(以及仓库根目录的
  # action.yml), 所以两处都要写进 directories (支持通配; directory 不支持)。二者放在同一条目并共用
  # 一个 group: 同一次 action 升级只产生一个 PR, 避免 workflow 侧与 composite 侧各开一个 PR 而在
  # 合入顺序上互相不一致 (issue #1212)。
  # Dependabot alert 不覆盖这些文件: GitHub Actions manifest 必须在 .github/workflows/ 下, 且 alert
  # 只对语义化版本引用生成、不对 SHA 钉版生成。
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
