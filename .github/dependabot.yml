# GitHub Dependabot (issue #410): 自动升级 apps/gooseforum 的 Go 依赖(含间接依赖)。
# 分工: govulncheck(ci-govulncheck.yml 的 ci-backend-govulncheck job)负责"可达漏洞"告警,
# Dependabot 负责把 go.mod/go.sum 及时升到含修复的版本, 缩小漏洞窗口。
# 升级 PR 会触发 ci-backend 全量测试与 govulncheck, 两者通过才可合并。
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/apps/gooseforum"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # 本地 composite action (.github/actions/*/action.yml) 里钉的 action (issue #1212)。
  # 上面的 "/" 条目不覆盖它们: github-actions 生态下 "/" 只含 .github/workflows/** 与仓库根目录的
  # action.yml, 所以这些 pin 拿不到计划性升级 PR, 只能靠人工 sync 提交补。Dependabot alert 同样不覆盖
  # 它们: GitHub Actions manifest 必须在 .github/workflows/ 下, 且 alert 只对语义化版本引用生成、不对
  # SHA 钉版生成。directories 支持通配 (directory 不支持), 每个匹配目录各自成为一个更新任务。
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      composite-actions:
        patterns: ["*"]
