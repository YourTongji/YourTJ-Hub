name: deploy-dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "research/**"
      - "**.md"
      - ".playwright-mcp/**"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-binary

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yourtj-hub
          path: ./bin
      - name: Upload binary to dev host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          source: "bin/yourtj-hub"
          target: "/tmp"
          strip_components: 1
      - name: Deploy to dev (sync db from main + build image + restart + smoke)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          script: |
            set -e
            # 1. 同步 main 数据库一致性快照(dev 用 main 真实数据预演迁移)
            /opt/yourtj/scripts/sync-db-from-main.sh
            # 2. 构建镜像 + 部署 + 健康检查(失败自动回滚), dev 对外端口 5235
            /opt/yourtj/scripts/deploy.sh dev /tmp/yourtj-hub dev-${{ github.sha }} 5235
