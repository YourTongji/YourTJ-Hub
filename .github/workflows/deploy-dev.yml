name: deploy-dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "research/**"
      - "**.md"
      - ".playwright-mcp/**"
      # wiki 内容(含飞书同步)变更必须触发部署, 抵消上面 **.md 的忽略
      - "!wiki/**"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-binary

  wiki-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Build wiki static site
        run: |
          cd wiki
          COREPACK_ENABLE_PROJECT_SPEC=0 pnpm install --frozen-lockfile
          pnpm build
        # secret 经 env 映射注入(security N1): 避免内联 shell 展开
        # 引入命令注入面(secret 内容变化时); 未配置时为空串,
        # Layout.vue trim 后判定为无评论, 构建不失败
        env:
          VITE_WALINE_SERVER_URL: ${{ secrets.WIKI_WALINE_SERVER_URL }}
      - name: Package wiki dist
        run: tar -czf wiki-dist.tar.gz -C wiki/.vitepress/dist .
      - name: Upload wiki dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-dist
          path: wiki-dist.tar.gz
          retention-days: 7

  deploy:
    needs: [build, wiki-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yourtj-hub
          path: ./bin
      - uses: actions/download-artifact@v4
        with:
          name: wiki-dist
          path: ./wiki-dist
      - name: Upload binary to dev host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          source: "bin/yourtj-hub"
          target: "/tmp"
          strip_components: 1
      - name: Upload wiki dist to dev host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          source: "wiki-dist/wiki-dist.tar.gz"
          target: "/tmp"
          strip_components: 2
      - name: Upload deploy script to dev host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          source: "deploy/scripts/deploy.sh,deploy/scripts/sync-db-from-main.sh,deploy/scripts/deploy-wiki.sh"
          target: "/tmp"
          strip_components: 2
      - name: Deploy to dev (sync db from main + build image + restart + smoke)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          script: |
            set -e
            # 0. 同步仓库最新脚本到服务器(install 保证可执行位)。
            install -m 0755 /tmp/deploy.sh /opt/yourtj/scripts/deploy.sh
            install -m 0755 /tmp/sync-db-from-main.sh /opt/yourtj/scripts/sync-db-from-main.sh
            install -m 0755 /tmp/deploy-wiki.sh /opt/yourtj/scripts/deploy-wiki.sh
            # 1. 同步 main 数据库一致性快照(dev 用 main 真实数据预演迁移)
            /opt/yourtj/scripts/sync-db-from-main.sh
            # 2. 构建镜像 + 部署 + 健康检查(失败自动回滚), dev 对外端口 5235
            #    dev 部署频繁, 镜像只保留最近 3 个(含当前) + prev
            IMAGE_KEEP_N=3 /opt/yourtj/scripts/deploy.sh dev /tmp/yourtj-hub dev-${{ github.sha }} 5235
            # 3. wiki 静态站部署(nginx 镜像, 端口 5285), 同样失败回滚
            IMAGE_KEEP_N=3 /opt/yourtj/scripts/deploy-wiki.sh dev /tmp/wiki-dist.tar.gz wiki-dev-${{ github.sha }} 5285
