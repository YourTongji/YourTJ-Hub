name: deploy-dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "research/**"
      - "**.md"
      - ".playwright-mcp/**"

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/gooseforum/resource/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/gooseforum/go.sum
      - name: Build frontend
        working-directory: apps/gooseforum/resource
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build binary
        working-directory: apps/gooseforum
        run: go build -o ../../bin/yourtj-hub .
      - uses: actions/upload-artifact@v4
        with:
          name: yourtj-hub
          path: bin/yourtj-hub
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Upload binary to dev host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "bin/yourtj-hub"
          target: "/tmp"
          strip_components: 1
      - name: Deploy to dev (sync db from main + restart + smoke)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            # 1. 同步 main 数据库一致性快照(dev 用 main 真实数据预演迁移)
            /srv/yourtj/scripts/sync-db-from-main.sh
            # 2. 上传的新二进制已在 /tmp, 交给 deploy.sh 统一安装/重启/回滚
            /srv/yourtj/scripts/deploy.sh dev /tmp/yourtj-hub 5235
