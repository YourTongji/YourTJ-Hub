name: Deploy / dev
on:
  workflow_run:
    workflows: ['CI / Verify']
    types: [completed]
    branches: [dev]
permissions:
  contents: read
  actions: read
# Configuration and database mutation must not be cancelled by a newer push.
concurrency:
  group: instance-mutate-dev
  cancel-in-progress: false
  queue: max
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.eligible.outputs.eligible }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev
          persist-credentials: false
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/deploy_gate.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: steps.source.outputs.eligible == 'true'
        with:
          name: ci-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .ci-plan
      - id: eligible
        if: steps.source.outputs.eligible == 'true'
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          plan=json.loads(Path('.ci-plan/ci-plan.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('eligible='+str(plan['deploy']['run'] is True).lower()+'\n')
          PY
  build:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-binary

  build-image:
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/push-image
        with:
          tag: dev-${{ needs.gate.outputs.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [gate, build, build-image]
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Reject an obsolete candidate before configuration or database mutation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
        run: test "$(gh api repos/YourTongji/YourTJ-Hub/git/ref/heads/dev --jq .object.sha)" = "$SOURCE_SHA"
      # 渲染实例 config（dev 环境 secrets; dev GitHub 凭据留空 → 渲染 allow-empty）
      - name: Render dev config
        uses: ./.github/actions/render-config
        with:
          env: dev
          campus-client-id: ${{ secrets.CAMPUS_CLIENT_ID }}
          campus-client-secret: ${{ secrets.CAMPUS_CLIENT_SECRET }}
          campus-redirect-uri: ${{ secrets.CAMPUS_REDIRECT_URI }}
          campus-encryption-key: ${{ secrets.CAMPUS_ENCRYPTION_KEY }}
          campus-identity-key: ${{ secrets.CAMPUS_IDENTITY_KEY }}
          signing-key: ${{ secrets.SIGNING_KEY }}
          pg-dsn: ${{ secrets.PG_DSN }}
          meili-master-key: ${{ secrets.MEILI_MASTER_KEY }}
          wiki-webhook-secret: ${{ secrets.WIKI_WEBHOOK_SECRET }}
          # dev 有意不设 GitHub 凭据(DB siteUrl 无环境隔离); gh inputs 留空
          gh-client-id: ""
          gh-client-secret: ""
          # Apple credentials stay empty: dev snapshots must not revoke production grants.
          apple-client-id: ""
          apple-team-id: ""
          apple-key-id: ""
          apple-private-key-base64: ""
          google-client-id: ""
          google-client-secret: ""
          ai-api-key: ""
      # 上传到 run-specific 路径, 避免与 deploy-main 并发部署时
      # 互相覆盖 /tmp 下的同名文件(见 PR review #1)
      - name: Upload deploy scripts to dev host
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          source: "deploy/scripts/deploy.sh,deploy/scripts/sync-db-from-main.sh,deploy/scripts/pgdsn.sh,deploy/scripts/apply-config.sh,deploy/scripts/rotate-agent-epoch.py"
          target: "/tmp/yourtj-deploy-${{ github.run_id }}"
          strip_components: 2
      - name: Upload rendered dev config to dev host
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          source: "deploy/rendered/config-dev.toml"
          target: "/tmp/yourtj-deploy-${{ github.run_id }}"
          strip_components: 2
      # compose 由 init-server.sh 一次性安装到服务器, dev 部署不更新它,
      # 避免 dev 分支的 compose 变更影响共享的生产实例(PR review #3)。
      # 部署只需 pull 镜像 + up 已有 compose 中的服务
      - name: Deploy to dev (sync db from main + pull image + restart + smoke)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          script: |
            set -e
            RUN_DIR=/tmp/yourtj-deploy-${{ github.run_id }}
            # 0. 同步仓库最新脚本到服务器(install 保证可执行位)。
            #    sync-db-from-main.sh source pgdsn.sh, 必须一并下发, 否则
            #    set -e 下 source 失败阻断部署(review W2)。
            install -m 0755 "$RUN_DIR/deploy.sh" /opt/yourtj/scripts/deploy.sh
            install -m 0755 "$RUN_DIR/sync-db-from-main.sh" /opt/yourtj/scripts/sync-db-from-main.sh
            install -m 0755 "$RUN_DIR/pgdsn.sh" /opt/yourtj/scripts/pgdsn.sh
            install -m 0755 "$RUN_DIR/apply-config.sh" /opt/yourtj/scripts/apply-config.sh
            install -m 0755 "$RUN_DIR/rotate-agent-epoch.py" /opt/yourtj/scripts/rotate-agent-epoch.py
            # 1. 同步 main 数据库一致性快照(dev 用 main 真实数据预演迁移)
            /opt/yourtj/scripts/sync-db-from-main.sh
            # 2. 拉取 GHCR 镜像 + 部署 + 健康检查(失败自动回滚), dev 对外端口 5235
            #    dev 部署频繁, 镜像只保留最近 3 个(含当前) + prev
            #    CONFIG_FILE 携带渲染 config: 与镜像同一回滚事务原子替换
            IMAGE_KEEP_N=3 CONFIG_FILE="$RUN_DIR/config-dev.toml" \
              /opt/yourtj/scripts/deploy.sh dev dev-${{ needs.gate.outputs.sha }} 5235
            # 3. 部署成功/失败后清理本 run 上传的临时文件(含明文渲染 config)
            rm -rf "$RUN_DIR"
