name: CI / automation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/mobile-release -p 'test_*.py'
      - run: node --test scripts/test-mobile-ci-*.mjs scripts/test-oryn-validation.mjs
      - run: bash deploy/scripts/pgdsn_test.sh
      - run: python3 deploy/render_config_test.py
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26'
      - name: Check all workflow contracts
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint -ignore 'unexpected key "queue" for "concurrency" section'
