name: contract

on:
  push:
    paths:
      - "apps/gooseforum/app/**"
      - "packages/api-contract/**"
  pull_request:
    paths:
      - "apps/gooseforum/app/**"
      - "packages/api-contract/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate openapi.yaml (placeholder until the contract pipeline exists)
        working-directory: packages/api-contract
        run: |
          test -f openapi.yaml && echo "openapi.yaml exists" || echo "TODO: generate openapi.yaml once the contract pipeline exists"
