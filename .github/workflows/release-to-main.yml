name: Release / main

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Server version increment (waits for PR CI, merges and releases automatically)"
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: server-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for PR CI, merge dev into main and tag the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BUMP: ${{ inputs.bump }}
        run: |
          python3 scripts/mobile-release/prepare_server.py

  publish:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/gooseforum/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/gooseforum/resource/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: apps/gooseforum/resource
        run: pnpm install --frozen-lockfile

      - name: 构建并发布 release 二进制资产
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: apps/gooseforum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 触发生产部署(deploy-main)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Dispatch the published tag so every deployment job uses the same
          # commit as the release binaries, even if main advances meanwhile.
          gh workflow run deploy-main.yml --ref "$RELEASE_TAG"
          echo "已触发 deploy-main workflow 部署 $RELEASE_TAG"
