name: mobile-golden-refresh

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Git ref (branch, tag, or SHA) to render page goldens from. Defaults
          to the default branch HEAD.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  render:
    name: render-page-goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - name: Bootstrap
        working-directory: apps/mobile
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Render page goldens
        working-directory: apps/mobile/packages/forum_app
        run: flutter test --update-goldens test/golden/pages_golden_test.dart
      - name: Archive page goldens
        run: >-
          tar -czf page-goldens.tar.gz
          -C apps/mobile/packages/forum_app/test/golden golden/pages
      - uses: actions/upload-artifact@v4
        with:
          name: page-goldens
          path: page-goldens.tar.gz
          if-no-files-found: error
          retention-days: 1
