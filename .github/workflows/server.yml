name: server

on:
  push:
    paths:
      - "apps/server/**"
  pull_request:
    paths:
      - "apps/server/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet
        working-directory: apps/server
        run: go vet ./...
      - name: Test
        working-directory: apps/server
        run: go test ./...
      - name: Build
        working-directory: apps/server
        run: go build ./cmd/server
