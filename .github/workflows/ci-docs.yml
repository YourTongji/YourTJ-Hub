name: CI / Documentation

on:
  workflow_call:
    inputs:
      source:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ci-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node --test scripts/test-doc-links.mjs
      - run: node --test scripts/test-verify-decisions.mjs
      - run: node --test scripts/test-generate-decisions-index.mjs
      - run: node scripts/run-gates.mjs
      - name: Generate decision index and job summary
        run: |
          source=$(git rev-parse HEAD)
          node scripts/generate-decisions-index.mjs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$source/docs/decisions/" > "$RUNNER_TEMP/decisions-index.md"
          cat "$RUNNER_TEMP/decisions-index.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload decision index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: decision-index
          path: ${{ runner.temp }}/decisions-index.md
          if-no-files-found: error
          retention-days: 7
