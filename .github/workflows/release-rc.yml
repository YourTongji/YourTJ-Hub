name: Release / RC
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Optional already-prepared request; empty prepares a new RC
        type: string
      scope: {description: 'RC platforms', type: choice, options: [mobile, web, android, ios], default: mobile}
      source: {description: 'Fixed main-history SHA; main resolves once', type: string, default: main}
      version: {description: 'Optional final X.Y.Z', type: string}
      bump: {description: 'Version increment', type: choice, options: [patch, minor, major], default: patch}
      ios_destination: {description: 'Final iOS targets', type: choice, options: [app-store, testflight], default: app-store}
      draft_notes: {description: 'Optional AI notes drafting', type: boolean, default: false}
      existing_release: {description: 'Optional published schema-4 TestFlight request to promote unchanged to App Store', type: string}
permissions:
  contents: write
  actions: read
  deployments: write
  packages: write
  pull-requests: read
  checks: read
concurrency:
  group: ${{ (startsWith(inputs.candidate, 'web-') || (inputs.candidate == '' && inputs.scope == 'web')) && 'release-web-packaging' || 'release-mobile-packaging' }}
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.candidate == ''
    uses: ./.github/workflows/release-prepare.yml
    with:
      scope: ${{ inputs.scope }}
      source: ${{ inputs.source }}
      version: ${{ inputs.version }}
      bump: ${{ inputs.bump }}
      ios_destination: ${{ inputs.ios_destination }}
      draft_notes: ${{ inputs.draft_notes }}
      existing_release: ${{ inputs.existing_release }}
    secrets: inherit
  identity:
    needs: prepare
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    environment: mobile-release
    concurrency:
      group: release-candidate-${{ inputs.candidate || needs.prepare.outputs.candidate }}
      cancel-in-progress: false
      queue: max
    outputs:
      candidate: ${{ steps.identity.outputs.candidate }}
      source: ${{ steps.identity.outputs.source }}
      version: ${{ steps.identity.outputs.version }}
      number: ${{ steps.identity.outputs.number }}
      tag: ${{ steps.identity.outputs.tag }}
      platforms: ${{ steps.identity.outputs.platforms }}
      display: ${{ steps.identity.outputs.display_build }}
      ios_number: ${{ steps.identity.outputs.ios_number }}
      metadata_only: ${{ steps.identity.outputs.metadata_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate || needs.prepare.outputs.candidate }}
        run: python3 scripts/release/rc.py begin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.identity.outputs.new_identity == 'true'
        with:
          name: rc-identity
          path: rc-identity.json
          if-no-files-found: error
          retention-days: 90
  android:
    needs: identity
    if: ${{ !cancelled() && needs.identity.result == 'success' && contains(fromJSON(needs.identity.outputs.platforms), 'android') }}
    uses: ./.github/workflows/release-android.yml
    with:
      candidate: ${{ needs.identity.outputs.candidate }}
      source: ${{ needs.identity.outputs.source }}
      version: ${{ needs.identity.outputs.version }}
      number: ${{ needs.identity.outputs.number }}
      display_build: ${{ needs.identity.outputs.display }}
      tag: ${{ needs.identity.outputs.tag }}
      rc_build: true
    secrets: inherit
  ios:
    needs: identity
    if: ${{ !cancelled() && needs.identity.result == 'success' && contains(fromJSON(needs.identity.outputs.platforms), 'ios') }}
    uses: ./.github/workflows/release-ios.yml
    with:
      candidate: ${{ needs.identity.outputs.candidate }}
      source: ${{ needs.identity.outputs.source }}
      version: ${{ needs.identity.outputs.version }}
      number: ${{ needs.identity.outputs.number }}
      display_build: ${{ needs.identity.outputs.display }}
      ios_number: ${{ needs.identity.outputs.ios_number }}
      channels: '["ios-testflight"]'
      rc_build: true
    secrets: inherit
  web:
    needs: identity
    if: ${{ !cancelled() && needs.identity.result == 'success' && contains(fromJSON(needs.identity.outputs.platforms), 'web') }}
    uses: ./.github/workflows/release-web.yml
    with:
      candidate: ${{ needs.identity.outputs.candidate }}
      source: ${{ needs.identity.outputs.source }}
      tag: ${{ needs.identity.outputs.tag }}
      rc_build: true
    secrets: inherit
  ready:
    needs: [identity, android, ios, web]
    if: always() && needs.identity.result == 'success' && needs.identity.outputs.metadata_only != 'true'
    runs-on: ubuntu-latest
    environment: mobile-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: rc-result-*
          path: rc-results
          merge-multiple: true
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 scripts/release/rc.py collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc-record-${{ github.run_attempt }}
          path: rc-record.json
          if-no-files-found: error
          retention-days: 90
      - name: Mint the existing release preparation identity
        id: author
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.ORYN_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORYN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-actions: read
      - name: Select these artifacts in the editable release request
        env: {GH_TOKEN: '${{ steps.author.outputs.token }}'}
        run: python3 scripts/release/rc.py attach
