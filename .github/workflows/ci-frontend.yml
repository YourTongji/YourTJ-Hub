name: CI / frontend

on:
  workflow_call:
    inputs:
      source:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ci-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/gooseforum/resource/pnpm-lock.yaml
      - name: Install
        working-directory: apps/gooseforum/resource
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/gooseforum/resource
        run: pnpm typecheck
      - name: Test
        working-directory: apps/gooseforum/resource
        run: pnpm test
      - name: Install browser for layout tests
        working-directory: apps/gooseforum/resource
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser layout tests
        id: browser
        working-directory: apps/gooseforum/resource
        env:
          CAMPUS_MAP_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/campus-map-browser-evidence
        run: pnpm test:browser
      - name: Preserve campus map browser evidence
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: campus-map-browser-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/campus-map-browser-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Check i18n keys
        working-directory: apps/gooseforum/resource
        run: pnpm check
      - name: Build
        working-directory: apps/gooseforum/resource
        run: pnpm build
