name: deploy-main

on:
  # 生产部署唯一入口: release-to-main 显式触发, 不监听 push
  # (防止直接 push main 导致意外/双重复部署)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-binary

  wiki-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm via corepack
        run: |
          corepack enable
          # wiki 是独立 workspace(防外层 packageManager 干扰); 显式指定 pnpm 版本
          corepack prepare pnpm@9.15.4 --activate
      - name: Build wiki static site
        run: |
          cd wiki
          COREPACK_ENABLE_PROJECT_SPEC=0 pnpm install --frozen-lockfile
          pnpm build
        # secret 经 env 映射注入(security N1): 避免内联 shell 展开
        # 引入命令注入面(secret 内容变化时); 未配置时为空串,
        # Layout.vue trim 后判定为无评论, 构建不失败
        env:
          VITE_WALINE_SERVER_URL: ${{ secrets.WIKI_WALINE_SERVER_URL }}
      - name: Package wiki dist
        run: tar -czf wiki-dist.tar.gz -C wiki/.vitepress/dist .
      - name: Upload wiki dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-dist
          path: wiki-dist.tar.gz
          retention-days: 7

  deploy:
    needs: [build, wiki-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yourtj-hub
          path: ./bin
      - uses: actions/download-artifact@v4
        with:
          name: wiki-dist
          path: ./wiki-dist
      - name: Upload binary to prod host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          source: "bin/yourtj-hub"
          target: "/tmp"
          strip_components: 1
      - name: Upload wiki dist to prod host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          source: "wiki-dist/wiki-dist.tar.gz"
          target: "/tmp"
          # 路径仅 2 层(wiki-dist/wiki-dist.tar.gz), strip 1 恰好剩文件名;
          # strip 2 会剥光路径导致解包为空目录(review 实测)
          strip_components: 1
      - name: Upload deploy scripts to prod host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          source: "deploy/scripts/deploy.sh,deploy/scripts/backup-db.sh,deploy/scripts/pgdsn.sh,deploy/scripts/deploy-wiki.sh,deploy/scripts/bootstrap-wiki-assets.sh"
          target: "/tmp"
          strip_components: 2
      - name: Upload wiki deploy assets to prod host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          # strip 1 保留相对结构: /tmp/build/wiki.Dockerfile + /tmp/docker-compose.yaml,
          # bootstrap-wiki-assets.sh 幂等安装到 /opt/yourtj(存量服务器免手动 init-server)
          source: "deploy/build/wiki.Dockerfile,deploy/build/wiki.nginx.conf,deploy/docker-compose.yaml"
          target: "/tmp"
          strip_components: 1
      - name: Deploy to main (backup db + build image + restart + smoke + rollback)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          script: |
            set -e
            # 0. 同步仓库最新脚本到服务器(install 保证可执行位)。
            #    backup-db.sh source pgdsn.sh, 必须一并下发, 否则 set -e 下
            #    source 失败阻断部署(review W2)。
            install -m 0755 /tmp/deploy.sh /opt/yourtj/scripts/deploy.sh
            install -m 0755 /tmp/backup-db.sh /opt/yourtj/scripts/backup-db.sh
            install -m 0755 /tmp/pgdsn.sh /opt/yourtj/scripts/pgdsn.sh
            install -m 0755 /tmp/deploy-wiki.sh /opt/yourtj/scripts/deploy-wiki.sh
            install -m 0755 /tmp/bootstrap-wiki-assets.sh /opt/yourtj/scripts/bootstrap-wiki-assets.sh
            # 0.5 幂等补齐 wiki 部署资产(Dockerfile/nginx.conf/compose 服务/.env WIKI_*),
            #     存量服务器无需手动重跑 init-server.sh
            /opt/yourtj/scripts/bootstrap-wiki-assets.sh
            # 1. 部署前一致性备份(保留最近 7 份)
            /opt/yourtj/scripts/backup-db.sh main
            # 2. 构建镜像 + 部署 + 健康检查(失败自动回滚), main 对外端口 5234
            #    生产保留更多回滚候选, 镜像保留最近 5 个(含当前) + prev
            IMAGE_KEEP_N=5 /opt/yourtj/scripts/deploy.sh main /tmp/yourtj-hub main-${{ github.sha }} 5234
            # 3. wiki 静态站部署(nginx 镜像, 端口 5284), 同样失败回滚
            IMAGE_KEEP_N=5 /opt/yourtj/scripts/deploy-wiki.sh main /tmp/wiki-dist.tar.gz wiki-main-${{ github.sha }} 5284
