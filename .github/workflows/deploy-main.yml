name: deploy-main

on:
  # 生产部署唯一入口: release-to-main 显式触发, 不监听 push
  # (防止直接 push main 导致意外/双重复部署)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-binary

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yourtj-hub
          path: ./bin
      - name: Upload binary to prod host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          source: "bin/yourtj-hub"
          target: "/tmp"
          strip_components: 1
      - name: Deploy to main (backup db + build image + restart + smoke + rollback)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || '22' }}
          script: |
            set -e
            # 1. 部署前一致性备份(保留最近 7 份)
            /opt/yourtj/scripts/backup-db.sh main
            # 2. 构建镜像 + 部署 + 健康检查(失败自动回滚), main 对外端口 5234
            /opt/yourtj/scripts/deploy.sh main /tmp/yourtj-hub main-${{ github.sha }} 5234
