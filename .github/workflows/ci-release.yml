name: CI / release request
on:
  workflow_call:
permissions:
  contents: read
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/release/workflow.py validate-pr
