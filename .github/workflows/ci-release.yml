name: CI / release request
on:
  workflow_call:
permissions:
  contents: read
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/release/workflow.py validate-pr
