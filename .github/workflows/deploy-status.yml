name: Deploy / status

on:
  push:
    branches: [main]
    paths:
      - 'apps/status/**'
      - '.github/workflows/deploy-status.yml'
      - '.github/workflows/ci-status.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-status-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && vars.STATUS_DEPLOYMENT_ENABLED == 'true'
    uses: ./.github/workflows/ci-status.yml
    with:
      source: ${{ github.sha }}
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: status-production
    defaults:
      run:
        working-directory: apps/status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/status/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          CONTEXT: production
          COMMIT_REF: ${{ github.sha }}
      - run: pnpm deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify deployed content and API
        env:
          COMMIT_REF: ${{ github.sha }}
        run: node scripts/verify-deployment.mjs https://status.yourtj.de
      - name: Deploy collection scheduler
        if: vars.STATUS_SCHEDULER_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm deploy:scheduler
