name: CI / contract

on:
  workflow_call:
    inputs:
      source:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ci-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/api-contract/pnpm-lock.yaml
      - name: Install contract tooling
        working-directory: packages/api-contract
        run: pnpm install --frozen-lockfile
      - name: Validate, bundle, and generate TypeScript types
        working-directory: packages/api-contract
        run: pnpm run check
      - name: Require generated TypeScript types to be committed
        run: git diff --exit-code -- apps/gooseforum/resource/packages/client/src/gen
      - name: Require generated route coverage matrix to be committed
        run: git diff --exit-code -- packages/api-contract/coverage-matrix.md
