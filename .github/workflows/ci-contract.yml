name: CI / contract

on:
  workflow_call:
    inputs:
      source:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ci-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/api-contract/pnpm-lock.yaml
      - name: Install contract tooling
        working-directory: packages/api-contract
        run: pnpm install --frozen-lockfile
      - name: Validate, bundle, and generate TypeScript types
        working-directory: packages/api-contract
        run: pnpm run check
      - name: Require generated TypeScript types to be committed
        run: git diff --exit-code -- apps/gooseforum/resource/packages/client/src/gen
      - name: Publish route coverage job summary
        run: |
          source=$(git rev-parse HEAD)
          printf 'Source: [%s](%s/%s/tree/%s)\n\n' "$source" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$source" > "$RUNNER_TEMP/api-route-coverage.md"
          cat packages/api-contract/.tmp/coverage-matrix.md >> "$RUNNER_TEMP/api-route-coverage.md"
          cat "$RUNNER_TEMP/api-route-coverage.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload route coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: api-route-coverage
          path: ${{ runner.temp }}/api-route-coverage.md
          if-no-files-found: error
          retention-days: 7
