name: CI / mobile

on:
  workflow_call:
    inputs:
      source:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - name: Bootstrap
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart run melos bootstrap
      - name: Analyze
        working-directory: apps/mobile
        run: dart run melos run analyze

  test:
    name: Test / ${{ matrix.package }} / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: auth, shard: 0, shards: 1 }
          - { package: core, shard: 0, shards: 1 }
          - { package: ui_kit, shard: 0, shards: 1 }
          - { package: forum_app, shard: 0, shards: 2 }
          - { package: forum_app, shard: 1, shards: 2 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - name: Bootstrap
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart run melos bootstrap
      - name: Test
        working-directory: apps/mobile/packages/${{ matrix.package }}
        # Each runner owns a Flutter SDK, so package jobs do not contend for its startup lock.
        run: flutter test --total-shards=${{ matrix.shards }} --shard-index=${{ matrix.shard }}
