name: CI / mobile

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/mobile/**"
      - "apps/gooseforum/resource/src/site/assets/logo.svg"
      - ".github/workflows/ci-mobile.yml"
      - ".github/workflows/release-mobile.yml"
      - ".github/workflows/release-to-main.yml"
      - ".github/workflows/deploy-main.yml"
      - "scripts/mobile-release/**"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/gooseforum/resource/src/site/assets/logo.svg"
      - ".github/workflows/ci-mobile.yml"
      - ".github/workflows/release-mobile.yml"
      - ".github/workflows/release-to-main.yml"
      - ".github/workflows/deploy-main.yml"
      - "scripts/mobile-release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - name: Bootstrap
        working-directory: apps/mobile
        run: |
          dart pub get
          dart run melos bootstrap
      - name: Analyze
        working-directory: apps/mobile
        run: dart run melos run analyze
      - name: Test
        working-directory: apps/mobile
        run: dart run melos run test
      - name: Release script regression tests
        run: python3 -m unittest discover -s scripts/mobile-release -p 'test_*.py'
