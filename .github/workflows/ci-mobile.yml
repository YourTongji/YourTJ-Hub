name: ci-mobile

on:
  push:
    paths:
      - "apps/mobile/**"
  # PR 无条件触发, 保证 required status check 稳定存在(不会被 paths 跳过卡死)
  pull_request:

jobs:
  ci-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - name: Bootstrap
        working-directory: apps/mobile
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Analyze
        working-directory: apps/mobile
        run: melos run analyze
      - name: Test
        working-directory: apps/mobile
        run: melos run test
      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-golden-failures
          path: |
            apps/mobile/packages/forum_app/test/golden/failures/
            apps/mobile/packages/ui_kit/test/golden/failures/
          if-no-files-found: ignore
          retention-days: 7
