name: CI / govulncheck

on:
  workflow_call:
    inputs:
      source:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Go 依赖漏洞扫描(issue #410)。govulncheck 只报告"可达"漏洞: 标准库 +
  # 实际调用链能到达的依赖漏洞, 避免为整棵依赖树里不可达的 CVE 报警。
  # 官方 golang/govulncheck-action 的行为(2026-09 复核其 action.yml):
  #   - 默认 output-format=text, 直接透传 govulncheck 退出码: 发现可达漏洞
  #     exit 3(job 红, 日志含漏洞 ID 与修复版本), 无漏洞 exit 0;
  #   - 下载 vuln DB(vuln.go.dev)失败、go install govulncheck 失败等运行错误
  #     以非零退出(job 红) —— 网络/代理故障天然失败, 不会静默变绿;
  #   - 内部 setup-go 默认 check-latest=true；版本范围保留最新 1.26.x patch,
  #     并设置安全补丁下限，避免 Actions manifest 滞后时选中已知漏洞版本。
  #     manifest 无匹配版本时 setup-go 会回退 Go 官方发布源。
  # job 名保持 ci-backend-govulncheck 不变, 与迁移前一致。
  ci-backend-govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      # repo-checkout=false: 复用上方 checkout, 避免 action 内重复检出。
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f
        with:
          go-version-input: ">=1.26.9 <1.27.0"
          work-dir: apps/gooseforum
          repo-checkout: "false"
