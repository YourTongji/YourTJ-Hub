name: CI / mobile native

on:
  workflow_call:
    inputs:
      source:
        type: string
        default: ''
      platforms:
        type: string
        default: '["android","ios"]'
      purpose:
        type: string
        default: production

permissions:
  contents: read

jobs:
  native-build:
    name: Native build / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform == 'ios' && (inputs.source != '' && 'xcode-27' || 'macos-26') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - name: Read the trusted iOS selector for a release candidate
        if: matrix.platform == 'ios' && inputs.source != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .ios-controller
          persist-credentials: false
      - name: Select the candidate iOS SDK
        if: matrix.platform == 'ios' && inputs.source != ''
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
          YOURTJ_IOS_BUILD_PURPOSE: ${{ inputs.purpose }}
        run: bash .ios-controller/scripts/mobile-release/select_ios_toolchain.sh
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: matrix.platform == 'android'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - name: Bootstrap
        working-directory: apps/mobile/packages/forum_app
        # Generate Flutter plugin/SwiftPM files on a clean checkout before --no-pub.
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- ':(top)apps/mobile/pubspec.lock'
      - name: Check effective iOS distribution signing settings
        if: matrix.platform == 'ios'
        run: python3 -m unittest discover -s scripts/mobile-release -p test_ios_signing_settings.py
      - name: Configure build-only OEM identifiers (never distributed)
        if: matrix.platform == 'android'
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          android = Path('apps/mobile/packages/forum_app/android')
          values = {'JPUSH_APPKEY': '000000000000000000000000', 'VENDORS': 'huawei,xiaomi,oppo,vivo,honor,meizu,fcm'}
          for vendor, keys in {'XIAOMI': ['APPID', 'APPKEY'], 'OPPO': ['APPID', 'APPKEY', 'APPSECRET'], 'VIVO': ['APPID', 'APPKEY'], 'HONOR': ['APPID'], 'MEIZU': ['APPID', 'APPKEY']}.items():
              for key in keys:
                  values[vendor + '_' + key] = '100000000'
          (android / 'push.properties').write_text(''.join(k + '=' + v + '\n' for k, v in values.items()))
          (android / 'app/agconnect-services.json').write_text(json.dumps({'configuration_version': '1.0', 'region': 'CN', 'client': {'app_id': '100000000', 'cp_id': '100000000', 'client_id': '100000000', 'client_secret': 'build-only', 'api_key': 'build-only', 'package_name': 'tj.yourtj.forum_app'}}))
          (android / 'app/google-services.json').write_text(json.dumps({'project_info': {'project_number': '100000000000', 'project_id': 'build-only'}, 'client': [{'client_info': {'mobilesdk_app_id': '1:100000000000:android:1000000000000000000000', 'android_client_info': {'package_name': 'tj.yourtj.forum_app'}}, 'api_key': [{'current_key': 'build-only'}]}]}))
          PYTHON
      - name: Compile and shrink Android with all seven push adapters
        if: matrix.platform == 'android'
        working-directory: apps/mobile/packages/forum_app
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/build-only.jks" -storepass android -keypass android -alias build-only -dname "CN=CI Build Only" -keyalg RSA -keysize 2048 -validity 2
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          Path('android/key.properties').write_text('storeFile=' + os.environ['RUNNER_TEMP'] + '/build-only.jks\nstorePassword=android\nkeyPassword=android\nkeyAlias=build-only\n')
          PYTHON
          flutter build apk --no-pub --release --target-platform android-arm64 --split-per-abi --analyze-size --code-size-directory "$RUNNER_TEMP/mobile-code-size"
          python3 ../../../../scripts/ci/check_android_entrypoint.py build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Collect Android release size analysis
        if: matrix.platform == 'android'
        working-directory: apps/mobile/packages/forum_app
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          candidates = sorted(
              (Path.home() / '.flutter-devtools').glob('apk-code-size-analysis_*.json'),
              key=lambda path: path.stat().st_mtime_ns,
          )
          if not candidates:
              raise SystemExit('Flutter did not produce the Android APK size analysis JSON')
          artifact_dir = Path(os.environ['RUNNER_TEMP']) / 'mobile-release-size'
          artifact_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(candidates[-1], artifact_dir / 'android-arm64-apk-size-analysis.json')
          apk = Path('build/app/outputs/flutter-apk/app-arm64-v8a-release.apk')
          metadata = {
              'gitSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'flutterVersion': json.loads(subprocess.check_output(['flutter', '--version', '--machine']))['frameworkVersion'],
              'buildMode': 'release',
              'targetPlatform': 'android-arm64',
              'androidBuildConfigSha256': subprocess.check_output(['python3', '../../../../scripts/ci/check_android_apk_size.py', '--build-config-sha256'], text=True).strip(),
              'apkBytes': apk.stat().st_size,
          }
          (artifact_dir / 'build-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PYTHON
      - name: Upload Android release size analysis
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-size-${{ github.sha }}
          path: ${{ runner.temp }}/mobile-release-size/
          if-no-files-found: error
          retention-days: 90
      - name: Check Android release APK size budget
        if: matrix.platform == 'android'
        run: |
          python3 scripts/ci/check_android_apk_size.py "$RUNNER_TEMP/mobile-release-size/build-metadata.json"
      - name: Compile iOS APNs bridge
        if: matrix.platform == 'ios'
        working-directory: apps/mobile/packages/forum_app
        run: flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Test iOS native storage policy
        if: matrix.platform == 'ios'
        working-directory: apps/mobile/packages/forum_app
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; runtimes=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,devices in sorted(runtimes.items(), reverse=True) if ".iOS-" in runtime for d in devices if d["isAvailable"] and d["name"].startswith("iPhone")))')
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -parallel-testing-enabled NO -only-testing:RunnerTests \
            BUILD_DIR="$PWD/build/ios" test
      - name: Test iOS dev preview storage startup
        if: matrix.platform == 'ios'
        working-directory: apps/mobile/packages/forum_app
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; runtimes=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,devices in sorted(runtimes.items(), reverse=True) if ".iOS-" in runtime for d in devices if d["isAvailable"] and d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$simulator_id" -b
          flutter test integration_test/storage_bootstrap_test.dart --no-pub -d "$simulator_id" \
            --dart-define=YOURTJ_ENVIRONMENT=dev \
            --dart-define=YOURTJ_PREVIEW=true \
            --dart-define=YOURTJ_API_BASE_URL=https://dev.yourtj.de \
            --dart-define=YOURTJ_OIDC_ISSUER=https://dev.yourtj.de/api/oauth
      - name: Capture native profile bookmark pagination
        id: bookmark_acceptance
        # Acceptance artifacts belong to PR/source CI, not release candidates.
        if: matrix.platform == 'ios' && inputs.source == ''
        working-directory: apps/mobile/packages/forum_app
        env:
          YOURTJ_TEST_ARTIFACTS: ${{ runner.temp }}/profile-bookmarks-native
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; runtimes=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,devices in sorted(runtimes.items(), reverse=True) if ".iOS-" in runtime for d in devices if d["isAvailable"] and d["name"].startswith("iPhone")))')
          export YOURTJ_TEST_DEVICE="$simulator_id"
          mkdir -p "$YOURTJ_TEST_ARTIFACTS"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess

          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          device = next(dict(item, runtime=runtime) for runtime, items in devices.items() for item in items if item['udid'] == os.environ['YOURTJ_TEST_DEVICE'])
          metadata = {
              'checkoutSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'prHeadSha': os.environ.get('PR_HEAD_SHA', ''),
              'flutter': json.loads(subprocess.check_output(['flutter', '--version', '--machine'])),
              'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              'device': device,
              'target': 'integration_test/profile_bookmarks_native_test.dart',
              'buildMode': 'debug',
              'locale': 'zh',
              'themes': ['light', 'dark'],
              'orders': ['topic-first', 'post-first'],
              'states': ['pending', 'merged'],
              'automatedAssertions': 'not_completed',
              'visualReview': 'not_performed',
              'evidence': 'Synthetic repository data targeting the real iOS Simulator Flutter surface. No live backend or physical-device acceptance. Screenshots require visual review, not golden comparison.',
          }
          (Path(os.environ['YOURTJ_TEST_ARTIFACTS']) / 'source.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PYTHON
          xcrun simctl bootstatus "$simulator_id" -b
          flutter drive --no-pub --debug \
            --driver=test_driver/integration_driver.dart \
            --target=integration_test/profile_bookmarks_native_test.dart -d "$simulator_id" \
            --dart-define=YOURTJ_ENVIRONMENT=dev \
            --dart-define=YOURTJ_PREVIEW=true \
            --dart-define=YOURTJ_API_BASE_URL=https://dev.yourtj.de \
            --dart-define=YOURTJ_OIDC_ISSUER=https://dev.yourtj.de/api/oauth \
            --dart-define=YOURTJ_TEST_SCREENSHOTS=true \
            2>&1 | tee "$YOURTJ_TEST_ARTIFACTS/flutter-drive.log"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ['YOURTJ_TEST_ARTIFACTS'])
          screenshots = []
          for theme in ('light', 'dark'):
              for first in ('topic', 'post'):
                  for state in ('pending', 'merged'):
                      path = output / f'profile-bookmarks-{theme}-{first}-first-{state}.png'
                      if not path.is_file() or path.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
                          raise SystemExit(f'Missing or invalid native screenshot: {path.name}')
                      screenshots.append(path.name)
          receipt = output / 'source.json'
          metadata = json.loads(receipt.read_text())
          metadata.update(automatedAssertions='passed', screenshots=screenshots)
          receipt.write_text(json.dumps(metadata, indent=2) + '\n')
          PYTHON
      - name: Upload native bookmark acceptance captures
        if: always() && matrix.platform == 'ios' && inputs.source == '' && steps.bookmark_acceptance.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-bookmarks-ios-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/profile-bookmarks-native/
          if-no-files-found: error
          retention-days: 14
