name: CI / mobile native

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - "apps/mobile/**/pubspec.yaml"
      - "apps/mobile/**/pubspec.lock"
      - "apps/mobile/**/pubspec_overrides.yaml"
      - "apps/mobile/**/build.yaml"
      - "apps/mobile/**/hook/**"
      - "apps/mobile/**/hooks/**"
      - "apps/mobile/scripts/**"
      - "apps/mobile/release-config.json"
      - ".github/workflows/ci-mobile-native.yml"
      - ".github/workflows/release-mobile.yml"
      - "scripts/mobile-release/**"
      - "apps/mobile/**/android/**"
      - "apps/mobile/**/ios/**"
  pull_request:
    paths:
      - "apps/mobile/**/pubspec.yaml"
      - "apps/mobile/**/pubspec.lock"
      - "apps/mobile/**/pubspec_overrides.yaml"
      - "apps/mobile/**/build.yaml"
      - "apps/mobile/**/hook/**"
      - "apps/mobile/**/hooks/**"
      - "apps/mobile/scripts/**"
      - "apps/mobile/release-config.json"
      - ".github/workflows/ci-mobile-native.yml"
      - ".github/workflows/release-mobile.yml"
      - "scripts/mobile-release/**"
      - "apps/mobile/**/android/**"
      - "apps/mobile/**/ios/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ github.event_name == 'workflow_dispatch' && '["android","ios"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          filters: |
            android:
              - 'apps/mobile/**/pubspec.yaml'
              - 'apps/mobile/**/pubspec.lock'
              - 'apps/mobile/**/pubspec_overrides.yaml'
              - 'apps/mobile/**/build.yaml'
              - 'apps/mobile/**/hook/**'
              - 'apps/mobile/**/hooks/**'
              - 'apps/mobile/scripts/**'
              - 'apps/mobile/release-config.json'
              - '.github/workflows/ci-mobile-native.yml'
              - '.github/workflows/release-mobile.yml'
              - 'scripts/mobile-release/**'
              - 'apps/mobile/**/android/**'
            ios:
              - 'apps/mobile/**/pubspec.yaml'
              - 'apps/mobile/**/pubspec.lock'
              - 'apps/mobile/**/pubspec_overrides.yaml'
              - 'apps/mobile/**/build.yaml'
              - 'apps/mobile/**/hook/**'
              - 'apps/mobile/**/hooks/**'
              - 'apps/mobile/scripts/**'
              - 'apps/mobile/release-config.json'
              - '.github/workflows/ci-mobile-native.yml'
              - '.github/workflows/release-mobile.yml'
              - 'scripts/mobile-release/**'
              - 'apps/mobile/**/ios/**'

  native-build:
    name: Native build / ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.changes.outputs.platforms) }}
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.platform == 'android'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - name: Bootstrap
        working-directory: apps/mobile/packages/forum_app
        # Generate Flutter plugin/SwiftPM files on a clean checkout before --no-pub.
        run: flutter pub get
      - name: Check effective iOS distribution signing settings
        if: matrix.platform == 'ios'
        run: python3 -m unittest discover -s scripts/mobile-release -p test_ios_signing_settings.py
      - name: Configure build-only OEM identifiers (never distributed)
        if: matrix.platform == 'android'
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          android = Path('apps/mobile/packages/forum_app/android')
          values = {'JPUSH_APPKEY': '000000000000000000000000', 'VENDORS': 'huawei,xiaomi,oppo,vivo,honor,meizu,fcm'}
          for vendor, keys in {'XIAOMI': ['APPID', 'APPKEY'], 'OPPO': ['APPID', 'APPKEY', 'APPSECRET'], 'VIVO': ['APPID', 'APPKEY'], 'HONOR': ['APPID'], 'MEIZU': ['APPID', 'APPKEY']}.items():
              for key in keys:
                  values[vendor + '_' + key] = '100000000'
          (android / 'push.properties').write_text(''.join(k + '=' + v + '\n' for k, v in values.items()))
          (android / 'app/agconnect-services.json').write_text(json.dumps({'configuration_version': '1.0', 'region': 'CN', 'client': {'app_id': '100000000', 'cp_id': '100000000', 'client_id': '100000000', 'client_secret': 'build-only', 'api_key': 'build-only', 'package_name': 'tj.yourtj.forum_app'}}))
          (android / 'app/google-services.json').write_text(json.dumps({'project_info': {'project_number': '100000000000', 'project_id': 'build-only'}, 'client': [{'client_info': {'mobilesdk_app_id': '1:100000000000:android:1000000000000000000000', 'android_client_info': {'package_name': 'tj.yourtj.forum_app'}}, 'api_key': [{'current_key': 'build-only'}]}]}))
          PYTHON
      - name: Compile and shrink Android with all seven push adapters
        if: matrix.platform == 'android'
        working-directory: apps/mobile/packages/forum_app
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/build-only.jks" -storepass android -keypass android -alias build-only -dname "CN=CI Build Only" -keyalg RSA -keysize 2048 -validity 2
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          Path('android/key.properties').write_text('storeFile=' + os.environ['RUNNER_TEMP'] + '/build-only.jks\nstorePassword=android\nkeyPassword=android\nkeyAlias=build-only\n')
          PYTHON
          flutter build apk --release --target-platform android-arm64 --split-per-abi --analyze-size --code-size-directory "$RUNNER_TEMP/mobile-code-size"
      - name: Collect Android release size analysis
        if: matrix.platform == 'android'
        working-directory: apps/mobile/packages/forum_app
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          candidates = sorted(
              (Path.home() / '.flutter-devtools').glob('apk-code-size-analysis_*.json'),
              key=lambda path: path.stat().st_mtime_ns,
          )
          if not candidates:
              raise SystemExit('Flutter did not produce the Android APK size analysis JSON')
          artifact_dir = Path(os.environ['RUNNER_TEMP']) / 'mobile-release-size'
          artifact_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(candidates[-1], artifact_dir / 'android-arm64-apk-size-analysis.json')
          apk = Path('build/app/outputs/flutter-apk/app-arm64-v8a-release.apk')
          metadata = {
              'gitSha': os.environ['GITHUB_SHA'],
              'flutterVersion': json.loads(subprocess.check_output(['flutter', '--version', '--machine']))['frameworkVersion'],
              'buildMode': 'release',
              'targetPlatform': 'android-arm64',
              'apkBytes': apk.stat().st_size,
          }
          (artifact_dir / 'build-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PYTHON
      - name: Upload Android release size analysis
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-size-${{ github.sha }}
          path: ${{ runner.temp }}/mobile-release-size/
          if-no-files-found: error
          retention-days: 90
      - name: Compile iOS APNs bridge
        if: matrix.platform == 'ios'
        working-directory: apps/mobile/packages/forum_app
        run: flutter build ios --simulator --debug --no-codesign --no-pub
