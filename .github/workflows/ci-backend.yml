name: CI / backend

on:
  workflow_call:
    inputs:
      source:
        type: string
        default: ''
      postgres:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.9"
      # 与 go.mod 的安全补丁下限一致，避免缓存命中旧 patch。
      - name: Assert Go toolchain >= 1.26.9
        working-directory: apps/gooseforum
        run: |
          set -euo pipefail
          min="1.26.9"
          cur="$(go env GOVERSION | sed 's/^go//')"
          if [[ "$(printf '%s\n%s\n' "$min" "$cur" | sort -V | head -n1)" != "$min" ]]; then
            echo "::error::Go toolchain ${cur} is below the required minimum ${min} (stdlib CVEs fixed in Go 1.26.9)"
            exit 1
          fi
          echo "Go toolchain ${cur} >= ${min}: OK"
      - name: Vet
        working-directory: apps/gooseforum
        run: go vet ./...
      - name: Test
        working-directory: apps/gooseforum
        run: go test ./...
      - name: Build
        working-directory: apps/gooseforum
        run: go build .

      # deploy 运维脚本测试(issue #134): DSN 解析支持 URL/key=value 两种格式,
      # 非法 DSN 在调用侧于任何 DB 操作前报错; 渲染器 fail-closed(配置治理);
      # 仅 deploy 脚本/模板/渲染器变更时运行。
      - name: Deploy scripts (bash syntax + DSN parser + render config tests)
        run: |
          # bash -n 只语法检查第一个文件参数, 多文件写法会静默跳过其余文件, 必须逐个检查
          for f in deploy/scripts/pgdsn.sh deploy/scripts/pgdsn_test.sh deploy/scripts/backup-db.sh deploy/scripts/sync-db-from-main.sh deploy/scripts/init-server.sh deploy/scripts/deploy.sh deploy/scripts/apply-config.sh deploy/scripts/verify-instance.sh; do
            bash -n "$f"
          done
          bash deploy/scripts/pgdsn_test.sh
          python3 deploy/render_config_test.py
          python3 -m unittest deploy/agent_snapshot_test.py
          python3 -m unittest discover -s examples/agent-runtime -p 'test_*.py' -v

  # wiki 同步锁并发测试（#285 回归）必须通过竞态检测。PR #297 描述引用过
  # "ci-backend-race"，但此前该 job 不存在；此处落地为真实 job，与
  # ci-backend-pg 相同的 paths-filter 门控模式（backend 变更时运行）。
  ci-backend-race:
    needs: ci-backend
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.9"
      - name: Test (race detector, wiki sync concurrency)
        working-directory: apps/gooseforum
        run: go test -race ./app/service/wikiservice/

  # 全部主库模型必须在 PostgreSQL 上可迁移。回归背景: issue #8 曾因模型里
  # 硬编码 MySQL 类型(bigint unsigned/datetime/tinyint)导致 PG 建表失败、
  # 服务带残缺 schema 启动, 登录/注册运行期才报错。此 job 用真实 PG 验证。
  ci-backend-pg:
    needs: ci-backend
    if: inputs.postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.9"
      - name: Test (PostgreSQL migration + PG-gated models)
        working-directory: apps/gooseforum
        env:
          YOURTJ_TEST_PG_URL: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres sslmode=disable"
          TEST_PG_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres sslmode=disable"
        # Include both PG naming conventions across the app; new packages need no CI allowlist.
        # Tests share a disposable database and some DROP SCHEMA public CASCADE.
        # Serialize packages and tests so one suite cannot destroy another suite's schema.
        run: go test -p 1 -parallel 1 ./app/... -run 'PostgreSQL|Postgres' -count=1 -v
