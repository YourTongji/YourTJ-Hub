name: server

on:
  push:
    paths:
      - "apps/gooseforum/app/**"
      - "apps/gooseforum/main.go"
      - "apps/gooseforum/go.mod"
      - "apps/gooseforum/go.sum"
  pull_request:
    paths:
      - "apps/gooseforum/app/**"
      - "apps/gooseforum/main.go"
      - "apps/gooseforum/go.mod"
      - "apps/gooseforum/go.sum"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet
        working-directory: apps/gooseforum
        run: go vet ./...
      - name: Test
        working-directory: apps/gooseforum
        run: go test ./...
      - name: Build
        working-directory: apps/gooseforum
        run: go build .
