name: Oryn
on:
  workflow_dispatch:
    inputs:
      release_notes_smoke:
        description: Read-only release-note replay with live Oryn; no release publication
        type: boolean
        default: false
      preflight:
        description: Check App access and planning without model calls or publication
        type: boolean
        default: true
      item:
        description: Exact issue or PR number (blank means scan)
        type: string
      comment:
        description: Exact maintainer command comment ID (requires item)
        type: string
      mode:
        description: Review or request validated repair
        type: choice
        options: [review, repair]
        default: review
      timeout:
        description: Task budget in seconds (10–3000; blank uses the repository default)
        type: string
      publish:
        description: Publish review comments and advisory labels
        type: boolean
        default: false
  schedule:
    - cron: "23 */6 * * *"
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
defaults:
  run:
    working-directory: .oryn-runtime
concurrency:
  group: ${{ inputs.release_notes_smoke == true && format('oryn-release-smoke-{0}', github.run_id) || ((github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ORYN_ENABLED == 'true') || (github.event_name != 'schedule' && vars.ORYN_EVENT_ENABLED == 'true')) && 'oryn-sweep' || format('oryn-disabled-{0}', github.run_id)) }}
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    if: inputs.release_notes_smoke != true && (github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ORYN_ENABLED == 'true') || (github.event_name != 'schedule' && vars.ORYN_EVENT_ENABLED == 'true'))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      source-ref: ${{ steps.revision.outputs.ref }}
      matrix: ${{ steps.admit.outputs.matrix || steps.plan.outputs.matrix }}
      count: ${{ (steps.admit.outputs.count || steps.plan.outputs.count) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - id: revision
        working-directory: .
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-oryn
        with:
          client-id: ${{ vars.ORYN_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORYN_APP_PRIVATE_KEY }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: target
        with:
          client-id: ${{ vars.ORYN_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORYN_APP_PRIVATE_KEY }}
          owner: YourTongji
          repositories: YourTJ-Hub
          permission-contents: read
          permission-issues: ${{ inputs.preflight == true && 'read' || 'write' }}
          permission-pull-requests: ${{ inputs.preflight == true && 'read' || 'write' }}
          permission-checks: read
          permission-statuses: read
          permission-actions: read
      - id: plan
        run: bun script/plan-workflow.ts
        env:
          ORYN_ENABLED: ${{ vars.ORYN_ENABLED }}
          ORYN_EVENT_ENABLED: ${{ vars.ORYN_EVENT_ENABLED }}
          ORYN_MODEL: ${{ vars.ORYN_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          ORYN_READ_TOKEN: ${{ steps.target.outputs.token }}
          ORYN_BOT_LOGIN: ${{ steps.target.outputs.app-slug }}[bot]
          INPUT_REPOSITORY: YourTongji/YourTJ-Hub
          INPUT_ITEM: ${{ inputs.item }}
          INPUT_COMMENT: ${{ inputs.comment }}
          INPUT_MODE: ${{ inputs.mode || 'review' }}
          INPUT_TIMEOUT: ${{ inputs.timeout }}
          ORYN_TASK_TIMEOUT_SECONDS: ${{ vars.ORYN_TASK_TIMEOUT_SECONDS || '1800' }}
      - if: inputs.preflight != true && (inputs.publish == true || (github.event_name == 'schedule' && vars.ORYN_SCHEDULE_PUBLISH == 'true') || (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && vars.ORYN_EVENT_PUBLISH == 'true'))
        id: admit
        run: bun script/admit-workflow.ts
        env:
          ORYN_ALLOW_PUBLISH: "1"
          ORYN_WRITE_TOKEN: ${{ steps.target.outputs.token }}
          ORYN_BOT_LOGIN: ${{ steps.target.outputs.app-slug }}[bot]
      - if: (steps.admit.outputs.count || steps.plan.outputs.count) != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan
          overwrite: true
          path: .oryn-runtime/.artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  process:
    needs: plan
    if: inputs.preflight != true && needs.plan.outputs.count != '' && needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/oryn-item.yml
    with:
      slug: ${{ matrix.slug }}
      number: ${{ matrix.number }}
      runtime: ${{ matrix.runtime }}
      source-ref: ${{ needs.plan.outputs.source-ref }}
      publish: ${{ inputs.publish == true || (github.event_name == 'schedule' && vars.ORYN_SCHEDULE_PUBLISH == 'true') || (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && vars.ORYN_EVENT_PUBLISH == 'true') }}
    secrets:
      ORYN_APP_PRIVATE_KEY: ${{ secrets.ORYN_APP_PRIVATE_KEY }}
      ORYN_OPENCODE_GO_API_KEY: ${{ secrets.ORYN_OPENCODE_GO_API_KEY }}

  release-notes-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.release_notes_smoke == true
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        scope: [mobile, ios, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect read-only historical source replay
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/smoke.py --scope "${{ matrix.scope }}"
      - uses: ./.github/actions/setup-oryn
        with:
          client-id: ${{ vars.ORYN_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORYN_APP_PRIVATE_KEY }}
      - run: bun run core:install
      - name: Live Oryn release draft (no target token in model process)
        working-directory: .
        env:
          ORYN_API_KEY: ${{ secrets.ORYN_OPENCODE_GO_API_KEY }}
          ORYN_MODEL: ${{ vars.ORYN_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          ORYN_BASE_URL: ${{ vars.ORYN_BASE_URL || 'https://opencode.ai/zen/go/v1' }}
          ORYN_TASK_TIMEOUT_SECONDS: ${{ vars.ORYN_TASK_TIMEOUT_SECONDS || '1800' }}
          ORYN_VARIANT: max
        run: python3 scripts/release/workflow.py draft-notes --folder .release-smoke
      - name: Validate and render platform output
        working-directory: .
        run: python3 scripts/release/smoke.py --verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-notes-smoke-${{ matrix.scope }}
          include-hidden-files: true
          path: .release-smoke
          retention-days: 7
