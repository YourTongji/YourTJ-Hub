name: Mobile Release Catalog

on:
  workflow_dispatch:

permissions:
  contents: write
  deployments: read

concurrency:
  group: mobile-release-catalog
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh receipt-backed catalog from trusted main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/workflow.py publish-catalog
