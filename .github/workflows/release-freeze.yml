name: Dev / Merge policy
on:
  pull_request_target:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  # Keep the existing ruleset context while retiring release freezes from dev.
  release-freeze:
    name: release-freeze
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Dev delivery is continuous; normal PR review and CI govern merges.'
