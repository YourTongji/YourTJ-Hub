name: ci-wiki

on:
  push:
    branches: [dev, main]
    paths:
      - "wiki/**"
      - ".github/workflows/ci-wiki.yml"
  # PR 无条件触发, 保证 required status check 稳定存在
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On dev/main pushes, compare with the commit before this push.
          # This input is ignored for pull_request, which uses its base branch.
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          filters: |
            wiki:
              - 'wiki/**'
              - '.github/workflows/ci-wiki.yml'

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.wiki == 'true'
        with:
          version: 11
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.wiki == 'true'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: wiki/pnpm-lock.yaml
      - name: Install
        if: steps.filter.outputs.wiki == 'true'
        working-directory: wiki
        run: pnpm install --frozen-lockfile
      - name: Build
        if: steps.filter.outputs.wiki == 'true'
        working-directory: wiki
        run: pnpm build
      - name: Verify dist artifacts (srcDir routing + Pagefind index + favicon)
        if: steps.filter.outputs.wiki == 'true'
        run: |
          test -f wiki/.vitepress/dist/index.html
          test -f wiki/.vitepress/dist/pagefind/pagefind.js
          test -f wiki/.vitepress/dist/favicon.svg
