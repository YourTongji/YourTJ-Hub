# Git hooks (lefthook)。本地快速检查点；CI 拥有全量门禁矩阵。
# 安装：make hooks（检测 lefthook，缺失时提示 brew install lefthook）。

pre-commit:
  parallel: true
  jobs:
    - name: whitespace (staged)
      run: git diff --cached --check
    - name: gofmt (staged Go blobs)
      glob: '**/*.go'
      run: 'for f in {staged_files}; do if git show ":$f" | gofmt -l | grep -q .; then echo "gofmt needed: $f"; exit 1; fi; done'
      # 校验 index 中的 staged blob（git show :$f）而非 worktree 副本，
      # 避免部分 staged 时检查对象与将要提交的内容不一致

pre-push:
  jobs:
    - name: go vet
      run: cd apps/gooseforum && go vet ./...
    - name: golangci-lint (incremental, full fallback)
      run: scripts/hooks/check-golangci.sh
    - name: frontend typecheck
      run: cd apps/gooseforum/resource && pnpm typecheck
