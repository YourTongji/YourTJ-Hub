# yourtj-wiki nginx 站点配置
# - VitePress 是预渲染静态站 + SPA 路由: try_files 回退 /index.html
# - assets(pagefind 等带内容 hash)长缓存; html 短缓存(no-cache 验证)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 内容 hash 静态资源: 长缓存(immutable)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Pagefind 离线索引: 随内容更新, 1 天缓存
    location /pagefind/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # 其余(html + SPA 路由): 回退 index.html, no-cache 保证内容更新可见
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
