# Cloudflare Pages 配置示例（issue #170）
# 用法：在 CF Pages 控制台创建项目时使用以下构建配置，
#       或参考 wiki/docs/deployment/cloudflare-pages.md。
#
# Build command:          cd wiki && pnpm install && pnpm build
# Build output directory: wiki/.vitepress/dist
# Environment variables:  VITE_WALINE_SERVER_URL=https://comment.example.com（可选）
name = "yourtj-wiki"
compatibility_date = "2024-11-01"
pages_build_output_dir = "wiki/.vitepress/dist"

[build]
command = "cd wiki && pnpm install && pnpm build"
