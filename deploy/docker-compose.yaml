# yourtj-hub 双实例编排(main 正式 / dev 测试) + 自管 nginx 反向代理
# 用法: docker compose up -d [main|dev|nginx]
# 镜像来自 GHCR(CI 构建推送, 服务器匿名 pull), 环境变量来自 /opt/yourtj/.env(见 init-server.sh)
services:
  main:
    image: ${IMAGE_REPO:-ghcr.io/yourtongji/yourtj-hub}:${MAIN_TAG:-latest}
    container_name: yourtj-main
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIN_PORT:-5234}:5234"
    volumes:
      - ./main/config.toml:/app/config.toml:ro
      - ./main/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5234/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  dev:
    image: ${IMAGE_REPO:-ghcr.io/yourtongji/yourtj-hub}:${DEV_TAG:-latest}
    container_name: yourtj-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_PORT:-5235}:5234"
    volumes:
      - ./dev/config.toml:/app/config.toml:ro
      - ./dev/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5234/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # 反向代理: Cloudflare 终止 TLS 后回源本容器(80)。
  #   公网流量一律走 nginx(0.0.0.0:80); 后端容器只绑 127.0.0.1。
  nginx:
    image: nginx:1.27-alpine
    container_name: yourtj-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/yourtj.conf:/etc/nginx/conf.d/default.conf:ro
    # 不依赖 main/dev: 后端寻址用变量 + Docker DNS resolver,
    # 避免 compose 因 depends_on 把未部署的实例一起拉起(拉取不存在的 tag)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: yourtj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yourtj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yourtj}"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: yourtj-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  meilidata:
