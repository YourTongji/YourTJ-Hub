name: mobile
environment:
  sdk: ">=3.12.2 <4.0.0"
dev_dependencies:
  melos: ^8.2.2
workspace:
  - packages/auth
  - packages/core
  - packages/forum_app
  - packages/ui_kit
dependency_overrides:
  # Keep Runner on iOS 13; the Widget Extension separately requires iOS 14.
  home_widget:
    path: third_party/home_widget
melos:
  scripts:
    analyze:
      run: dart run melos exec --concurrency=1 -- "flutter analyze"
      description: Run flutter analyze in all packages (serial; concurrent Flutter commands contend for the startup lock).
    test:
      run: dart run melos exec --concurrency=1 -- "flutter test --exclude-tags=golden"
      description: Run flutter test in all packages (serial; concurrent flutter test processes contend for the Flutter startup lock). Pixel goldens are tagged `golden` and excluded from this gate; regenerate them per golden test file with --update-goldens.
    gen:
      run: dart run melos exec --depends-on=build_runner -- "dart run build_runner build --delete-conflicting-outputs"
      description: Regenerate freezed/json_serializable outputs in packages that use build_runner.
  command:
    bootstrap:
      usePubspecOverrides: true
