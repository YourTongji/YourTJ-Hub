name: forum_app
description: "yourtj mobile forum client."
publish_to: 'none'
resolution: workspace
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.1
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  core:
    path: ../core
  auth:
    path: ../auth
  ui_kit:
    path: ../ui_kit
  cupertino_icons: ^1.0.9
  dio: ^5.7.0
  crypto: ^3.0.7
  flutter_quill: ^11.5.1
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  flutter_widget_from_html_core: ^0.17.3
  image_picker: ^1.1.2
  gal: ^2.3.2
  url_launcher: ^6.3.2
  markdown_widget: ^2.3.2
  image: ^4.5.4
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  home_widget: ^0.10.0
  sqlite3_flutter_libs: ^0.6.0+eol
  share_plus: ^11.0.0
  app_settings: ^9.0.0

  intl: ^0.20.2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  tldts: 0.0.1-beta
  flutter_native_splash: ^2.4.8
  flutter_svg: ^2.3.0
  animated_text_effects: ^0.0.7
dev_dependencies:
  flutter_secure_storage_platform_interface: ^1.1.2
  shared_preferences_platform_interface: ^2.4.2
  path_provider_platform_interface: ^2.1.2
  webview_flutter_platform_interface: ^2.15.1
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#F7FBFA"
  color_dark: "#0B1112"
  image: assets/splash/brand_mark.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#F7FBFA"
    color_dark: "#0B1112"
    image: assets/splash/brand_mark_android12.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/brand-default.png
    - assets/launcher/icon.png
    - assets/splash/brand_mark.png
    - assets/splash/brand_mark.svg
    - assets/splash/logo_motion.webp
