name: forum_app
description: "yourtj mobile forum client."
publish_to: 'none'
resolution: workspace
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.1
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  core:
    path: ../core
  auth:
    path: ../auth
  ui_kit:
    path: ../ui_kit
  cupertino_icons: ^1.0.9
  dio: ^5.7.0
  crypto: ^3.0.7
  flutter_quill: ^11.5.1
  flutter_riverpod: ^2.6.1
