openapi: 3.1.0
info:
  title: YourTJ Status API
  version: 1.2.0
  description: Read-only public snapshots collected independently of the forum.
servers:
  - url: https://status.yourtj.de
paths:
  /mobile/releases.json:
    get:
      operationId: getMobileReleaseCatalog
      summary: Read mobile release notes
      description: >-
        Returns a display-only catalog derived from reviewed release requests and successful
        GitHub distribution receipts. History coverage is per distribution channel; missing
        channels are omitted. TestFlight instructions are separate English testing notes.
        Responses are cached and carry an ETag. The catalog contains no candidate evidence,
        deployment payloads or credentials.
      responses:
        '200':
          description: Receipt-backed release catalog
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MobileReleaseCatalog'}
        '304': {description: Catalog unchanged}
        '405': {description: GET required}
        '503': {description: Catalog source unavailable or invalid}
  /api/status:
    get:
      operationId: getStatus
      summary: Read status snapshots
      description: >-
        Reads persisted snapshots only; visitors cannot trigger upstream collection.
        GitHub Actions collects current resources, uptime, history and traffic every fifteen minutes,
        and device reports hourly; scheduled runs can be delayed. Data is stale after twenty minutes
        (current/history/traffic) or seventy minutes (devices). Retention is one hour and three hours
        respectively. fetchedAt is never advanced on failure.
        Resource history remains available independently when current metrics expire;
        the server envelope then has current/cpuCores null and preserves history's own timestamp.
        Browsers poll every sixty seconds. Dynamic API responses are not cached;
        the browser also rechecks freshness independently when a request fails.
      parameters:
        - in: query
          name: range
          schema: {type: string, enum: [24h, 7d, 30d], default: 24h}
        - in: query
          name: serverRange
          schema: {type: string, enum: [1h, 6h, 24h, 7d], default: 1h}
        - in: query
          name: deviceRange
          schema: {type: string, enum: [24h, 7d, 30d], default: 7d}
      responses:
        '200':
          description: Available, stale, unavailable or unconfigured sources
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusResponse'}
        '400':
          description: Unknown, repeated or unsupported query parameter
        '503':
          description: Snapshot storage is unavailable
components:
  schemas:
    MobileReleaseCatalog:
      type: object
      required: [schemaVersion, historyCoverage, releases]
      properties:
        schemaVersion: {const: 1}
        historyCoverage:
          type: object
          required: [source, publishedAt, byChannel]
          properties:
            source: {const: github-release-receipts}
            publishedAt: {type: string, format: date-time}
            byChannel: {type: object, additionalProperties: {$ref: '#/components/schemas/MobileReleaseCoverage'}}
        releases:
          type: array
          maxItems: 300
          items: {$ref: '#/components/schemas/MobileReleaseRecord'}
    MobileReleaseCoverage:
      type: object
      required: [completeFromBuild, throughBuild, coveredBuilds]
      properties:
        completeFromBuild:
          type: integer
          minimum: 0
          description: >-
            Inclusive minimum installed build from which clients may claim a complete upgrade-note
            range. This is a conservative threshold, not proof that every build has a structured
            entry; use coveredBuilds for exact entries. If build 43 is the first known structured
            public build and no earlier public build is known, this floor is 43 and history below
            43 is unknown.
        throughBuild: {type: integer, minimum: 0}
        coveredBuilds: {type: array, maxItems: 300, items: {type: integer, minimum: 0}, uniqueItems: true}
    MobileReleaseRecord:
      type: object
      required: [version, buildNumber, channels, highlights, breaking, requiredActions, testflightNotes]
      properties:
        version: {type: string, pattern: '^\d+\.\d+\.\d+$'}
        buildNumber: {type: integer, minimum: 1}
        channels: {type: array, items: {type: string, enum: [android, ios-app-store, ios-testflight]}, uniqueItems: true}
        highlights: {type: array, items: {$ref: '#/components/schemas/MobileReleaseNote'}}
        breaking: {type: array, items: {$ref: '#/components/schemas/MobileReleaseNote'}}
        requiredActions: {type: array, items: {$ref: '#/components/schemas/MobileReleaseNote'}}
        testflightNotes:
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,79}$'}
              text: {type: string, minLength: 1, maxLength: 500}
    MobileReleaseNote:
      type: object
      required: [id, title, summary, kind, platforms]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,79}$'}
        title: {type: string, minLength: 1, maxLength: 100}
        summary: {type: string, minLength: 1, maxLength: 400}
        kind: {type: string, enum: [feature, improvement, fix, security]}
        platforms: {type: array, items: {type: string, enum: [android, ios-app-store, ios-testflight]}, uniqueItems: true}
    StatusDevicesSource:
      $ref: './components.yaml#/StatusDevicesSource'
    StatusDevices:
      $ref: './components.yaml#/StatusDevices'
    StatusDeviceRow:
      $ref: './components.yaml#/StatusDeviceRow'
    StatusSnapshot:
      $ref: './components.yaml#/StatusSnapshot'
    StatusServerSource:
      $ref: './components.yaml#/StatusServerSource'
    StatusTrafficSource:
      $ref: './components.yaml#/StatusTrafficSource'
    StatusServer:
      $ref: './components.yaml#/StatusServer'
    StatusSample:
      $ref: './components.yaml#/StatusSample'
    StatusLoadPoint:
      $ref: './components.yaml#/StatusLoadPoint'
    StatusTraffic:
      $ref: './components.yaml#/StatusTraffic'
    StatusTrafficPoint:
      $ref: './components.yaml#/StatusTrafficPoint'
    StatusResponse:
      $ref: './components.yaml#/StatusResponse'
    StatusUptimeSource:
      $ref: './components.yaml#/StatusUptimeSource'
    StatusUptime:
      $ref: './components.yaml#/StatusUptime'
    StatusUptimeMonitor:
      $ref: './components.yaml#/StatusUptimeMonitor'
    StatusUptimeHeartbeat:
      $ref: './components.yaml#/StatusUptimeHeartbeat'
