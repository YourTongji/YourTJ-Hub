openapi: 3.1.0
info:
  title: YourTJ Status API
  version: 1.2.0
  description: Read-only public snapshots collected independently of the forum.
servers:
  - url: https://status.yourtj.de
paths:
  /api/status:
    get:
      operationId: getStatus
      summary: Read status snapshots
      description: >-
        Reads persisted snapshots only; visitors cannot trigger upstream collection.
        GitHub Actions collects current resources, uptime, history and traffic every fifteen minutes,
        and device reports hourly; scheduled runs can be delayed. Data is stale after twenty minutes
        (current/history/traffic) or seventy minutes (devices). Retention is one hour and three hours
        respectively. fetchedAt is never advanced on failure.
        Resource history remains available independently when current metrics expire;
        the server envelope then has current/cpuCores null and preserves history's own timestamp.
        Browsers poll every sixty seconds. Dynamic API responses are not cached;
        the browser also rechecks freshness independently when a request fails.
      parameters:
        - in: query
          name: range
          schema: {type: string, enum: [24h, 7d, 30d], default: 24h}
        - in: query
          name: serverRange
          schema: {type: string, enum: [1h, 6h, 24h, 7d], default: 1h}
        - in: query
          name: deviceRange
          schema: {type: string, enum: [24h, 7d, 30d], default: 7d}
      responses:
        '200':
          description: Available, stale, unavailable or unconfigured sources
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusResponse'}
        '400':
          description: Unknown, repeated or unsupported query parameter
        '503':
          description: Snapshot storage is unavailable
components:
  schemas:
    StatusDevicesSource:
      $ref: './components.yaml#/StatusDevicesSource'
    StatusDevices:
      $ref: './components.yaml#/StatusDevices'
    StatusDeviceRow:
      $ref: './components.yaml#/StatusDeviceRow'
    StatusSnapshot:
      $ref: './components.yaml#/StatusSnapshot'
    StatusServerSource:
      $ref: './components.yaml#/StatusServerSource'
    StatusTrafficSource:
      $ref: './components.yaml#/StatusTrafficSource'
    StatusServer:
      $ref: './components.yaml#/StatusServer'
    StatusSample:
      $ref: './components.yaml#/StatusSample'
    StatusLoadPoint:
      $ref: './components.yaml#/StatusLoadPoint'
    StatusTraffic:
      $ref: './components.yaml#/StatusTraffic'
    StatusTrafficPoint:
      $ref: './components.yaml#/StatusTrafficPoint'
    StatusResponse:
      $ref: './components.yaml#/StatusResponse'
    StatusUptimeSource:
      $ref: './components.yaml#/StatusUptimeSource'
    StatusUptime:
      $ref: './components.yaml#/StatusUptime'
    StatusUptimeMonitor:
      $ref: './components.yaml#/StatusUptimeMonitor'
    StatusUptimeHeartbeat:
      $ref: './components.yaml#/StatusUptimeHeartbeat'
