[app]
# 运行环境配置 (local/production/staging等)
# 当设置为 'local' 时会自动绑定到 127.0.0.1，其他值则监听所有接口
env = "production"
# 调试模式开关，可选覆盖项
# 不配置时：local 默认 true，其他环境默认 false
# debug = false
# 维护模式开关
# 为 true 时所有请求返回503维护页面
maintenance = false
# 安全签名密钥
signingKey = "{{.SigningKey}}"
# CDN URL (可选，留空则使用本地资源)
# 例如: https://cdn.example.com
cdn_url = ""

[server]
url = "http://localhost"
port = 5234
accessLog = false
gzip = true # 应用层 gzip 开关

[jwtopt]
validTime = 604800

[db]
migration = "on" # on,off
backupSqlite = true
backupDir = "./storage/databasebackup/"
keep = 7
spec = "0 3 * * *"

[db.default]
# 主库连接类型: sqlite / mysql / postgres（文件库 [db.file] 固定 sqlite）
connection = "sqlite"
# mysql: "db_user:db_pass@tcp(db_host:3306)/db_name?charset=utf8mb4&parseTime=True&loc=Local"
# postgres: "host=db_host user=db_user password=db_pass dbname=db_name port=5432 sslmode=disable"
url = "db_user:db_pass@tcp(db_host:3306)/db_name?charset=utf8mb4&parseTime=True&loc=Local"
path = "./storage/database/sqlite.db"# :memory:|./storage/database/sqlite.db

maxIdleConnections = 3
maxOpenConnections = 5
maxLifeSeconds = 300

[db.file]
connection = "sqlite"# in mysql sqlite
url = "root:root_password@tcp(127.0.0.1:3306)/goose_forum?charset=utf8mb4&parseTime=True&loc=Local"
path = "./storage/database/file.db"# :memory:|./storage/database/sqlite.db

maxIdleConnections = 3
maxOpenConnections = 5
maxLifeSeconds = 300

[meilisearch]
url = "http://localhost:7700"
masterkey = ""

[log]
type = "file"# LOG_TYPE stdout,file
path = "./storage/logs/run.log"
rolling = true # 是否开启滚动 true ,false
maxage = 10 # 最大日期
maxsize = 256 # 最大文件大小 MB
maxBackUps = 30 # 最大保留文件数量
# 日志级别 debug/info/warn/error，默认 info。
# 不配置时 debug 模式（[app] debug=true）自动放宽到 debug；显式配置后以本项为准。
# 生产环境建议显式配置 level（见 deploy/config.toml.example）。
# level = "info"
# 日志格式 json/console，默认 json
format = "json"
# ERROR/WARNING 独立轮转文件（便于告警采集），留空则不单独拆分
errorPath = "./storage/logs/run.error.log"
# 访问日志是否记录客户端 IP，默认关闭（隐私最小化）
logIp = false
# 慢 SQL 日志。默认生产环境建议开启，local 可按需关闭。
slowSQL = true
slowSQLThreshold = "200ms"

# GitHub OAuth配置
[github]
client_id = ""
client_secret = ""

# 内建 OIDC Provider（可选；为选课站等第一方服务提供标准 OIDC 登录）
[oidc]
enabled = false
# issuer 默认取 site_url + /api/oauth；显式配置可覆盖
# issuer = "https://forum.example.com/api/oauth"
# RS256 签名私钥：内联 PEM 或密钥文件（二者都为空时自动生成并持久化到 signing_key_file）
# signing_key = ""
signing_key_file = "./storage/oidc/signing_key.pem"
# 访问令牌/授权码/id_token 有效期（秒）
access_token_ttl = 3600
auth_request_ttl = 600
id_token_ttl = 3600
# 第一方客户端（public 客户端不填 secret，PKCE 强制；confidential 客户端用 client_secret_basic）
[[oidc.clients]]
id = "yourtj-mobile"
name = "yourtj 移动端"
redirect_uris = ["yourtj://callback"]
# secret = ""
# 示例：web 端第一方服务（confidential）
# [[oidc.clients]]
# id = "course-select"
# name = "选课站"
# secret = "请替换为强随机密钥"
# redirect_uris = ["https://course.example.com/callback"]

# end #
