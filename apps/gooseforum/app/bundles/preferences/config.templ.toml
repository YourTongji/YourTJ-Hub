[app]
# 运行环境配置 (local/production/staging等)
# 当设置为 'local' 时会自动绑定到 127.0.0.1，其他值则监听所有接口
env = "production"
# 调试模式开关，可选覆盖项
# 不配置时：local 默认 true，其他环境默认 false
# debug = false
# 维护模式开关
# 为 true 时所有请求返回503维护页面
maintenance = false
# 安全签名密钥
signingKey = "{{.SigningKey}}"
# CDN URL (可选，留空则使用本地资源)
# 例如: https://cdn.example.com
cdn_url = ""

[server]
url = "http://localhost"
port = 5234
accessLog = false
gzip = true # 应用层 gzip 开关

[csrf]
# Cookie 认证写接口的跨站请求防护（issue #406）额外允许的来源（逗号分隔，
# 完整 origin，如 https://forum.example.com）。默认只需请求自身的 Host 同源即可，
# 仅当存在必须共享会话 Cookie 的独立前端域时才需要配置。
allowedOrigins = ""

[jwtopt]
validTime = 604800

[db]
migration = "on" # on,off
backupSqlite = true
backupDir = "./storage/databasebackup/"
keep = 7
spec = "0 3 * * *"

[db.default]
# 主库连接类型: sqlite（本地开发/测试默认）/ postgres（部署默认；文件库 [db.file] 固定 sqlite）
connection = "sqlite"
# postgres: "host=db_host user=db_user password=db_pass dbname=db_name port=5432 sslmode=disable"
url = "host=db_host user=db_user password=db_pass dbname=db_name port=5432 sslmode=disable"
path = "./storage/database/sqlite.db"# :memory:|./storage/database/sqlite.db

maxIdleConnections = 3
maxOpenConnections = 5
maxLifeSeconds = 300

[db.file]
connection = "sqlite"
path = "./storage/database/file.db"# :memory:|./storage/database/sqlite.db

maxIdleConnections = 3
maxOpenConnections = 5
maxLifeSeconds = 300

[meilisearch]
url = "http://localhost:7700"
masterkey = ""

# Wiki GitHub 唯一真实源（可选）：配置后 wiki 内容由仓库同步（只读投影），
# 编辑/审核/历史/贡献者全部走 GitHub PR。repo 留空 = 不启用（站内 wiki 读旧数据）。
[wiki.git]
repo = ""
branch = "main"
clone_dir = "./storage/wiki-repo"
# 每日定时同步 cron spec（默认每日 03:00；另含进程启动时异步同步一次）
schedule = "0 3 * * *"
# GitHub webhook 验签密钥（兼容旧配置的明文写法；推荐改用管理端
# 「wiki 同步面板 → Webhook 验签密钥」保存，securestore 加密落库，
# 留空 = webhook 端点 403 拒绝）
# 管理端清除密钥后本配置失效（fail-closed）
webhook_secret = ""

[log]
type = "file"# LOG_TYPE stdout,file
path = "./storage/logs/run.log"
rolling = true # 是否开启滚动 true ,false
maxage = 10 # 最大日期
maxsize = 256 # 最大文件大小 MB
maxBackUps = 30 # 最大保留文件数量
# 日志级别 debug/info/warn/error，默认 info。
# 不配置时 debug 模式（[app] debug=true）自动放宽到 debug；显式配置后以本项为准。
# 生产环境建议显式配置 level（见 deploy/config.toml.example）。
# level = "info"
# 日志格式 json/console，默认 json
format = "json"
# ERROR/WARNING 独立轮转文件（便于告警采集），留空则不单独拆分
errorPath = "./storage/logs/run.error.log"
# 访问日志是否记录客户端 IP，默认关闭（隐私最小化）
logIp = false
# 慢 SQL 日志。默认生产环境建议开启，local 可按需关闭。
slowSQL = true
slowSQLThreshold = "200ms"

# GitHub OAuth配置
[github]
client_id = ""
client_secret = ""

# Google OAuth配置（可选；需要在站点设置中配置绝对 Site URL）
[google]
client_id = ""
client_secret = ""

# 内建 OIDC Provider（可选；为选课站等第一方服务提供标准 OIDC 登录）
[oidc]
enabled = false
# issuer 默认取 site_url + /api/oauth；显式配置可覆盖
# issuer = "https://forum.example.com/api/oauth"
# RS256 签名私钥：内联 PEM 或密钥文件（二者都为空时自动生成并持久化到 signing_key_file）
# signing_key = ""
signing_key_file = "./storage/oidc/signing_key.pem"
# 访问令牌/授权码/id_token 有效期（秒）
access_token_ttl = 3600
auth_request_ttl = 600
id_token_ttl = 3600
# 第一方客户端（public 客户端不填 secret，PKCE 强制；confidential 客户端用 client_secret_basic）
[[oidc.clients]]
id = "yourtj-mobile"
name = "yourtj 移动端"
redirect_uris = ["yourtj://callback"]
# secret = ""
# 示例：web 端第一方服务（confidential）
# [[oidc.clients]]
# id = "course-select"
# name = "选课站"
# secret = "请替换为强随机密钥"
# redirect_uris = ["https://course.example.com/callback"]

# 内置 MCP server（可选；将 /api/v1/agent/* 六操作暴露为标准 MCP 工具）
# 认证复用 Agent Bearer token（agt_*），读操作默认可用
# 端点开关与写工具开关在管理员面板「MCP server」设置中配置（DB 存储、热生效），
# 默认均关闭。这里不再提供 [mcp] 段。


# AI 课程总结（B7，issue #181）：OpenAI-compatible /chat/completions 端点。
# provider 仅作记录；qwen（DashScope compatible-mode）/OpenRouter/本地 Ollama 等
# 均走同一协议，切换只改 base_url/model/api_key，输出 schema 不变。
# 开关、全局每分钟生成上限与 provider 参数（endpoint/model/apiKey/temperature/
# maxTokens）均可在管理面板「AI 总结」设置中配置（DB 存储、热生效；apiKey 加密
# 落库不回显）。管理后台配置了 endpoint 或 model 时优先于本段；两者都未配置时
# 回退本段（向后兼容）。默认关闭；部署需配置端点与模型并开启开关后生效。
[ai_summary]
provider = "qwen"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = ""
model = "qwen3.6-flash-2026-04-16"
temperature = 0.3
max_tokens = 1024

# 排课器学期起止日期（可选，默认注释）：一系统同步数据不含学期日期，
# 排课器「当前周次」定位需要此配置。键 = pk_calendar.calendar_id_i18n。
# [pk.semester_dates."2025-2026-1"]
# start = "2025-09-08"
# end = "2026-01-18"

# end #
