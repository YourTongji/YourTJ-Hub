PublicPersona:
  type: object
  required:
  - kind
  - publicUid
  - name
  - avatarUrl
  - profileUrl
  properties:
    kind:
      const: persona
    publicUid:
      type: string
      pattern: ^[0-9a-f]{32}$
    name:
      type: string
      description: Unmodified full THUOCL entry; escaped as plain text.
    avatarUrl:
      type: string
    profileUrl:
      type: string
  additionalProperties: false
AnonymousBatch:
  type: object
  required:
  - id
  - day
  - words
  - expiresAt
  - createdAt
  properties:
    id:
      type: string
    day:
      type: string
      format: date
    words:
      type: array
      minItems: 10
      maxItems: 10
      uniqueItems: true
      items:
        type: string
    expiresAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
  additionalProperties: false
AnonymousState:
  type: object
  required:
  - persona
  - nameSelectedAt
  - nameChangeAvailableAt
  - disabled
  - governanceDisabled
  - day
  - remaining
  - resetsAt
  - batches
  - lexiconVersion
  properties:
    persona:
      oneOf:
      - $ref: '#/PublicPersona'
      - type: 'null'
    nameSelectedAt:
      type:
      - string
      - 'null'
      format: date-time
    nameChangeAvailableAt:
      type:
      - string
      - 'null'
      format: date-time
    disabled:
      type: boolean
    governanceDisabled:
      type: boolean
    day:
      type: string
    remaining:
      type: integer
      minimum: 0
      maximum: 10
    resetsAt:
      type: string
      format: date-time
    batches:
      type: array
      items:
        $ref: '#/AnonymousBatch'
    lexiconVersion:
      type: string
  additionalProperties: false
AnonymousRevealedOwner:
  type: object
  required:
  - publicUid
  - userId
  - username
  properties:
    publicUid:
      type: string
    userId:
      type: integer
      minimum: 1
    username:
      type: string
  additionalProperties: false
AnonymousBatchRequest:
  type: object
  required:
  - day
  - requestKey
  properties:
    day:
      type: string
    requestKey:
      type: string
      minLength: 8
      maxLength: 128
  additionalProperties: false
AnonymousConfirmRequest:
  type: object
  required:
  - batchId
  - index
  properties:
    batchId:
      type: string
    index:
      type: integer
      minimum: 0
      maximum: 9
  additionalProperties: false
AnonymousDisableRequest:
  type: object
  required:
  - disabled
  properties:
    disabled:
      type: boolean
  additionalProperties: false
AnonymousRevealRequest:
  type: object
  required:
  - publicUid
  - reason
  properties:
    publicUid:
      type: string
    reason:
      type: string
      minLength: 1
      maxLength: 512
  additionalProperties: false
getAnonymousIdentityStateResponse:
  oneOf:
  - allOf:
    - $ref: ./schemas.yaml#/ApiSuccess
    - type: object
      required:
      - result
      properties:
        result:
          $ref: '#/AnonymousState'
  - $ref: ./schemas.yaml#/ApiFailure
generateAnonymousNamesResponse:
  oneOf:
  - allOf:
    - $ref: ./schemas.yaml#/ApiSuccess
    - type: object
      required:
      - result
      properties:
        result:
          $ref: '#/AnonymousBatch'
  - $ref: ./schemas.yaml#/ApiFailure
confirmAnonymousNameResponse:
  oneOf:
  - allOf:
    - $ref: ./schemas.yaml#/ApiSuccess
    - type: object
      required:
      - result
      properties:
        result:
          $ref: '#/PublicPersona'
  - $ref: ./schemas.yaml#/ApiFailure
disableAnonymousIdentityResponse: &id001
  oneOf:
  - allOf:
    - $ref: ./schemas.yaml#/ApiSuccess
    - type: object
      required:
      - result
      properties:
        result:
          type: boolean
  - $ref: ./schemas.yaml#/ApiFailure
revealAnonymousIdentityResponse:
  oneOf:
  - allOf:
    - $ref: ./schemas.yaml#/ApiSuccess
    - type: object
      required:
      - result
      properties:
        result:
          $ref: '#/AnonymousRevealedOwner'
  - $ref: ./schemas.yaml#/ApiFailure
AnonymousGovernRequest:
  type: object
  required:
  - postId
  - disabled
  - reason
  properties:
    postId:
      type: integer
      minimum: 1
    disabled:
      type: boolean
    reason:
      type: string
      minLength: 1
      maxLength: 512
  additionalProperties: false
governAnonymousIdentityResponse: *id001
