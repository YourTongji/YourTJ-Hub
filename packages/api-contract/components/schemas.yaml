  type: object
  required: [name, label, pages]
  properties:
    name:
      type: string
    label:
      type: string
      description: Display label of the namespace.
    pages:
      type: array
      items:
        $ref: '#/WikiTreePage'
  additionalProperties: false

WikiTreeResult:
  type: object
  required: [namespaces]
  properties:
    namespaces:
      type: array
      items:
        $ref: '#/WikiTreeNamespace'
  additionalProperties: false

WikiTreeResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/WikiTreeResult'
    - $ref: '#/ApiFailure'

WikiNamespaceSummary:
  type: object
  required: [name, description, sortOrder, pageCount, updatedAt]
  properties:
    name:
      type: string
    description:
      type: string
    sortOrder:
      type: integer
      description: Ordering key; smaller values come first.
    pageCount:
      type: integer
      format: int64
      description: Number of pages with at least one approved revision.
    updatedAt:
      type: string
      format: date-time
    firstPagePath:
      type: string
      description: Full path (namespace/slug) of the first approved page in this namespace; empty when the namespace has no approved pages.
  additionalProperties: false

WikiNamespaceListResult:
  type: array
  items:
    $ref: '#/WikiNamespaceSummary'
