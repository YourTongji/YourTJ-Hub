  type: object
  properties:
    settings:
      $ref: '#/AdminAiSummarySettingsConfig'
  additionalProperties: false
  description: Replacement AI summary settings. Non-empty `apiKey` is encrypted (AES-256-GCM) before persistence; an empty one keeps the stored key (issue #324 security pattern). The Go struct tags `settings` with `validate:"required"`, but struct-level required never fails — a missing/malformed body saves a zero-value configuration.

AdminAiSummaryModelsRequest:
  type: object
  properties:
    baseUrl:
      type: string
      description: Optional temporary endpoint to probe before saving; empty uses the stored configuration.
    apiKey:
      type: string
      description: Optional temporary api key to probe before saving; empty falls back to the stored (decrypted) key.
  additionalProperties: false
  description: Probe request for the OpenAI-compatible `/models` endpoint. Supports testing credentials before saving them.

AdminAiSummaryModelsItem:
  type: object
  required: [id]
  properties:
    id:
