ApiSuccess:
  type: object
  required: [result, code]
  properties:
    result: {}
    code:
      type: integer
      const: 0
      description: Successful operation. Consumers must still inspect this field because business failures can use HTTP 200.
    messageCode:
      type: string
      description: Stable application message identifier when the operation emits one.
    params:
      type: object
      additionalProperties: true
  additionalProperties: false

ApiFailure:
  type: object
  required: [result, code]
  properties:
    result:
      type: 'null'
    code:
      type: integer
      const: 1
    messageCode:
      type: string
      description: Stable application message identifier for the failure.
    params:
      type: object
      additionalProperties: true
  additionalProperties: false

RateLimitedFailure:
  allOf:
    - $ref: '#/ApiFailure'
    - type: object
      required: [messageCode, params]
      properties:
        params:
          type: object
          required: [action, retryAfterSeconds]
          properties:
            action:
              type: string
            retryAfterSeconds:
              type: integer
              minimum: 1
          additionalProperties: true

LoginRequest:
  type: object
  required: [username, encryptedPassword]
  properties:
    username:
      type: string
      minLength: 1
      description: Username or email address. Leading and trailing whitespace is ignored by the server.
    encryptedPassword:
      type: string
      minLength: 1
      description: Base64 RSA-OAEP-256 encrypted JSON password payload from GET /api/login-public-key.
    captchaId:
      type: string
    captchaCode:
      type: string
  additionalProperties: false

TotpChallengeResult:
  type: object
  required: [twoFactorRequired, message]
  properties:
    twoFactorRequired:
      type: boolean
      const: true
    message:
      type: string
  additionalProperties: false

LoginResult:
  oneOf:
    - type: string
      description: Human-readable successful-login message.
    - $ref: '#/TotpChallengeResult'

LoginSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          $ref: '#/LoginResult'

LoginResponse:
  oneOf:
    - $ref: '#/LoginSuccess'
    - $ref: '#/ApiFailure'

LoginPublicKeyResult:
  type: object
  required: [publicKey, serverTs, algorithm]
  properties:
    publicKey:
      type: string
      minLength: 1
      description: PEM-encoded RSA public key. Private key material is never returned.
    serverTs:
      type: integer
      format: int64
      minimum: 1
      description: Current server time in Unix milliseconds. Password-login clients must encrypt their password payload within ±3 minutes of this timestamp; a stale payload is rejected as `auth.login.invalidRequest`.
    algorithm:
      type: string
      const: RSA-OAEP-256
  additionalProperties: false

LoginPublicKeySuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/LoginPublicKeyResult'

LoginPublicKeyResponse:
  oneOf:
    - $ref: '#/LoginPublicKeySuccess'
    - $ref: '#/ApiFailure'

TotpVerifyRequest:
  type: object
  properties:
    code:
      type: string
      description: TOTP code or recovery code; any non-empty value is verified as a TOTP code first and then as a recovery code. When non-empty, this field takes precedence over recoveryCode.
    recoveryCode:
      type: string
      description: One-time recovery code used only when code is empty.
  additionalProperties: false

TotpVerifySuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          description: Human-readable successful-login message; messageCode is the stable identifier.
        messageCode:
          type: string
          const: auth.login.success

TotpVerifyResponse:
  oneOf:
    - $ref: '#/TotpVerifySuccess'
    - $ref: '#/ApiFailure'

OidcExchangeRequest:
  type: object
  required: [code, codeVerifier, nonce, redirectUri]
  properties:
    code:
      type: string
      minLength: 1
      description: One-time authorization code returned to the AppAuth redirect URI.
    codeVerifier:
      type: string
      minLength: 1
      description: PKCE verifier generated and retained by the mobile client.
    nonce:
      type: string
      minLength: 1
      description: Nonce sent in the authorization request; it must equal the verified ID token nonce.
    redirectUri:
      type: string
      format: uri
      minLength: 1
      description: Mobile callback URI. The server requires an exact match with its configured allowlist value.
  additionalProperties: false

OidcExchangeResult:
  type: object
  required: [token]
  properties:
    token:
      type: string
      minLength: 1
      description: Forum JWT session credential for Bearer authentication.
  additionalProperties: false

OidcExchangeSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/OidcExchangeResult'

WriteTopicRequest:
  type: object
  required: [content, title, categoryId]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 0
      description: Existing topic ID when updating; omit or send 0 when creating.
    content:
      type: string
      minLength: 1
    title:
      type: string
      minLength: 1
    categoryId:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: integer
        format: uint64
        minimum: 1
    topicStatus:
      type: integer
      enum: [0, 1]
      description: Existing draft/published status value; omitted values use the legacy draft default (0).
    website:
      type: string
      description: Compatibility honeypot field. Normal clients must not render or submit it.
    captchaId:
      type: string
      description: Required only when server-side posting risk controls request a captcha.
    captchaCode:
      type: string
      description: Required only when server-side posting risk controls request a captcha.
  additionalProperties: false

WriteTopicSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          oneOf:
            - type: integer
              format: uint64
              minimum: 1
              description: Topic ID for a normal create or update.
            - type: boolean
              const: true
              description: Silent success returned only when the honeypot field is populated.

WriteTopicResponse:
  oneOf:
    - $ref: '#/WriteTopicSuccess'
    - $ref: '#/ApiFailure'

AgentMe:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: object
          required: [agentId, username, nickname, avatarUrl, tokenPrefix, enabled, createdAt, updatedAt]
          properties:
            agentId:
              type: integer
              format: uint64
              minimum: 1
            username:
              type: string
            nickname:
              type: string
            avatarUrl:
              type: string
            tokenPrefix:
              type: string
              description: Non-secret token prefix; the token and its hash are never exposed.
            enabled:
              type: integer
              enum: [0, 1]
            createdAt:
              type: integer
              format: int64
            updatedAt:
              type: integer
              format: int64
          additionalProperties: false

AgentTopicItem:
  type: object
  required: [id, title, excerpt, categoryIds, userId, status, processStatus, replyCount, viewCount, postCount, createdAt, updatedAt]
  properties:
    id:
      type: integer
      format: uint64
    title:
      type: string
    excerpt:
      type: string
    categoryIds:
      type: array
      items:
        type: integer
        format: uint64
    userId:
      type: integer
      format: uint64
    status:
      type: integer
      enum: [0, 1]
    processStatus:
      type: integer
      enum: [0, 1, 2]
    replyCount:
      type: integer
      format: uint64
    viewCount:
      type: integer
      format: uint64
    postCount:
      type: integer
      format: uint64
    lastPostedAt:
      type: integer
      format: int64
    createdAt:
      type: integer
      format: int64
    updatedAt:
      type: integer
      format: int64
  additionalProperties: false

AgentTopicListResult:
  type: object
  required: [list, page, pageSize, hasNext]
  properties:
    list:
      type: array
      items:
        $ref: '#/AgentTopicItem'
    page:
      type: integer
    pageSize:
      type: integer
    hasNext:
      type: boolean
  additionalProperties: false

AgentTopicListResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/AgentTopicListResult'

AgentWriteTopicRequest:
  type: object
  required: [title, content, categoryId]
  properties:
    title:
      type: string
      minLength: 1
    content:
      type: string
      minLength: 1
    categoryId:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: integer
        format: uint64
        minimum: 1
  additionalProperties: false
  description: Agent topics always publish (topicStatus=1); website and captcha fields are deliberately absent.

AgentPostListResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: object
          required: [posts, replyTargets, hasBefore, hasAfter, total, maxPostNo]
          properties:
            posts:
              type: array
              items:
                type: object
            replyTargets:
              type: array
              items:
                type: object
            anchorPostId:
              type: integer
              format: uint64
            beforePostNo:
              type: integer
              format: uint64
            afterPostNo:
              type: integer
              format: uint64
            hasBefore:
              type: boolean
            hasAfter:
              type: boolean
            total:
              type: integer
              format: int64
            maxPostNo:
              type: integer
              format: uint64
          additionalProperties: false
  description: Mirrors the forum PostWindow payload shape.

AgentCreatePostRequest:
  type: object
  required: [content]
  properties:
    content:
      type: string
      minLength: 1
    replyToPostId:
      type: integer
      format: uint64
      minimum: 0
  additionalProperties: false
  description: The topic id comes from the path and is authoritative.

AgentCreatePostResult:
  type: object
  required: [id, postNo, renderedContent]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    postNo:
      type: integer
      format: uint64
      minimum: 1
    renderedContent:
      type: string
  additionalProperties: false

AgentCreatePostResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/AgentCreatePostResult'
    - $ref: '#/ApiFailure'

AgentSearchResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: object
          required: [query, scope, topics, users, categories, total, usersTotal, categoriesTotal, totalPages, pagination]
          properties:
            query:
              type: string
            scope:
              type: string
            topics:
              type: array
              items:
                type: object
            users:
              type: array
              items:
                type: object
            categories:
              type: array
              items:
                type: object
            total:
              type: integer
              format: int64
            usersTotal:
              type: integer
              format: int64
            categoriesTotal:
              type: integer
              format: int64
            totalPages:
              type: integer
            pagination:
              type: object
            failedScopes:
              type: array
              items:
                type: string
            searchUnavailable:
              type: boolean
          additionalProperties: false
  description: Mirrors the forum SearchJSON payload, including searchUnavailable and failedScopes.

UserSession:
  type: object
  required: [id, ipMasked, userAgent, createdAt, expiresAt, isCurrent]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    ipMasked:
      type: string
      description: Privacy-masked client IP (the last IPv4 octet or the IPv6 interface ID is hidden); unparseable stored values are returned as an empty string.
    userAgent:
      type: string
      description: Truncated raw user agent; clients render a parsed device label.
    createdAt:
      type: integer
      format: int64
      minimum: 1
      description: Session creation time in Unix milliseconds.
    expiresAt:
      type: integer
      format: int64
      minimum: 1
      description: Session expiry time in Unix milliseconds.
    isCurrent:
      type: boolean
      description: True for the session that carries the current token.
  additionalProperties: false

SessionListSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: array
          items:
            $ref: '#/UserSession'

SessionListResponse:
  oneOf:
    - $ref: '#/SessionListSuccess'
    - $ref: '#/ApiFailure'

RevokeSessionRequest:
  type: object
  required: [id]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
      description: Session ID from the session list. Must belong to the caller.
  additionalProperties: false

SessionMessageSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          description: Human-readable confirmation message; `messageCode` pins the stable identifier.
        messageCode:
          type: string
          enum: [session.revoke.success, session.revokeAll.success]

SessionMessageResponse:
  oneOf:
    - $ref: '#/SessionMessageSuccess'
    - $ref: '#/ApiFailure'

LogoutSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: string
          const: logout

LogoutResponse:
  oneOf:
    - $ref: '#/LogoutSuccess'
    - $ref: '#/ApiFailure'

CourseSummary:
  type: object
  required: [id, primaryCode, name, department, creditX10]
  properties:
    id:
      type: integer
      format: uint64
    primaryCode:
      type: string
    name:
      type: string
    department:
      type: string
    creditX10:
      type: integer
      description: Credit multiplied by 10 to stay integral (2.5 credit -> 25).
    aliases:
      type: array
      items:
        type: string
    instructors:
      type: array
      items:
        type: string
    recentTerms:
      type: array
      items:
        type: string
  additionalProperties: false

CourseListResult:
  type: object
  required: [list, page, size, total, hasNext]
  properties:
    list:
      type: array
      items:
        $ref: '#/CourseSummary'
    page:
      type: integer
    size:
      type: integer
    total:
      type: integer
      format: int64
    hasNext:
      type: boolean
  additionalProperties: false

CourseListResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/CourseListResult'

OfferingSummary:
  type: object
  required: [id, termCode]
  properties:
    id:
      type: integer
      format: uint64
    termCode:
      type: string
    termName:
      type: string
    campus:
      type: string
    faculty:
      type: string
    instructors:
      type: array
      items:
        type: string
  additionalProperties: false

CourseDetail:
  type: object
  required: [id, primaryCode, name, department, creditX10]
  properties:
    id:
      type: integer
      format: uint64
    primaryCode:
      type: string
    name:
      type: string
    department:
      type: string
    creditX10:
      type: integer
    aliases:
      type: array
      items:
        type: string
    offerings:
      type: array
      items:
        $ref: '#/OfferingSummary'
  additionalProperties: false

CourseDetailResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/CourseDetail'
