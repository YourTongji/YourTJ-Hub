RegisterRequest:
  type: object
  description: |
    Client-side strict request shape for POST /api/register. The server binds the body
    loosely and silently ignores unknown fields; `additionalProperties: false` is a
    consumer constraint, not a server rejection. Field names use the legacy
    `userName`/`passWord` casing and must not be normalized client-side.
  required: [email, userName, passWord]
  properties:
    email:
      type: string
      minLength: 1
      format: email
      description: Email address; the server lowercases and trims it before validation and applies the site email-domain allowlist when configured.
    userName:
      type: string
      minLength: 1
      description: Username, 6-32 characters of letters, digits, `_` or `-` (server regex `^[a-zA-Z0-9_-]{6,32}$`); the server trims surrounding whitespace.
    passWord:
      type: string
      minLength: 1
      description: Password, 6-64 characters, must contain both letters and digits.
    locale:
      type: string
      description: Optional BCP-47 style locale hint; normalized server-side.
    invitationCode:
      type: string
      description: Optional invitation code; currently accepted but not enforced by the server.
    captchaId:
      type: string
      description: Captcha id from GET /api/get-captcha; required only when the site requires captcha.
    captchaCode:
      type: string
      description: Captcha answer for `captchaId`; required only when the site requires captcha.
    website:
      type: string
      description: Compatibility honeypot field. Normal clients must not render or submit it; any non-blank value is treated as bot traffic and silently accepted without creating an account.
  additionalProperties: false

RegisterSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          description: Human-readable success message. The wording is UI copy and not a stable machine contract value; clients must branch on `messageCode`.
        messageCode:
          type: string
          enum: [auth.login.success, auth.register.emailVerify]
          description: |
            `auth.login.success` when the account is created and a session is issued
            immediately (email verification disabled); `auth.register.emailVerify` when
            the site requires email verification before the session is usable. The
            honeypot path returns the same `auth.login.success` envelope without
            creating an account.

RegisterResponse:
  oneOf:
    - $ref: '#/RegisterSuccess'
    - $ref: '#/ApiFailure'

ForgotPasswordRequest:
  type: object
  description: |
    Client-side strict request shape for POST /api/forgot-password. The server binds
    the body loosely and silently ignores unknown fields; `additionalProperties: false`
    is a consumer constraint, not a server rejection.
  required: [email]
  properties:
    email:
      type: string
      minLength: 1
      format: email
      description: Email address to send the reset link to. The response never reveals whether this email is registered.
    captchaId:
      type: string
      description: Captcha id from GET /api/get-captcha; required only when the site requires captcha.
    captchaCode:
      type: string
      description: Captcha answer for `captchaId`; required only when the site requires captcha.
    website:
      type: string
      description: Compatibility honeypot field. Normal clients must not render or submit it; any non-blank value is treated as bot traffic and silently accepted without enqueuing any mail.
  additionalProperties: false

ForgotPasswordSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          description: Human-readable confirmation message; the wording is UI copy and not a stable machine contract value.
        messageCode:
          type: string
          const: auth.passwordReset.mailQueued
          description: Returned identically for registered, unknown, bot, and email-change-cooldown addresses (anti-enumeration).

ForgotPasswordResponse:
  oneOf:
    - $ref: '#/ForgotPasswordSuccess'
    - $ref: '#/ApiFailure'

ResetPasswordRequest:
  type: object
  description: |
    Client-side strict request shape for POST /api/reset-password. The server binds
    the body loosely and silently ignores unknown fields; `additionalProperties: false`
    is a consumer constraint, not a server rejection.
  required: [token, newPassword]
  properties:
    token:
      type: string
      minLength: 1
      description: Reset token from the password reset email (30-minute lifetime).
    newPassword:
      type: string
      minLength: 1
      description: New password, 6-64 characters, must contain both letters and digits.
  additionalProperties: false

ResetPasswordSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          description: Human-readable confirmation message; the wording is UI copy and not a stable machine contract value.
        messageCode:
          type: string
          const: auth.passwordReset.success

ResetPasswordResponse:
  oneOf:
    - $ref: '#/ResetPasswordSuccess'
    - $ref: '#/ApiFailure'
WikiTreeNode:
  type: object
  required: [kind, pageId, path, title, active, children]
  properties:
    kind:
      type: string
      enum: [page, directory]
      description: page is a Markdown file; directory is a non-clickable repository directory container.
    pageId:
      type: integer
      format: uint64
      minimum: 0
      description: Non-zero for page nodes and zero for directory nodes.
    path:
      type: string
      description: Stable repository-relative page or directory path within the namespace (slash-separated).
    title:
      type: string
    active:
      type: boolean
      description: True when this page is the active SSR route; always false for directory nodes.
    children:
      type: array
      items:
        $ref: '#/WikiTreeNode'
  additionalProperties: false

WikiTreeNamespace:
  type: object
  required: [name, label, nodes]
  properties:
    name:
      type: string
      description: Display name (top-level directory name; may contain Unicode such as Chinese).
    label:
      type: string
      description: Display label of the namespace.
    nodes:
      type: array
      items:
        $ref: '#/WikiTreeNode'
  additionalProperties: false

WikiTreeResult:
  type: object
  required: [namespaces]
  properties:
    namespaces:
      type: array
      items:
        $ref: '#/WikiTreeNamespace'
  additionalProperties: false

WikiTreeResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/WikiTreeResult'
    - $ref: '#/ApiFailure'

WikiNamespaceSummary:
  type: object
  required: [name, description, sortOrder, pageCount, updatedAt]
  properties:
    name:
      type: string
      description: Display name (top-level directory name in the GitHub wiki repo; may contain Unicode such as Chinese).
    description:
      type: string
    sortOrder:
      type: integer
      description: Ordering key; smaller values come first.
    pageCount:
      type: integer
      format: int64
      description: Number of public pages in this namespace (projected from the GitHub wiki repo).
    updatedAt:
      type: string
      format: date-time
    firstPagePath:
      type: string
      description: Full path (first segment is the namespace directory name) of the first public page in this namespace; empty when the namespace has no public pages.
  additionalProperties: false

WikiNamespaceListResult:
  type: array
  items:
    $ref: '#/WikiNamespaceSummary'
  description: The raw namespace array; an empty listing is an empty array, never null.

WikiNamespaceListResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/WikiNamespaceListResult'
    - $ref: '#/ApiFailure'

WikiRecentPage:
  type: object
  description: "Recently updated page in the wiki home feed. GitHub SSOT: pages are a read-only projection of the wiki repository, so there is no forum editor — editorId/editorName are intentionally absent (issue #291); Git authorship is exposed via the page detail contributors list instead."
  required: [pageId, path, title, updatedAt]
  properties:
    pageId:
      type: integer
      format: uint64
      minimum: 1
    path:
      type: string
      description: Full path (first segment is the namespace directory name) for direct linking (review P2).
    title:
      type: string
    updatedAt:
      type: string
      format: date-time
  additionalProperties: false

WikiHomeResult:
  type: object
  required: [namespaces, recent]
  properties:
    namespaces:
      type: array
      items:
        $ref: '#/WikiNamespaceSummary'
    recent:
      type: array
      items:
        $ref: '#/WikiRecentPage'
  additionalProperties: false

WikiHomeResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/WikiHomeResult'
    - $ref: '#/ApiFailure'

WikiSearchItem:
  type: object
  description: Page-level wiki search result (aggregates the paragraph hits of one wiki page).
  required: [namespace, path, title, titleHit, anchors, snippet, score, hitType]
  properties:
    namespace:
      type: string
      description: "Display name of the namespace (fallback: URL key)."
    path:
      type: string
      description: Full page path (namespace/slug) for direct linking.
    title:
      type: string
    titleHit:
      type: boolean
      description: True when the query matched the page title (vs only body text).
    heading:
      type: string
      description: Nearest section heading of the top hit paragraph; absent when the hit is in the title only.
    anchors:
      type: array
      items:
        type: string
      description: Paragraph anchors (s-<n>) of every hit paragraph in this page, for in-page navigation.
    snippet:
      type: string
      description: Highlighted paragraph excerpt (<mark> wraps matched terms).
    score:
      type: number
      format: double
      description: Ranking score of the top paragraph hit (higher first).
    hitType:
      type: string
      enum: [title, body]
      description: Whether the strongest hit is in the title or the body.
  additionalProperties: false

WikiSearchResult:
  type: object
  required: [query, total, items, searchUnavailable]
  properties:
    query:
      type: string
      description: Echoed (trimmed) search query.
    total:
      type: integer
      format: int64
      description: Page-level result count (distinct pages); never the paragraph hit count.
    items:
      type: array
      items:
        $ref: '#/WikiSearchItem'
    searchUnavailable:
      type: boolean
      description: True when the search backend is unavailable; items is then empty.
  additionalProperties: false

WikiSearchResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/WikiSearchResult'
    - $ref: '#/ApiFailure'






WikiAdminTreeNode:
  type: object
  required: [kind, pageId, path, sourcePath, title, sortOrder, children]
  properties:
    kind:
      type: string
      enum: [page, directory]
    pageId:
      type: integer
      format: uint64
      minimum: 0
      description: Non-zero for page nodes and zero for directory nodes.
    path:
      type: string
      description: Canonical page path with repository directory name as first segment.
    sourcePath:
      type: string
      description: Real repository-relative path (keeps original case/Unicode); used for GitHub edit/history links.
    title:
      type: string
    sortOrder:
      type: integer
    children:
      type: array
      items:
        $ref: '#/WikiAdminTreeNode'
  additionalProperties: false

WikiAdminTreeNamespace:
  type: object
  required: [name, label, nodes]
  properties:
    name:
      type: string
    label:
      type: string
    nodes:
      type: array
      items:
        $ref: '#/WikiAdminTreeNode'
  additionalProperties: false

WikiAdminTreeResult:
  type: array
  items:
    $ref: '#/WikiAdminTreeNamespace'
  description: The raw namespace tree array; an empty listing is an empty array, never null.

WikiAdminTreeResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/WikiAdminTreeResult'
    - $ref: '#/ApiFailure'


WikiSyncPages:
  type: object
  required: [total, namespaces]
  properties:
    total:
      type: integer
      format: int64
      description: Total wiki page projection rows (including soft-deleted pages).
    namespaces:
      type: integer
      format: int64
      description: Total wiki namespaces.
  additionalProperties: false

WikiSyncRunView:
  type: object
  required: [id, headSha, trigger, status, pagesAdded, pagesUpdated, pagesDeleted, startedAt]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    headSha:
      type: string
      description: Git commit SHA of the synced head.
    trigger:
      type: string
      enum: [manual, schedule, webhook, startup]
      description: What started the sync run.
    status:
      type: string
      enum: [running, success, failed]
    pagesAdded:
      type: integer
    pagesUpdated:
      type: integer
    pagesDeleted:
      type: integer
    error:
      type: string
      description: Failure message; absent when the run succeeded.
    startedAt:
      type: string
      format: date-time
    finishedAt:
      type: string
      format: date-time
      description: Absent while the run is still running.
  additionalProperties: false

WikiSyncStatus:
  type: object
  required: [enabled, repo, branch, headSha, pages]
  properties:
    enabled:
      type: boolean
      description: Whether GitHub wiki sync is configured ([wiki.git].repo non-empty).
    repo:
      type: string
      description: Wiki repository URL; empty when sync is disabled.
    branch:
      type: string
      description: Default branch synced from the repository (defaults to main).
    headSha:
      type: string
      description: Head commit SHA of the latest run; empty before the first run.
    lastRun:
      $ref: '#/WikiSyncRunView'
      description: Latest run; absent before the first run.
    recentRuns:
      type: array
      items:
        $ref: '#/WikiSyncRunView'
      description: Recent runs, newest first; absent when no runs exist yet.
    pages:
      $ref: '#/WikiSyncPages'
  additionalProperties: false

WikiSyncStatusResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/WikiSyncStatus'
    - $ref: '#/ApiFailure'

WikiSyncAccepted:
  type: object
  required: [accepted]
  properties:
    accepted:
      type: boolean
      const: true
      description: The sync run was accepted and is now executing asynchronously.
  additionalProperties: false

WikiSyncRunResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/WikiSyncAccepted'
    - $ref: '#/ApiFailure'

WikiSyncRunsResult:
  type: array
  items:
    $ref: '#/WikiSyncRunView'
  description: Recent sync runs ordered by id desc; an empty listing is an empty array, never null.

WikiSyncRunsResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/WikiSyncRunsResult'
    - $ref: '#/ApiFailure'

WikiWebhookSuccess:
  type: object
  required: [ok]
  properties:
    ok:
      type: boolean
      const: true
  additionalProperties: false

WikiWebhookFailure:
  type: object
  required: [error]
  properties:
    error:
      type: string
  additionalProperties: false


# ================= User account / notifications / chat（Issue #277 P2）=================

CaptchaResult:
  type: object
  required: [captchaId, captchaImg]
  properties:
    captchaId:
      type: string
      minLength: 1
      description: Captcha challenge id; echoed back as captchaId on captcha-guarded writes.
    captchaImg:
      type: string
      minLength: 1
      description: Captcha image as a `data:image/png;base64` data URI, renderable directly in an <img> element.
  additionalProperties: false

CaptchaSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/CaptchaResult'

ExternalInformationItem:
  type: object
  required: [link]
  properties:
    link:
      type: string
      description: External profile URL; empty when unset.
  additionalProperties: false

ExternalInformation:
  type: object
  required: [github, weibo, bilibili, twitter, linkedIn, zhihu]
  properties:
    github:
      $ref: '#/ExternalInformationItem'
    weibo:
      $ref: '#/ExternalInformationItem'
    bilibili:
      $ref: '#/ExternalInformationItem'
    twitter:
      $ref: '#/ExternalInformationItem'
    linkedIn:
      $ref: '#/ExternalInformationItem'
    zhihu:
      $ref: '#/ExternalInformationItem'
  additionalProperties: false

UserBadge:
  type: object
  required: [code, type, grantMode, name, description, iconType, iconKey, iconUrl, color, level, isEnabled, isWearable, sortOrder, source, reason, grantedAt]
  properties:
    code:
      type: string
    type:
      type: string
    grantMode:
      type: string
    name:
      type: string
    description:
      type: string
    iconType:
      type: string
    iconKey:
      type: string
    iconUrl:
      type: string
    color:
      type: string
    level:
      type: string
    isEnabled:
      type: boolean
    isWearable:
      type: boolean
    sortOrder:
      type: integer
    source:
      type: string
      description: How the badge was granted (system or manual).
    reason:
      type: string
    grantedAt:
      type: string
      description: Grant time in RFC 3339 format.
  additionalProperties: false

UserCard:
  type: object
  required: [userId, username, nickname, avatarUrl, profileCoverUrl, bio, signature, websiteName, website, prestige, isAdmin, topicCount, replyCount, likeReceivedCount, likeGivenCount, followerCount, followingCount, collectionCount, isOnline, isFollowing, externalInformation, isSelf, badges, lastActiveTime, createdAt, isAccountClosed]
  properties:
    userId:
      type: integer
      format: uint64
      minimum: 1
    username:
      type: string
    nickname:
      type: string
    avatarUrl:
      type: string
    profileCoverUrl:
      type: string
    bio:
      type: string
    signature:
      type: string
    websiteName:
      type: string
    website:
      type: string
    prestige:
      type: integer
      format: int64
    isAdmin:
      type: boolean
    topicCount:
      type: integer
      minimum: 0
    replyCount:
      type: integer
      minimum: 0
    likeReceivedCount:
      type: integer
      minimum: 0
    likeGivenCount:
      type: integer
      minimum: 0
    followerCount:
      type: integer
      minimum: 0
    followingCount:
      type: integer
      minimum: 0
    collectionCount:
      type: integer
      minimum: 0
    isOnline:
      type: boolean
    isFollowing:
      type: boolean
      description: Viewer-specific; always false on this route because the route group mounts no JWT middleware.
    externalInformation:
      $ref: '#/ExternalInformation'
    isSelf:
      type: boolean
      description: Viewer-specific; always false on this route because the route group mounts no JWT middleware.
    badges:
      type: array
      items:
        $ref: '#/UserBadge'
      description: Always an array (empty when the user holds no badges), never null.
    wornBadge:
      $ref: '#/UserBadge'
    lastActiveTime:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
      description: Account creation time in RFC 3339 format.
    isAccountClosed:
      type: boolean
      description: True renders the tombstone card of a closed (soft-deleted) account; the other fields then carry zero values.
  additionalProperties: false

UserCardSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/UserCard'

UserCardResponse:
  oneOf:
    - $ref: '#/UserCardSuccess'
    - $ref: '#/ApiFailure'

UserUpdateSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          const: 更新成功
          description: Human-readable success message; messageCode is the stable identifier.
        messageCode:
          type: string
          const: user.updateSuccess

UserUpdateResponse:
  oneOf:
    - $ref: '#/UserUpdateSuccess'
    - $ref: '#/ApiFailure'

SetUserInfoRequest:
  type: object
  properties:
    nickname:
      type: string
    bio:
      type: string
      description: Full-overwrite semantics; an empty string clears the field.
    signature:
      type: string
      description: Full-overwrite semantics; an empty string clears the field.
    website:
      type: string
    websiteName:
      type: string
    locale:
      type: string
      description: UI locale; only applied when non-empty after trimming.
    externalInformation:
      $ref: '#/ExternalInformation'
  additionalProperties: false

SetUserProfileCoverRequest:
  type: object
  properties:
    profileCoverUrl:
      type: string
      description: Cover image URL; trimmed server-side, an empty string clears the cover.
  additionalProperties: false

SetUserEmailRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
      description: New email address; lower-cased and trimmed server-side.
    password:
      type: string
      minLength: 1
      description: Current account password as second-factor confirmation.
  additionalProperties: false

ResendActivationResult:
  type: object
  required: [remainingToday]
  properties:
    remainingToday:
      type: integer
      minimum: 0
      description: Remaining activation-email resends allowed today (daily limit 3).
  additionalProperties: false

ResendActivationSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode, params]
      properties:
        result:
          $ref: '#/ResendActivationResult'
        messageCode:
          type: string
          const: auth.activation.resendSuccess
        params:
          type: object
          required: [remainingToday]
          properties:
            remainingToday:
              type: integer
              minimum: 0
          additionalProperties: true

ResendActivationResponse:
  oneOf:
    - $ref: '#/ResendActivationSuccess'
    - $ref: '#/ApiFailure'

SetUserNameRequest:
  type: object
  required: [username]
  properties:
    username:
      type: string
      pattern: '^[a-zA-Z0-9_-]{6,32}$'
      description: New username; values outside the pattern fail with `auth.username.invalid` (HTTP 200).
  additionalProperties: false

SetPresetAvatarRequest:
  type: object
  required: [avatarUrl]
  properties:
    avatarUrl:
      type: string
      enum:
        - /static/pic/1.webp
        - /static/pic/2.webp
        - /static/pic/3.webp
        - /static/pic/4.webp
        - /static/pic/5.webp
        - /static/pic/6.webp
        - /static/pic/7.webp
        - /static/pic/8.webp
        - /static/pic/9.webp
        - /static/pic/10.webp
        - /static/pic/11.webp
        - /static/pic/12.webp
      description: Built-in preset avatar; any other value fails with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

PresetAvatarResult:
  type: object
  required: [avatarUrl]
  properties:
    avatarUrl:
      type: string
      description: Web URL of the applied preset avatar.
  additionalProperties: false

PresetAvatarSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/PresetAvatarResult'

PresetAvatarResponse:
  oneOf:
    - $ref: '#/PresetAvatarSuccess'
    - $ref: '#/ApiFailure'

WearBadgeRequest:
  type: object
  properties:
    badgeCode:
      type: string
      description: Badge to wear; an empty string (or omitted field) takes the current badge off. Unknown or not-owned codes fail with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

UploadAvatarRequest:
  type: object
  required: [avatar]
  properties:
    avatar:
      type: string
      format: binary
      description: Primary avatar image file.
    avatarMedium:
      type: string
      format: binary
      description: Optional pre-cropped medium avatar; when present the server stores both files and returns avatarMediumUrl.
  additionalProperties: false

UploadAvatarResult:
  type: object
  required: [avatarUrl]
  properties:
    avatarUrl:
      type: string
    avatarMediumUrl:
      type: string
      description: Present only when an avatarMedium file was uploaded.
  additionalProperties: false

UploadAvatarSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          $ref: '#/UploadAvatarResult'
        messageCode:
          type: string
          const: upload.success

UploadAvatarResponse:
  oneOf:
    - $ref: '#/UploadAvatarSuccess'
    - $ref: '#/ApiFailure'

ChangePasswordRequest:
  type: object
  required: [oldPassword, newPassword]
  properties:
    oldPassword:
      type: string
      minLength: 1
      description: Current password; a wrong value fails with `auth.password.oldInvalid` (HTTP 200).
    newPassword:
      type: string
      minLength: 1
      description: 6-64 characters containing at least one letter and one digit; violations fail with `auth.password.tooShort` (params minLength) / `auth.password.tooLong` / `auth.password.needsLetterNumber` (HTTP 200).
  additionalProperties: false

ChangePasswordSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          const: 密码修改成功
          description: Human-readable success message; messageCode is the stable identifier.
        messageCode:
          type: string
          const: auth.password.updateSuccess

ChangePasswordResponse:
  oneOf:
    - $ref: '#/ChangePasswordSuccess'
    - $ref: '#/ApiFailure'

OAuthBinding:
  oneOf:
    - type: object
      required: [bound, provider, createdAt, updatedAt]
      properties:
        bound:
          type: boolean
          const: true
        provider:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    - type: object
      required: [bound]
      properties:
        bound:
          type: boolean
          const: false
      additionalProperties: false

OAuthBindingsResult:
  type: object
  required: [github, google]
  properties:
    github:
      $ref: '#/OAuthBinding'
    google:
      $ref: '#/OAuthBinding'
  additionalProperties: false
  description: Binding state keyed by provider; the response always carries the fixed github and google keys.

OAuthBindingsSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/OAuthBindingsResult'

OAuthBindingsResponse:
  oneOf:
    - $ref: '#/OAuthBindingsSuccess'
    - $ref: '#/ApiFailure'

UnbindOAuthSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode, params]
      properties:
        result:
          type: string
          const: 解绑成功
          description: Human-readable success message; messageCode is the stable identifier.
        messageCode:
          type: string
          const: oauth.unbind.success
        params:
          type: object
          required: [provider]
          properties:
            provider:
              type: string
          additionalProperties: true

UnbindOAuthResponse:
  oneOf:
    - $ref: '#/UnbindOAuthSuccess'
    - $ref: '#/ApiFailure'

UnreadStatusResult:
  type: object
  required: [notifications, messages, moderationReports]
  properties:
    notifications:
      type: boolean
      description: True when the user has unread notifications.
    messages:
      type: boolean
      description: True when the user has unread chat messages.
    moderationReports:
      type: boolean
      description: True when the user has open moderation reports.
    latestNotificationType:
      type: string
      description: Event type of the latest unread notification; omitted when there are no unread notifications.
  additionalProperties: false

UnreadStatusSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/UnreadStatusResult'

UnreadStatusResponse:
  oneOf:
    - $ref: '#/UnreadStatusSuccess'
    - $ref: '#/ApiFailure'

NotificationTopicRef:
  type: object
  required: [id, title, url]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    title:
      type: string
    url:
      type: string
  additionalProperties: false

NotificationPayload:
  type: object
  required: [id, eventType, isRead, createdAt, title, content, actor, payload]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    eventType:
      type: string
      description: Notification event type (for example reply/like/system); the payload shape varies with it.
    isRead:
      type: boolean
    createdAt:
      type: string
      description: Notification creation time in RFC 3339 format.
    title:
      type: string
    content:
      type: string
    actor:
      $ref: '#/TopicAuthorPayload'
    topic:
      $ref: '#/NotificationTopicRef'
    payload:
      type: object
      additionalProperties: true
      description: Raw event payload (title/content/templateKey/templateParams/actorId/topicId/postId/metadata and friends); shape varies by eventType.
  additionalProperties: false

NotificationListResult:
  type: object
  required: [items, nextCursor, hasNext, unreadCount]
  properties:
    items:
      type: array
      items:
        $ref: '#/NotificationPayload'
    nextCursor:
      type: integer
      format: uint64
      minimum: 0
      description: Cursor for the next (older) page; 0 when no further page exists.
    hasNext:
      type: boolean
    unreadCount:
      type: integer
      format: int64
      minimum: 0
      description: Total unread notification count of the caller, independent of the current filter.
  additionalProperties: false

NotificationListSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/NotificationListResult'

NotificationListResponse:
  oneOf:
    - $ref: '#/NotificationListSuccess'
    - $ref: '#/ApiFailure'

MarkNotificationReadRequest:
  type: object
  required: [notificationId]
  properties:
    notificationId:
      type: integer
      format: uint64
      minimum: 1
      description: Missing or zero fails validation with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

NotificationMarkReadSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          const: 标记已读成功
          description: Human-readable success message; messageCode is the stable identifier.
        messageCode:
          type: string
          const: notification.markRead.success

NotificationMarkReadResponse:
  oneOf:
    - $ref: '#/NotificationMarkReadSuccess'
    - $ref: '#/ApiFailure'

NotificationMarkAllReadSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          const: 标记全部已读成功
          description: Human-readable success message; messageCode is the stable identifier.
        messageCode:
          type: string
          const: notification.markAllRead.success

NotificationMarkAllReadResponse:
  oneOf:
    - $ref: '#/NotificationMarkAllReadSuccess'
    - $ref: '#/ApiFailure'

SendChatMessageRequest:
  type: object
  required: [peerId, content, msgType]
  properties:
    peerId:
      type: integer
      format: uint64
      minimum: 1
      description: Recipient user id; messaging oneself fails with `chat.send.failed` (HTTP 200).
    content:
      type: string
      minLength: 1
      description: Message content; sensitive-word hits fail with `chat.sensitive.blocked` (HTTP 200, params word).
    msgType:
      type: integer
      enum: [1, 2, 3]
      description: 1 text, 2 image, 3 voice. Effectively required — omitting it binds 0 and fails validation with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

SendChatMessageResult:
  type: object
  required: [convId]
  properties:
    convId:
      type: integer
      format: uint64
      minimum: 1
      description: Conversation id the message was stored under; reuse it for messages/mark-read.
  additionalProperties: false

SendChatMessageSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/SendChatMessageResult'

SendChatMessageResponse:
  oneOf:
    - $ref: '#/SendChatMessageSuccess'
    - $ref: '#/ApiFailure'

GetChatMessagesRequest:
  type: object
  required: [convId]
  properties:
    convId:
      type: integer
      format: uint64
      minimum: 1
      description: Target conversation; non-members and unknown ids fail with `chat.messages.failed` (HTTP 200) without revealing which case matched.
    beforeId:
      type: integer
      format: uint64
      minimum: 0
      description: Return the page of messages older than this message id; mutually exclusive with afterId. 0 is treated as omitted.
    afterId:
      type: integer
      format: uint64
      minimum: 0
      description: Return the page of messages newer than this message id; mutually exclusive with beforeId. 0 is treated as omitted.
    limit:
      type: integer
      minimum: 1
      maximum: 100
      description: Page size; omitted or 0 falls back to the server default (30), values above 100 fail validation with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

ChatMessageVo:
  type: object
  required: [id, senderId, content, msgType, isRead, createdAt, isSelf]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    senderId:
      type: integer
      format: uint64
      minimum: 1
    content:
      type: string
    msgType:
      type: integer
      enum: [1, 2, 3]
      description: 1 text, 2 image, 3 voice.
    isRead:
      type: integer
      enum: [0, 1]
      description: Numeric read flag (0 unread, 1 read), not a boolean.
    createdAt:
      type: string
      description: Message creation time in RFC 3339 format.
    isSelf:
      type: boolean
      description: True when the caller sent this message.
  additionalProperties: false

ChatMessagesResult:
  type: object
  required: [list, hasMoreBefore, hasMoreAfter, nextBeforeId, latestId]
  properties:
    list:
      type: array
      items:
        $ref: '#/ChatMessageVo'
      description: Ascending by message id within the page.
    hasMoreBefore:
      type: boolean
      description: True when older messages exist beyond this page (only meaningful for latest/beforeId reads).
    hasMoreAfter:
      type: boolean
      description: True when newer messages exist beyond this page (only set for afterId reads).
    nextBeforeId:
      type: integer
      format: uint64
      minimum: 0
      description: Id of the oldest returned message; pass as beforeId for the next older page. 0 when the page is empty.
    latestId:
      type: integer
      format: uint64
      minimum: 0
      description: Id of the newest returned message. 0 when the page is empty.
  additionalProperties: false

ChatMessagesSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/ChatMessagesResult'

ChatMessagesResponse:
  oneOf:
    - $ref: '#/ChatMessagesSuccess'
    - $ref: '#/ApiFailure'

MarkChatReadRequest:
  type: object
  required: [convId]
  properties:
    convId:
      type: integer
      format: uint64
      minimum: 1
      description: Conversation to clear; non-members and unknown ids fail with `chat.markRead.failed` (HTTP 200) without revealing which case matched.
  additionalProperties: false

ChatMarkReadSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: 'null'
          description: The success envelope carries no payload (result is null and no messageCode is emitted).

ChatMarkReadResponse:
  oneOf:
    - $ref: '#/ChatMarkReadSuccess'
    - $ref: '#/ApiFailure'


# ================= Forum moderation workbench（Issue #277 P3）=================

ModerationTopicStatusRequest:
  type: object
  required: [topicId, action]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 1
      description: Target topic; unknown ids fail with `topic.notFound` (HTTP 200). Missing or zero fails validation with `common.request.invalidParams` (HTTP 200).
    action:
      type: string
      enum: [ban, unban]
      description: ban sets processStatus 1 (hidden from public views), unban restores 0. Any other value (including empty) fails validation with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

ModerationPostStatusRequest:
  type: object
  required: [postId, action]
  properties:
    postId:
      type: integer
      format: uint64
      minimum: 1
      description: Target post; unknown ids fail with `post.notFound` (HTTP 200). Missing or zero fails validation with `common.request.invalidParams` (HTTP 200).
    action:
      type: string
      enum: [ban, unban]
      description: ban sets processStatus 1, unban restores 0. Any other value (including empty) fails validation with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

ModerationActionSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: boolean
          const: true
          description: Idempotent — repeating an already-applied status also returns true.

ModerationActionResponse:
  oneOf:
    - $ref: '#/ModerationActionSuccess'
    - $ref: '#/ApiFailure'

ModerationReportListRequest:
  type: object
  properties:
    status:
      type: string
      enum: [open, closed, resolved, rejected]
      description: Optional filter; omitted means `open`. `closed` expands to resolved+rejected server-side. Any other value fails validation with `common.request.invalidParams` (HTTP 200).
    cursor:
      type: integer
      format: uint64
      minimum: 0
      description: Pass the previous page's nextCursor for the next page; omit or send 0 for the first page.
    pageSize:
      type: integer
      description: Clamped server-side into the 10-50 range (values below 10 become 10, above 50 become 50).
    category:
      type: integer
      format: uint64
      minimum: 0
      description: Optional category filter, intersected with the caller's moderation scope; a category outside the scope yields an empty page.
  additionalProperties: false

ModerationReportItem:
  type: object
  required: [id, targetType, targetId, targetUrl, title, excerpt, reason, note, status, resolution, reporter, handler, categories, createdAt]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    targetType:
      type: string
      enum: [topic, post]
    targetId:
      type: integer
      format: uint64
      minimum: 1
    targetUrl:
      type: string
      description: Deep link to the reported content; empty when it cannot be resolved.
    title:
      type: string
    excerpt:
      type: string
      description: Content snapshot taken at report time (max 120 runes).
    reason:
      type: string
      enum: [spam, abuse, illegal, irrelevant, other]
    note:
      type: string
      description: Reporter note (max 300 runes); may be empty.
    status:
      type: string
      enum: [open, resolved, rejected]
    resolution:
      type: string
      enum: [banned, ignored, '']
      description: Set when handled; empty for open reports and for resolve actions.
    reporter:
      $ref: '#/TopicAuthorPayload'
    handler:
      $ref: '#/ReportHandlerPayload'
    categories:
      type: array
      items:
        $ref: '#/TopicCategoryPayload'
    createdAt:
      type: string
      description: RFC 3339 timestamp.
    handledAt:
      type: string
      description: RFC 3339 timestamp; omitted while the report is open.
    targetDeleted:
      type: boolean
      description: Present and true when the reported content has since been deleted; review still relies on the report-time snapshot.
  additionalProperties: false

ModerationReportListResult:
  type: object
  required: [items, nextCursor, hasNext]
  properties:
    items:
      type: array
      items:
        $ref: '#/ModerationReportItem'
    nextCursor:
      type: integer
      format: uint64
      minimum: 0
      description: Pass as cursor for the next page; 0 when hasNext is false.
    hasNext:
      type: boolean
  additionalProperties: false

ModerationReportListSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/ModerationReportListResult'

ModerationReportListResponse:
  oneOf:
    - $ref: '#/ModerationReportListSuccess'
    - $ref: '#/ApiFailure'

ModerationReportStatusRequest:
  type: object
  required: [id, action]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
      description: Report id; unknown ids fail with `report.notFound` (HTTP 200). Missing or zero fails validation with `common.request.invalidParams` (HTTP 200).
    action:
      type: string
      enum: [ban, resolve, reject]
      description: ban resolves with resolution `banned`, resolve resolves with empty resolution, reject rejects with resolution `ignored`. Any other value (including empty) fails validation with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

ModerationLogListRequest:
  type: object
  properties:
    cursor:
      type: integer
      format: uint64
      minimum: 0
      description: Pass the previous page's nextCursor for the next page; omit or send 0 for the first page.
    pageSize:
      type: integer
      description: Clamped server-side into the 10-50 range.
  additionalProperties: false

ModerationLogSubject:
  type: object
  required: [type, id, title]
  properties:
    type:
      type: string
      enum: [topic, post, report, category, user, system]
    id:
      type: integer
      format: uint64
      minimum: 0
    title:
      type: string
    url:
      type: string
      description: Deep link to the subject; omitted when it cannot be resolved.
    excerpt:
      type: string
      description: Omitted when no excerpt is available.
  additionalProperties: false

ModerationLogItem:
  type: object
  required: [id, action, actor, subject, categories, messageCode, params, createdAt]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    action:
      type: string
      description: Stable action identifier recorded in the moderation log (e.g. topic status change, report handling, deleted-content view).
    actor:
      $ref: '#/TopicAuthorPayload'
    subject:
      $ref: '#/ModerationLogSubject'
    categories:
      type: array
      items:
        $ref: '#/TopicCategoryPayload'
    messageCode:
      type: string
      description: Stable message identifier for rendering the log entry.
    params:
      type: object
      additionalProperties: true
      description: Localization params for messageCode; shape depends on the action.
    createdAt:
      type: string
      description: RFC 3339 timestamp.
  additionalProperties: false

ModerationLogListResult:
  type: object
  required: [items, nextCursor, hasNext]
  properties:
    items:
      type: array
      items:
        $ref: '#/ModerationLogItem'
    nextCursor:
      type: integer
      format: uint64
      minimum: 0
      description: Pass as cursor for the next page; 0 when hasNext is false.
    hasNext:
      type: boolean
  additionalProperties: false

ModerationLogListSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/ModerationLogListResult'

ModerationLogListResponse:
  oneOf:
    - $ref: '#/ModerationLogListSuccess'
    - $ref: '#/ApiFailure'

ViewDeletedContentRequest:
  type: object
  required: [contentType, contentId, reason]
  properties:
    contentType:
      type: string
      enum: [topic, post]
      description: Any other value fails with `common.request.invalidParams` (HTTP 200).
    contentId:
      type: integer
      format: uint64
      minimum: 1
      description: Deleted topic or post id. Unknown, still-visible, or permanently purged content fails with `topic.notFound` / `post.notFound` (HTTP 200).
    reason:
      type: string
      minLength: 1
      maxLength: 300
      description: Mandatory audit reason; every view is written to the moderation log. Blank after trimming fails with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

ModerationDeletedContentView:
  type: object
  required: [contentType, contentId, title, content, authorId, authorName, categories, deletedBy, deletedByWho, deletedAt, deleteReason, targetUrl]
  properties:
    contentType:
      type: string
      enum: [topic, post]
    contentId:
      type: integer
      format: uint64
      minimum: 1
    topicId:
      type: integer
      format: uint64
      minimum: 1
      description: Owning topic id; omitted when it cannot be resolved.
    title:
      type: string
      description: Topic title, or `回复 #<postNo>` for a deleted reply.
    content:
      type: string
      description: Raw markdown source of the deleted content.
    authorId:
      type: integer
      format: uint64
      minimum: 0
    authorName:
      type: string
      description: Resolved at view time; empty when the author account is gone.
    categories:
      type: array
      items:
        $ref: '#/TopicCategoryPayload'
    deletedBy:
      type: integer
      format: uint64
      minimum: 0
      description: User id of the deleting actor; 0 when not recorded.
    deletedByWho:
      type: string
      description: Username of the deleting actor; empty when not resolvable.
    deletedAt:
      type: string
      description: RFC 3339 deletion timestamp; empty when not recorded.
    deleteReason:
      type: string
    targetUrl:
      type: string
  additionalProperties: false

ViewDeletedContentSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/ModerationDeletedContentView'

ViewDeletedContentResponse:
  oneOf:
    - $ref: '#/ViewDeletedContentSuccess'
    - $ref: '#/ApiFailure'

# ================= Admin topic/post management（Issue #277 P3）=================

AdminTopicsListRequest:
  type: object
  properties:
    page:
      type: integer
      minimum: 0
      description: 1-based page; values below 1 are treated as page 1.
    pageSize:
      type: integer
      description: Bounded server-side to the shared page-size limits.
    search:
      type: string
      description: Case-insensitive title substring filter.
    userId:
      type: integer
      format: uint64
      minimum: 0
      description: Optional author filter; 0 or omitted lists all authors.
  additionalProperties: false

AdminTopicBase:
  type: object
  required: [id, title, description, categoryId, userId, topicStatus, processStatus, createdAt, updatedAt]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    title:
      type: string
    description:
      type: string
      description: Topic excerpt.
    categoryId:
      type: array
      items:
        type: integer
        format: uint64
        minimum: 1
    userId:
      type: integer
      format: uint64
      minimum: 1
      description: Author user id.
    topicStatus:
      type: integer
      description: Lifecycle status of the topic (0 unlisted, 1 published).
    processStatus:
      type: integer
      description: Moderation status (0 normal, 1 banned).
    createdAt:
      type: string
      description: RFC 3339 timestamp.
    updatedAt:
      type: string
      description: RFC 3339 timestamp.

AdminTopicListItem:
  allOf:
    - $ref: '#/AdminTopicBase'
    - type: object
      required: [username, userAvatarUrl, viewCount, replyCount, likeCount, pinWeight]
      properties:
        username:
          type: string
          description: Author username; empty when the author account is gone.
        userAvatarUrl:
          type: string
        viewCount:
          type: integer
          format: uint64
          minimum: 0
        replyCount:
          type: integer
          format: uint64
          minimum: 0
        likeCount:
          type: integer
          format: uint64
          minimum: 0
        pinWeight:
          type: integer
          minimum: 0
          description: Pin weight; larger values sort first.
  unevaluatedProperties: false

AdminTopicsListResult:
  type: object
  required: [list, page, size, total]
  properties:
    list:
      type: array
      items:
        $ref: '#/AdminTopicListItem'
    page:
      type: integer
      minimum: 1
    size:
      type: integer
      minimum: 1
      description: Effective page size after server-side bounding.
    total:
      type: integer
      format: int64
      description: Always 0 — the admin list query does not compute a total count.
    hasNext:
      type: boolean
      description: Omitted from the wire payload when false.
  additionalProperties: false

AdminTopicsListSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/AdminTopicsListResult'

AdminTopicsListResponse:
  oneOf:
    - $ref: '#/AdminTopicsListSuccess'
    - $ref: '#/ApiFailure'

AdminTopicSourceRequest:
  type: object
  required: [topicId]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 1
      description: Unknown ids fail with `topic.notFound` (HTTP 200). Missing or zero fails validation with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

AdminTopicSource:
  allOf:
    - $ref: '#/AdminTopicBase'
    - type: object
      required: [content]
      properties:
        content:
          type: string
          description: Raw markdown source of the topic's first post.
  unevaluatedProperties: false

AdminTopicSourceSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/AdminTopicSource'

AdminTopicSourceResponse:
  oneOf:
    - $ref: '#/AdminTopicSourceSuccess'
    - $ref: '#/ApiFailure'

AdminEditTopicRequest:
  type: object
  required: [topicId, processStatus]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 1
      description: Unknown ids fail with `topic.notFound` (HTTP 200).
    processStatus:
      type: integer
      enum: [0, 1]
      description: 0 normal, 1 banned. Any other value fails validation with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

AdminDeleteTopicRequest:
  type: object
  required: [topicId, reason]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 1
      description: Unknown ids fail with `topic.notFound` (HTTP 200). Wiki subsite topics fail with `topic.operationDenied` (HTTP 200).
    reason:
      type: string
      minLength: 1
      maxLength: 500
      description: Mandatory moderation reason, stored in the audit log. Blank after trimming fails with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

AdminRestoreTopicRequest:
  type: object
  required: [topicId]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 1
      description: Unknown ids fail with `topic.notFound` (HTTP 200); topics not in the moderator-removed state fail with `content.notRecoverable` (HTTP 200).
  additionalProperties: false

AdminDeletePostRequest:
  type: object
  required: [postId, reason]
  properties:
    postId:
      type: integer
      format: uint64
      minimum: 1
      description: Reply posts only. Unknown ids fail with `post.notFound` (HTTP 200); the topic first post fails with `common.request.invalidParams` (HTTP 200) — delete the topic instead.
    reason:
      type: string
      minLength: 1
      maxLength: 500
      description: Mandatory moderation reason, stored in the audit log. Blank after trimming fails with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

AdminEditTopicPinRequest:
  type: object
  required: [topicId, pinWeight]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 1
      description: Unknown ids fail with `topic.notFound` (HTTP 200).
    pinWeight:
      type: integer
      minimum: 0
      maximum: 1000000
      description: 0 unpins; larger weights sort first. Values outside 0-1000000 fail validation with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

AdminEditTopicCategoriesRequest:
  type: object
  required: [topicId, categoryId]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 1
      description: Unknown ids fail with `topic.notFound` (HTTP 200).
    categoryId:
      type: array
      items:
        type: integer
        format: uint64
        minimum: 1
      minItems: 1
      maxItems: 3
      description: Replacement category set (deduplicated server-side). An empty/omitted set or more than three raw entries fail request validation with `common.request.invalidParams`; zero or unknown ids fail with `admin.category.notFound` (all HTTP 200). The handler's `admin.topic.categoryRequired` / `admin.topic.categoryTooMany` branches are unreachable because validation runs first.
  additionalProperties: false

AdminOperationSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          const: 操作成功
        messageCode:
          type: string
          enum: [common.operation.success, content.restore.success]
          description: "`common.operation.success` for most operations; `content.restore.success` for adminRestoreTopic."

AdminOperationResponse:
  oneOf:
    - $ref: '#/AdminOperationSuccess'
    - $ref: '#/ApiFailure'

# ================= Admin operations: agent accounts, opt records, traffic（Issue #277 P3 切片二）=================

AdminAgentItem:
  type: object
  required: [agentId, username, nickname, avatarUrl, email, tokenPrefix, webhookEndpoint, enabled, createdBy, lastUsedAt, createdAt, updatedAt]
  properties:
    agentId:
      type: integer
      format: uint64
      minimum: 1
      description: Bot user id backing the Agent.
    username:
      type: string
    nickname:
      type: string
    avatarUrl:
      type: string
    email:
      type: string
      description: Always empty — bot users carry no email.
    tokenPrefix:
      type: string
      description: Non-secret token prefix (`agt_` + 8 chars); the token and its hash never leave the server.
    webhookEndpoint:
      type: string
      description: Optional HTTP(S) webhook endpoint; empty when unset.
    enabled:
      type: integer
      enum: [0, 1]
      description: 1 enabled, 0 disabled. Disabling also revokes the stored credential.
    createdBy:
      type: integer
      format: uint64
      minimum: 0
      description: Admin user id that created the Agent.
    lastUsedAt:
      type: [integer, 'null']
      format: int64
      description: Millisecond timestamp of the last authenticated use; null when never used.
    createdAt:
      type: integer
      format: int64
      description: Millisecond timestamp.
    updatedAt:
      type: integer
      format: int64
      description: Millisecond timestamp.
  additionalProperties: false

AdminAgentListResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: array
          items:
            $ref: '#/AdminAgentItem'
          description: All Agents, newest first.

AdminAgentCreateRequest:
  type: object
  required: [username]
  properties:
    username:
      type: string
      pattern: '^[a-zA-Z0-9_-]{6,32}$'
      description: Bot username. Missing/blank fails request validation with `common.request.invalidParams` (HTTP 200); a value failing the format rule fails with `admin.agent.usernameInvalid` (HTTP 200); a taken username fails with `admin.agent.usernameExists` (HTTP 200).
    nickname:
      type: string
      maxLength: 64
      description: Optional display name; more than 64 runes fails with `common.request.invalidParams` (HTTP 200).
    webhookEndpoint:
      type: string
      maxLength: 512
      description: Optional HTTP(S) webhook endpoint; non-HTTP(S) schemes, credentials, fragments, and local/private targets fail with `admin.agent.webhookInvalid` (HTTP 200).
  additionalProperties: false

AdminAgentCreateSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: object
          required: [agent, token]
          properties:
            agent:
              $ref: '#/AdminAgentItem'
            token:
              type: string
              pattern: '^agt_'
              description: Plaintext bearer token, returned exactly once at creation; only its hash is stored.
          additionalProperties: false

AdminAgentCreateResponse:
  oneOf:
    - $ref: '#/AdminAgentCreateSuccess'
    - $ref: '#/ApiFailure'

AdminAgentUpdateRequest:
  type: object
  required: [agentId]
  properties:
    agentId:
      type: integer
      format: uint64
      minimum: 1
      description: Unknown ids fail with `admin.agent.notFound` (HTTP 200); missing/zero fails request validation with `common.request.invalidParams` (HTTP 200).
    nickname:
      type: string
      maxLength: 64
      description: Applied only when present; more than 64 runes fails with `common.request.invalidParams` (HTTP 200).
    webhookEndpoint:
      type: string
      maxLength: 512
      description: Applied only when present; invalid endpoints fail with `admin.agent.webhookInvalid` (HTTP 200).
    enabled:
      type: integer
      enum: [0, 1]
      description: Applied only when present; other values fail with `common.request.invalidParams` (HTTP 200). Setting 0 revokes the stored credential; re-enabling an Agent whose credential was revoked fails with `admin.agent.needsRotate` (HTTP 200) until adminAgentRotateToken issues a new token.
  additionalProperties: false

AdminAgentUpdateResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/AdminAgentItem'
    - $ref: '#/ApiFailure'

AdminAgentIdRequest:
  type: object
  required: [agentId]
  properties:
    agentId:
      type: integer
      format: uint64
      minimum: 1
      description: Unknown ids fail with `admin.agent.notFound` (HTTP 200); missing/zero fails request validation with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

AdminAgentRotateTokenSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: object
          required: [agentId, token]
          properties:
            agentId:
              type: integer
              format: uint64
              minimum: 1
            token:
              type: string
              pattern: '^agt_'
              description: New plaintext bearer token, returned exactly once; the previous token stops resolving immediately.
          additionalProperties: false

AdminAgentRotateTokenResponse:
  oneOf:
    - $ref: '#/AdminAgentRotateTokenSuccess'
    - $ref: '#/ApiFailure'

AdminAgentDisableSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          const: success
        messageCode:
          type: string
          const: common.operation.success

AdminAgentDisableResponse:
  oneOf:
    - $ref: '#/AdminAgentDisableSuccess'
    - $ref: '#/ApiFailure'

AdminOptRecordPageRequest:
  type: object
  properties:
    page:
      type: integer
      minimum: 0
      description: 1-based page; values below 1 are treated as the first page. The echoed `page` in the response is 0-based (requested page minus one, floored at 0).
    pageSize:
      type: integer
      description: Bounded server-side into 10-50.
    optUserId:
      type: integer
      format: uint64
      minimum: 0
      description: Optional operator filter; 0 or omitted lists all operators.
    optType:
      type: integer
      description: Optional operation-type filter; 0 or omitted disables the filter.
    targetType:
      type: integer
      description: Optional target-type filter; 0 or omitted disables the filter.
    targetId:
      type: integer
      description: Optional target-id filter; 0 or omitted disables the filter.
  additionalProperties: false

AdminOptRecordItem:
  type: object
  required: [id, optUserId, optType, targetType, targetId, optInfo, createdAt]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    optUserId:
      type: integer
      format: uint64
      minimum: 0
      description: Operator user id.
    optType:
      type: integer
    targetType:
      type: integer
    targetId:
      type: string
      description: Target identifier stored as a string.
    optInfo:
      type: string
      description: Operation detail payload (JSON-encoded message code and params).
    createdAt:
      type: string
      description: RFC 3339 timestamp.
  additionalProperties: false

AdminOptRecordPageResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: object
          required: [list, page, size, total]
          properties:
            list:
              type: array
              items:
                $ref: '#/AdminOptRecordItem'
              description: Records sorted by id descending.
            page:
              type: integer
              minimum: 0
              description: Echoed 0-based page (requested page minus one, floored at 0).
            size:
              type: integer
              minimum: 1
              description: Effective page size after server-side bounding into 10-50.
            total:
              type: integer
              format: int64
              minimum: 0
            hasNext:
              type: boolean
              description: Omitted from the wire payload when false.
          additionalProperties: false

AdminTrafficOverviewRequest:
  type: object
  properties:
    startDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Inclusive range start (YYYY-MM-DD); empty defaults to 7 days ago.
    endDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Inclusive range end (YYYY-MM-DD); empty defaults to today.
  additionalProperties: false

AdminDailyTraffic:
  type: object
  required: [date, regCount, topicCount, replyCount]
  properties:
    date:
      type: string
      description: YYYY-MM-DD.
    regCount:
      type: integer
      format: int64
      minimum: 0
      description: Registered users that day; 0 when no stat row exists.
    topicCount:
      type: integer
      format: int64
      minimum: 0
      description: Published topics that day; 0 when no stat row exists.
    replyCount:
      type: integer
      format: int64
      minimum: 0
      description: Published replies that day; 0 when no stat row exists.
  additionalProperties: false

AdminTrafficOverviewResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              type: array
              items:
                $ref: '#/AdminDailyTraffic'
              description: One entry per day in the range, ascending; every in-range day is present even without stat rows.
    - $ref: '#/ApiFailure'

# ================= Admin user manager: users, badges, role options（Issue #277 P3 切片三）=================

AdminUserListRequest:
  type: object
  properties:
    username:
      type: string
      description: Substring filter on the username.
    userId:
      type: integer
      format: uint64
      minimum: 0
      description: Exact user-id filter; 0 or omitted lists all users.
    email:
      type: string
      description: Substring filter on the account email.
    page:
      type: integer
      minimum: 0
      description: 1-based page; values below 1 are treated as page 1. The echoed `page` in the response is 0-based.
    pageSize:
      type: integer
      description: Bounded server-side into 10-30.
  additionalProperties: false

AdminUserRoleOption:
  type: object
  required: [name, value]
  properties:
    name:
      type: string
      description: Role name.
    value:
      type: integer
      format: uint64
      minimum: 1
      description: Role id.
  additionalProperties: false
  description: The wire object may also carry a `label` string mirroring `name`; adminUserList never emits it.

AdminBadge:
  type: object
  required: [code, type, grantMode, name, description, iconType, iconKey, iconUrl, color, level, isEnabled, isWearable, sortOrder]
  properties:
    code:
      type: string
      description: Stable badge code (system codes like `early_member`, custom codes carry a `custom_` prefix).
    type:
      type: string
      enum: [system, custom]
    grantMode:
      type: string
      enum: [auto, manual]
      description: Only `manual` badges appear in adminUserBadgeOptions options and are grantable via adminSaveUserBadges.
    name:
      type: string
    description:
      type: string
    iconType:
      type: string
      enum: [asset, key]
    iconKey:
      type: string
      description: Icon key when iconType is `key`; empty otherwise.
    iconUrl:
      type: string
      description: Icon asset path when iconType is `asset`; empty otherwise.
    color:
      type: string
    level:
      type: string
      enum: [bronze, silver, gold, special]
    isEnabled:
      type: boolean
    isWearable:
      type: boolean
    sortOrder:
      type: integer
    isSystem:
      type: boolean
      description: System badges are seeded by the server; system badges cannot be deleted.
    canDelete:
      type: boolean
      description: Whether the current caller may delete this badge (false for system badges).
  additionalProperties: false

AdminUserBadge:
  allOf:
    - $ref: '#/AdminBadge'
    - type: object
      required: [source, reason, grantedAt]
      properties:
        source:
          type: string
          description: Grant source (`manual`, `auto`, `migration`).
        reason:
          type: string
          description: Grant reason recorded at grant time.
        grantedAt:
          type: string
          description: RFC 3339 timestamp of the (re)grant.

AdminUserItem:
  type: object
  required: [userId, username, avatarUrl, email, status, actorType, validate, prestige, roleList, createTime, lastActiveTime, badges]
  properties:
    userId:
      type: integer
      format: uint64
      minimum: 1
    username:
      type: string
    avatarUrl:
      type: string
      description: Web avatar URL; the banned avatar when the account is frozen, the default avatar when none is set.
    email:
      type: string
      description: Account email (PII — admin-only surface).
    status:
      type: integer
      description: Frozen flag (0 normal, 1 frozen).
    actorType:
      type: integer
      description: 0 human, 1 bot (Agent).
    validate:
      type: integer
      description: Activation flag (0 pending, 1 activated).
    prestige:
      type: integer
      format: int64
    roleList:
      type: [array, 'null']
      items:
        $ref: '#/AdminUserRoleOption'
      description: Single-entry array with the user's role; null when the user holds no role.
    roleId:
      type: integer
      format: uint64
      minimum: 1
      description: The user's role id; omitted from the wire payload when 0.
    createTime:
      type: string
      description: RFC 3339 timestamp.
    lastActiveTime:
      type: string
      description: RFC 3339 timestamp; falls back to the account creation time when no statistics row exists.
    badges:
      type: array
      items:
        $ref: '#/AdminUserBadge'
      description: The user's active badges (empty array when none).
  additionalProperties: false

AdminUserListResult:
  type: object
  required: [list, page, size, total]
  properties:
    list:
      type: array
      items:
        $ref: '#/AdminUserItem'
    page:
      type: integer
      minimum: 0
      description: 0-based echo of the requested 1-based page (requested page minus one, floored at 0).
    size:
      type: integer
      minimum: 10
      maximum: 30
      description: Effective page size after server-side bounding.
    total:
      type: integer
      format: int64
      minimum: 0
      description: Total number of users matching the filters.
  additionalProperties: false

AdminUserListSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/AdminUserListResult'

AdminUserListResponse:
  oneOf:
    - $ref: '#/AdminUserListSuccess'
    - $ref: '#/ApiFailure'

AdminEditUserRequest:
  type: object
  properties:
    userId:
      type: integer
      format: uint64
      minimum: 0
      description: Target user; 0 or unknown ids fail with `admin.user.targetFetchFailed` (HTTP 200).
    status:
      type: integer
      description: Frozen flag to apply (0 normal, 1 frozen). Omitted binds to 0 and unfreezes.
    validate:
      type: integer
      description: Activation flag to apply (0 pending, 1 activated). Omitted binds to 0 and deactivates.
    roleId:
      type: integer
      format: uint64
      minimum: 0
      description: Role to assign; 0 clears the role. Non-zero on a bot (Agent) account fails with `admin.agent.roleNotAllowed` (HTTP 200).
  additionalProperties: false
  description: No field is required and no field-level validation runs — omitted fields bind to zero values and overwrite the stored state.

AdminUserActionSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          const: success
        messageCode:
          type: string
          const: common.operation.success

AdminUserActionResponse:
  oneOf:
    - $ref: '#/AdminUserActionSuccess'
    - $ref: '#/ApiFailure'

AdminUserBadgeOptionsRequest:
  type: object
  properties:
    userId:
      type: integer
      format: uint64
      minimum: 0
      description: Target user whose active badges are listed; 0 or unknown ids yield an empty `active` array.
  additionalProperties: false

AdminUserBadgeOptionsResult:
  type: object
  required: [options, active]
  properties:
    options:
      type: array
      items:
        $ref: '#/AdminBadge'
      description: Every enabled manual-grant badge (built-in system definitions plus enabled custom overrides).
    active:
      type: array
      items:
        $ref: '#/AdminUserBadge'
      description: The target user's currently active badges.
  additionalProperties: false

AdminUserBadgeOptionsSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/AdminUserBadgeOptionsResult'

AdminUserBadgeOptionsResponse:
  oneOf:
    - $ref: '#/AdminUserBadgeOptionsSuccess'
    - $ref: '#/ApiFailure'

AdminSaveUserBadgesRequest:
  type: object
  properties:
    userId:
      type: integer
      format: uint64
      minimum: 0
      description: Target user; 0 fails with `user.notFound` (HTTP 200). No further existence check runs.
    badgeCodes:
      type: array
      items:
        type: string
      description: Replacement set of manually-granted badge codes (deduplicated server-side); codes that do not resolve to an enabled manual-grant badge are silently ignored.
  additionalProperties: false

AdminRoleOption:
  type: object
  required: [name, label, value]
  properties:
    name:
      type: string
      description: Role name.
    label:
      type: string
      description: Same as name.
    value:
      type: integer
      format: uint64
      minimum: 1
      description: Role id.
  additionalProperties: false

AdminRoleOptionsResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: array
          items:
            $ref: '#/AdminRoleOption'
          description: All non-deleted roles as options (empty array when none exist).

# ================= Admin role manager: permissions and roles（Issue #277 P3 切片三）=================

AdminPermissionOption:
  type: object
  required: [name, label, value]
  properties:
    name:
      type: string
      description: Permission name localized to the request locale.
    label:
      type: string
      description: Same as name.
    value:
      type: integer
      minimum: 0
      maximum: 6
      description: Permission enum id (0 Admin, 1 UserManager, 2 TopicsManager, 3 PageManager, 4 RoleManager, 5 SiteManager, 6 CourseManager).
  additionalProperties: false

AdminPermissionListResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: array
          items:
            $ref: '#/AdminPermissionOption'
          description: All 7 assignable permissions, enum id ascending.

AdminRolePermissionItem:
  type: object
  required: [id, name]
  properties:
    id:
      type: integer
      minimum: 0
      description: Permission enum id.
    name:
      type: string
      description: Permission name localized to the request locale; empty for unknown permission ids.
  additionalProperties: false

AdminRoleItem:
  type: object
  required: [roleId, roleName, effective, permissions, createTime]
  properties:
    roleId:
      type: integer
      format: uint64
      minimum: 1
    roleName:
      type: string
    effective:
      type: integer
      description: 1 effective, 0 disabled.
    permissions:
      type: array
      items:
        $ref: '#/AdminRolePermissionItem'
      description: Every stored permission grant of the role (including ineffective ones).
    createTime:
      type: string
      description: RFC 3339 timestamp.
  additionalProperties: false

AdminRoleListResult:
  type: object
  required: [list, page, size, total]
  properties:
    list:
      type: array
      items:
        $ref: '#/AdminRoleItem'
    page:
      type: integer
      minimum: 0
      description: Always 0 — the request binds no page field.
    size:
      type: integer
      minimum: 10
      description: Always 10 — the request binds no pageSize field and the server default applies.
    total:
      type: integer
      format: int64
      minimum: 0
  additionalProperties: false

AdminRoleListSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/AdminRoleListResult'

AdminRoleListResponse:
  oneOf:
    - $ref: '#/AdminRoleListSuccess'
    - $ref: '#/ApiFailure'

AdminRoleSaveRequest:
  type: object
  required: [roleName, permissions]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 0
      description: 0 creates a new role; a positive id updates that role (an unknown positive id silently creates a new role).
    roleName:
      type: string
      minLength: 1
      description: Blank fails request validation with `common.request.invalidParams` (HTTP 200).
    permissions:
      type: array
      items:
        type: integer
        format: uint64
        minimum: 0
      minItems: 1
      maxItems: 100
      description: Replacement permission-id set. Empty or over-long lists fail request validation with `common.request.invalidParams` (HTTP 200); unknown ids are stored as-is.
  additionalProperties: false

AdminRoleDeleteRequest:
  type: object
  properties:
    id:
      type: integer
      format: uint64
      minimum: 0
      description: Role to delete; 0 or unknown ids fail with `admin.role.notFound` (HTTP 200).
  additionalProperties: false

AdminBoolSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: boolean
          const: true

AdminBoolResponse:
  oneOf:
    - $ref: '#/AdminBoolSuccess'
    - $ref: '#/ApiFailure'

# ================= Admin category/moderator manager（Issue #277 P3 切片三）=================

AdminCategoryListRequest:
  type: object
  properties:
    page:
      type: integer
      description: Accepted but ignored — the category list is never paged.
    pageSize:
      type: integer
      description: Accepted but ignored — the category list is never paged.
  additionalProperties: false

AdminCategoryModeratorItem:
  type: object
  required: [id, userId, username, avatarUrl, status]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
      description: Moderator row id (the handle used by the delete operations).
    userId:
      type: integer
      format: uint64
      minimum: 1
    username:
      type: string
      description: Empty when the user account is gone.
    avatarUrl:
      type: string
      description: Empty when the user account is gone.
    status:
      type: integer
      description: 1 enabled, 0 disabled.
  additionalProperties: false

AdminCategoryItem:
  type: object
  required: [id, category, desc, icon, color, slug, sort, moderators]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    category:
      type: string
      description: Category display name.
    desc:
      type: string
    icon:
      type: string
    color:
      type: string
      description: Hex color; a default is filled in when stored empty.
    slug:
      type: string
    sort:
      type: integer
      description: Ascending sort weight (ties break by id ascending).
    moderators:
      type: array
      items:
        $ref: '#/AdminCategoryModeratorItem'
      description: Enabled category-scope moderators, moderator row id ascending (empty array when none).
  additionalProperties: false

AdminCategoryListResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: array
          items:
            $ref: '#/AdminCategoryItem'
          description: All categories (empty array when none exist).

AdminCategorySaveRequest:
  type: object
  required: [category]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 0
      description: 0 creates a new category; a positive id overwrites that category (unknown positive ids fail with `admin.category.dataNotFound`, HTTP 200).
    category:
      type: string
      minLength: 1
      description: Display name. Missing/empty fails validation with `common.request.invalidParams`; whitespace-only fails the handler trim check with `admin.category.nameRequired` (both HTTP 200).
    desc:
      type: string
    icon:
      type: string
    color:
      type: string
    slug:
      type: string
    sort:
      type: integer
  additionalProperties: false

AdminCategoryDeleteRequest:
  type: object
  properties:
    id:
      type: integer
      format: uint64
      minimum: 0
      description: Category to delete; 0 or unknown ids fail with `admin.category.notFound` (HTTP 200).
  additionalProperties: false

AdminModeratorUserRequest:
  type: object
  properties:
    userId:
      type: integer
      format: uint64
      minimum: 0
      description: Target user id; takes precedence over username. 0 falls back to the username lookup.
    username:
      type: string
      description: Exact username lookup fallback. Both empty fails with `admin.moderator.userRequired`; an unresolvable reference fails with `admin.moderator.userNotFound` (both HTTP 200).
  additionalProperties: false

AdminModeratorDeleteRequest:
  type: object
  required: [id]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
      description: Moderator row id (from adminCategoryList / adminGlobalModeratorList). Missing/zero fails validation with `common.request.invalidParams`; unknown ids or rows of the other scope fail with `admin.moderator.notFound` (both HTTP 200).
  additionalProperties: false

AdminCategoryModeratorAddRequest:
  type: object
  required: [categoryId]
  properties:
    categoryId:
      type: integer
      format: uint64
      minimum: 1
      description: Missing/zero fails validation with `common.request.invalidParams`; unknown ids fail with `admin.category.notFound` (both HTTP 200).
    userId:
      type: integer
      format: uint64
      minimum: 0
      description: Target user id; takes precedence over username. 0 falls back to the username lookup.
    username:
      type: string
      description: Exact username lookup fallback. Both empty fails with `admin.moderator.userRequired`; an unresolvable reference fails with `admin.moderator.userNotFound`; bot accounts fail with `admin.agent.roleNotAllowed` (all HTTP 200).
  additionalProperties: false

AdminModeratorListResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: array
          items:
            $ref: '#/AdminCategoryModeratorItem'
          description: All enabled global moderators, moderator row id ascending (empty array when none exist).

# ================= Admin page settings: friend links, sponsors, announcement（Issue #277 P3 切片四）=================

AdminFriendLinkItem:
  type: object
  required: [name, desc, url, logoUrl, status]
  properties:
    name:
      type: string
    desc:
      type: string
    url:
      type: string
    logoUrl:
      type: string
    status:
      type: integer
      description: Display status flag (1 = shown).
  additionalProperties: false

AdminFriendLinksGroup:
  type: object
  required: [links]
  properties:
    name:
      type: string
      description: Omitted when empty (`omitempty`).
    emoji:
      type: string
      description: Omitted when empty (`omitempty`).
    color:
      type: string
      description: Omitted when empty (`omitempty`).
    links:
      type: array
      items:
        $ref: '#/AdminFriendLinkItem'
      description: Never null in responses — null groups are normalized to an empty array.
  additionalProperties: false

AdminFriendLinksResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: array
          items:
            $ref: '#/AdminFriendLinksGroup'
          description: Stored friend-link groups, or the built-in default when nothing has been saved.

AdminSaveFriendLinksRequest:
  type: object
  properties:
    linksInfo:
      type: array
      items:
        $ref: '#/AdminFriendLinksGroup'
      description: Replacement group list. No validation — a missing/null value is saved as null.
  additionalProperties: false

AdminSponsorItem:
  type: object
  required: [link, message, avatarUrl, name]
  properties:
    link:
      type: string
    message:
      type: string
    avatarUrl:
      type: string
    name:
      type: string
  additionalProperties: false

AdminSponsorsTiers:
  type: object
  required: [level0, level1, level2, level3]
  properties:
