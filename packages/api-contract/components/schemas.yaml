  additionalProperties: false
  description: Replacement notify settings. A non-empty endpoint `secret` is encrypted (AES-256-GCM) before persistence; an empty one keeps the stored secret for the matching endpoint (issue #324 S1). The Go struct tags `settings` with `validate:"required"`, but struct-level required never fails — a missing/malformed body saves a zero-value configuration.

AdminOnesystemSettingsResult:
