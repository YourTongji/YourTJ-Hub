ApiSuccess:
  type: object
  required: [result, code]
  properties:
    result: {}
    code:
      type: integer
      const: 0
      description: Successful operation. Consumers must still inspect this field because business failures can use HTTP 200.
    messageCode:
      type: string
      description: Stable application message identifier when the operation emits one.
    params:
      type: object
      additionalProperties: true
  additionalProperties: false

ApiFailure:
  type: object
  required: [result, code]
  properties:
    result:
      type: 'null'
    code:
      type: integer
      const: 1
    messageCode:
      type: string
      description: Stable application message identifier for the failure.
    params:
      type: object
      additionalProperties: true
  additionalProperties: false

RateLimitedFailure:
  allOf:
    - $ref: '#/ApiFailure'
    - type: object
      required: [messageCode, params]
      properties:
        params:
          type: object
          required: [action, retryAfterSeconds]
          properties:
            action:
              type: string
            retryAfterSeconds:
              type: integer
              minimum: 1
          additionalProperties: true

LoginRequest:
  type: object
  required: [username, encryptedPassword]
  properties:
    username:
      type: string
      minLength: 1
      description: Username or email address. Leading and trailing whitespace is ignored by the server.
    encryptedPassword:
      type: string
      minLength: 1
      description: Base64 RSA-OAEP-256 encrypted JSON password payload from GET /api/login-public-key.
    captchaId:
      type: string
    captchaCode:
      type: string
  additionalProperties: false

TotpChallengeResult:
  type: object
  required: [twoFactorRequired, message]
  properties:
    twoFactorRequired:
      type: boolean
      const: true
    message:
      type: string
  additionalProperties: false

LoginResult:
  oneOf:
    - type: string
      description: Human-readable successful-login message.
    - $ref: '#/TotpChallengeResult'

LoginSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          $ref: '#/LoginResult'

LoginResponse:
  oneOf:
    - $ref: '#/LoginSuccess'
    - $ref: '#/ApiFailure'

LoginPublicKeyResult:
  type: object
  required: [publicKey, serverTs, algorithm]
  properties:
    publicKey:
      type: string
      minLength: 1
      description: PEM-encoded RSA public key. Private key material is never returned.
    serverTs:
      type: integer
      format: int64
      minimum: 1
      description: Current server time in Unix milliseconds. Password-login clients must encrypt their password payload within ±3 minutes of this timestamp; a stale payload is rejected as `auth.login.invalidRequest`.
    algorithm:
      type: string
      const: RSA-OAEP-256
  additionalProperties: false

LoginPublicKeySuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/LoginPublicKeyResult'

LoginPublicKeyResponse:
  oneOf:
    - $ref: '#/LoginPublicKeySuccess'
    - $ref: '#/ApiFailure'

TotpVerifyRequest:
  type: object
  properties:
    code:
      type: string
      description: TOTP code or recovery code; any non-empty value is verified as a TOTP code first and then as a recovery code. When non-empty, this field takes precedence over recoveryCode.
    recoveryCode:
      type: string
      description: One-time recovery code used only when code is empty.
  additionalProperties: false

TotpVerifySuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          description: Human-readable successful-login message; messageCode is the stable identifier.
        messageCode:
          type: string
          const: auth.login.success

TotpVerifyResponse:
  oneOf:
    - $ref: '#/TotpVerifySuccess'
    - $ref: '#/ApiFailure'

TotpStatusResult:
  type: object
  required: [enabled]
  properties:
    enabled:
      type: boolean
  additionalProperties: false

TotpStatusSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          $ref: '#/TotpStatusResult'
        messageCode:
          const: common.operation.success

TotpStatusResponse:
  oneOf:
    - $ref: '#/TotpStatusSuccess'
    - $ref: '#/ApiFailure'

TotpSetupRequest:
  type: object
  description: |
    Client-side strict request shape. `additionalProperties: false` is a consumer constraint;
    the server currently binds this request loosely and silently ignores unknown fields, unlike
    the strictly decoded sibling /api/auth/totp/verify.
  required: [password]
  properties:
    password:
      type: string
      minLength: 1
      description: Current account password used for re-authentication before provisioning TOTP.
  additionalProperties: false

TotpSetupResult:
  type: object
  required: [secret, otpauthUrl]
  properties:
    secret:
      type: string
      minLength: 1
      description: Base32 TOTP secret. It is returned only during setup and is not persisted in plaintext.
    otpauthUrl:
      type: string
      minLength: 1
      description: otpauth URI for authenticator enrollment.
  additionalProperties: false

TotpSetupSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          $ref: '#/TotpSetupResult'
        messageCode:
          const: common.operation.success

TotpSetupResponse:
  oneOf:
    - $ref: '#/TotpSetupSuccess'
    - $ref: '#/ApiFailure'

TotpEnableRequest:
  type: object
  description: |
    Client-side strict request shape. `additionalProperties: false` is a consumer constraint;
    the server currently binds this request loosely and silently ignores unknown fields, unlike
    the strictly decoded sibling /api/auth/totp/verify.
  required: [code]
  properties:
    code:
      type: string
      minLength: 1
      pattern: '^\d{6}$'
      description: |
        Current six-digit TOTP code proving authenticator setup before enabling 2FA. The pattern is a
        client-side format constraint; the server trims surrounding whitespace before validation, so a
        six-digit code with stray whitespace is still accepted server-side.
  additionalProperties: false

TotpEnableResult:
  type: object
  required: [recoveryCodes]
  properties:
    recoveryCodes:
      type: array
      minItems: 10
      maxItems: 10
      items:
        type: string
        minLength: 1
  additionalProperties: false

TotpEnableSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          $ref: '#/TotpEnableResult'
        messageCode:
          const: common.operation.success

TotpEnableResponse:
  oneOf:
    - $ref: '#/TotpEnableSuccess'
    - $ref: '#/ApiFailure'

TotpDisableRequest:
  type: object
  description: |
    Client-side strict request shape. `additionalProperties: false` is a consumer constraint;
    the server currently binds this request loosely and silently ignores unknown fields, unlike
    the strictly decoded sibling /api/auth/totp/verify.
  required: [code]
  properties:
    code:
      type: string
      minLength: 1
      description: Current TOTP code or account password used to disable 2FA.
  additionalProperties: false

TotpDisableSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          minLength: 1
          description: Human-readable success message. The wording is UI copy and not a stable machine contract value; clients must not branch on it.
        messageCode:
          const: common.operation.success

TotpDisableResponse:
  oneOf:
    - $ref: '#/TotpDisableSuccess'
    - $ref: '#/ApiFailure'

OidcExchangeRequest:
  type: object
  required: [code, codeVerifier, nonce, redirectUri]
  properties:
    code:
      type: string
      minLength: 1
      description: One-time authorization code returned to the AppAuth redirect URI.
    codeVerifier:
      type: string
      minLength: 1
      description: PKCE verifier generated and retained by the mobile client.
    nonce:
      type: string
      minLength: 1
      description: Nonce sent in the authorization request; it must equal the verified ID token nonce.
    redirectUri:
      type: string
      format: uri
      minLength: 1
      description: Mobile callback URI. The server requires an exact match with its configured allowlist value.
  additionalProperties: false

OidcExchangeResult:
  type: object
  required: [token]
  properties:
    token:
      type: string
      minLength: 1
      description: Forum JWT session credential for Bearer authentication.
  additionalProperties: false

OidcExchangeSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/OidcExchangeResult'

WriteTopicRequest:
  type: object
  required: [content, title, categoryId]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 0
      description: Existing topic ID when updating; omit or send 0 when creating.
    content:
      type: string
      minLength: 1
    title:
      type: string
      minLength: 1
    categoryId:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: integer
        format: uint64
        minimum: 1
    topicStatus:
      type: integer
      enum: [0, 1]
      description: Existing draft/published status value; omitted values use the legacy draft default (0).
    website:
      type: string
      description: Compatibility honeypot field. Normal clients must not render or submit it.
    captchaId:
      type: string
      description: Required only when server-side posting risk controls request a captcha.
    captchaCode:
      type: string
      description: Required only when server-side posting risk controls request a captcha.
  additionalProperties: false

WriteTopicSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          oneOf:
            - type: integer
              format: uint64
              minimum: 1
              description: Topic ID for a normal create or update.
            - type: boolean
              const: true
              description: Silent success returned only when the honeypot field is populated.

WriteTopicResponse:
  oneOf:
    - $ref: '#/WriteTopicSuccess'
    - $ref: '#/ApiFailure'

AgentMe:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: object
          required: [agentId, username, nickname, avatarUrl, tokenPrefix, enabled, createdAt, updatedAt]
          properties:
            agentId:
              type: integer
              format: uint64
              minimum: 1
            username:
              type: string
            nickname:
              type: string
            avatarUrl:
              type: string
            tokenPrefix:
              type: string
              description: Non-secret token prefix; the token and its hash are never exposed.
            enabled:
              type: integer
              enum: [0, 1]
            createdAt:
              type: integer
              format: int64
            updatedAt:
              type: integer
              format: int64
          additionalProperties: false

AgentTopicItem:
  type: object
  required: [id, title, excerpt, categoryIds, userId, status, processStatus, replyCount, viewCount, postCount, createdAt, updatedAt]
  properties:
    id:
      type: integer
      format: uint64
    title:
      type: string
    excerpt:
      type: string
    categoryIds:
      type: array
      items:
        type: integer
        format: uint64
    userId:
      type: integer
      format: uint64
    status:
      type: integer
      enum: [0, 1]
    processStatus:
      type: integer
      enum: [0, 1, 2]
    replyCount:
      type: integer
      format: uint64
    viewCount:
      type: integer
      format: uint64
    postCount:
      type: integer
      format: uint64
    lastPostedAt:
      type: integer
      format: int64
    createdAt:
      type: integer
      format: int64
    updatedAt:
      type: integer
      format: int64
  additionalProperties: false

AgentTopicListResult:
  type: object
  required: [list, page, pageSize, hasNext]
  properties:
    list:
      type: array
      items:
        $ref: '#/AgentTopicItem'
    page:
      type: integer
    pageSize:
      type: integer
    hasNext:
      type: boolean
  additionalProperties: false

AgentTopicListResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/AgentTopicListResult'

AgentWriteTopicRequest:
  type: object
  required: [title, content, categoryId]
  properties:
    title:
      type: string
      minLength: 1
    content:
      type: string
      minLength: 1
    categoryId:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: integer
        format: uint64
        minimum: 1
  additionalProperties: false
  description: Agent topics always publish (topicStatus=1); website and captcha fields are deliberately absent.

AgentPostListResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: object
          required: [posts, replyTargets, hasBefore, hasAfter, total, maxPostNo]
          properties:
            posts:
              type: array
              items:
                $ref: '#/PostPayload'
            replyTargets:
              type: array
              items:
                $ref: '#/ReplyTargetPayload'
            anchorPostId:
              type: integer
              format: uint64
            beforePostNo:
              type: integer
              format: uint64
            afterPostNo:
              type: integer
              format: uint64
            hasBefore:
              type: boolean
            hasAfter:
              type: boolean
            total:
              type: integer
              format: int64
            maxPostNo:
              type: integer
              format: uint64
          additionalProperties: false
  description: Mirrors the forum PostWindow payload shape.

AgentCreatePostRequest:
  type: object
  required: [content]
  properties:
    content:
      type: string
      minLength: 1
    replyToPostId:
      type: integer
      format: uint64
      minimum: 0
  additionalProperties: false
  description: The topic id comes from the path and is authoritative.

AgentCreatePostResult:
  type: object
  required: [id, postNo, renderedContent]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    postNo:
      type: integer
      format: uint64
      minimum: 1
    renderedContent:
      type: string
  additionalProperties: false

AgentCreatePostResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/AgentCreatePostResult'
    - $ref: '#/ApiFailure'

AgentSearchResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/SearchResultPayload'
  description: Mirrors the forum SearchJSON payload (including courses), including searchUnavailable and failedScopes.

SearchResultPayload:
  type: object
  required: [query, scope, topics, users, categories, courses, total, usersTotal, categoriesTotal, coursesTotal, totalPages, pagination]
  properties:
    query:
      type: string
    scope:
      type: string
    topics:
      type: array
      items:
        $ref: '#/TopicPayload'
    users:
      type: array
      items:
        $ref: '#/UserSearchPayload'
    categories:
      type: array
      items:
        $ref: '#/CategorySearchPayload'
    courses:
      type: array
      items:
        $ref: '#/CourseSearchPayload'
    total:
      type: integer
      format: int64
    usersTotal:
      type: integer
      format: int64
    categoriesTotal:
      type: integer
      format: int64
    coursesTotal:
      type: integer
      format: int64
    totalPages:
      type: integer
    pagination:
      $ref: '#/PaginationPayload'
    failedScopes:
      type: array
      items:
        type: string
      description: Index names whose query failed; omitted when every index answered.
    searchUnavailable:
      type: boolean
      description: True when no search backend is configured or every index query failed; groups are empty in that case. Omitted otherwise.
  additionalProperties: false

# Shared forum payloads reused by the Agent endpoints. Each mirrors the Go DTO
# serialized by the corresponding forum controller so consumers can type-safely
# access the real fields (post/topic/user/category/course) instead of an empty
# record.
PostPayload:
  type: object
  required: [id, topicId, postNo, content, renderedContent, processStatus, isHidden, isAuthorDeleted, isModeratorRemoved, canModerate, author, createdAt, isOwnPost, updatedAt, revisionCount, likeCount, isLiked, isBookmarked]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    topicId:
      type: integer
      format: uint64
      minimum: 1
    postNo:
      type: integer
      format: uint64
      minimum: 1
    content:
      type: string
      description: Raw post content; emptied for hidden or removed posts.
    renderedContent:
      type: string
      description: Rendered HTML; emptied for hidden or removed posts.
    processStatus:
      type: integer
      enum: [0, 1, 2]
      description: 0 normal, 1 blocked, 2 pending moderation.
    isHidden:
      type: boolean
    isAuthorDeleted:
      type: boolean
    isModeratorRemoved:
      type: boolean
    canModerate:
      type: boolean
    author:
      $ref: '#/TopicAuthorPayload'
    createdAt:
      type: string
      description: Post creation time in the server's `2006-01-02 15:04:05` format.
    replyToPostId:
      type: integer
      format: uint64
      minimum: 0
      description: Present only when the post replies to an in-window post.
    replyToUserId:
      type: integer
      format: uint64
      minimum: 0
    replyToUsername:
      type: string
    isOwnPost:
      type: boolean
    updatedAt:
      type: string
      description: Post update time in the server's `2006-01-02 15:04:05` format.
    lastEditor:
      $ref: '#/TopicAuthorPayload'
      description: Present only when the post was edited after creation.
    lastEditedAt:
      type: string
      description: Last edit time in RFC 3339 format; present only when the post was edited.
    revisionCount:
      type: integer
      format: int64
      minimum: 0
      description: Number of stored revisions in the post version history.
    likeCount:
      type: integer
      format: uint64
    isLiked:
      type: boolean
    isBookmarked:
      type: boolean
  additionalProperties: false

ReplyTargetPayload:
  type: object
  required: [id, author]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    postNo:
      type: integer
      format: uint64
      minimum: 1
      description: Present only when the target post is available.
    author:
      $ref: '#/TopicAuthorPayload'
      description: The zero author payload when unavailable is true.
    renderedContent:
      type: string
      description: Present only when the target post is available and not author or moderator removed.
    isAuthorDeleted:
      type: boolean
    isModeratorRemoved:
      type: boolean
    unavailable:
      type: boolean
      description: True when the replied-to post is outside the window, purged, or pending moderation.
  additionalProperties: false

TopicCategoryPayload:
  type: object
  required: [id, name, url, color]
  properties:
    id:
      type: integer
      format: uint64
    name:
      type: string
    url:
      type: string
    color:
      type: string
  additionalProperties: false

TopicPayload:
  type: object
  required: [id, title, description, url, pinWeight, processStatus, author, participants, categories, replyCount, viewCount, activityText, lastUpdateTime]
  properties:
    id:
      type: integer
      format: uint64
    title:
      type: string
    description:
      type: string
    firstImageUrl:
      type: string
      description: Present only when the topic has a cover image.
    images:
      type: array
      items:
        type: string
    url:
      type: string
    pinWeight:
      type: integer
    processStatus:
      type: integer
      enum: [0, 1, 2]
    author:
      $ref: '#/TopicAuthorPayload'
    participants:
      type: array
      items:
        $ref: '#/TopicAuthorPayload'
    categories:
      type: array
      items:
        $ref: '#/TopicCategoryPayload'
    replyCount:
      type: integer
      format: uint64
    viewCount:
      type: integer
      format: uint64
    activityText:
      type: string
    lastUpdateTime:
      type: string
    unseen:
      type: boolean
      description: Present only for authenticated viewers with unseen tracking.
  additionalProperties: false

UserSearchPayload:
  type: object
  required: [id, username, nickname, avatarUrl, bio]
  properties:
    id:
      type: integer
      format: uint64
    username:
      type: string
    nickname:
      type: string
    avatarUrl:
      type: string
    bio:
      type: string
  additionalProperties: false

CategorySearchPayload:
  type: object
  required: [id, name, slug, icon, color, desc]
  properties:
    id:
      type: integer
      format: uint64
    name:
      type: string
    slug:
      type: string
    icon:
      type: string
    color:
      type: string
    desc:
      type: string
  additionalProperties: false

CourseSearchPayload:
  type: object
  required: [id, primaryCode, name, department, creditX10, aliases, instructors, terms, campus]
  properties:
    id:
      type: integer
      format: uint64
    primaryCode:
      type: string
    name:
      type: string
    department:
      type: string
    teacherId:
      type: integer
      format: uint64
      description: Identity teacher id of this course card (0 = no teacher); omitted when the course has no teacher.
    teacherName:
      type: string
      description: Identity teacher name of this course card; omitted when the course has no teacher (frontend shows 无教师).
    creditX10:
      type: integer
      description: Credit multiplied by 10 to stay integral (2.5 credit -> 25).
    aliases:
      type: array
      items:
        type: string
    instructors:
      type: array
      items:
        type: string
    terms:
      type: array
      items:
        type: string
    campus:
      type: array
      items:
        type: string
    ratingAvg:
      type: number
      format: double
      description: Non-NULL rating average; omitted when there are no rated reviews.
    reviewCount:
      type: integer
      description: Number of visible reviews (including unrated legacy ones).
  additionalProperties: false

PaginationPayload:
  type: object
  required: [page, nextPage, hasNext, nextUrl]
  properties:
    page:
      type: integer
    nextPage:
      type: integer
    hasNext:
      type: boolean
    nextUrl:
      type: string
  additionalProperties: false

UserSession:
  type: object
  required: [id, ipMasked, userAgent, createdAt, expiresAt, isCurrent]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    ipMasked:
      type: string
      description: Privacy-masked client IP (the last IPv4 octet or the IPv6 interface ID is hidden); unparseable stored values are returned as an empty string.
    userAgent:
      type: string
      description: Truncated raw user agent; clients render a parsed device label.
    createdAt:
      type: integer
      format: int64
      minimum: 1
      description: Session creation time in Unix milliseconds.
    expiresAt:
      type: integer
      format: int64
      minimum: 1
      description: Session expiry time in Unix milliseconds.
    isCurrent:
      type: boolean
      description: True for the session that carries the current token.
  additionalProperties: false

SessionListSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: array
          items:
            $ref: '#/UserSession'

SessionListResponse:
  oneOf:
    - $ref: '#/SessionListSuccess'
    - $ref: '#/ApiFailure'

RevokeSessionRequest:
  type: object
  required: [id]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
      description: Session ID from the session list. Must belong to the caller.
  additionalProperties: false

SessionMessageSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          description: Human-readable confirmation message; `messageCode` pins the stable identifier.
        messageCode:
          type: string
          enum: [session.revoke.success, session.revokeAll.success]

SessionMessageResponse:
  oneOf:
    - $ref: '#/SessionMessageSuccess'
    - $ref: '#/ApiFailure'

LogoutSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: string
          const: logout

LogoutResponse:
  oneOf:
    - $ref: '#/LogoutSuccess'
    - $ref: '#/ApiFailure'

CourseSummary:
  type: object
  required: [id, primaryCode, name, department, creditX10]
  properties:
    id:
      type: integer
      format: uint64
    primaryCode:
      type: string
    name:
      type: string
    department:
      type: string
    creditX10:
      type: integer
      description: Credit multiplied by 10 to stay integral (2.5 credit -> 25).
    teacherId:
      type: integer
      format: uint64
      description: Identity teacher id of this course card (0 = no teacher); omitted when the course has no teacher.
    teacherName:
      type: string
      description: Identity teacher name of this course card; omitted when the course has no teacher (frontend shows 无教师).
    aliases:
      type: array
      items:
        type: string
    instructors:
      type: array
      items:
        type: string
    recentTerms:
      type: array
      items:
        type: string
    ratingAvg:
      type: number
      format: double
      description: Non-NULL rating average; omitted when there are no rated reviews. Legacy 0-star ratings converted to NULL are excluded.
    reviewCount:
      type: integer
      description: Number of visible reviews (including unrated legacy ones).
  additionalProperties: false

CourseListResult:
  type: object
  required: [list, page, size, total, hasNext]
  properties:
    list:
      type: array
      items:
        $ref: '#/CourseSummary'
    page:
      type: integer
    size:
      type: integer
    total:
      type: integer
      format: int64
    hasNext:
      type: boolean
  additionalProperties: false

CourseListResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/CourseListResult'

OfferingSummary:
  type: object
  required: [id, termCode]
  properties:
    id:
      type: integer
      format: uint64
    termCode:
      type: string
    termName:
      type: string
    campus:
      type: string
    faculty:
      type: string
    classCode:
      type: string
      description: Class code for this offering (e.g. 32000101); empty for legacy packages without class info.
    className:
      type: string
      description: Class name for this offering (e.g. 01班); empty for legacy packages without class info.
    instructors:
      type: array
      items:
        type: string
    ratingAvg:
      type: number
      format: double
      description: Non-NULL rating average for this offering; omitted when there are no rated reviews.
    reviewCount:
      type: integer
      description: Number of visible reviews for this offering.
  additionalProperties: false

CourseDetail:
  type: object
  required: [id, primaryCode, name, department, creditX10]
  properties:
    id:
      type: integer
      format: uint64
    primaryCode:
      type: string
    name:
      type: string
    department:
      type: string
    creditX10:
      type: integer
    teacherId:
      type: integer
      format: uint64
      description: Identity teacher id of this course card (0 = no teacher); omitted when the course has no teacher.
    teacherName:
      type: string
      description: Identity teacher name of this course card; omitted when the course has no teacher (frontend shows 无教师).
    aliases:
      type: array
      items:
        type: string
    offerings:
      type: array
      items:
        $ref: '#/OfferingSummary'
    ratingAvg:
      type: number
      format: double
      description: Non-NULL rating average; omitted when there are no rated reviews.
    reviewCount:
      type: integer
      description: Number of visible reviews (including unrated legacy ones).
    ratingDistribution:
      type: array
      description: |
        Count of visible reviews per star bucket, index 0 = 1 star, index 4 = 5 stars.
        Omitted when the course has no visible reviews.
      items:
        type: integer
  additionalProperties: false

CourseDetailResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/CourseDetail'

CourseSummaryStatus:
  type: string
  enum: [cached, generated, insufficient_data, disabled]
  description: |
    Backend summary status. `error` and `rateLimited` are frontend-local states inferred from
    HTTP failures and never returned by this API.

CourseSummaryConsensus:
  type: string
  enum: [strong_recommend, recommend, neutral, cautious, not_recommend]
  description: Five-level sentiment consensus across visible reviews.

CourseSummarySentiment:
  type: string
  enum: [positive, neutral, negative]
  description: Sentiment label of one representative review excerpt.

CourseSummaryRepresentativeReview:
  type: object
  required: [excerpt, sentiment]
  properties:
    excerpt:
      type: string
      description: Short excerpt from the original review (≤500 chars).
    sentiment:
      $ref: '#/CourseSummarySentiment'
  additionalProperties: false

CourseSummaryPayload:
  type: object
  required: [consensus, keywords, pros, cons, representativeReviews]
  properties:
    consensus:
      $ref: '#/CourseSummaryConsensus'
    keywords:
      type: array
      maxItems: 5
      items:
        type: string
    pros:
      type: array
      maxItems: 4
      items:
        type: string
    cons:
      type: array
      maxItems: 4
      items:
        type: string
    representativeReviews:
      type: array
      maxItems: 3
      items:
        $ref: '#/CourseSummaryRepresentativeReview'
  additionalProperties: false

CourseSummaryResult:
  type: object
  required: [status]
  properties:
    status:
      $ref: '#/CourseSummaryStatus'
    summary:
      $ref: '#/CourseSummaryPayload'
      description: Present for status `cached` and `generated`; omitted otherwise.
    generatedAt:
      type: string
      format: date-time
      description: When the summary was generated (RFC 3339).
    model:
      type: string
      description: The LLM model that produced the summary.
  additionalProperties: false

CourseSummaryResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/CourseSummaryResult'

RelatedCourseItem:
  type: object
  description: |
    A related course card. With the (code, teacher) composite identity model, courses with the
    same primary_code but different teachers are independent cards, so both "other courses by the
    same teacher" and "other teachers for the same course" blocks return this structure.
  required: [id, primaryCode, name, department, ratingAvg, ratingCount, reviewCount]
  properties:
    id:
      type: integer
      format: uint64
    primaryCode:
      type: string
    name:
      type: string
    department:
      type: string
    teacherName:
      type: string
      description: Identity teacher name of the card; omitted when the course has no teacher.
    instructors:
      type: array
      items:
        type: string
    ratingAvg:
      type: number
      description: Average rating (ratingSum / ratingCount), 0 when no ratings exist.
    ratingCount:
      type: integer
      description: Number of visible reviews carrying a rating.
    reviewCount:
      type: integer
      description: Number of visible reviews for this course.
  additionalProperties: false

CourseRelatedResult:
  type: object
  required: [teacherOtherCourses, sameCourseOtherTeachers]
  properties:
    teacherOtherCourses:
      type: array
      description: Other visible courses sharing any teacher with the requested course, top 5 by review count.
      items:
        $ref: '#/RelatedCourseItem'
    sameCourseOtherTeachers:
      type: array
      description: Other course cards with the same primary_code (different teacher identity), top 5 by review count.
      items:
        $ref: '#/RelatedCourseItem'
  additionalProperties: false

CourseRelatedResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/CourseRelatedResult'

ReviewAuthorPayload:
  type: object
  required: [kind, label]
  properties:
    kind:
      type: string
      enum: [anonymous, member, legacy]
      description: Anonymous and legacy reviews never carry identity fields.
    label:
      type: string
      description: Display label (for example 匿名同学 for anonymous reviews).
    avatarUrl:
      type: string
      description: Public forum avatar path for member reviews only; omitted (omitempty) for anonymous and legacy reviews.
  additionalProperties: false
  description: Review author display info. Identity fields (userId/username/avatar) are deliberately absent from the review DTO.

ReviewViewerPayload:
  type: object
  required: [canEdit, canDelete, isHelpful]
  properties:
    canEdit:
      type: boolean
      description: True when the caller is the review author.
    canDelete:
      type: boolean
      description: True when the caller is the review author.
    isHelpful:
      type: boolean
      description: True when the caller marked the review helpful (only meaningful with an optional JWT).
    isDisliked:
      type: boolean
      description: True when the caller disliked the review (only meaningful with an optional JWT).
  additionalProperties: false

ReviewPayload:
  type: object
  required: [id, offeringId, rating, content, contentHtml, author, viewer, helpfulCount, createdAt, updatedAt]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    offeringId:
      type: integer
      format: uint64
      minimum: 1
    rating:
      type: [integer, 'null']
      minimum: 1
      maximum: 5
      description: Legacy imported reviews may have no rating (null); native reviews are 1..5.
    content:
      type: string
      description: Raw markdown review content; the edit form pre-fills from this field.
    contentHtml:
      type: string
      description: Rendered review content; never the raw markdown.
    author:
      $ref: '#/ReviewAuthorPayload'
    viewer:
      $ref: '#/ReviewViewerPayload'
    helpfulCount:
      type: integer
      format: int64
      minimum: 0
    dislikeCount:
      type: integer
      format: int64
      minimum: 0
      description: Number of dislikes from other users; the caller's own dislike state is exposed via viewer.isDisliked.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    offeringRatingAvg:
      type: number
      format: double
      description: |
        Non-NULL rating average of the review's offering (PRD §5.1 B1).
        Present only when the listing is scoped to a single offering and the
        offering has at least one rated review.
    offeringReviewCount:
      type: integer
      description: Number of visible reviews of the review's offering (offering-scoped listing only).
  additionalProperties: false

ReviewListResult:
  type: object
  required: [list, total]
  properties:
    list:
      type: array
      items:
        $ref: '#/ReviewPayload'
      description: The current page of visible reviews; an empty listing is an empty array, never null.
    nextCursor:
      type: string
      description: |
        Cursor for the next page, present only when more reviews exist.
        Format is "offeringId:reviewId" of the last item of the current page
        (course-level ordering is (offering_id DESC, id DESC)). Omit to stop paging.
    total:
      type: integer
      format: int64
      description: Total number of visible reviews matching the current scope (course or offering filter).
  additionalProperties: false

ReviewListResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/ReviewListResult'
    - $ref: '#/ApiFailure'

ReviewWriteRequest:
  type: object
  required: [offeringId, rating, content]
  properties:
    offeringId:
      type: integer
      format: uint64
      minimum: 1
    rating:
      type: integer
      minimum: 1
      maximum: 5
    content:
      type: string
      minLength: 1
      maxLength: 50000
      description: Markdown review content (max 50000 runes); rendered into contentHtml by the server.
    isAnonymous:
      type: boolean
      default: false
      description: When true, the review is displayed without any author identity.
  additionalProperties: false

ReviewWriteSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/ReviewPayload'

ReviewWriteResponse:
  oneOf:
    - $ref: '#/ReviewWriteSuccess'
    - $ref: '#/ApiFailure'

ReviewUpdateRequest:
  type: object
  properties:
    rating:
      type: [integer, 'null']
      minimum: 1
      maximum: 5
      description: Omit (or send null) to keep the current rating.
    content:
      type: string
      maxLength: 50000
      description: Markdown review content (max 50000 runes); an empty string clears the body while keeping the review.
    isAnonymous:
      type: boolean
      description: Omit to keep the current anonymity setting.
  additionalProperties: false

ReviewActionResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              type: boolean
              const: true
    - $ref: '#/ApiFailure'

ReviewReportRequest:
  type: object
  required: [reason]
  properties:
    reason:
      type: string
      enum: [spam, abuse, illegal, irrelevant, other]
    note:
      type: string
      maxLength: 300
      description: Optional context, trimmed to 300 runes by the server.
  additionalProperties: false

ModerationCourseReviewStatusRequest:
  type: object
  required: [reviewId, action]
  properties:
    reviewId:
      type: integer
      format: uint64
      minimum: 1
    action:
      type: string
      enum: [hide, show]
  additionalProperties: false

ModerationCourseReviewReportListRequest:
  type: object
  properties:
    status:
      type: string
      enum: [open, resolved, rejected]
      description: Defaults to open when omitted.
    cursor:
      type: integer
      format: uint64
      minimum: 0
      description: Last seen report id for cursor pagination; 0 starts at the newest page.
    pageSize:
      type: integer
      minimum: 1
      maximum: 50
      description: Page size for the report queue. The server clamps values to 10..50; values below 10 (including 0) use 10, values above 50 use 50. The schema accepts 1..50 to reflect tolerated input.
  additionalProperties: false

ModerationCourseReviewReportItem:
  type: object
  required: [id, reviewId, reason, note, status, resolution, excerpt, reporter, handler, createdAt, reportCount]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    reviewId:
      type: integer
      format: uint64
      minimum: 1
    reason:
      type: string
      enum: [spam, abuse, illegal, irrelevant, other]
    note:
      type: string
    status:
      type: string
      enum: [open, resolved, rejected]
    resolution:
      type: string
      description: Empty while open.
    excerpt:
      type: string
      description: Trimmed review content (120 runes) or a #id fallback.
    reporter:
      $ref: '#/TopicAuthorPayload'
    handler:
      $ref: '#/ReportHandlerPayload'
    createdAt:
      type: string
      description: Report creation time in the server's `2006-01-02 15:04:05` format.
    handledAt:
      type: string
      description: Handling time in the server's `2006-01-02 15:04:05` format; present only when the report has been handled.
    reportCount:
      type: integer
      minimum: 1
      description: Number of open reports aggregated for this review in the current page.
  additionalProperties: false

ModerationCourseReviewReportListResult:
  type: object
  required: [items, nextCursor, hasNext]
  properties:
    items:
      type: array
      items:
        $ref: '#/ModerationCourseReviewReportItem'
    nextCursor:
      type: integer
      format: uint64
      minimum: 0
    hasNext:
      type: boolean
  additionalProperties: false

ModerationCourseReviewReportListResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/ModerationCourseReviewReportListResult'
    - $ref: '#/ApiFailure'

ModerationCourseReviewRevealRequest:
  type: object
  required: [reviewId, reason]
  properties:
    reviewId:
      type: integer
      format: uint64
      minimum: 1
    reason:
      type: string
      minLength: 1
      description: Mandatory justification; recorded in the restricted operation log.
  additionalProperties: false

CourseReviewAuthorRevealPayload:
  type: object
  required: [reviewId, isAnonymous, source]
  properties:
    reviewId:
      type: integer
      format: uint64
      minimum: 1
    authorUserId:
      type: integer
      format: uint64
      description: Present only for native reviews with a linked author.
    username:
      type: string
      description: Present only for native reviews with a linked author.
    nickname:
      type: string
      description: Present only for native reviews with a linked author.
    isAnonymous:
      type: boolean
    source:
      type: string
      description: Empty for native reviews; legacy-import for imported reviews.
  additionalProperties: false

ModerationCourseReviewRevealResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/CourseReviewAuthorRevealPayload'
    - $ref: '#/ApiFailure'

AdminCourseListRequest:
  type: object
  properties:
    keyword:
      type: string
      description: Matches normalized name, primary code, aliases, pinyin, initials, or instructor names.
    department:
      type: string
    page:
      type: integer
      minimum: 1
      default: 1
    pageSize:
      type: integer
      minimum: 1
      maximum: 50
      default: 20
  additionalProperties: false

AdminCourseItem:
  type: object
  required: [id, primaryCode, name, department, creditX10, status, aliases, instructors, reviewCount, createdAt]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    primaryCode:
      type: string
    name:
      type: string
    department:
      type: string
    creditX10:
      type: integer
      description: Credit multiplied by 10 to stay integral.
    status:
      type: integer
      enum: [0, 1]
      description: 0 visible, 1 hidden.
    aliases:
      type: array
      items:
        type: string
    instructors:
      type: array
      items:
        type: string
    reviewCount:
      type: integer
    ratingAvg:
      type: number
      description: Average rating across visible reviews; omitted when no rated reviews.
    createdAt:
      type: string
  additionalProperties: false

AdminCourseListResult:
  type: object
  required: [list, page, size, total, hasNext]
  properties:
    list:
      type: array
      items:
        $ref: '#/AdminCourseItem'
    page:
      type: integer
    size:
      type: integer
    total:
      type: integer
      format: int64
    hasNext:
      type: boolean
  additionalProperties: false

AdminCourseListResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/AdminCourseListResult'
    - $ref: '#/ApiFailure'

AdminCourseItemResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/AdminCourseItem'
    - $ref: '#/ApiFailure'

AdminCourseCreateRequest:
  type: object
  required: [primaryCode, name]
  properties:
    primaryCode:
      type: string
      minLength: 1
    name:
      type: string
      minLength: 1
    department:
      type: string
    creditX10:
      type: integer
      minimum: 0
    aliases:
      type: array
      items:
        type: string
    instructors:
      type: array
      items:
        type: string
  additionalProperties: false

AdminCourseUpdateRequest:
  type: object
  required: [courseId]
  properties:
    courseId:
      type: integer
      format: uint64
      minimum: 1
    primaryCode:
      type: string
    name:
      type: string
    department:
      type: string
    creditX10:
      type: integer
      minimum: 0
    aliases:
      type: array
      items:
        type: string
    instructors:
      type: array
      items:
        type: string
  additionalProperties: false

AdminCourseDeleteRequest:
  type: object
  required: [courseId]
  properties:
    courseId:
      type: integer
      format: uint64
      minimum: 1
  additionalProperties: false

AdminReviewItem:
  type: object
  required: [id, offeringId, courseId, courseCode, courseName, content, status, author, createdAt, updatedAt]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    offeringId:
      type: integer
      format: uint64
      minimum: 1
    courseId:
      type: integer
      format: uint64
      minimum: 1
    courseCode:
      type: string
    courseName:
      type: string
    rating:
      type: integer
      minimum: 1
      maximum: 5
    content:
      type: string
    status:
      type: integer
      enum: [0, 1, 2]
      description: 0 visible, 1 hidden, 2 deleted (quarantine window).
    author:
      $ref: '#/ReviewAuthorPayload'
    createdAt:
      type: string
    updatedAt:
      type: string
  additionalProperties: false

AdminReviewListRequest:
  type: object
  properties:
    keyword:
      type: string
      description: Matches course name, primary code, or review body.
    status:
      type: integer
      minimum: -1
      maximum: 2
      description: -1 all; 0/1/2 filter by status. Defaults to -1.
    cursor:
      type: integer
      format: uint64
      minimum: 0
    pageSize:
      type: integer
      minimum: 1
      maximum: 50
  additionalProperties: false

AdminReviewListResult:
  type: object
  required: [items, nextCursor, hasNext]
  properties:
    items:
      type: array
      items:
        $ref: '#/AdminReviewItem'
    nextCursor:
      type: integer
      format: uint64
      minimum: 0
    hasNext:
      type: boolean
  additionalProperties: false

AdminReviewListResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/AdminReviewListResult'
    - $ref: '#/ApiFailure'

AdminReviewUpdateRequest:
  type: object
  required: [reviewId]
  properties:
    reviewId:
      type: integer
      format: uint64
      minimum: 1
    rating:
      type: integer
      minimum: 1
      maximum: 5
    content:
      type: string
  additionalProperties: false

AdminReviewDeleteRequest:
  type: object
  required: [reviewId]
  properties:
    reviewId:
      type: integer
      format: uint64
      minimum: 1
  additionalProperties: false

TopicAuthorPayload:
  type: object
  required: [id, username, avatarUrl]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    username:
      type: string
    nickname:
      type: string
      description: Present only when the user has a nickname.
    avatarUrl:
      type: string
    wornBadge:
      type: [object, 'null']
      description: Present only when the user wears a badge.
  additionalProperties: false

ReportHandlerPayload:
  type: object
  required: [id, username, avatarUrl]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 0
      description: 0 while the report is still open (no handler assigned yet); a real user id once handled.
    username:
      type: string
    nickname:
      type: string
      description: Present only when the user has a nickname.
    avatarUrl:
      type: string
    wornBadge:
      type: [object, 'null']
      description: Present only when the handler wears a badge.
  additionalProperties: false
  description: Report handler payload. Unlike TopicAuthorPayload the id may be 0 for open reports.

# ================= Forum interactions（Issue #277 P1）=================

TopicInteractionRequest:
  type: object
  required: [topicId, action]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 1
      description: Target topic; unknown or not-viewable ids fail with `topic.notFound` (HTTP 200).
    action:
      type: integer
      enum: [1, 2]
      description: 1 sets the interaction (like/bookmark/watch), 2 clears it. Values outside 1-2 fail with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

PostInteractionRequest:
  type: object
  required: [postId, action]
  properties:
    postId:
      type: integer
      format: uint64
      minimum: 1
      description: Target post; unknown ids or posts inside not-viewable topics fail with `post.notFound` (HTTP 200).
    action:
      type: integer
      enum: [1, 2]
      description: 1 sets the interaction (like/bookmark), 2 clears it. Values outside 1-2 fail with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

CourseBookmarkRequest:
  type: object
  required: [courseId, action]
  properties:
    courseId:
      type: integer
      format: uint64
      minimum: 1
      description: Target course; unknown or hidden ids fail with `course.notFound` (HTTP 404).
    action:
      type: integer
      enum: [1, 2]
      description: 1 bookmarks the course, 2 unbookmarks it. A malformed or zero body fails validation with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

InteractionSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: boolean
          const: true
          description: Set-semantics and idempotent; repeating the same state transition also returns true.

InteractionResponse:
  oneOf:
    - $ref: '#/InteractionSuccess'
    - $ref: '#/ApiFailure'

UpdateTopicStatusRequest:
  type: object
  required: [topicId, topicStatus]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 1
      description: Missing or zero fails validation with `common.request.invalidParams` (HTTP 200).
    topicStatus:
      type: integer
      enum: [0, 1]
      description: 0 unlists the topic, 1 publishes it. Values outside 0-1 fail with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

DeleteTopicRequest:
  type: object
  required: [topicId]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 1
      description: Missing or zero fails validation with `common.request.invalidParams` (HTTP 200).
    force:
      type: boolean
      description: Set together with password to confirm once the short-window delete count exceeds the server threshold (`content.batchDelete.confirmRequired`).
    password:
      type: string
      description: Account password, verified only when force confirms a burst deletion; a wrong password fails with `auth.credentials.invalid` (HTTP 200).
  additionalProperties: false

CreatePostRequest:
  type: object
  required: [topicId, content]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 1
      description: Target topic; unknown or not-viewable ids fail with `topic.notFound` (HTTP 200).
    content:
      type: string
      minLength: 1
      description: Markdown reply content. The server trims whitespace and enforces configurable length bounds (`comment.content.tooShort` / `comment.content.tooLong`, params minLength/maxLength).
    replyToPostId:
      type: integer
      format: uint64
      minimum: 1
      description: Optional parent post inside the same topic; an id outside the topic fails with `comment.parentPostMissing` (HTTP 200).
    website:
      type: string
      description: Compatibility honeypot field. Normal clients must not render or submit it; a populated value silently succeeds with result true and creates nothing.
    captchaId:
      type: string
      description: Required only when server-side posting risk controls request a captcha.
    captchaCode:
      type: string
      description: Required only when server-side posting risk controls request a captcha.
  additionalProperties: false

CreatePostResult:
  type: object
  required: [id, postNo, renderedContent]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    postNo:
      type: integer
      format: uint64
      minimum: 2
      description: Assigned floor number; replies created here are always postNo 2 or higher.
    renderedContent:
      type: string
      description: Rendered HTML of the stored content.
  additionalProperties: false

CreatePostSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          oneOf:
            - $ref: '#/CreatePostResult'
            - type: boolean
              const: true
              description: Silent success returned only when the honeypot field is populated.

CreatePostResponse:
  oneOf:
    - $ref: '#/CreatePostSuccess'
    - $ref: '#/ApiFailure'

UpdatePostRequest:
  type: object
  required: [postId, content]
  properties:
    postId:
      type: integer
      format: uint64
      minimum: 1
      description: Post owned by the caller; someone else's post fails with `topic.operationDenied` (HTTP 200).
    content:
      type: string
      minLength: 1
      description: Replacement markdown content; trimmed and length-checked like posts/create.
  additionalProperties: false

UpdatePostResult:
  type: object
  required: [id, postNo, content, renderedContent, updatedAt, lastEditorId, lastEditedAt, revisionCount]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    postNo:
      type: integer
      format: uint64
      minimum: 1
    content:
      type: string
      description: Stored (trimmed) markdown content after the edit.
    renderedContent:
      type: string
      description: Rendered HTML of the stored content.
    updatedAt:
      type: string
      description: Post update time in RFC 3339 format.
    lastEditorId:
      type: integer
      format: uint64
      minimum: 1
      description: Always the caller of this update.
    lastEditedAt:
      type: string
      description: Edit time in RFC 3339 format.
    revisionCount:
      type: integer
      format: int64
      minimum: 0
      description: Number of stored revisions after appending this edit.
  additionalProperties: false

UpdatePostSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/UpdatePostResult'

UpdatePostResponse:
  oneOf:
    - $ref: '#/UpdatePostSuccess'
    - $ref: '#/ApiFailure'

DeletePostRequest:
  type: object
  required: [postId]
  properties:
    postId:
      type: integer
      format: uint64
      minimum: 1
      description: Reply posts only; the topic first post (postNo 1) and unknown ids fail with `post.notFound` (HTTP 200).
    force:
      type: boolean
      description: Set together with password to confirm once the short-window delete count exceeds the server threshold (`content.batchDelete.confirmRequired`).
    password:
      type: string
      description: Account password, verified only when force confirms a burst deletion; a wrong password fails with `auth.credentials.invalid` (HTTP 200).
  additionalProperties: false

DeletePostResult:
  type: object
  required: [HasChildren]
  properties:
    HasChildren:
      type: boolean
      description: The capital-H key is intentional — the Go result struct carries no json tag, so the wire key stays `HasChildren`. True when the soft-deleted reply keeps visible children (tombstone placeholder).
  additionalProperties: false

DeletePostSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/DeletePostResult'

DeletePostResponse:
  oneOf:
    - $ref: '#/DeletePostSuccess'
    - $ref: '#/ApiFailure'

PostWindowPayload:
  type: object
  required: [posts, replyTargets, hasBefore, hasAfter, total, maxPostNo]
  properties:
    posts:
      type: array
      items:
        $ref: '#/PostPayload'
    replyTargets:
      type: [array, 'null']
      items:
        $ref: '#/ReplyTargetPayload'
      description: Preview payloads for replied-to posts outside the window; null when the window has no out-of-window reply targets.
    anchorPostId:
      type: integer
      format: uint64
      minimum: 1
      description: Present only when an anchorPostId query located the window.
    beforePostNo:
      type: integer
      format: uint64
      minimum: 1
      description: Post number of the first returned post; omitted when the window is empty.
    afterPostNo:
      type: integer
      format: uint64
      minimum: 1
      description: Post number of the last returned post; omitted when the window is empty.
    hasBefore:
      type: boolean
    hasAfter:
      type: boolean
    total:
      type: integer
      format: int64
      minimum: 0
      description: Total post sequence of the topic.
    maxPostNo:
      type: integer
      format: uint64
      minimum: 0
      description: Highest assigned post number of the topic.
  additionalProperties: false

PostWindowSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/PostWindowPayload'

PostWindowResponse:
  oneOf:
    - $ref: '#/PostWindowSuccess'
    - $ref: '#/ApiFailure'

PostRevisionPayload:
  type: object
  required: [version, editor, content, renderedHTML, processStatus, createdAt]
  properties:
    version:
      type: integer
      format: uint64
      minimum: 1
    editor:
      $ref: '#/TopicAuthorPayload'
      description: Zero author payload (id 0, empty strings) when the revision is masked for non-moderators.
    content:
      type: string
      description: Revision markdown snapshot; emptied when the revision is masked for non-moderators.
    renderedHTML:
      type: string
      description: Rendered HTML snapshot; emptied when the revision is masked for non-moderators.
    processStatus:
      type: integer
      enum: [0, 1, 2]
      description: 0 normal, 1 blocked, 2 pending moderation.
    createdAt:
      type: string
      description: Revision creation time in RFC 3339 format.
  additionalProperties: false

PostRevisionsResult:
  type: object
  required: [postId, versions, hasMore, beforeVersion]
  properties:
    postId:
      type: integer
      format: uint64
      minimum: 1
    versions:
      type: array
      items:
        $ref: '#/PostRevisionPayload'
      description: Ascending by version within the page.
    hasMore:
      type: boolean
      description: True when older revisions exist beyond this page.
    beforeVersion:
      type: integer
      format: uint64
      minimum: 0
      description: Cursor for the next (older) page; 0 when no older page exists.
  additionalProperties: false

PostRevisionsSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/PostRevisionsResult'

PostRevisionsResponse:
  oneOf:
    - $ref: '#/PostRevisionsSuccess'
    - $ref: '#/ApiFailure'

FollowUserRequest:
  type: object
  required: [id, action]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
      description: Target user id; unknown ids fail with `user.notFound` (HTTP 200).
    action:
      type: integer
      enum: [1, 2]
      description: 1 follows, 2 unfollows. Values outside 1-2 fail with `common.request.invalidParams` (HTTP 200).
  additionalProperties: false

CreateReportRequest:
  type: object
  required: [targetType, targetId, reason]
  properties:
    targetType:
      type: string
      enum: [topic, post]
    targetId:
      type: integer
      format: uint64
      minimum: 1
    reason:
      type: string
      enum: [spam, abuse, illegal, irrelevant, other]
    note:
      type: string
      description: Optional context; the server trims whitespace and truncates to 300 runes.
  additionalProperties: false

