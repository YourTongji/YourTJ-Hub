    senderId:
      type: integer
      format: uint64
      minimum: 1
    content:
      type: string
    msgType:
      type: integer
      enum: [1, 2, 3]
      description: 1 text, 2 image, 3 voice.
    isRead:
      type: integer
      enum: [0, 1]
      description: Numeric read flag (0 unread, 1 read), not a boolean.
    createdAt:
