ApiSuccess:
  type: object
  required: [result, code]
  properties:
    result: {}
    code:
      type: integer
      const: 0
      description: Successful operation. Consumers must still inspect this field because business failures can use HTTP 200.
    messageCode:
      type: string
      description: Stable application message identifier when the operation emits one.
    params:
      type: object
      additionalProperties: true
  additionalProperties: false

ApiFailure:
  type: object
  required: [result, code]
  properties:
    result:
      type: 'null'
    code:
      type: integer
      const: 1
    messageCode:
      type: string
      description: Stable application message identifier for the failure.
    params:
      type: object
      additionalProperties: true
  additionalProperties: false

RateLimitedFailure:
  allOf:
    - $ref: '#/ApiFailure'
    - type: object
      required: [messageCode, params]
      properties:
        params:
          type: object
          required: [action, retryAfterSeconds]
          properties:
            action:
              type: string
            retryAfterSeconds:
              type: integer
              minimum: 1
          additionalProperties: true

LoginRequest:
  type: object
  required: [username, encryptedPassword]
  properties:
    username:
      type: string
      minLength: 1
      description: Username or email address. Leading and trailing whitespace is ignored by the server.
    encryptedPassword:
      type: string
      minLength: 1
      description: Base64 RSA-OAEP-256 encrypted JSON password payload from GET /api/login-public-key.
    captchaId:
      type: string
    captchaCode:
      type: string
  additionalProperties: false

TotpChallengeResult:
  type: object
  required: [twoFactorRequired, message]
  properties:
    twoFactorRequired:
      type: boolean
      const: true
    message:
      type: string
  additionalProperties: false

LoginResult:
  oneOf:
    - type: string
      description: Human-readable successful-login message.
    - $ref: '#/TotpChallengeResult'

LoginSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          $ref: '#/LoginResult'

LoginResponse:
  oneOf:
    - $ref: '#/LoginSuccess'
    - $ref: '#/ApiFailure'

OidcExchangeRequest:
  type: object
  required: [code, codeVerifier, nonce, redirectUri]
  properties:
    code:
      type: string
      minLength: 1
      description: One-time authorization code returned to the AppAuth redirect URI.
    codeVerifier:
      type: string
      minLength: 1
      description: PKCE verifier generated and retained by the mobile client.
    nonce:
      type: string
      minLength: 1
      description: Nonce sent in the authorization request; it must equal the verified ID token nonce.
    redirectUri:
      type: string
      format: uri
      minLength: 1
      description: Mobile callback URI. The server requires an exact match with its configured allowlist value.
  additionalProperties: false

OidcExchangeResult:
  type: object
  required: [token]
  properties:
    token:
      type: string
      minLength: 1
      description: Forum JWT session credential for Bearer authentication.
  additionalProperties: false

OidcExchangeSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/OidcExchangeResult'

WriteTopicRequest:
  type: object
  required: [content, title, categoryId]
  properties:
    topicId:
      type: integer
      format: uint64
      minimum: 0
      description: Existing topic ID when updating; omit or send 0 when creating.
    content:
      type: string
      minLength: 1
    title:
      type: string
      minLength: 1
    categoryId:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: integer
        format: uint64
        minimum: 1
    topicStatus:
      type: integer
      enum: [0, 1]
      description: Existing draft/published status value; omitted values use the legacy draft default (0).
    website:
      type: string
      description: Compatibility honeypot field. Normal clients must not render or submit it.
    captchaId:
      type: string
      description: Required only when server-side posting risk controls request a captcha.
    captchaCode:
      type: string
      description: Required only when server-side posting risk controls request a captcha.
  additionalProperties: false

WriteTopicSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          oneOf:
            - type: integer
              format: uint64
              minimum: 1
              description: Topic ID for a normal create or update.
            - type: boolean
              const: true
              description: Silent success returned only when the honeypot field is populated.

WriteTopicResponse:
  oneOf:
    - $ref: '#/WriteTopicSuccess'
    - $ref: '#/ApiFailure'

UserSession:
  type: object
  required: [id, ipMasked, userAgent, createdAt, expiresAt, isCurrent]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
    ipMasked:
      type: string
      description: Privacy-masked client IP; the last IPv4 octet or the IPv6 interface ID is hidden.
    userAgent:
      type: string
      description: Truncated raw user agent; clients render a parsed device label.
    createdAt:
      type: integer
      format: int64
      minimum: 1
      description: Session creation time in Unix milliseconds.
    expiresAt:
      type: integer
      format: int64
      minimum: 1
      description: Session expiry time in Unix milliseconds.
    isCurrent:
      type: boolean
      description: True for the session that carries the current token.
  additionalProperties: false

SessionListSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: array
          items:
            $ref: '#/UserSession'

SessionListResponse:
  oneOf:
    - $ref: '#/SessionListSuccess'
    - $ref: '#/ApiFailure'

RevokeSessionRequest:
  type: object
  required: [id]
  properties:
    id:
      type: integer
      format: uint64
      minimum: 1
      description: Session ID from the session list. Must belong to the caller.
  additionalProperties: false

SessionMessageSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          description: Human-readable confirmation message; `messageCode` pins the stable identifier.
        messageCode:
          type: string
          enum: [session.revoke.success, session.revokeAll.success]

SessionMessageResponse:
  oneOf:
    - $ref: '#/SessionMessageSuccess'
    - $ref: '#/ApiFailure'

LogoutSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: string
          const: logout

LogoutResponse:
  oneOf:
    - $ref: '#/LogoutSuccess'
    - $ref: '#/ApiFailure'
