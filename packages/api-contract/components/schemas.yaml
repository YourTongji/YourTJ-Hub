AdminPrivacyPolicyResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/AdminLegalDocumentConfig'
          description: Stored privacy-policy configuration, or the built-in default when nothing has been saved.

AdminSavePrivacyPolicyRequest:
  type: object
  properties:
    settings:
      $ref: '#/AdminLegalDocumentConfig'
  additionalProperties: false
  description: Replacement privacy-policy configuration. The Go struct tags `settings` with `validate:"required"`, but struct-level required never fails — a missing/malformed body saves a zero-value configuration.


# ================= Admin integrations: mail / storage / MCP settings（Issue #277 P3 切片六）=================

AdminMailSettingsConfig:
  type: object
  required: [enableMail, smtpHost, smtpPort, useSSL, smtpUsername, smtpPassword, fromName, fromEmail]
  properties:
    enableMail:
      type: boolean
    smtpHost:
      type: string
    smtpPort:
      type: integer
    useSSL:
      type: boolean
    smtpUsername:
      type: string
    smtpPassword:
      type: string
      description: Plaintext SMTP password accepted on save/test requests (issue #324 S2). Never stored or returned in plaintext — an empty value on save keeps the stored (encrypted) password.
    fromName:
      type: string
    fromEmail:
      type: string
  additionalProperties: false

AdminMailSettingsView:
  type: object
  required: [enableMail, smtpHost, smtpPort, useSSL, smtpUsername, smtpPasswordConfigured, fromName, fromEmail]
  properties:
    enableMail:
      type: boolean
    smtpHost:
      type: string
    smtpPort:
      type: integer
    useSSL:
      type: boolean
    smtpUsername:
      type: string
    smtpPasswordConfigured:
      type: boolean
      description: Whether an SMTP password is stored (encrypted with AES-256-GCM). The password itself is never returned — the GET surface only reports configured state (issue #324 S2).
    fromName:
      type: string
    fromEmail:
      type: string
  additionalProperties: false

AdminMailSettingsResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/AdminMailSettingsView'
          description: Stored mail settings without the SMTP password (configured state only), or the built-in default when nothing has been saved.

AdminSaveMailSettingsRequest:
  type: object
  properties:
    settings:
      $ref: '#/AdminMailSettingsConfig'
  additionalProperties: false
  description: Replacement mail settings. A non-empty `smtpPassword` is encrypted (AES-256-GCM) before persistence; an empty one keeps the stored password (issue #324 S2). The Go struct tags `settings` with `validate:"required"`, but struct-level required never fails — a missing/malformed body saves a zero-value configuration.

AdminTestMailConnectionRequest:
  type: object
  properties:
    settings:
      $ref: '#/AdminMailSettingsConfig'
    testEmail:
      type: string
      format: email
      description: Recipient of the probe email. Validated with `required,email`; a missing or malformed value fails with HTTP 200 `common.request.invalidParams` before the handler runs (the handler's own `admin.mail.testEmailRequired` branch is unreachable through this route). When `settings.smtpPassword` is empty, the stored (decrypted) password is used for the probe (issue #324 S2).
  additionalProperties: false

AdminConnectionTestResult:
  type: object
  required: [success, messageCode]
  properties:
    success:
      type: boolean
      description: Whether the probe succeeded. Note the envelope `code` stays 0 either way — the outcome is reported inside `result`.
    messageCode:
      type: string
      description: "`admin.mail.testSuccess` / `admin.mail.testFailed` for mail, `admin.storage.testSuccess` / `admin.storage.testFailed` for storage."
    params:
      type: object
      additionalProperties: true
      description: On mail success `{email}`; on failure `{error}` with the raw dial/send error text.
  additionalProperties: false

AdminTestMailConnectionResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/AdminConnectionTestResult'
    - $ref: '#/ApiFailure'

AdminStorageSettingsConfig:
  type: object
  required: [provider, endpoint, bucket, region, bucketLookup, secure, accessKey, secretKey, publicUrlPrefix]
  properties:
    provider:
      type: string
      enum: [local, s3]
      description: Empty input is normalized to `local` on save; any other value fails with `common.request.invalidParams`.
    endpoint:
      type: string
      description: S3-compatible endpoint; required with bucket when provider is `s3`.
    bucket:
      type: string
    region:
      type: string
    bucketLookup:
      type: string
      description: "`auto` | `dns` | `path`."
    secure:
      type: boolean
    accessKey:
      type: string
      description: Plaintext access key accepted on save/test requests (issue #324 S3). Never stored or returned in plaintext — an empty value on save keeps the stored (encrypted) key.
    secretKey:
      type: string
      description: Plaintext secret key accepted on save/test requests (issue #324 S3). Never stored or returned in plaintext — an empty value on save keeps the stored (encrypted) key.
    publicUrlPrefix:
      type: string
      description: Optional public (CDN) prefix; empty means files are served through the `/file/img` proxy.
  additionalProperties: false

AdminStorageSettingsView:
  type: object
  required: [provider, endpoint, bucket, region, bucketLookup, secure, accessKeyConfigured, secretKeyConfigured, publicUrlPrefix]
  properties:
    provider:
      type: string
      enum: [local, s3]
    endpoint:
      type: string
    bucket:
      type: string
    region:
      type: string
    bucketLookup:
      type: string
    secure:
      type: boolean
    accessKeyConfigured:
      type: boolean
      description: Whether an access key is stored (encrypted with AES-256-GCM). The key itself is never returned (issue #324 S3).
    secretKeyConfigured:
      type: boolean
      description: Whether a secret key is stored (encrypted with AES-256-GCM). The key itself is never returned (issue #324 S3).
    publicUrlPrefix:
      type: string
  additionalProperties: false

AdminStorageSettingsResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/AdminStorageSettingsView'
          description: Stored storage settings without the credentials (configured state only), or the built-in default when nothing has been saved.

AdminSaveStorageSettingsRequest:
  type: object
  properties:
    settings:
      $ref: '#/AdminStorageSettingsConfig'
  additionalProperties: false
  description: Replacement storage settings. Non-empty `accessKey`/`secretKey` are encrypted (AES-256-GCM) before persistence; empty ones keep the stored keys (issue #324 S3). The Go struct tags `settings` with `validate:"required"`, but struct-level required never fails — a missing/malformed body saves the normalized zero-value configuration (`provider=local`).

AdminTestStorageConnectionRequest:
  type: object
  properties:
    settings:
      $ref: '#/AdminStorageSettingsConfig'
  additionalProperties: false
  description: Probe the submitted configuration without persisting it. `provider=local` (including an empty provider, which is normalized to `local`) always succeeds without touching any backend. When `accessKey`/`secretKey` are empty, the stored (decrypted) credentials are used for the probe (issue #324 S3).

AdminTestStorageConnectionResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/AdminConnectionTestResult'
    - $ref: '#/ApiFailure'

AdminCreateStorageMigrateTaskRequest:
  type: object
  properties:
    clearAfterMigrate:
      type: boolean
      description: Clear the local BLOB column after each object has been migrated.
  additionalProperties: false

AdminTaskCreatedResult:
  type: object
  required: [taskId]
  properties:
    taskId:
      type: integer
      format: uint64
      minimum: 1
      description: Id of the enqueued background task (task_queue row).
  additionalProperties: false

AdminTaskCreatedResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/AdminTaskCreatedResult'
    - $ref: '#/ApiFailure'

AdminTaskQueueItem:
  type: object
  required: [id, type, status, taskJson, retryCount, lastError, createdAt, processedAt]
  properties:
    id:
      type: integer
      format: uint64
    type:
      type: string
      description: Task type prefix (`export` for data exports, `file-migrate` for storage migrations).
    status:
      type: integer
      description: "0=pending, 1=running, 2=success, 3=failed, 4=retrying."
    taskJson:
      type: string
      description: Serialized task payload (JSON text; export payloads carry tables/format/fileName/progress/errorCount, migrate payloads carry lastId/total/processed/failed/clearAfterMigrate).
    retryCount:
      type: integer
    lastError:
      type: string
    createdAt:
      type: string
      format: date-time
    processedAt:
      type: string
      format: date-time
      description: Lease start of the last run; the zero time `0001-01-01T00:00:00Z` when the task never ran.
  additionalProperties: false

AdminStorageMigrateTaskListResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: array
          items:
            $ref: '#/AdminTaskQueueItem'
          description: Up to 20 most recent file-migration tasks, newest id first.

AdminMcpSettingsConfig:
  type: object
  required: [enabled, writes]
  properties:
    enabled:
      type: boolean
      description: Master switch for the built-in `/mcp` endpoint.
    writes:
      type: boolean
      description: Switch for the write tools (create_topic / create_post).
  additionalProperties: false

AdminMcpSettingsResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/AdminMcpSettingsConfig'
          description: Stored MCP settings, or the built-in default when nothing has been saved.

AdminSaveMcpSettingsRequest:
  type: object
  properties:
    settings:
      $ref: '#/AdminMcpSettingsConfig'
  additionalProperties: false
  description: Replacement MCP settings. The Go struct tags `settings` with `validate:"required"`, but struct-level required never fails — a missing/malformed body saves a zero-value configuration.

AdminScheduleSectionTime:
  type: object
  required: [section, start, end]
  properties:
    section:
      type: integer
      minimum: 1
      maximum: 12
      description: Class-period number (第 N 节), 1..12.
    start:
      type: string
      pattern: '^\d{2}:\d{2}$'
      description: Period start as strict 24-hour `HH:MM` (clock values validated server-side).
    end:
      type: string
      pattern: '^\d{2}:\d{2}$'
      description: Period end as strict 24-hour `HH:MM` (clock values validated server-side).
  additionalProperties: false

AdminScheduleSettingsConfig:
  type: object
  required: [sectionTimes]
  properties:
    sectionTimes:
      type: array
      items:
        $ref: '#/AdminScheduleSectionTime'
      description: The 12 class periods shown on the /schedule timetable, sorted by section ascending and deduplicated per section.
  additionalProperties: false

AdminScheduleSettingsResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/AdminScheduleSettingsConfig'
          description: Stored section times, or the built-in default table when nothing has been saved.

AdminSaveScheduleSettingsRequest:
  type: object
  properties:
    settings:
      $ref: '#/AdminScheduleSettingsConfig'
  additionalProperties: false
  description: Replacement section times. Any entry with a section outside 1..12, a non-`HH:MM` start/end, or a start not strictly earlier than its end rejects the whole submission with `common.request.invalidParams`.

# ================= Admin content ops: badges / review queue / file resources（Issue #277 P3 切片六）=================

AdminBadgeListItem:
  allOf:
    - $ref: '#/AdminBadge'
    - type: object
      required: [isSystem, canDelete]
      properties:
        isSystem:
          type: boolean
          description: True for built-in system badges (always listed; DB rows can only override their display fields).
        canDelete:
          type: boolean
          description: System badges can never be deleted (`admin.badge.systemDeleteBlocked`).

AdminBadgeListResponse:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: array
          items:
            $ref: '#/AdminBadgeListItem'
          description: All badges known to the admin console — the 15 built-in system badges (in definition order) followed by custom badges from the DB.

AdminSaveBadgeRequest:
  type: object
  required: [name]
  properties:
    code:
      type: string
      description: Stable badge code. Required for `type=system` (must name an existing system definition); optional for `type=custom` — a `custom_`-prefixed code is generated when omitted.
    type:
      type: string
      enum: [system, custom]
      description: Empty input defaults to `custom`.
    grantMode:
      type: string
      enum: [auto, manual]
      description: Empty input defaults to `manual`; overridden by the system definition for `type=system`.
    name:
      type: string
      minLength: 1
      description: Trimmed; blank fails with `admin.badge.nameRequired`.
    description:
      type: string
    iconType:
      type: string
      enum: [asset, key]
      description: Empty input defaults to `asset`.
    iconKey:
      type: string
    iconUrl:
      type: string
    color:
      type: string
    level:
      type: string
    isEnabled:
      type: boolean
    isWearable:
      type: boolean
    sortOrder:
      type: integer
  additionalProperties: false
  description: Creates or fully overwrites the badge row for `code`. Saving a `system` code stores an override of the built-in definition rather than a new badge.

AdminDeleteBadgeRequest:
  type: object
  properties:
    code:
      type: string
      description: Trimmed; blank fails with `admin.badge.codeRequired`. System badges fail with `admin.badge.systemDeleteBlocked`.
  additionalProperties: false

AdminReviewQueueRequest:
  type: object
  required: [kind]
  properties:
    kind:
      type: string
      enum: [topic, post]
      description: Any other value (including empty) fails validation with HTTP 200 `common.request.invalidParams`.
    page:
      type: integer
      minimum: 1
      description: 1-based; values below 1 are clamped to 1.
    pageSize:
      type: integer
      description: Values below 1 or above 50 fall back to 20.
  additionalProperties: false

AdminReviewQueueItem:
  type: object
  required: [id, title, excerpt, userId, username, processStatus, createdAt]
  properties:
    id:
      type: integer
      format: uint64
      description: Topic id when kind=topic, post id when kind=post.
    title:
      type: string
      description: Topic title; for posts, the title of the containing topic (empty when the topic is missing).
    excerpt:
      type: string
      description: Topic excerpt (falling back to the title) or the post content truncated to 120 bytes.
    userId:
      type: integer
      format: uint64
    username:
      type: string
      description: Author username; empty when the user row is missing.
    processStatus:
      type: integer
      description: "Always 2 (pending review) in this queue."
    createdAt:
      type: string
      format: date-time
      description: RFC 3339 timestamp.
    topicId:
      type: integer
      format: uint64
      description: Posts only; omitted for topics.
    postNo:
      type: integer
      format: uint64
      description: Posts only; omitted for topics.
  additionalProperties: false

AdminReviewQueueResult:
  type: object
  required: [items, total, page, pageSize]
  properties:
    items:
      type: array
      items:
        $ref: '#/AdminReviewQueueItem'
    total:
      type: integer
      format: int64
    page:
      type: integer
    pageSize:
      type: integer
  additionalProperties: false

AdminReviewQueueResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/AdminReviewQueueResult'
    - $ref: '#/ApiFailure'

AdminReviewActionRequest:
  type: object
  required: [kind, id]
  properties:
    kind:
      type: string
      enum: [topic, post]
    id:
      type: integer
      format: uint64
      minimum: 1
    approve:
      type: boolean
      description: True approves (processStatus→0), false rejects (processStatus→1). Wiki-station topics and wiki first posts are rejected with `admin.review.targetInvalid` — they belong to the wiki revision review flow.
  additionalProperties: false

AdminFileResourceItem:
  type: object
  required: [id, name, type, size, userId, createdAt, url, uploaderUsername]
  properties:
    id:
      type: integer
      format: uint64
    name:
      type: string
      description: Storage object name (date-sharded path).
    type:
      type: string
      description: MIME type recorded at upload time.
    size:
      type: integer
      format: int64
      description: Byte length of the stored content.
    userId:
      type: integer
      format: uint64
    createdAt:
      type: string
      format: date-time
    url:
      type: string
      description: Public access path (`/file/img/...` under the local provider, or the configured public prefix).
    uploaderUsername:
      type: string
      description: Empty when the uploader row is missing.
  additionalProperties: false

AdminFileResourcePageResult:
  type: object
  required: [list, page, size, total]
  properties:
    list:
      type: array
      items:
        $ref: '#/AdminFileResourceItem'
    page:
      type: integer
    size:
      type: integer
      description: Effective page size (clamped into [10, 50]).
    total:
      type: integer
      format: int64
      description: Not a row count — this is the current max file id (keyset-pagination cursor).
  additionalProperties: false

AdminFileResourcePageRequest:
  type: object
  properties:
    page:
      type: integer
      description: 1-based; values below 1 are clamped to 1.
    pageSize:
      type: integer
      description: Clamped into [10, 50]; 0 becomes 10.
  additionalProperties: false

AdminFileResourcePageResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/AdminFileResourcePageResult'
    - $ref: '#/ApiFailure'

# ================= Admin data portability: export / import / media upload（Issue #277 P3 切片六）=================

AdminImgUploadResult:
  type: object
  required: [url, filename, size]
  properties:
    url:
      type: string
      description: Public access path of the stored image (`/file/img/<yyyy/MM/dd>/<uuid>.<ext>` under the local provider).
    filename:
      type: string
      description: Original multipart filename.
    size:
      type: integer
      description: Stored byte length.
  additionalProperties: false

AdminImgUploadResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result, messageCode]
          properties:
            result:
              $ref: '#/AdminImgUploadResult'
            messageCode:
              type: string
              const: upload.success
    - $ref: '#/ApiFailure'

AdminCreateExportTaskRequest:
  type: object
  required: [tables, format]
  properties:
    tables:
      type: array
      minItems: 1
      items:
        type: string
        enum: [users, topics, posts, postRevisions, topicCategoryIndex, topicUserStat]
      description: Tables to dump. Unknown or duplicate entries fail with `admin.data.exportFailed` (params.error names the table).
    format:
      type: string
      enum: [json, csv]
  additionalProperties: false
  description: |
    Enqueues a background full-table export. The exported content is a verbatim table dump —
    for `users` this includes email addresses, freeze/activation state, role ids and profile
    fields, so the resulting file is sensitive personal data. Only SiteManager holders can
    create, list and download export tasks.

AdminExportTaskListResponse:
  allOf:
    - $ref: '#/ApiSuccess'
# ================= PK admin sync（issue #248 自愈入口；Issue #277 合并 dev 后补覆盖）=================

PkSyncStatusItem:
  type: object
  required: [calendarId, calendarName, status, rowsWritten, totalPages, lastCommittedPage, errorMsg, startedAt, finishedAt]
  properties:
    calendarId:
      type: integer
      format: uint64
      minimum: 1
      description: 一系统日历 ID（学期标识），即 pk_calendar.calendar_id。
    calendarName:
      type: string
      description: 学期显示名（calendar_id_i18n）；首次同步失败等尚未写入 calendar 的学期可能为空字符串。
    status:
      type: string
      enum: [running, completed, failed]
      description: 最近一次同步状态；超过断点续跑窗口（1 小时）的 running 会被判定为 failed。
    rowsWritten:
      type: integer
      minimum: 0
      description: 最近一次同步写入的行数。
    totalPages:
      type: integer
      minimum: 0
      description: 最近一次同步的抓取总页数。
    lastCommittedPage:
      type: integer
      minimum: 0
      description: 最近一次同步已提交的页数（断点续跑游标）。
    errorMsg:
      type: string
      description: 最近一次同步的失败说明；无错误时为空字符串。
    startedAt:
      type: [string, 'null']
      format: date-time
      description: 最近一次同步开始时间；从未同步时为 null。
    finishedAt:
      type: [string, 'null']
      format: date-time
      description: 最近一次同步结束时间；同步未结束或从未同步时为 null。
  additionalProperties: false

PkSyncStatusSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: array
          items:
            $ref: '#/PkSyncStatusItem'
          description: 各学期同步状态汇总，按 calendarId 倒序（最近学期在前）。

PkSyncStatusResponse:
  oneOf:
    - $ref: '#/PkSyncStatusSuccess'
    - $ref: '#/ApiFailure'

PkSyncCalendarRequest:
  type: object
  required: [term]
  properties:
    term:
      type: string
      minLength: 1
      description: 一系统数字 calendarId（如 121）或学期名（如 2025-2026-1）；首次同步尚未写入 pk_calendar 时只能传数字 calendarId。缺失/空白/无法解析失败于请求校验（HTTP 200）。
    depth:
      type: integer
      minimum: 1
      description: 可向前回溯的学期数上限（默认 1；管理端上限 8）。小于 1 按 1 处理，超过上限按上限处理。
  additionalProperties: false

PkSyncCalendarSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: object
          required: [started, calendarId, term]
          additionalProperties: false
          properties:
            started:
              type: boolean
              const: true
              description: 同步已作为后台异步任务启动（分页抓取可能持续数十秒到分钟级）。
            calendarId:
              type: integer
              format: uint64
              minimum: 1
              description: 已解析出的一系统日历 ID。
            term:
              type: string
              description: 归一化后的学期参数。

PkSyncCalendarResponse:
  oneOf:
    - $ref: '#/PkSyncCalendarSuccess'
    - $ref: '#/ApiFailure'

    - type: object
      required: [result]
      properties:
        result:
          type: array
          items:
            $ref: '#/AdminTaskQueueItem'
          description: Up to 20 most recent export tasks, newest id first.

AdminImportReportError:
  type: object
  required: [line, table, reason]
  properties:
    line:
      type: integer
    table:
      type: string
    reason:
      type: string
  additionalProperties: false

AdminImportReport:
  type: object
  required: [total, success, skipped, failed, errors, importedTables]
  properties:
    total:
      type: integer
    success:
      type: integer
    skipped:
      type: integer
      description: Rows skipped because an equivalent record already exists (idempotent re-import).
    failed:
      type: integer
    errors:
      type: array
      items:
        $ref: '#/AdminImportReportError'
    importedTables:
      type: array
      items:
        type: string
  additionalProperties: false

AdminImportDataResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/AdminImportReport'
    - $ref: '#/ApiFailure'

# --- User content lifecycle (issue #94) and forum read ops (issue #277) ---

MyContentItem:
  type: object
  required: [id, contentType, title, createdAt]
  properties:
    id:
      type: integer
      format: uint64
    contentType:
      type: string
      enum: [topic, post]
    title:
      type: string
      description: Topic title; post items render as `回复 #<postNo>`.
    excerpt:
      type: string
      description: Content excerpt (up to 100 runes); omitted when empty.
    topicId:
      type: integer
      format: uint64
      description: Parent topic id; post items only.
    postNo:
      type: integer
      format: uint64
      description: Floor number inside the topic; post items only.
    createdAt:
      type: string
      description: RFC3339 timestamp.
  additionalProperties: false

MyContentListResult:
  type: object
  required: [items, hasMore, nextCursorId]
  properties:
    items:
      type: array
      items:
        $ref: '#/MyContentItem'
    hasMore:
      type: boolean
    nextCursorId:
      type: integer
      format: uint64
      description: Id of the last item; pass as cursorId for the next page. 0 when the page is empty.
  additionalProperties: false

MyContentListSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/MyContentListResult'

MyContentListResponse:
  oneOf:
    - $ref: '#/MyContentListSuccess'
    - $ref: '#/ApiFailure'

DeletedContentItem:
  type: object
  required: [id, contentType, title, visibility, retention, deletedAt, canRestore, canPermanent]
  properties:
    id:
      type: integer
      format: uint64
    contentType:
      type: string
      enum: [topic, post]
    title:
      type: string
      description: Topic title; empty string on post items.
    excerpt:
      type: string
      description: Content excerpt (up to 100 runes); omitted when empty.
    topicId:
      type: integer
      format: uint64
      description: Parent topic id; post items only.
    postNo:
      type: integer
      format: uint64
      description: Floor number inside the topic; post items only.
    visibility:
      type: string
      enum: [USER_DELETED, MODERATOR_REMOVED]
    retention:
      type: string
      description: Lifecycle retention state (for example RECOVERABLE); PURGED rows never appear in this list.
    deletedAt:
      type: string
      description: RFC3339 deletion timestamp; empty for tombstone rows that carry no deleted_at.
    canRestore:
      type: boolean
      description: True only for USER_DELETED + RECOVERABLE rows still inside the 30-day recovery window.
    canPermanent:
      type: boolean
      description: True for USER_DELETED + RECOVERABLE rows (purgeable by the author).
    hasReplies:
      type: boolean
      description: Omitted unless the item carries reply context.
  additionalProperties: false

DeletedContentListResult:
  type: object
  required: [items, hasMore, nextCursorId]
  properties:
    items:
      type: array
      items:
        $ref: '#/DeletedContentItem'
    hasMore:
      type: boolean
    nextCursorId:
      type: integer
      format: uint64
      description: Id of the last item; pass as cursorId for the next page. 0 when the page is empty.
  additionalProperties: false

DeletedContentListSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/DeletedContentListResult'

DeletedContentListResponse:
  oneOf:
    - $ref: '#/DeletedContentListSuccess'
    - $ref: '#/ApiFailure'

RestoreContentRequest:
  type: object
  required: [contentType, contentId]
  properties:
    contentType:
      type: string
      enum: [topic, post]
    contentId:
      type: integer
      format: uint64
      minimum: 1
  additionalProperties: false

ContentLifecycleSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result, messageCode]
      properties:
        result:
          type: string
          const: 操作成功
        messageCode:
          type: string
          description: content.restore.success / content.purge.success / content.privacy.erased, depending on the operation.

ContentLifecycleResponse:
  oneOf:
    - $ref: '#/ContentLifecycleSuccess'
    - $ref: '#/ApiFailure'

BatchDeleteContentRequest:
  type: object
  required: [contentType, contentIds]
  properties:
    contentType:
      type: string
      enum: [topic, post]
    contentIds:
      type: array
      minItems: 1
      maxItems: 50
      items:
        type: integer
        format: uint64
        minimum: 1
    force:
      type: boolean
      description: Second-confirmation flag required once the deletion rate gate trips (content.batchDelete.confirmRequired).
    password:
      type: string
      description: Current account password; mandatory when force=true.
  additionalProperties: false

BatchDeleteResultItem:
  type: object
  required: [contentId, success]
  properties:
    contentId:
      type: integer
      format: uint64
    success:
      type: boolean
    message:
      type: string
      description: Per-item failure text; omitted on success.
  additionalProperties: false

BatchDeleteResult:
  type: object
  required: [succeeded, failed, results]
  properties:
    succeeded:
      type: integer
    failed:
      type: integer
    results:
      type: array
      items:
        $ref: '#/BatchDeleteResultItem'
  additionalProperties: false

BatchDeleteContentSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/BatchDeleteResult'

BatchDeleteContentResponse:
  oneOf:
    - $ref: '#/BatchDeleteContentSuccess'
    - $ref: '#/ApiFailure'

PurgeContentRequest:
  type: object
  required: [contentType, contentId]
  properties:
    contentType:
      type: string
      enum: [topic, post]
    contentId:
      type: integer
      format: uint64
      minimum: 1
    reason:
      type: string
      description: Optional audit text recorded with the purge.
    force:
      type: boolean
      description: Second-confirmation flag required once the deletion rate gate trips.
    password:
      type: string
      description: Current account password; mandatory when force=true.
  additionalProperties: false

PrivacyEraseRequest:
  type: object
  required: [contentType, contentId]
  properties:
    contentType:
      type: string
      enum: [topic, post]
    contentId:
      type: integer
      format: uint64
      minimum: 1
    force:
      type: boolean
      description: Second-confirmation flag required once the deletion rate gate trips.
    password:
      type: string
      description: Current account password; mandatory when force=true.
  additionalProperties: false

ContentEventRequest:
  type: object
  required: [eventType, contentType, contentId]
  properties:
    eventType:
      type: string
      enum: [content_delete_clicked, content_delete_confirmed]
      description: Frontend telemetry event; backend-owned lifecycle events are rejected with `common.request.invalidParams`.
    contentType:
      type: string
      enum: [topic, post]
    contentId:
      type: integer
      format: uint64
      minimum: 1
      description: Not checked for existence.
  additionalProperties: false

AccountCloseRequest:
  type: object
  required: [mode, password]
  properties:
    mode:
      type: string
      enum: [anonymize, delete]
      description: anonymize keeps historical content under a closed-account identity; delete best-effort deletes all own topics/replies first.
    password:
      type: string
      description: Current account password (irreversible operation second factor).
  additionalProperties: false

ContentActionSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          type: boolean
          const: true

ContentActionResponse:
  oneOf:
    - $ref: '#/ContentActionSuccess'
    - $ref: '#/ApiFailure'

SiteStatisticsResult:
  type: object
  required: [userCount, userMonthCount, topicMaxId, topicMonthCount, postMaxId, linksCount]
  properties:
    userCount:
      type: integer
      format: uint64
      description: Max users.id (allocation counter, not a live row count).
    userMonthCount:
      type: integer
      format: int64
      description: Registrations in the current calendar month.
    topicMaxId:
      type: integer
      format: uint64
    topicMonthCount:
      type: integer
      format: int64
      description: Topics created in the current calendar month.
    postMaxId:
      type: integer
      format: uint64
    linksCount:
      type: integer
      description: Number of configured friend links.
  additionalProperties: false

SiteStatisticsSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/SiteStatisticsResult'

ForumSearchSuccess:
  allOf:
    - $ref: '#/ApiSuccess'
    - type: object
      required: [result]
      properties:
        result:
          $ref: '#/SearchResultPayload'

ForumSearchResponse:
  oneOf:
    - $ref: '#/ForumSearchSuccess'
    - $ref: '#/ApiFailure'

# ================= Wiki webhook secret & asset CDN (merged from dev) =================
WikiWebhookSecretStatus:
  type: object
  required: [configured]
  properties:
    configured:
      type: boolean
      description: Whether a webhook secret is configured (securestore-encrypted admin setting or legacy plaintext config).
  additionalProperties: false


WikiWebhookSecretStatusResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/WikiWebhookSecretStatus'
    - $ref: '#/ApiFailure'


WikiWebhookSecretSaveRequest:
  type: object
  required: [secret]
  properties:
    secret:
      type: string
      maxLength: 1024
      description: Webhook secret in plaintext (present only during the save request); an empty string clears the stored secret.
  additionalProperties: false


WikiWebhookSecretSaveResult:
  type: object
  required: [ok]
  properties:
    ok:
      type: boolean
      const: true
  additionalProperties: false


WikiWebhookSecretSaveResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/WikiWebhookSecretSaveResult'
    - $ref: '#/ApiFailure'


WikiAssetCDNStatus:
  type: object
  required: [cdn]
  properties:
    cdn:
      type: string
      enum: [self, jsDelivr]
      description: Wiki asset CDN mode. `self` serves assets through /wiki/_assets/; `jsDelivr` serves them through the jsDelivr gh mirror of the configured repository.
  additionalProperties: false


WikiAssetCDNResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/WikiAssetCDNStatus'
    - $ref: '#/ApiFailure'


WikiAssetCDNSaveRequest:
  type: object
  required: [cdn]
  properties:
    cdn:
      type: string
      enum: [self, jsDelivr]
      description: Wiki asset CDN mode to persist.
  additionalProperties: false


WikiAssetCDNSaveResult:
  type: object
  required: [ok]
  properties:
    ok:
      type: boolean
      const: true
  additionalProperties: false


WikiAssetCDNSaveResponse:
  oneOf:
    - allOf:
        - $ref: '#/ApiSuccess'
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/WikiAssetCDNSaveResult'
    - $ref: '#/ApiFailure'