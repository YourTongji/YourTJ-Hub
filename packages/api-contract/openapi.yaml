  /api/user/sessions/revoke:
    $ref: ./paths/auth-sessions.yaml#/revokeSession
  /api/user/sessions/revoke-all:
    $ref: ./paths/auth-sessions.yaml#/revokeAllSessions
  /api/forum/topics/write:
    $ref: ./paths/forum-topics.yaml#/writeTopic
  /api/v1/agent/me:
    $ref: ./paths/agent.yaml#/agentMe
  /api/v1/agent/topics:
    get:
      $ref: ./paths/agent.yaml#/agentTopicList/get
    post:
      $ref: ./paths/agent.yaml#/agentWriteTopic/post
  /api/v1/agent/topics/{topicId}/posts:
    get:
      $ref: ./paths/agent.yaml#/agentPostList/get
    post:
      $ref: ./paths/agent.yaml#/agentCreatePost/post
  /api/v1/agent/search:
    $ref: ./paths/agent.yaml#/agentSearch
  /api/forum/courses:
    get:
      $ref: ./paths/courses.yaml#/listCourses/get
  /api/forum/courses/{courseId}:
    get:
      $ref: ./paths/courses.yaml#/getCourse/get
  /api/forum/courses/{courseId}/related:
    get:
      $ref: ./paths/courses.yaml#/getCourseRelated/get
  /api/forum/courses/{courseId}/reviews:
    get:
      $ref: ./paths/course-reviews.yaml#/listCourseReviews/get
  /api/forum/course-reviews:
    post:
      $ref: ./paths/course-reviews.yaml#/createCourseReview/post
  /api/forum/course-reviews/{reviewId}:
    patch:
      $ref: ./paths/course-reviews.yaml#/updateCourseReview/patch
    delete:
      $ref: ./paths/course-reviews.yaml#/deleteCourseReview/delete
  /api/forum/course-reviews/{reviewId}/helpful:
    put:
      $ref: ./paths/course-reviews.yaml#/markReviewHelpful/put
    delete:
      $ref: ./paths/course-reviews.yaml#/unmarkReviewHelpful/delete
  /api/forum/course-reviews/{reviewId}/reports:
    post:
      $ref: ./paths/course-reviews.yaml#/reportCourseReview/post
  /api/forum/moderation/course-review-status:
    post:
      $ref: ./paths/course-reviews.yaml#/moderationCourseReviewStatus/post
  /api/forum/moderation/course-review-reports:
    post:
      $ref: ./paths/course-reviews.yaml#/moderationCourseReviewReportList/post
  /api/forum/moderation/course-review-reveal:
    post:
      $ref: ./paths/course-reviews.yaml#/moderationCourseReviewReveal/post
  /api/forum/moderation/course-list:
    post:
      $ref: ./paths/course-management.yaml#/adminCourseList/post
  /api/forum/moderation/course-create:
    post:
      $ref: ./paths/course-management.yaml#/adminCourseCreate/post
  /api/forum/moderation/course-update:
    post:
      $ref: ./paths/course-management.yaml#/adminCourseUpdate/post
  /api/forum/moderation/course-delete:
    post:
      $ref: ./paths/course-management.yaml#/adminCourseDelete/post
  /api/forum/moderation/course-review-list:
    post:
      $ref: ./paths/course-management.yaml#/adminReviewList/post
  /api/forum/moderation/course-review-edit:
    post:
      $ref: ./paths/course-management.yaml#/adminReviewUpdate/post
  /api/forum/moderation/course-review-delete:
    post:
      $ref: ./paths/course-management.yaml#/adminReviewDelete/post
  /api/forum/moderation/course-stats-rebuild:
    post:
      $ref: ./paths/course-management.yaml#/adminCourseStatsRebuild/post
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT session supplied through the Authorization header.
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HTTP-only JWT session cookie created by successful login.
    agentBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: agt_
      description: Opaque Agent bearer token (agt_...) issued once at Agent create/rotate time. Cookies and human JWTs are never accepted.
