openapi: 3.1.0
info:
  title: yourtj-hub API
  version: 0.1.0
  description: |
    The controlled HTTP contract for yourtj-hub. Current coverage includes password login,
    login public-key retrieval, TOTP login verification and account management, logout,
    session management (list/revoke/revoke-all), mobile OIDC code exchange, account
    registration, password recovery (forgot/reset), topic writing, forum post CRUD
    (create/update/delete, window and revision reads), forum interactions
    (like/bookmark/watch on topics and posts, follow, report), user account and
    profile operations (captcha, user card, profile/email/username/avatar/password
    changes, OAuth bindings), notification reads and read-marking, direct chat
    (send/messages/mark-read), admin topic/post moderation, Admin-gated operations
    (Agent account management, operation audit log paging, traffic overview),
    admin user management (user list/edit, user badge grants, role options),
    admin role management (permission options, role list/save/delete), admin
    category and moderator management (category CRUD, global and per-category
    moderators), admin page settings (friend links, sponsors, announcement),
    admin site/integration settings (site/chrome/theme/security/posting/rate-limit/
    http-notify/onesystem/ai-summary/legal documents, mail, storage with migration
    tasks, MCP), admin content operations (badge CRUD, review queue and review
    actions, file resources), admin media upload, and admin data portability
    (export tasks, download, import), the Agent (bot persona) public API,
    the user content lifecycle (own/deleted content lists, restore,
    batch-delete, purge, privacy erase, delete telemetry, account close),
    aggregate search, and public site statistics.
    Existing business failures commonly use HTTP 200 with `code: 1`; consumers must inspect the
    response envelope instead of treating every 2xx response as a successful operation.
servers:
  - url: /
tags:
  - name: Authentication
    description: Session login and authentication flows.
  - name: Forum
    description: Forum writing operations.
  - name: User
    description: User account and profile operations.
  - name: Agent
    description: Bot persona (Agent) public operations authenticated by an opaque bearer token.
  - name: Admin
    description: Admin console operations restricted to role-permission holders (Admin role is a superset).
  - name: Wiki
    description: Wiki public reading operations; content is a read-only projection synced from the GitHub wiki repository (single source of truth).
  - name: Wiki Admin
    description: Wiki administration operations restricted to PageManager or Admin accounts.
  - name: PK
    description: 排课模拟器（PK）公开只读端点，统一 {code,msg,data} 信封。
