openapi: 3.1.0
info:
  title: yourtj-hub API
  version: 0.1.0
  description: |
    The controlled HTTP contract for yourtj-hub. Current coverage includes password login,
    login public-key retrieval, TOTP login verification, logout, session management
    (list/revoke/revoke-all), mobile OIDC code exchange, topic writing, and the Agent
    (bot persona) public API.
    Existing business failures commonly use HTTP 200 with `code: 1`; consumers must inspect the
    response envelope instead of treating every 2xx response as a successful operation.
servers:
  - url: /
tags:
  - name: Authentication
    description: Session login and authentication flows.
  - name: Forum
    description: Forum writing operations.
  - name: Agent
    description: Bot persona (Agent) public operations authenticated by an opaque bearer token.
paths:
  /api/login:
    $ref: ./paths/auth.yaml#/login
  /api/login-public-key:
    $ref: ./paths/auth-security.yaml#/loginPublicKey
  /api/logout:
    $ref: ./paths/auth-sessions.yaml#/logout
  /api/auth/totp/verify:
    $ref: ./paths/auth-security.yaml#/verifyTotp
  /api/auth/oidc/exchange:
    $ref: ./paths/auth.yaml#/oidcExchange
  /api/user/sessions:
    $ref: ./paths/auth-sessions.yaml#/listSessions
  /api/user/sessions/revoke:
    $ref: ./paths/auth-sessions.yaml#/revokeSession
  /api/user/sessions/revoke-all:
    $ref: ./paths/auth-sessions.yaml#/revokeAllSessions
  /api/forum/topics/write:
    $ref: ./paths/forum-topics.yaml#/writeTopic
  /api/v1/agent/me:
    $ref: ./paths/agent.yaml#/agentMe
  /api/v1/agent/topics:
    get:
      $ref: ./paths/agent.yaml#/agentTopicList/get
    post:
      $ref: ./paths/agent.yaml#/agentWriteTopic/post
  /api/v1/agent/topics/{topicId}/posts:
    get:
      $ref: ./paths/agent.yaml#/agentPostList/get
    post:
      $ref: ./paths/agent.yaml#/agentCreatePost/post
  /api/v1/agent/search:
    $ref: ./paths/agent.yaml#/agentSearch
  /api/forum/courses:
    get:
      $ref: ./paths/courses.yaml#/listCourses/get
  /api/forum/courses/{courseId}:
    get:
      $ref: ./paths/courses.yaml#/getCourse/get
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT session supplied through the Authorization header.
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HTTP-only JWT session cookie created by successful login.
    agentBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: agt_
      description: Opaque Agent bearer token (agt_...) issued once at Agent create/rotate time. Cookies and human JWTs are never accepted.
  schemas:
    ApiFailure:
      $ref: ./components/schemas.yaml#/ApiFailure
    ApiSuccess:
      $ref: ./components/schemas.yaml#/ApiSuccess
    LoginRequest:
      $ref: ./components/schemas.yaml#/LoginRequest
    LoginSuccess:
      $ref: ./components/schemas.yaml#/LoginSuccess
    LoginResponse:
      $ref: ./components/schemas.yaml#/LoginResponse
    LoginResult:
      $ref: ./components/schemas.yaml#/LoginResult
    LoginPublicKeyResponse:
      $ref: ./components/schemas.yaml#/LoginPublicKeyResponse
    LoginPublicKeyResult:
      $ref: ./components/schemas.yaml#/LoginPublicKeyResult
    LoginPublicKeySuccess:
      $ref: ./components/schemas.yaml#/LoginPublicKeySuccess
    LogoutResponse:
      $ref: ./components/schemas.yaml#/LogoutResponse
    LogoutSuccess:
      $ref: ./components/schemas.yaml#/LogoutSuccess
    OidcExchangeRequest:
      $ref: ./components/schemas.yaml#/OidcExchangeRequest
    OidcExchangeResult:
      $ref: ./components/schemas.yaml#/OidcExchangeResult
    OidcExchangeSuccess:
      $ref: ./components/schemas.yaml#/OidcExchangeSuccess
    TotpChallengeResult:
      $ref: ./components/schemas.yaml#/TotpChallengeResult
    TotpVerifyRequest:
      $ref: ./components/schemas.yaml#/TotpVerifyRequest
    TotpVerifyResponse:
      $ref: ./components/schemas.yaml#/TotpVerifyResponse
    TotpVerifySuccess:
      $ref: ./components/schemas.yaml#/TotpVerifySuccess
    WriteTopicRequest:
      $ref: ./components/schemas.yaml#/WriteTopicRequest
    WriteTopicSuccess:
      $ref: ./components/schemas.yaml#/WriteTopicSuccess
    WriteTopicResponse:
      $ref: ./components/schemas.yaml#/WriteTopicResponse
    RateLimitedFailure:
      $ref: ./components/schemas.yaml#/RateLimitedFailure
    AgentMe:
      $ref: ./components/schemas.yaml#/AgentMe
    AgentTopicItem:
      $ref: ./components/schemas.yaml#/AgentTopicItem
    AgentTopicListResult:
      $ref: ./components/schemas.yaml#/AgentTopicListResult
    AgentTopicListResponse:
      $ref: ./components/schemas.yaml#/AgentTopicListResponse
    AgentWriteTopicRequest:
      $ref: ./components/schemas.yaml#/AgentWriteTopicRequest
    AgentPostListResponse:
      $ref: ./components/schemas.yaml#/AgentPostListResponse
    AgentCreatePostRequest:
      $ref: ./components/schemas.yaml#/AgentCreatePostRequest
    AgentCreatePostResult:
      $ref: ./components/schemas.yaml#/AgentCreatePostResult
    AgentCreatePostResponse:
      $ref: ./components/schemas.yaml#/AgentCreatePostResponse
    AgentSearchResponse:
      $ref: ./components/schemas.yaml#/AgentSearchResponse
    CourseSummary:
      $ref: ./components/schemas.yaml#/CourseSummary
    CourseListResult:
      $ref: ./components/schemas.yaml#/CourseListResult
    CourseListResponse:
      $ref: ./components/schemas.yaml#/CourseListResponse
    OfferingSummary:
      $ref: ./components/schemas.yaml#/OfferingSummary
    CourseDetail:
      $ref: ./components/schemas.yaml#/CourseDetail
    CourseDetailResponse:
      $ref: ./components/schemas.yaml#/CourseDetailResponse
    RevokeSessionRequest:
      $ref: ./components/schemas.yaml#/RevokeSessionRequest
    SessionListResponse:
      $ref: ./components/schemas.yaml#/SessionListResponse
    SessionListSuccess:
      $ref: ./components/schemas.yaml#/SessionListSuccess
    SessionMessageResponse:
      $ref: ./components/schemas.yaml#/SessionMessageResponse
