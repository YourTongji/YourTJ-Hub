getUnreadStatus:
  get:
    tags: [Forum]
    summary: Read the caller's unread status flags
    operationId: getUnreadStatus
    description: |
      Lightweight polling endpoint (mounts NoUpdateUserActivity, so polling does
      not extend the caller's online presence). Reports unread notifications,
      unread chat messages, and open moderation reports; latestNotificationType is
      present only when an unread notification exists.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Unread status flags.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/UnreadStatusResponse
            examples:
              success:
                externalValue: ../fixtures/unread-status-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json

getNotifications:
  get:
    tags: [Forum]
    summary: List the caller's notifications with cursor pagination
    operationId: getNotifications
    description: |
      Cursor-paginated notification feed (mounts NoUpdateUserActivity). Query
      binding is strict: malformed values fail with HTTP 400 and
      `common.request.parseFailed`. A filter outside ""/all/unread fails with
      `common.request.invalidParams` (HTTP 200). limit <= 0 falls back to 20 and
      values above 50 clamp to 50. A service-side query failure surfaces as HTTP
      200 `common.request.parseFailed` with params error. Pass the returned
      nextCursor as cursor for the next (older) page.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    parameters:
      - name: filter
        in: query
        schema:
          type: string
          enum: ['', all, unread]
          description: Empty or `all` returns every notification, `unread` restricts to unread ones; any other value fails with `common.request.invalidParams` (HTTP 200).
      - name: cursor
        in: query
        schema:
          type: integer
          format: uint64
          minimum: 0
          description: Return notifications older than this notification id; omit or send 0 for the newest page.
      - name: limit
        in: query
        schema:
          type: integer
          description: Page size; values <= 0 fall back to 20 and values above 50 clamp to 50.
    responses:
      '200':
        description: Notification page, or a legacy business failure envelope (`common.request.invalidParams` / `common.request.parseFailed`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/NotificationListResponse
            examples:
              success:
                externalValue: ../fixtures/notifications-success.json
              invalidFilter:
                externalValue: ../fixtures/invalid-params.json
      '400':
        description: Malformed query parameters.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/parse-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json

markNotificationRead:
  post:
    tags: [Forum]
    summary: Mark one notification as read
    operationId: markNotificationRead
    description: |
      Marks a single notification of the caller as read. Note the update carries a
      user_id condition, so marking someone else's or a nonexistent id silently
      succeeds (zero rows updated is not an error). JSON binding is lenient: a
      malformed body binds to zero values and fails validation as
      `common.request.invalidParams` (HTTP 200) because notificationId is required.
      Business failure: `notification.markRead.failed`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/MarkNotificationReadRequest
    responses:
      '200':
        description: Notification marked read, or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/NotificationMarkReadResponse
            examples:
              success:
                externalValue: ../fixtures/notification-mark-read-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

markAllNotificationsRead:
  post:
    tags: [Forum]
    summary: Mark all of the caller's notifications as read
    operationId: markAllNotificationsRead
    description: |
      Marks every notification of the caller as read and invalidates the cached
      unread status. The request takes no body. Business failure:
      `notification.markAllRead.failed`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: All notifications marked read, or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/NotificationMarkAllReadResponse
            examples:
              success:
                externalValue: ../fixtures/notification-mark-all-read-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
getPushConfig:
  get:
    tags: [Forum]
    summary: Read Web Push channel configuration for the caller
    operationId: getPushConfig
    description: |
      Returns whether the instance has Web Push enabled and, when enabled, the
      VAPID application server key (65-byte P-256 uncompressed point, base64url)
      the browser must pass to PushManager.subscribe as applicationServerKey.
      configured=false when the instance has no [webpush] VAPID keys (dev keeps
      the channel off); clients then hide the push opt-in toggle.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Push channel configuration.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PushConfigResponse
            examples:
              enabled:
                externalValue: ../fixtures/push-config-enabled.json
              disabled:
                externalValue: ../fixtures/push-config-disabled.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json

subscribePush:
  post:
    tags: [Forum]
    summary: Persist the caller's browser push subscription
    operationId: subscribePush
    description: |
      Saves one Web Push subscription (PushSubscription.toJSON()) owned by the
      caller. endpoint is globally unique: resubscribing from the same browser
      (or after logging into another account) converges the row to the current
      user and refreshes its keys and language. Business failure surfaces as
      HTTP 200 `common.operation.failed`. The subscription carries long-lived
      push-service credentials and is deleted on account close.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/PushSubscribeRequest
    responses:
      '200':
        description: Subscription persisted (or a legacy business failure envelope).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PushSubscribeResponse
            examples:
              success:
                externalValue: ../fixtures/push-subscribe-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

unsubscribePush:
  post:
    tags: [Forum]
    summary: Remove one of the caller's browser push subscriptions
    operationId: unsubscribePush
    description: |
      Deletes the subscription with the given endpoint when it belongs to the
      caller (idempotent: an endpoint the caller does not own, or that does not
      exist, silently succeeds and never reveals other users' subscriptions).
      Clients call this after browser-side PushSubscription.unsubscribe() so the
      server stops sending to a dead endpoint.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/PushUnsubscribeRequest
    responses:
      '200':
        description: Subscription removed (or a legacy business failure envelope).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PushUnsubscribeResponse
            examples:
              success:
                externalValue: ../fixtures/push-unsubscribe-success.json
      '401':
