orderMyStickers:
  post:
    tags: [Forum]
    summary: Replace the order of my private sticker library
    operationId: orderMyStickers
    description: |
      names must contain every current membership once, in desired display order.
      Duplicate, foreign, missing and stale names fail atomically with
      common.request.invalidParams; clients should reload on conflict. Empty names
      is valid only for an empty library. Serialized with collection/removal and
      bounded to 200 names. Body limit 64 KiB.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/StickerNamesRequest
    responses:
      '200':
        description: Result or stable business failure envelope.
