listCalendars:
  get:
    tags: [PK]
    summary: List the most recent 8 semesters for the PK scheduler
    security: []
    operationId: pkListCalendars
    responses:
      '200':
        description: Recent semesters ordered by calendarId descending.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkCalendarListResponse
            examples:
              success:
                externalValue: ../fixtures/pk-calendars-success.json
      '500':
        description: Internal error.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure

