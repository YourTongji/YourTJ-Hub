              successBatch:
                externalValue: ../fixtures/pk-course-details-batch-success.json
      '400':
        description: Missing calendarId or courseCode(s).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure
            examples:
              badRequest:
                externalValue: ../fixtures/pk-course-details-bad-request.json
      '500':
        description: Internal error.
