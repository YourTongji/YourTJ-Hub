findCourseDetails:
  post:
    tags: [PK]
    summary: Fetch teaching-class details by one courseCode (array) or many (dict)
    security: []
    operationId: pkFindCourseDetails
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required: [calendarId, courseCode]
                additionalProperties: false
                properties:
                  calendarId:
                    type: integer
                    minimum: 1
                  courseCode:
                    type: string
                    description: Single course code; returns a teaching-class array.
              - type: object
                required: [calendarId, courseCodes]
                additionalProperties: false
                properties:
                  calendarId:
                    type: integer
                    minimum: 1
                  courseCodes:
                    type: array
                    items:
                      type: string
                    description: Batch course codes; returns a courseCode -> classes dict.
    responses:
      '200':
        description: Teaching-class details; array for a single code, dict for batch.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkCourseDetailsResponse
            examples:
              successSingle:
                externalValue: ../fixtures/pk-course-details-single-success.json
              successBatch:
                externalValue: ../fixtures/pk-course-details-batch-success.json
      '400':
        description: Missing calendarId or courseCode(s).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure
            examples:
              badRequest:
                externalValue: ../fixtures/pk-course-details-bad-request.json
      '500':
        description: Internal error.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure

