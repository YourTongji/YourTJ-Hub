findGrades:
  post:
    tags: [PK]
    summary: List available grades for a semester
    security: []
    operationId: pkFindGrades
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [calendarId]
            properties:
              calendarId:
                type: integer
                minimum: 1
            additionalProperties: false
    responses:
      '200':
        description: Grades present in the semester's planned courses, descending.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkGradesResponse
            examples:
              success:
                externalValue: ../fixtures/pk-grades-success.json
      '400':
        description: Missing or invalid calendarId.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure
            examples:
              badRequest:
                externalValue: ../fixtures/pk-bad-request.json
      '500':
        description: Internal error.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure

findMajors:
  post:
    tags: [PK]
    summary: List majors for a grade (optionally within a semester)
    security: []
    operationId: pkFindMajors
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [grade]
            properties:
              grade:
                type: integer
                minimum: 1
              calendarId:
                type: integer
                minimum: 1
                description: Optional; limits majors to those with planned courses in the semester.
            additionalProperties: false
    responses:
      '200':
        description: Major candidates ordered by code.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkMajorsResponse
            examples:
              success:
                externalValue: ../fixtures/pk-majors-success.json
      '400':
        description: Missing or invalid grade.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure
            examples:
              badRequest:
                externalValue: ../fixtures/pk-majors-bad-request.json
      '500':
        description: Internal error.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure

findCoursesByMajor:
  post:
    tags: [PK]
    summary: List planned courses for a major (including earlier grades)
    security: []
    operationId: pkFindCoursesByMajor
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [grade, code, calendarId]
            properties:
              grade:
                type: integer
                minimum: 1
              code:
                type: string
                minLength: 1
                description: Major code.
              calendarId:
                type: integer
                minimum: 1
            additionalProperties: false
    responses:
      '200':
        description: Course groups with their teaching classes.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkCoursesByMajorResponse
            examples:
