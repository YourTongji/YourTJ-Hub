                  calendarId:
                    type: integer
                    minimum: 1
                  courseCode:
                    type: string
                    description: Single course code; returns a teaching-class array.
              - type: object
                required: [calendarId, courseCodes]
                additionalProperties: false
                properties:
                  calendarId:
                    type: integer
                    minimum: 1
                  courseCodes:
                    type: array
                    items:
                      type: string
                    description: Batch course codes; returns a courseCode -> classes dict.
    responses:
      '200':
        description: Teaching-class details; array for a single code, dict for batch.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkCourseDetailsResponse
