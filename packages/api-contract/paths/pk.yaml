syncCourseInfo:
  post:
    tags: [PK]
    summary: Incrementally refresh selected courses' teaching-class info
    security: []
    operationId: pkSyncCourseInfo
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [calendarId]
            properties:
              calendarId:
                type: integer
                minimum: 1
              majorCourseCodes:
                type: array
                items:
                  type: string
              otherCourseCodes:
                type: array
                items:
                  type: string
              majorInfo:
                type: object
                properties:
                  grade:
                    type: integer
                  code:
                    type: string
                additionalProperties: false
            additionalProperties: false
    responses:
      '200':
        description: courseCode -> teaching-class array; isExclusive present only for major courses.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkCourseInfoSyncResponse
            examples:
              success:
                externalValue: ../fixtures/pk-course-info-sync-success.json
      '400':
        description: Missing calendarId.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure
            examples:
              badRequest:
                externalValue: ../fixtures/pk-bad-request.json
      '500':
        description: Internal error.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure

getCourseReviewBrief:
  get:
    tags: [PK]
    summary: Course review summary for the PK scheduler popup
    security: []
    operationId: pkGetCourseReviewBrief
    parameters:
      - name: courseCode
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: teacherName
        in: query
        required: false
        schema:
          type: string
      - name: calendarId
        in: query
        required: false
        description: 限定教学班课号只在该学期内匹配（跨学期班号复用时不串学期）。
        schema:
          type: integer
          format: uint64
      - name: teachingClassId
        in: query
        required: false
        description: |
          教学班直查键（course_offering.teaching_class_id）：有则精准定位该班所属课程卡与
          offering（course-scope 特判课程卡），不再走 courseCode+teacherName 猜测；未命中
          （缺失/隐藏）时回退旧路径。与 calendarId 同时传入时以直查结果为准。
        schema:
          type: integer
          format: uint64
    responses:
      '200':
        description: Course review summary matched by courseCode (falls back to newCourseCode / primary_code).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkReviewBriefResponse
            examples:
              success:
                externalValue: ../fixtures/pk-course-review-brief-success.json
      '400':
        description: Missing courseCode.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure
            examples:
              badRequest:
                externalValue: ../fixtures/pk-course-review-brief-bad-request.json
      '500':
        description: Internal error.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure
