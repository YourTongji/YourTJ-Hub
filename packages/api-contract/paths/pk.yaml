getCourseReviewBrief:
  get:
    tags: [PK]
    summary: Course review summary for the PK scheduler popup
    security: []
    operationId: pkGetCourseReviewBrief
    parameters:
      - name: courseCode
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: teacherName
        in: query
        required: false
        schema:
          type: string
      - name: calendarId
        in: query
        required: false
        description: 限定教学班课号只在该学期内匹配（跨学期班号复用时不串学期）。
        schema:
          type: integer
          format: uint64
      - name: teachingClassId
        in: query
        required: false
        description: |
          教学班直查键（course_offering.teaching_class_id）：有则精准定位该班所属课程卡与
          offering（course-scope 特判课程卡），不再走 courseCode+teacherName 猜测；未命中
          （缺失/隐藏）时回退旧路径。与 calendarId 同时传入时以直查结果为准。
        schema:
          type: integer
          format: uint64
    responses:
      '200':
        description: Course review summary matched by courseCode (falls back to newCourseCode / primary_code).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkReviewBriefResponse
            examples:
              success:
                externalValue: ../fixtures/pk-course-review-brief-success.json
      '400':
        description: Missing courseCode.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure
            examples:
              badRequest:
                externalValue: ../fixtures/pk-course-review-brief-bad-request.json
      '500':
        description: Internal error.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure
getSectionTimes:
  get:
    tags: [PK]
    summary: Class-period (section) schedule table for the PK scheduler grid
    security: []
    operationId: pkGetSectionTimes
    description: |
      Returns the section start/end table used to render the PK scheduler time
      grid (mobile Route A shares this source, same read path as the /schedule
      SSR props and the admin schedule-settings GET: stored configs are
      normalized through NormalizeStoredScheduleSettings — legacy un-versioned
      12-section rows saved before PR #496 are remapped by their old numbers).
      When nothing has been configured the built-in current 11-section default
      table is returned (sections 1-8 daytime, evening 9/10/11 from 18:30;
      anchors: section 3 = 10:00, section 5 = 13:30, section 7 = 15:30,
      section 9 = 18:30). maxRowsDefault is always 11 — historical 12-section
      semesters (calendarId < 120) are rendered client-side from the built-in
      historical table and do not consume this response.
    responses:
      '200':
        description: Section schedule table (configured/normalized table, or the built-in current 11-section default).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkSectionTimesResponse
            examples:
              success:
                externalValue: ../fixtures/pk-section-times-success.json
      '500':
        description: Internal error.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure

getPlans:
  get:
    tags: [PK]
    summary: Fetch the caller's cloud schedule plan snapshot
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    operationId: pkGetPlans
    description: |
      Login-required read of the caller's PK scheduler plan snapshot (issue #537).
      Returns the four persisted fields (plans/activePlanId/majorSelected/weekView)
      plus the server-side authoritative updatedAt clock (RFC3339Nano UTC) that
      clients store as pk.syncedAt for load-time conflict detection. When the user
      has never uploaded a snapshot data is null. Frozen accounts may still read
      (no writable-account check, aligned with the myContentList precedent).
      Rate limited under the dedicated pk.plans quota (independent from the
      course.catalog read quota).
    responses:
      '200':
        description: Cloud snapshot, or null data when the user has no snapshot yet.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkPlansGetResponse
            examples:
              success:
                externalValue: ../fixtures/pk-plans-get-success.json
              empty:
                externalValue: ../fixtures/pk-plans-get-empty.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '429':
        description: Rate limit exceeded (pk.plans quota).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
      '500':
        description: Internal error.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure

putPlans:
  put:
    tags: [PK]
    summary: Replace the caller's cloud schedule plan snapshot wholesale
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    operationId: pkPutPlans
    description: |
      Login-required whole-snapshot upsert (issue #537): plans/activePlanId/
      majorSelected/weekView are replaced atomically; created_at stays fixed and
      the server-side updated_at clock is refreshed. Server-side shallow
      validation only (1..10 plans, non-blank id/name per plan, activePlanId must
      reference one of the plans, whole payload <= 1MB) — deep sanitize remains the
      client's load-path responsibility. Writes require a writable account
      (frozen/pending activation rejected). The response carries the new
      updatedAt for the client's pk.syncedAt.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/PkPlansPutRequest
    responses:
      '200':
        description: Snapshot stored; returns the server-side sync clock.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkPlansPutResponse
            examples:
              success:
                externalValue: ../fixtures/pk-plans-put-success.json
      '400':
        description: Structural validation failed (count/limit/identity/activePlanId/size).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure
            examples:
              badRequest:
                externalValue: ../fixtures/pk-plans-bad-request.json
              tooManyPlans:
                externalValue: ../fixtures/pk-plans-too-many.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: Frozen (or pending-activation) account.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozen:
                externalValue: ../fixtures/account-frozen.json
      '409':
        description: The observed baseUpdatedAt is stale; fetch and resolve before retrying.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure
            examples:
              conflict:
                externalValue: ../fixtures/pk-plans-conflict.json
      '429':
        description: Rate limit exceeded (pk.plans quota).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
      '500':
        description: Internal error.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure

deletePlans:
  delete:
    tags: [PK]
    summary: Delete the caller's cloud schedule plan snapshot
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    operationId: pkDeletePlans
    description: |
      Login-required idempotent delete of the caller's cloud snapshot (issue #537);
      local data is untouched. Same account-close semantics as the push device
      cleanup (anonymize and delete modes both erase the row). Writes require a
      writable account.
    responses:
      '200':
        description: Snapshot removed (or was already absent).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkPlansDeleteResponse
            examples:
              success:
                externalValue: ../fixtures/pk-plans-delete-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: Frozen (or pending-activation) account.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozen:
                externalValue: ../fixtures/account-frozen.json
      '429':
        description: Rate limit exceeded (pk.plans quota).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
      '500':
        description: Internal error.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PkFailure
