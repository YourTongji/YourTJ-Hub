adminAgentWebhookRedeliver:
  post:
    tags:
    - Admin
    summary: Explicitly restart one failed delivery round
    operationId: adminAgentWebhookRedeliver
    description: Preserves eventId and endpoint generation. Only unexpired failed
      deliveries with current generation and source visibility are allowed; maximum
      3 rounds and 27 total attempts.
    security:
    - bearerAuth: []
    - accessTokenCookie: []
    responses:
      '200':
        description: Success or a business failure envelope; inspect code.
        content:
          application/json:
            schema:
