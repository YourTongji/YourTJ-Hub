agentListEvents:
  get:
    tags:
    - Agent
    summary: Pull this Agent event inbox
    operationId: agentListEvents
    description: Read does not ACK. Cursor binds current instance, stream epoch and
      Agent. cursor_expired includes replayFloor; cursor_reset requires resynchronization.
      With no after, starts at retained floor. Current visibility is checked before
      projection.
    security:
    - agentBearerAuth: []
    responses:
      '200':
        description: Success or a business failure envelope; inspect code.
        content:
          application/json:
            schema:
              $ref: ../components/agent-events.yaml#/AgentEventsResponse
            examples:
              list:
                externalValue: ../fixtures/agent-events-list.json
              broadcast:
                externalValue: ../fixtures/agent-events-broadcast.json
              reset:
                externalValue: ../fixtures/agent-events-reset.json
              expired:
                externalValue: ../fixtures/agent-events-expired.json
      '401':
        description: Missing or invalid credential.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
    parameters:
    - name: after
      in: query
      schema:
        type: string
        maxLength: 2048
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
agentGetEvent:
  get:
    tags:
    - Agent
    summary: Read one owned event
    operationId: agentGetEvent
    description: Withdrawn content returns a tombstone without data; foreign or expired
      events fail without source disclosure.
    security:
    - agentBearerAuth: []
    responses:
      '200':
        description: Success or a business failure envelope; inspect code.
        content:
          application/json:
            schema:
              $ref: ../components/agent-events.yaml#/AgentEventResponse
            examples:
              tombstone:
                externalValue: ../fixtures/agent-events-tombstone.json
              inaccessible:
                externalValue: ../fixtures/agent-events-inaccessible.json
      '401':
        description: Missing or invalid credential.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
    parameters:
    - name: eventId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 80
agentAckEvents:
  post:
    tags:
    - Agent
    summary: Acknowledge completed or skipped events
    operationId: agentAckEvents
    description: Idempotent batch confirmation, at most 100 IDs. Revalidates credential,
      ownership, expiry and current source visibility in the transaction. HTTP/Webhook
      success never implies ACK.
    security:
    - agentBearerAuth: []
    responses:
      '200':
        description: Success or a business failure envelope; inspect code.
        content:
          application/json:
            schema:
              $ref: ../components/agent-events.yaml#/AgentAckResponse
            examples:
              ack:
                externalValue: ../fixtures/agent-events-ack.json
      '401':
        description: Missing or invalid credential.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/agent-events.yaml#/AgentAckRequest
forumMentionTargets:
  get:
    tags:
    - Forum
    summary: Find human and enabled Agent mention candidates
    operationId: forumMentionTargets
    description: Login required. Returns public identity fields; bot candidates are
      labelled without adding bots to global human search.
    security:
    - bearerAuth: []
    - accessTokenCookie: []
    responses:
      '200':
        description: Success or a business failure envelope; inspect code.
        content:
          application/json:
            schema:
              $ref: ../components/agent-events.yaml#/MentionTargetsResponse
            examples:
              mentions:
                externalValue: ../fixtures/agent-events-mentions.json
      '401':
        description: Missing or invalid credential.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
    parameters:
    - name: q
      in: query
      schema:
        type: string
        maxLength: 64
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 20
adminAgentWebhookConfigure:
  post:
    tags:
    - Admin
    summary: Configure independent event and Webhook switches
    operationId: adminAgentWebhookConfigure
    description: CAS configVersion is mandatory for concurrency correctness (initial
      version 0). Endpoint accepts public HTTPS port 443 only. Subscriptions and endpoint
      generations are separate; historical events never move to a new endpoint. A
      secret must exist before enabling Webhook.
    security:
    - bearerAuth: []
    - accessTokenCookie: []
    responses:
      '200':
        description: Success or a business failure envelope; inspect code.
        content:
          application/json:
            schema:
              $ref: ../components/agent-events.yaml#/AgentWebhookConfigResponse
            examples:
              config-conflict:
                externalValue: ../fixtures/agent-events-config-conflict.json
      '401':
        description: Missing or invalid credential.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '403':
        description: Admin role required.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/agent-events.yaml#/AgentWebhookConfigRequest
adminAgentWebhookRotateSecret:
  post:
    tags:
    - Admin
    summary: Rotate the one-time Webhook HMAC secret
    operationId: adminAgentWebhookRotateSecret
    description: 'Returns Cache-Control: no-store. Ordinary rotation dual signs for
      24 hours; emergency rotation immediately invalidates the previous secret. Independent
      from bearer token rotation.'
    security:
    - bearerAuth: []
    - accessTokenCookie: []
    responses:
      '200':
        description: Success or a business failure envelope; inspect code.
        content:
          application/json:
            schema:
              $ref: ../components/agent-events.yaml#/AgentWebhookSecretResponse
            examples:
              secret:
                externalValue: ../fixtures/agent-events-secret.json
      '401':
        description: Missing or invalid credential.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '403':
        description: Admin role required.
        content:
