adminGetMailSettings:
  get:
    tags: [Admin]
    summary: Read the outbound mail (SMTP) settings
    operationId: adminGetMailSettings
    description: |
      Admin console operation gated by the `SiteManager` role permission
      (Admin role is a superset); callers without it fail with HTTP 403 and
      `permission.denied` (params permission=<localized permission name>,
      `站点管理` in zh). Returns the stored mail settings, or the built-in
      default configuration when nothing has been saved yet. Exposure
      boundary: `smtpPassword` is returned in cleartext — there is no
      masking on this admin surface. JSON binding is lenient: query string
      and body are ignored.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Mail settings including the cleartext SMTP password (stored configuration or the built-in default).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminMailSettingsResponse
            examples:
              success:
                externalValue: ../fixtures/admin-mail-settings-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: Frozen account, or caller lacks the SiteManager permission.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-ai-summary-settings-permission-denied.json

adminSaveMailSettings:
  post:
    tags: [Admin]
    summary: Replace the outbound mail (SMTP) settings
    operationId: adminSaveMailSettings
    description: |
      Admin console operation gated by the `SiteManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`.
      Replaces the whole mail configuration with the submitted value and
      clears the mail-settings cache. There is no request validation: the Go
      struct tags `settings` with `validate:"required"`, but struct-level
      required never fails, so a malformed or empty body binds to zero
      values and is saved as-is.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminSaveMailSettingsRequest
    responses:
      '200':
        description: Configuration saved (`result` is the string `success`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminPageConfigSaveResponse
            examples:
              success:
                externalValue: ../fixtures/admin-agent-disable-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: Frozen account, or caller lacks the SiteManager permission.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-ai-summary-settings-permission-denied.json

adminTestMailConnection:
  post:
    tags: [Admin]
    summary: Send a probe email with the submitted SMTP settings
    operationId: adminTestMailConnection
    description: |
      Admin console operation gated by the `SiteManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`. Sends a
      real test email through the submitted (unsaved) SMTP configuration —
      nothing is persisted. The outcome is reported inside the success
      envelope: the envelope `code` is 0 even when the send fails; inspect
      `result.success` and `result.messageCode`
      (`admin.mail.testSuccess` / `admin.mail.testFailed`, the latter with
      `params.error` carrying the raw dial/send error text). A missing or
      malformed `testEmail` fails request validation
      (`validate:"required,email"`) with HTTP 200
      `common.request.invalidParams` before the handler runs — the handler's
      own `admin.mail.testEmailRequired` branch is unreachable through this
      route.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminTestMailConnectionRequest
    responses:
      '200':
        description: "Probe outcome inside a success envelope, or a `code: 1` validation failure."
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminTestMailConnectionResponse
            examples:
              sendSucceeded:
                externalValue: ../fixtures/admin-test-mail-connection-success.json
              sendFailed:
                externalValue: ../fixtures/admin-test-mail-connection-failed.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: Frozen account, or caller lacks the SiteManager permission.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-ai-summary-settings-permission-denied.json

