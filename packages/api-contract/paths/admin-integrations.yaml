adminSaveStorageSettings:
  post:
    tags: [Admin]
    summary: Replace the file storage settings
    operationId: adminSaveStorageSettings
    description: |
      Admin console operation gated by the `SiteManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`. An
      empty `provider` is normalized to `local`; any provider other than
      `local`/`s3` fails with HTTP 200 `common.request.invalidParams`; an
      `s3` configuration without `endpoint` and `bucket` fails with HTTP 200
      `admin.storage.saveFailed` (params.error is the fixed Chinese sentence
      `S3 模式需要填写 Endpoint 与 Bucket`). On success the whole storage
      configuration is replaced and the storage-settings cache is cleared.
      The Go struct tags `settings` with `validate:"required"`, but
      struct-level required never fails, so a missing/malformed body saves
      the normalized zero-value configuration (`provider=local`).
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminSaveStorageSettingsRequest
    responses:
      '200':
        description: "Configuration saved (`result` is the string `success`), or a `code: 1` business failure (invalid provider, incomplete S3 configuration)."
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminPageConfigSaveResponse
            examples:
              success:
                externalValue: ../fixtures/admin-agent-disable-success.json
              s3MissingEndpointOrBucket:
                externalValue: ../fixtures/admin-save-storage-settings-save-failed.json
              invalidProvider:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the SiteManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-ai-summary-settings-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

