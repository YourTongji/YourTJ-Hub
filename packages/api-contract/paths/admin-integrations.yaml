adminCreateStorageMigrateTask:
  post:
    tags: [Admin]
    summary: Enqueue a background file-migration task to object storage
    operationId: adminCreateStorageMigrateTask
    description: |
      Admin console operation gated by the `SiteManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`.
      Enqueues a background task (task_queue type `file-migrate`) that
      migrates locally stored file BLOBs to the configured S3-compatible
      storage; returns the task id. The migration only runs when the active
      (already saved) storage provider is `s3`; with any other provider the
      service rejects the request and the handler reports HTTP 200
      `admin.storage.migrateFailed` with params.error `file migration
      requires an s3-compatible storage provider`. Note: the
      `admin.storage.migrateInvalidProvider` message code exists in the
      codebase but is unreachable — the controller compares against a
      distinct sentinel error, so the provider-mismatch path falls through
      to `admin.storage.migrateFailed`. A configured-but-unreachable S3
      backend also fails with `admin.storage.migrateFailed` (params.error
      carries the wrapped connection error). JSON binding is lenient: a
      missing body binds `clearAfterMigrate=false`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminCreateStorageMigrateTaskRequest
    responses:
      '200':
        description: "Task id of the enqueued migration, or a `code: 1` business failure."
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminTaskCreatedResponse
            examples:
              success:
                externalValue: ../fixtures/admin-data-export-success.json
              providerNotS3:
                externalValue: ../fixtures/admin-storage-migrate-task-migrate-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the SiteManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-ai-summary-settings-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

