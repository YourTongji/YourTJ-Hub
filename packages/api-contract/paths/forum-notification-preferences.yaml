preferences:
  get:
    operationId: getNotificationPreferences
    tags: [Forum]
    summary: Read the caller's account-wide unread indicator preferences
    description: Display preferences only; independent of notification delivery and read state. Categories filter in-app notification badges, not the notification list or private-message badges.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Account preference; existing and new accounts default to numeric indicators.
        content:
          application/json:
            schema:
              $ref: '#/response'
            examples:
              number:
                externalValue: ../fixtures/notification-preferences-number.json
              dot:
                externalValue: ../fixtures/notification-preferences-dot.json
      '401':
        description: Missing, invalid, expired or revoked session.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              required:
                externalValue: ../fixtures/auth-required.json
  put:
    operationId: updateNotificationPreferences
    tags: [Forum]
    summary: Set the caller's account-wide unread indicator preferences
    description: |
      Changes display only: badgeCategories filters notification badge flags/counts, not stored unread facts, notification lists, messages or push consent.
      Category semantics match the notification center: directly mentioned replies are mentions; unknown event types are system.
      Default categories include replies, mentions, likes, following and system. An empty array disables notification badges.
      Applies only to the caller, with last committed write winning per supplied field across devices; omitted/null fields are preserved. Pending email
      activation is allowed for this self-service preference; frozen accounts remain blocked.
      A private existing unread-change hint asks other sessions to refresh. Invalid enums, duplicate categories or an update with no non-null fields return HTTP 200 `common.request.invalidParams` without changing the preference.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/update'
    responses:
      '200':
        description: Committed preference, or a legacy validation/storage failure envelope.
        content:
          application/json:
            schema:
              $ref: '#/response'
            examples:
              number:
                externalValue: ../fixtures/notification-preferences-number.json
              dot:
                externalValue: ../fixtures/notification-preferences-dot.json
              invalid:
                externalValue: ../fixtures/notification-preferences-invalid.json
      '400':
        description: Malformed/non-object/null JSON, wrong types, unknown fields, trailing data or body exceeding 4 KiB.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/parse-failed.json
      '401':
        description: Missing, invalid, expired or revoked session.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              required:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: Frozen/unavailable account, or a cookie request rejected by the CSRF gate. Pending activation is allowed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozen:
                externalValue: ../fixtures/account-frozen.json
              csrf:
                externalValue: ../fixtures/csrf-rejected.json
      '429':
        description: Shared interaction limit (action `interact`) exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
            examples:
              rateLimited:
                externalValue: ../fixtures/account-close-rate-limited.json
value:
  type: object
  required: [badgeStyle, badgeCategories]
  properties:
    badgeStyle:
      type: string
      enum: [number, dot]
      description: Numeric unread count (capped by the UI), or a dot with no displayed count.
    badgeCategories:
      $ref: '#/categories'
  additionalProperties: false
categories:
  type: array
  uniqueItems: true
  maxItems: 5
  items:
    type: string
    enum: [replies, mentions, likes, following, system]
  description: Account-wide notification badge selection. Default all; empty means none. Replies with a direct mention count as mentions.
update:
  type: object
  minProperties: 1
  additionalProperties: false
  properties:
    badgeStyle:
      type: [string, 'null']
      enum: [number, dot, null]
    badgeCategories:
      anyOf:
        - $ref: '#/categories'
        - type: 'null'
response:
  oneOf:
    - allOf:
        - $ref: ../components/schemas.yaml#/ApiSuccess
        - type: object
          required: [result]
          properties:
            result:
              $ref: '#/value'
    - $ref: ../components/schemas.yaml#/ApiFailure
