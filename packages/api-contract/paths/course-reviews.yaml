reportCourseReview:
  post:
    tags: [Forum]
    summary: Report a course review
    operationId: reportCourseReview
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      Authenticated write. The caller cannot report their own review
      (`report.ownContent`); a second open report for the same review is rejected as
      `report.duplicate`. All report failures are legacy HTTP 200 business failures, matching the
      existing forum report behavior.
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ReviewReportRequest
    responses:
      '200':
        description: Boolean success result or a report business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ReviewActionResponse
            examples:
              success:
                externalValue: ../fixtures/course-review-report-success.json
              targetInvalid:
                externalValue: ../fixtures/course-review-report-target-invalid.json
              ownContent:
                externalValue: ../fixtures/course-review-report-own-content.json
              duplicate:
                externalValue: ../fixtures/course-review-report-duplicate.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/course-review-unauthenticated.json
      '429':
        description: Report rate limit exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure

moderationCourseReviewStatus:
  post:
    tags: [Forum]
    summary: Hide or show a course review (CourseManager)
    operationId: moderationCourseReviewStatus
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      CourseManager-scoped moderation. Permission failures and unknown reviews are legacy HTTP 200
      business failures (`permission.denied`, `review.notFound`); the operation is idempotent and
      adjusts course/offering stats projections.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ModerationCourseReviewStatusRequest
    responses:
      '200':
        description: Boolean success result or a moderation business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ReviewActionResponse
            examples:
              success:
                externalValue: ../fixtures/course-review-moderation-status-success.json
              permissionDenied:
                externalValue: ../fixtures/course-review-permission-denied.json
              notFound:
                externalValue: ../fixtures/course-review-not-found.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/course-review-unauthenticated.json

moderationCourseReviewReportList:
  post:
    tags: [Forum]
    summary: List the course review report queue (CourseManager)
    operationId: moderationCourseReviewReportList
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      CourseManager-scoped moderation queue for course review reports. Permission failures are a
      legacy HTTP 200 business failure (`permission.denied`). Items never expose the reviewed
      author's identity; the reporter/handler author payloads are the standard forum author shape.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ModerationCourseReviewReportListRequest
    responses:
      '200':
        description: One page of open (or filtered) reports, or a permission business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ModerationCourseReviewReportListResponse
            examples:
              success:
                externalValue: ../fixtures/course-review-moderation-reports-success.json
              permissionDenied:
                externalValue: ../fixtures/course-review-permission-denied.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/course-review-unauthenticated.json

moderationCourseReviewReveal:
  post:
    tags: [Forum]
    summary: Reveal a course review author identity (Admin only)
    operationId: moderationCourseReviewReveal
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      Admin-only identity reveal for anonymous course review authors. A reason is required and the
      reveal is written to the restricted operation log. Permission failures and unknown reviews
      are legacy HTTP 200 business failures (`permission.denied`, `review.notFound`).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ModerationCourseReviewRevealRequest
    responses:
      '200':
        description: The revealed author identity, or a moderation business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ModerationCourseReviewRevealResponse
            examples:
              success:
                externalValue: ../fixtures/course-review-moderation-reveal-success.json
              permissionDenied:
                externalValue: ../fixtures/course-review-permission-denied.json
              notFound:
                externalValue: ../fixtures/course-review-not-found.json
      '429':
        description: Identity-reveal rate limit exceeded (1h window).
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/course-review-unauthenticated.json
