moderationCourseReviewStatus:
  post:
    tags: [Forum]
    summary: Hide or show a course review (CourseManager)
    operationId: moderationCourseReviewStatus
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      CourseManager-scoped moderation. Unknown reviews are legacy HTTP 200 business failures
      (`review.notFound`); permission failures are rejected by the permission middleware with
      HTTP 403 `permission.denied` (the middleware runs before the handler). The operation is
      idempotent and adjusts course/offering stats projections.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ModerationCourseReviewStatusRequest
    responses:
      '200':
        description: Boolean success result, or a business failure envelope (e.g. `review.notFound`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ReviewActionResponse
            examples:
              success:
                externalValue: ../fixtures/result-true.json
              notFound:
                externalValue: ../fixtures/course-review-not-found.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          The caller is not a CourseManager.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              permissionDenied:
                externalValue: ../fixtures/permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
      '429':
        description: Course-review moderation rate limit exceeded (60s window).
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
