listCourseReviews:
  get:
    tags: [Forum]
    summary: List visible course reviews for a course or a single offering
    security: []
    operationId: listCourseReviews
    description: |
      Public read endpoint. An optional valid JWT (cookie or Bearer) only personalizes the
      `viewer` state (canEdit/canDelete/isHelpful); anonymous callers receive the same reviews
      with viewer flags false. Review payloads never contain author identity fields
      (userId/username/avatar): anonymous and legacy reviews expose only a kind/label pair.
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
      - name: offeringId
        in: query
        schema:
          type: integer
          format: uint64
          minimum: 1
          description: When present, only reviews of this offering are returned.
      - name: cursor
        in: query
        schema:
          type: string
          description: |
            Pagination cursor returned as nextCursor in the previous response
            (format "offeringId:reviewId"). Omit for the first page.
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
          description: Page size (default 50, max 50; server/client default aligned).
    responses:
      '200':
        description: Visible reviews ordered newest first.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ReviewListResponse
            examples:
              success:
                externalValue: ../fixtures/course-reviews-list-success.json
      '400':
        description: Malformed course id or query parameters.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/course-parse-failed.json
      '500':
        description: Review listing failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              listFailed:
                externalValue: ../fixtures/course-review-list-failed.json

createCourseReview:
  post:
    tags: [Forum]
    summary: Create a course review for an offering
    operationId: createCourseReview
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      Authenticated write. Each user can review an offering at most once; a second review for the
      same offering fails with 409 `review.duplicate`. The offering must exist and be visible
      (404 `review.offeringNotFound`). Anonymous reviews are stored and returned without any
      author identity.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ReviewWriteRequest
    responses:
      '200':
        description: The created review payload, or a legacy business failure envelope for validation failures.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ReviewWriteResponse
            examples:
              success:
                externalValue: ../fixtures/course-review-create-success.json
              invalidRequest:
                summary: Current route behavior for invalid rating/content (legacy HTTP 200 envelope).
                externalValue: ../fixtures/course-review-invalid-params.json
      '400':
        description: Malformed JSON request body (binding failure). Rating range and required-field failures are legacy HTTP 200 business failures.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/course-parse-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/course-review-unauthenticated.json
      '403':
        description: Authenticated account is frozen or its account information cannot be resolved.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '404':
        description: The offering does not exist or is not visible.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              offeringNotFound:
                externalValue: ../fixtures/course-review-offering-not-found.json
      '409':
        description: The caller already reviewed this offering.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              duplicate:
                externalValue: ../fixtures/course-review-duplicate.json
      '429':
        description: Course-review write rate limit exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure

updateCourseReview:
  patch:
    tags: [Forum]
    summary: Update the caller's own course review
    operationId: updateCourseReview
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      Authenticated write. Only the author can update a review (403 `review.notOwned`); hidden or
      deleted reviews are reported as 404 `review.notFound`. `rating` is optional and must stay in
      1..5 when present. A review that does not exist is also 404 `review.notFound`.
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ReviewUpdateRequest
    responses:
      '200':
        description: The updated review payload, or a legacy business failure envelope for validation failures.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ReviewWriteResponse
            examples:
              success:
                externalValue: ../fixtures/course-review-update-success.json
      '400':
        description: Rating outside 1..5.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              ratingInvalid:
                externalValue: ../fixtures/course-review-rating-invalid.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/course-review-unauthenticated.json
      '403':
        description: The caller is not the review author, or the account is frozen.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              notOwned:
                externalValue: ../fixtures/course-review-not-owned.json
      '404':
        description: The review does not exist, is hidden, or is deleted.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              notFound:
                externalValue: ../fixtures/course-review-not-found.json
      '429':
        description: Course-review write rate limit exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure

deleteCourseReview:
  delete:
    tags: [Forum]
    summary: Delete the caller's own course review
    operationId: deleteCourseReview
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      Authenticated write. Only the author can delete a review (403 `review.notOwned`); the review
      enters a deletion quarantine window and stops being listed. Deleting is idempotent: repeating
      DELETE on an already deleted review returns 200 with no further effect, and the author can
      delete a review hidden by moderation (200). Unknown reviews report 404 `review.notFound`.
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
    responses:
      '200':
        description: Boolean success result, or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ReviewActionResponse
            examples:
              success:
                externalValue: ../fixtures/course-review-delete-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/course-review-unauthenticated.json
      '403':
        description: The caller is not the review author, or the account is frozen.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              notOwned:
                externalValue: ../fixtures/course-review-not-owned.json
      '404':
        description: The review does not exist, is hidden, or is deleted.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              notFound:
                externalValue: ../fixtures/course-review-not-found.json
      '429':
        description: Course-review write rate limit exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure

