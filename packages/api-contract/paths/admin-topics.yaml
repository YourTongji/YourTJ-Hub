adminEditTopic:
  post:
    tags: [Admin]
    summary: Ban or unban a topic from the admin console
    operationId: adminEditTopic
    description: |
      Admin console operation gated by the `TopicsManager` role permission; callers
      without it fail with HTTP 403 and `permission.denied`. Sets the topic
      processStatus (0 normal, 1 banned); re-applying the current status is a
      no-op success. Unknown topics fail with `topic.notFound` (HTTP 200); a status
      outside 0-1 fails validation as `common.request.invalidParams` (HTTP 200);
      persistence failures surface as `common.operation.failed` (HTTP 200). JSON
      binding is lenient: a malformed body binds to zero values and fails validation
      as `common.request.invalidParams` (HTTP 200).
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminEditTopicRequest
    responses:
      '200':
        description: Operation applied, or a legacy business failure envelope (`topic.notFound` / `common.operation.failed` / `common.request.invalidParams`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminOperationResponse
            examples:
              success:
                externalValue: ../fixtures/admin-post-delete-success.json
              topicNotFound:
                externalValue: ../fixtures/admin-topic-categories-edit-topic-not-found.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the TopicsManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
