adminListTopics:
  post:
    tags: [Admin]
    summary: Page through topics for the admin console
    operationId: adminListTopics
    description: |
      Admin console topic list, gated by the `TopicsManager` role permission
      (Admin role is a superset). Callers without the permission fail with HTTP 403
      and `permission.denied` (params permission=<localized permission name>).
      Results sort by pin weight, then update time, both descending. The page payload
      never computes a total count (`total` is always 0). JSON binding is lenient:
      a malformed body binds to zero values and returns the first page.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminTopicsListRequest
    responses:
      '200':
        description: Topic page.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminTopicsListResponse
            examples:
              success:
                externalValue: ../fixtures/admin-topics-list-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the TopicsManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-category-delete-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

