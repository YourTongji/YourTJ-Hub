adminEditTopicCategories:
  post:
    tags: [Admin]
    summary: Replace a topic's category set
    operationId: adminEditTopicCategories
    description: |
      Admin console operation gated by the `TopicsManager` role permission; callers
      without it fail with HTTP 403 and `permission.denied`. Replaces the topic's
      categories with the given set (deduplicated server-side). The request struct
      validates `categoryId` with `min=1,max=3` before the handler runs, so an
      empty/omitted set or more than three raw entries fail validation with
      `common.request.invalidParams` (HTTP 200) — the handler's
      `admin.topic.categoryRequired` / `admin.topic.categoryTooMany` branches are
      unreachable through this endpoint. A zero or unknown category id fails with
      `admin.category.notFound` (HTTP 200), unknown topics with `topic.notFound`
      (HTTP 200); persistence failures surface as `common.operation.failed`
      (HTTP 200). JSON binding is lenient: a malformed body binds to zero values
      and fails validation as `common.request.invalidParams` (HTTP 200).
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminEditTopicCategoriesRequest
    responses:
      '200':
        description: Categories replaced, or a legacy business failure envelope (`common.request.invalidParams` / `admin.category.notFound` / `topic.notFound` / `common.operation.failed`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminOperationResponse
            examples:
              success:
                externalValue: ../fixtures/admin-post-delete-success.json
              topicNotFound:
                externalValue: ../fixtures/admin-topic-categories-edit-topic-not-found.json
              categoryNotFound:
                externalValue: ../fixtures/admin-category-delete-not-found.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the TopicsManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
