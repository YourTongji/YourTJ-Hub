adminDeleteTopic:
  post:
    tags: [Admin]
    summary: Moderation-delete a topic (soft, restorable via adminRestoreTopic)
    operationId: adminDeleteTopic
    description: |
      Admin console operation gated by the `TopicsManager` role permission; callers
      without it fail with HTTP 403 and `permission.denied`. Performs a moderation
      (governance) deletion: the topic is soft-deleted into the moderator-removed
      state — never hard-deleted — and only the admin console can restore it; the
      author cannot. Re-deleting an already moderator-removed topic is an idempotent
      success that keeps the original deletion metadata. Wiki subsite topics are
      rejected with `topic.operationDenied` (HTTP 200). Unknown topics fail with
      `topic.notFound` (HTTP 200); a blank reason fails with
      `common.request.invalidParams` (HTTP 200); persistence failures surface as
      `content.delete.failed` (HTTP 200).
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminDeleteTopicRequest
    responses:
      '200':
        description: Topic deleted, or a legacy business failure envelope (`topic.notFound` / `topic.operationDenied` / `common.request.invalidParams` / `content.delete.failed`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminOperationResponse
            examples:
              success:
                externalValue: ../fixtures/admin-post-delete-success.json
              topicNotFound:
                externalValue: ../fixtures/admin-topic-categories-edit-topic-not-found.json
              operationDenied:
                externalValue: ../fixtures/admin-topic-delete-operation-denied.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the TopicsManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-category-delete-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

adminRestoreTopic:
  post:
    tags: [Admin]
    summary: Restore a moderation-deleted topic
    operationId: adminRestoreTopic
    description: |
      Admin console operation gated by the `TopicsManager` role permission; callers
      without it fail with HTTP 403 and `permission.denied`. The admin console is
      the only restore channel for moderation-deleted topics. Unknown topics fail
      with `topic.notFound` (HTTP 200); topics not in the moderator-removed state
      fail with `content.notRecoverable` (HTTP 200); persistence failures surface
      as `content.restore.failed` (HTTP 200). A successful restore returns
      messageCode `content.restore.success`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminRestoreTopicRequest
    responses:
      '200':
        description: Topic restored, or a legacy business failure envelope (`topic.notFound` / `content.notRecoverable` / `content.restore.failed`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminOperationResponse
            examples:
              success:
                externalValue: ../fixtures/admin-topic-restore-success.json
              topicNotFound:
                externalValue: ../fixtures/admin-topic-categories-edit-topic-not-found.json
              notRecoverable:
                externalValue: ../fixtures/admin-topic-restore-not-recoverable.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the TopicsManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-category-delete-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

adminDeletePost:
  post:
    tags: [Admin]
    summary: Moderation-delete a reply post
    operationId: adminDeletePost
    description: |
      Admin console operation gated by the `TopicsManager` role permission; callers
      without it fail with HTTP 403 and `permission.denied`. Unlike author
      self-deletion, a moderation deletion cannot be restored by the author, records
      the mandatory reason in the audit log, and also upgrades author-deleted posts
      to the moderator-removed state. Re-deleting an already moderator-removed or
      purged post is an idempotent success. The topic first post is rejected with
      `common.request.invalidParams` (HTTP 200) — use adminDeleteTopic instead.
      Unknown posts fail with `post.notFound` (HTTP 200); a blank reason fails with
      `common.request.invalidParams` (HTTP 200); persistence failures surface as
      `content.delete.failed` (HTTP 200).
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminDeletePostRequest
    responses:
      '200':
        description: Post deleted, or a legacy business failure envelope (`post.notFound` / `common.request.invalidParams` / `content.delete.failed`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminOperationResponse
            examples:
              success:
                externalValue: ../fixtures/admin-post-delete-success.json
              postNotFound:
                externalValue: ../fixtures/admin-post-delete-post-not-found.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the TopicsManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
