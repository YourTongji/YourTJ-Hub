uploadAvatar:
  post:
    tags: [User]
    summary: Upload a custom avatar image
    operationId: uploadAvatar
    description: |
      Multipart upload of a custom avatar. The `avatar` file part is required;
      `avatarMedium` is an optional pre-cropped medium file stored alongside.
      Business failures (HTTP 200): `upload.attachment.disabled`, `upload.cooldown`
      (new-account upload cooldown, params minutes/availableAt),
      `upload.file.missing`, `upload.filename.required`,
      `upload.dailyLimit.avatar` (params count/fileCount), `upload.file.tooLarge`
      (params maxSizeKb), `upload.extension.unsupported` (params extensions),
      `upload.image.unsupported`, `upload.image.invalidContent`,
      `upload.saveFailed` (params error). Frozen accounts are rejected by the
      route-level CheckWritableAccount middleware with the standard params
      action=写入 / actionCode=write (the controller's own 上传附件 /
      uploadAttachment permission check is unreachable behind that middleware).
      When the site mandates verified email, the same controller check can
      reject pending-activation accounts with HTTP 403 `permission.emailRequired`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: ../components/schemas.yaml#/UploadAvatarRequest
    responses:
      '200':
        description: Avatar stored, or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/UploadAvatarResponse
            examples:
              success:
                externalValue: ../fixtures/upload-avatar-success.json
              fileMissing:
                externalValue: ../fixtures/admin-img-upload-file-missing.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account (standard middleware params action=写入, actionCode=write) or unverified email under mandatory verification (`permission.emailRequired`).
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
      '429':
        description: Upload rate limit (action `upload`) exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
            examples:
              rateLimited:
                externalValue: ../fixtures/upload-avatar-rate-limited.json

changePassword:
  post:
    tags: [User]
    summary: Change the caller's password
    operationId: changePassword
    description: |
      Changes the account password. On success the account TokenVersion increments,
      so every previously issued JWT — including the one used for this request —
      is immediately invalid and no replacement token is minted; the client must log
      in again. The new password must be 6-64 characters and contain at least one
      letter and one digit (`auth.password.tooShort` params minLength=6,
      `auth.password.tooLong`, `auth.password.needsLetterNumber`). Bot (Agent)
      accounts are rejected with `auth.password.oldInvalid`. JSON binding is
      lenient: a malformed body binds to zero values and fails validation as
      `common.request.invalidParams` (HTTP 200) because both fields are required.
      Other business failures: `auth.password.oldInvalid`,
      `auth.password.updateFailed`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ChangePasswordRequest
    responses:
      '200':
        description: Password changed (all existing sessions invalidated), or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ChangePasswordResponse
            examples:
              success:
                externalValue: ../fixtures/change-password-success.json
              oldPasswordInvalid:
                externalValue: ../fixtures/change-password-old-invalid.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
      '429':
        description: Password-change rate limit (action `password.change`) exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
            examples:
              rateLimited:
                externalValue: ../fixtures/change-password-rate-limited.json

getOAuthBindings:
  get:
    tags: [User]
    summary: List the caller's OAuth bindings
    operationId: getOAuthBindings
    description: |
      Read-only endpoint guarded by authentication only (no writable-account
      check), so frozen accounts can still read their binding state. The result is
      keyed by provider and always carries the fixed github and google entries; a
      bound entry includes provider/createdAt/updatedAt, an unbound entry is just
      `{bound: false}`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Binding state keyed by provider.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/OAuthBindingsResponse
            examples:
              success:
                externalValue: ../fixtures/oauth-bindings-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json

unbindOAuth:
  post:
    tags: [User]
    summary: Unbind an OAuth provider from the caller's account
    operationId: unbindOAuth
    description: |
      Removes the OAuth binding named by the provider path parameter (the value is
      not validated against a provider list). Unbinding the last remaining login
      method — an account without an email address whose other OAuth bindings count
      to zero — is refused, and any service-side failure surfaces as HTTP 200
      `oauth.unbind.failed` with params error/provider. The request takes no body.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
        description: Provider key as registered at bind time (for example github or google); not validated by the server.
    responses:
      '200':
        description: Provider unbound, or a legacy business failure envelope (`oauth.unbind.failed`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/UnbindOAuthResponse
            examples:
              success:
                externalValue: ../fixtures/oauth-unbind-success.json
              unbindFailed:
                externalValue: ../fixtures/oauth-unbind-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
