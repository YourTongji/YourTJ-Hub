      zero values and fails validation as `common.request.invalidParams` (HTTP 200)
      because username is required. Other business failures: `user.fetchFailed`,
      `user.updateFailed`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
