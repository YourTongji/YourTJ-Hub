setUserEmail:
  post:
    tags: [User]
    summary: Change the caller's email address
    operationId: setUserEmail
    description: |
      Changes the account email behind a password second-factor check. On success
      the account activation state flips back to pending, an activation email is
      sent to the new address, a change notification is queued to the old address,
      and the new address cannot be used for forgot-password within 24 hours of the
      change (EmailChangedAt cooldown). JSON binding is lenient: a malformed body
      binds to zero values and fails validation as `common.request.invalidParams`
      (HTTP 200). Business failures: `common.request.invalidParams`,
      `auth.password.oldInvalid`, `auth.password.oauthRequired` (OAuth-only account
      without a password), `auth.emailDomain.notAllowed`, `auth.email.exists`,
      `user.fetchFailed`, `user.updateFailed`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/SetUserEmailRequest
    responses:
      '200':
        description: Email updated (activation email sent to the new address), or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/UserUpdateResponse
            examples:
              success:
                externalValue: ../fixtures/set-user-email-success.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
      '429':
        description: Email-change rate limit (action `email.change`) exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
            examples:
              rateLimited:
                externalValue: ../fixtures/set-user-email-rate-limited.json

resendActivationEmail:
  post:
    tags: [User]
    summary: Resend the account activation email
    operationId: resendActivationEmail
    description: |
      Resends the activation email to the caller's pending-verification address.
      The route mounts no rate-limit middleware; throttling is enforced inside the
      service and surfaces as business failure codes: `auth.activation.disabled`
      (site-wide email verification off), `auth.activation.alreadyVerified`,
      `auth.activation.resendCooldown` (params retryAfterSeconds),
      `auth.activation.resendDaily` (params limit, daily cap 3) and
      `auth.activation.resendFailed`. The request takes no body.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Activation email resent (result and params carry remainingToday), or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ResendActivationResponse
            examples:
              success:
                externalValue: ../fixtures/resend-activation-email-success.json
              cooldown:
                externalValue: ../fixtures/resend-activation-email-cooldown.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

setUserName:
  post:
    tags: [User]
    summary: Change the caller's username
    operationId: setUserName
    description: |
      Renames the account. The new username must match `^[a-zA-Z0-9_-]{6,32}$`
      (`auth.username.invalid`) and survives the reserved/banned lists
      (`auth.username.reserved` / `auth.username.banned`) and the uniqueness check
