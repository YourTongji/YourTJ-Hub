getCaptcha:
  get:
    tags: [User]
    summary: Generate a captcha challenge
    operationId: getCaptcha
    description: |
      Fully public endpoint: no authentication, no rate limit, no input. Returns a
      fresh captcha id plus the image as a `data:image/png;base64` data URI. The id
      is echoed back as captchaId on captcha-guarded operations (for example
      posts/create when risk controls request a captcha). This endpoint has no
      business failure branch.
    security: []
    responses:
      '200':
        description: Fresh captcha challenge.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CaptchaSuccess
            examples:
              success:
                externalValue: ../fixtures/captcha-success.json

getUserCard:
  get:
    tags: [User]
    summary: Read the compact public profile card of a user
    operationId: getUserCard
    description: |
      Public read endpoint with no rate limit. Note the route group mounts no JWT
      middleware, so the viewer-specific flags isSelf and isFollowing are always
      false. Query binding is strict: a missing or non-numeric userId fails with
      HTTP 400 and `common.request.parseFailed`. An unknown user id fails with
      `user.notFound` (HTTP 200); a closed (soft-deleted) account instead returns a
      successful minimal tombstone card (userId/avatarUrl/isAccountClosed set, the
      remaining fields zero-valued).
    security: []
    parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
    responses:
      '200':
        description: User card, or a legacy business failure envelope (`user.notFound`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/UserCardResponse
            examples:
              success:
                externalValue: ../fixtures/user-card-success.json
              userNotFound:
                externalValue: ../fixtures/admin-save-user-badges-user-not-found.json
      '400':
        description: Missing or malformed userId query parameter.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/parse-failed.json

setUserInfo:
  post:
    tags: [User]
    summary: Update the caller's profile fields
    operationId: setUserInfo
    description: |
      Full-overwrite update of nickname/bio/signature/website/websiteName/
      externalInformation; every field is optional in the request, and bio/signature
      accept an empty string to clear the stored value. locale is applied only when
      non-empty after trimming. JSON binding is lenient: a malformed body binds to
      zero values and still succeeds as an all-empty overwrite. A nickname hitting
      the reserved/banned lists fails with `auth.nickname.reserved` /
      `auth.nickname.banned`; profile free text (bio/signature/website/websiteName)
      hitting the sensitive-word list fails with `content.sensitive.blocked`
      (params carries the matched word). Business failures: `user.fetchFailed`,
      `user.updateFailed`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/SetUserInfoRequest
    responses:
      '200':
        description: |
          Profile updated, or a legacy business failure envelope
          (`auth.nickname.reserved` / `auth.nickname.banned` /
          `content.sensitive.blocked`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/UserUpdateResponse
            examples:
              success:
                externalValue: ../fixtures/set-user-email-success.json
              nicknameReserved:
                summary: Nickname hits the reserved list (legacy HTTP 200 envelope).
                externalValue: ../fixtures/user-info-nickname-reserved.json
              nicknameBanned:
                summary: Nickname hits the banned list (legacy HTTP 200 envelope).
                externalValue: ../fixtures/user-info-nickname-banned.json
              sensitiveBlocked:
                summary: Profile free text hits the sensitive-word list (legacy HTTP 200 envelope).
                externalValue: ../fixtures/user-info-sensitive-blocked.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

