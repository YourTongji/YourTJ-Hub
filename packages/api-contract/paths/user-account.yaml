wearBadge:
  post:
    tags: [User]
    summary: Wear or take off a badge
    operationId: wearBadge
    description: |
      Pins one of the caller's granted badges on the profile; an empty (or omitted)
      badgeCode takes the current badge off. Every rejection — unknown code, badge
      not owned, badge not wearable — collapses into `common.request.invalidParams`
      (HTTP 200). JSON binding is lenient: a malformed body binds to zero values and
      takes the badge off.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/WearBadgeRequest
    responses:
