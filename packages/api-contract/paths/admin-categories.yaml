adminCategoryList:
  post:
    tags: [Admin]
    summary: List all categories with their moderators
    operationId: adminCategoryList
    description: |
      Admin console operation gated by the `TopicsManager` role permission
      (Admin role is a superset); callers without it fail with HTTP 403 and
      `permission.denied` (params permission=<localized permission name>).
      Returns every category ordered by sort ascending then id ascending, each
      with its enabled moderators (moderator row id ascending). Despite the
      request struct carrying page/pageSize fields, the result is **not**
      paged — both fields are ignored. JSON binding is lenient: a malformed
      body binds to zero values and is ignored.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminCategoryListRequest
    responses:
      '200':
        description: All categories with moderators.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminCategoryListResponse
            examples:
              success:
                externalValue: ../fixtures/admin-category-list-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the TopicsManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-category-delete-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

adminCategorySave:
  post:
    tags: [Admin]
    summary: Create or update a category
    operationId: adminCategorySave
    description: |
      Admin console operation gated by the `TopicsManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`. `id` 0
      creates a new category; a positive `id` overwrites every field of the
      existing category with the submitted values (omitted optional fields
      bind to zero values and clear the stored ones). A positive `id`
      matching no category fails with `admin.category.dataNotFound`
      (HTTP 200). A missing/empty `category` fails request validation with
      `common.request.invalidParams` (HTTP 200); a whitespace-only `category`
      passes validation but fails the handler's trim check with
      `admin.category.nameRequired` (HTTP 200). Saving clears the category
      cache and schedules a search-index refresh. JSON binding is lenient: a
      malformed body binds to zero values and fails validation as
      `common.request.invalidParams` (HTTP 200) because category is required.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminCategorySaveRequest
    responses:
      '200':
        description: Category saved (result true), or a legacy business failure envelope (`common.request.invalidParams` / `admin.category.nameRequired` / `admin.category.dataNotFound`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminBoolResponse
            examples:
              success:
                externalValue: ../fixtures/result-true.json
              nameRequired:
                externalValue: ../fixtures/admin-category-save-name-required.json
              dataNotFound:
                externalValue: ../fixtures/admin-category-save-data-not-found.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the TopicsManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-category-delete-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

adminCategoryDelete:
  post:
    tags: [Admin]
    summary: Delete a category
    operationId: adminCategoryDelete
    description: |
      Admin console operation gated by the `TopicsManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`. The
      category row is hard-deleted. Unknown ids (including a missing/zero id)
      fail with `admin.category.notFound` (HTTP 200); deleting the last
      remaining category fails with `admin.category.keepOne` (HTTP 200); a
      category that still has effective topic bindings fails with
      `admin.category.hasTopics` (HTTP 200). Deletion clears the category
      cache and schedules a search-index cleanup. JSON binding is lenient: a
      malformed body binds to zero values and fails as
      `admin.category.notFound`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminCategoryDeleteRequest
    responses:
      '200':
        description: Category deleted (result true), or a legacy business failure envelope (`admin.category.notFound` / `admin.category.keepOne` / `admin.category.hasTopics`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminBoolResponse
            examples:
              success:
                externalValue: ../fixtures/result-true.json
              categoryNotFound:
                externalValue: ../fixtures/admin-category-delete-not-found.json
              keepOne:
                externalValue: ../fixtures/admin-category-delete-keep-one.json
              hasTopics:
                externalValue: ../fixtures/admin-category-delete-has-topics.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the TopicsManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-category-delete-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

