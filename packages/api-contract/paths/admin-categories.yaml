adminGlobalModeratorAdd:
  post:
    tags: [Admin]
    summary: Grant a user the global moderator scope
    operationId: adminGlobalModeratorAdd
    description: |
      Admin console operation gated by the `TopicsManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`. Resolves
      the target by `userId` first, falling back to an exact `username` match;
      granting is idempotent and re-enables an existing disabled moderator
      row. A missing/blank user reference fails with
      `admin.moderator.userRequired` (HTTP 200); an unresolvable one fails
      with `admin.moderator.userNotFound` (HTTP 200); bot (Agent) accounts
      fail with `admin.agent.roleNotAllowed` (HTTP 200). JSON binding is
      lenient: a malformed body binds to zero values and fails as
      `admin.moderator.userRequired`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminModeratorUserRequest
    responses:
      '200':
        description: Moderator granted (result true), or a legacy business failure envelope (`admin.moderator.userRequired` / `admin.moderator.userNotFound` / `admin.agent.roleNotAllowed`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminBoolResponse
            examples:
              success:
                externalValue: ../fixtures/result-true.json
              userRequired:
                externalValue: ../fixtures/admin-category-moderator-add-user-required.json
              userNotFound:
                externalValue: ../fixtures/admin-category-moderator-add-user-not-found.json
              agentRoleNotAllowed:
                externalValue: ../fixtures/admin-category-moderator-add-agent-role-not-allowed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the TopicsManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
