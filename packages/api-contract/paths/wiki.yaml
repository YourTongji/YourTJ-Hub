getWikiTree:
  get:
    tags: [Wiki]
    summary: Public wiki page tree across namespaces
    security: []
    operationId: getWikiTree
    responses:
      '200':
        description: "Namespace-labeled page tree with an active-page flag for each page; pages nest under directory nodes mirroring the repository directory hierarchy (issue #289)."
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiTreeResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-tree-success.json
      '500':
        description: Wiki tree query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

listWikiNamespaces:
  get:
    tags: [Wiki]
    summary: List public wiki namespaces with page counts
    security: []
    operationId: listWikiNamespaces
    responses:
      '200':
        description: Namespaces ordered by sort order then name, each with its approved-page count.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiNamespaceListResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-namespaces-success.json
      '500':
        description: Namespace query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

getWikiHome:
  get:
    tags: [Wiki]
    summary: Public wiki home feed with namespaces and recent approved revisions
    security: []
    operationId: getWikiHome
    responses:
      '200':
        description: Namespace overview plus recently updated pages ordered by update time desc.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiHomeResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-home-success.json
      '500':
        description: Wiki home query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

getAdminWikiTree:
  get:
    tags: [Wiki Admin]
    summary: Admin wiki page tree with sort order (PageManager or Admin only)
    operationId: getAdminWikiTree
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Namespace-labeled page tree including sort order for admin editing.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiAdminTreeResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-admin-tree-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/wiki-unauthenticated.json
      '403':
        description: The account is not a PageManager or Admin (or it is frozen).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              forbidden:
                externalValue: ../fixtures/wiki-namespace-forbidden.json
