getWikiTree:
  get:
    tags: [Wiki]
    summary: Public wiki page tree across namespaces
    security: []
    operationId: getWikiTree
    responses:
      '200':
        description: Namespace-labeled page tree with an active-page flag for each page.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiTreeResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-tree-success.json
      '500':
        description: Wiki tree query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

listWikiNamespaces:
  get:
    tags: [Wiki]
    summary: List public wiki namespaces with page counts
    security: []
    operationId: listWikiNamespaces
    responses:
      '200':
        description: Namespaces ordered by sort order then name, each with its approved-page count.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiNamespaceListResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-namespaces-success.json
      '500':
        description: Namespace query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

getWikiHome:
  get:
    tags: [Wiki]
    summary: Public wiki home feed with namespaces and recent approved revisions
    security: []
    operationId: getWikiHome
    responses:
      '200':
        description: Namespace overview plus recently updated pages ordered by update time desc.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiHomeResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-home-success.json
      '500':
        description: Wiki home query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

listWikiRevisions:
  get:
    tags: [Wiki]
    summary: List revisions of one wiki page
    security: []
    operationId: listWikiRevisions
    parameters:
      - name: pageId
        in: query
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
    responses:
      '200':
        description: |
          Published revisions of the page ordered by revision number desc. Only approved
          (published) revisions are listed; pending/rejected/superseded revisions carry
          unpublished content and are exposed only to editors and reviewers (Blueprint
          risk item: pending content must not leak to the public). Request-level validation
          failures (missing pageId) and unknown pages are returned as legacy HTTP 200
          envelopes (issue #176 B4 style: the contract documents the actual route behavior):
          `common.request.invalidParams` for a missing pageId, `wiki.page.notFound` for an
          unknown page.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiRevisionListResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-revisions-success.json
              invalidParams:
                summary: Missing pageId (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-revisions-invalid-params.json
              notFound:
                summary: Unknown page (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-not-found.json
      '400':
        description: Malformed query string (strict binding failure).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/wiki-parse-failed.json

createWikiPage:
  post:
    tags: [Wiki]
    summary: Create a wiki page in a namespace (publishes revision 1 as approved)
    operationId: createWikiPage
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/WikiCreatePageRequest
    responses:
      '200':
        description: |
          Created page id and canonical path. Business failures are returned as legacy
          HTTP 200 envelopes with stable message codes (issue #176 B4 style: the contract
          documents the actual route behavior): request-level validation failures
          (`common.request.invalidParams`, including illegal paths), namespace missing or
          the account not being an editor of the namespace (`wiki.namespace.notFound`),
          and a path collision (`wiki.page.pathConflict`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiCreatePageResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-page-create-success.json
              invalidParams:
                summary: Request-level validation failure (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-create-invalid-params.json
              namespaceNotFound:
                summary: Namespace missing or caller not an editor (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-create-namespace-not-found.json
              pathConflict:
                summary: Path already exists (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-path-conflict.json
      '400':
        description: Malformed JSON request body (strict binding failure).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/wiki-parse-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/wiki-unauthenticated.json
      '403':
        description: Authenticated account is frozen or its account information cannot be resolved.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

updateWikiPage:
  put:
    tags: [Wiki]
    summary: "Update an existing wiki page (write-publish: the new revision is immediately approved)"
    operationId: updateWikiPage
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/WikiUpdatePageRequest
    responses:
      '200':
        description: |
          New revision is created and immediately published (write-publish; no review step).
          The caller must be the page creator, a namespace editor, or a PageManager/Admin.
          Business failures are returned as legacy HTTP 200 envelopes with stable message
          codes: request-level validation failures (`common.request.invalidParams`), the
          page or its namespace missing or the account not being an editor
          (`wiki.namespace.notFound`, `wiki.page.notFound`), a version conflict when
          `baseRevisionNo` no longer matches the published revision (`wiki.revision.conflict`),
          and content hitting the sensitive-word filter (`content.sensitive.blocked`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiUpdatePageResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-page-update-success.json
              invalidParams:
                summary: Request-level validation failure (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-update-invalid-params.json
              namespaceNotFound:
                summary: Namespace missing or caller not an editor (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-update-namespace-not-found.json
              pageNotFound:
                summary: Unknown page (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-not-found.json
              revisionConflict:
                summary: baseRevisionNo no longer matches the published revision (legacy HTTP 200 envelope, 409 semantics).
                externalValue: ../fixtures/wiki-revision-conflict.json
              sensitiveBlocked:
                summary: Content hits the sensitive-word filter (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-content-sensitive-blocked.json
      '400':
        description: Malformed URI or JSON request body (strict binding failure).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/wiki-parse-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/wiki-unauthenticated.json
      '403':
        description: Authenticated account is frozen or its account information cannot be resolved.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

rollbackWikiPage:
  post:
    tags: [Wiki Admin]
    summary: Roll back a wiki page to an earlier revision (PageManager or Admin only)
    operationId: rollbackWikiPage
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/WikiRollbackRequest
    responses:
      '200':
        description: |
          Rollback executed and cannot be undone: every revision with a revision number
          greater than the target is permanently deleted, the page's published revision
          pointer moves back to the target, and materialized views (forum post, topic
          metadata, search index) are resynchronized. Business failures are returned as
          legacy HTTP 200 envelopes: a caller lacking PageManager/Admin
          (`permission.denied`), an unknown page (`wiki.page.notFound`), and an unknown
          target revision (`wiki.revision.notFound`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiRollbackResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-rollback-success.json
              notFound:
                summary: Unknown page or target revision (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-revision-not-found.json
      '400':
        description: Malformed URI or JSON request body (strict binding failure).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/wiki-parse-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/wiki-unauthenticated.json
      '403':
        description: The account is not a PageManager or Admin (or it is frozen).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              forbidden:
                externalValue: ../fixtures/wiki-namespace-forbidden.json

diffWikiPage:
  get:
    tags: [Wiki Admin]
    summary: Fetch two revisions of a wiki page for diffing (PageManager or Admin only)
    operationId: diffWikiPage
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
      - name: from
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Revision number of the older side; absent means an empty baseline (page before creation).
      - name: to
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
    responses:
      '200':
        description: |
          Raw markdown of the two requested revisions (or an empty baseline when `from`
          is absent) for rendering a diff in the admin UI. Business failures are returned
          as legacy HTTP 200 envelopes: an unknown page (`wiki.page.notFound`) and an
          unknown revision number (`wiki.revision.notFound`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiDiffResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-diff-success.json
              notFound:
                summary: Unknown page or revision (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-revision-not-found.json
      '400':
        description: Malformed query string (strict binding failure).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/wiki-parse-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/wiki-unauthenticated.json
      '403':
        description: The account is not a PageManager or Admin (or it is frozen).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              forbidden:
                externalValue: ../fixtures/wiki-namespace-forbidden.json

