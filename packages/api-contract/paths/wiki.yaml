getWikiTree:
  get:
    tags: [Wiki]
    summary: Public wiki page tree across namespaces
    security: []
    operationId: getWikiTree
    responses:
      '200':
        description: Namespace-labeled page tree with an active-page flag for each page.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiTreeResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-tree-success.json
      '500':
        description: Wiki tree query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

listWikiNamespaces:
  get:
    tags: [Wiki]
    summary: List public wiki namespaces with page counts
    security: []
    operationId: listWikiNamespaces
    responses:
      '200':
        description: Namespaces ordered by sort order then name, each with its approved-page count.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiNamespaceListResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-namespaces-success.json
      '500':
        description: Namespace query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

getWikiHome:
  get:
    tags: [Wiki]
    summary: Public wiki home feed with namespaces and recent approved revisions
    security: []
    operationId: getWikiHome
    responses:
      '200':
        description: Namespace overview plus recently updated pages ordered by update time desc.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiHomeResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-home-success.json
      '500':
        description: Wiki home query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

listWikiRevisions:
  get:
    tags: [Wiki]
    summary: List revisions of one wiki page
    security: []
    operationId: listWikiRevisions
    parameters:
      - name: pageId
        in: query
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
    responses:
      '200':
        description: |
          Published revisions of the page ordered by revision number desc. Only approved
          (published) revisions are listed; pending/rejected/superseded revisions carry
          unpublished content and are exposed only to editors and reviewers (Blueprint
          risk item: pending content must not leak to the public). Request-level validation
          failures (missing pageId) and unknown pages are returned as legacy HTTP 200
          envelopes (issue #176 B4 style: the contract documents the actual route behavior):
          `common.request.invalidParams` for a missing pageId, `wiki.page.notFound` for an
          unknown page.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiRevisionListResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-revisions-success.json
              invalidParams:
                summary: Missing pageId (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-revisions-invalid-params.json
              notFound:
                summary: Unknown page (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-not-found.json
      '400':
        description: Malformed query string (strict binding failure).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/wiki-parse-failed.json

createWikiPage:
  post:
    tags: [Wiki]
    summary: Create a wiki page in a namespace (submits a pending revision)
    operationId: createWikiPage
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/WikiCreatePageRequest
    responses:
      '200':
        description: |
          Created page id and canonical path. Business failures are returned as legacy
          HTTP 200 envelopes with stable message codes (issue #176 B4 style: the contract
          documents the actual route behavior): request-level validation failures
          (`common.request.invalidParams`, including illegal paths), namespace missing or
          the account not being an editor of the namespace (`wiki.namespace.notFound`),
          and a path collision (`wiki.page.pathConflict`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiCreatePageResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-page-create-success.json
              invalidParams:
                summary: Request-level validation failure (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-create-invalid-params.json
              namespaceNotFound:
                summary: Namespace missing or caller not an editor (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-create-namespace-not-found.json
              pathConflict:
                summary: Path already exists (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-path-conflict.json
      '400':
        description: Malformed JSON request body (strict binding failure).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/wiki-parse-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/wiki-unauthenticated.json
      '403':
        description: Authenticated account is frozen or its account information cannot be resolved.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

updateWikiPage:
  put:
    tags: [Wiki]
    summary: Update an existing wiki page (submits a new pending revision)
    operationId: updateWikiPage
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/WikiUpdatePageRequest
    responses:
      '200':
        description: |
          New pending revision created for the page. Business failures are returned as
          legacy HTTP 200 envelopes with stable message codes: request-level validation
          failures (`common.request.invalidParams`), the page or its namespace missing or
          the account not being an editor (`wiki.namespace.notFound`, `wiki.page.notFound`),
          and a path collision (`wiki.page.pathConflict`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiUpdatePageResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-page-update-success.json
              invalidParams:
                summary: Request-level validation failure (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-update-invalid-params.json
              namespaceNotFound:
                summary: Namespace missing or caller not an editor (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-update-namespace-not-found.json
              pageNotFound:
                summary: Unknown page (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-page-not-found.json
      '400':
        description: Malformed URI or JSON request body (strict binding failure).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/wiki-parse-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/wiki-unauthenticated.json
      '403':
        description: Authenticated account is frozen or its account information cannot be resolved.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

reviewWikiRevision:
  post:
    tags: [Wiki]
    summary: Approve or reject a pending wiki revision (PageManager or Admin only)
    operationId: reviewWikiRevision
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    parameters:
      - name: revisionId
        in: path
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/WikiReviewRevisionRequest
    responses:
      '200':
        description: |
          Review recorded. Business failures are returned as legacy HTTP 200 envelopes with
          stable message codes: an unknown action (`common.request.invalidParams`), the
          caller lacking PageManager/Admin (`permission.denied`), an unknown revision
          (`wiki.revision.notFound`), and a revision that is no longer pending
          (`wiki.revision.notPending`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiReviewRevisionResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-revision-review-success.json
              invalidParams:
                summary: Unknown action (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-revision-review-invalid-params.json
              forbidden:
                summary: Caller lacks PageManager/Admin (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-revision-review-forbidden.json
              notFound:
                summary: Unknown revision (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-revision-not-found.json
              notPending:
                summary: Revision is no longer pending (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-revision-review-conflict.json
      '400':
        description: Malformed URI or JSON request body (strict binding failure).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/wiki-parse-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/wiki-unauthenticated.json
      '403':
        description: Authenticated account is frozen or its account information cannot be resolved.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

