getWikiTree:
  get:
    tags: [Wiki]
    summary: Public hierarchical wiki tree across namespaces
    security: []
    operationId: getWikiTree
    responses:
      '200':
        description: Namespace-labeled recursive directory/page tree with active-page flags.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiTreeResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-tree-success.json
      '500':
        description: Wiki tree query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

listWikiNamespaces:
  get:
    tags: [Wiki]
    summary: List public wiki namespaces with page counts
    security: []
    operationId: listWikiNamespaces
    responses:
      '200':
        description: Namespaces ordered by sort order then name, each with its public page count.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiNamespaceListResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-namespaces-success.json
      '500':
        description: Namespace query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

getWikiHome:
  get:
    tags: [Wiki]
    summary: Public wiki home feed with namespaces and recently updated pages
    security: []
    operationId: getWikiHome
    responses:
      '200':
        description: Namespace overview plus recently updated pages ordered by update time desc.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiHomeResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-home-success.json
      '500':
        description: Wiki home query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

searchWikiSearch:
  get:
    tags: [Wiki]
    summary: Search wiki pages at paragraph granularity
    security: []
    operationId: searchWikiSearch
    parameters:
      - name: q
        in: query
        required: true
        description: Search keywords (trimmed; empty query returns an empty result without hitting the search backend).
        schema:
          type: string
          maxLength: 100
      - name: limit
        in: query
        description: Maximum number of page-level results (clamped to 12 when omitted or out of range).
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 12
    responses:
      '200':
        description: |
          Page-level aggregated search results. Each item aggregates the paragraph hits of one
          wiki page and carries its paragraph anchors for precise in-page navigation. When the
          search backend is unavailable the response degrades to an empty items list with
          `searchUnavailable: true` (still HTTP 200). `total` is the page-level result count
          (distinct pages), not the paragraph hit count.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiSearchResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-search-success.json
              empty:
                summary: Empty query returns a deterministic empty result.
                externalValue: ../fixtures/wiki-search-empty.json

getAdminWikiTree:
  get:
    tags: [Wiki Admin]
    summary: Admin hierarchical wiki tree with sort order (PageManager or Admin only)
    operationId: getAdminWikiTree
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Namespace-labeled recursive directory/page tree including sort order for admin editing.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiAdminTreeResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-admin-tree-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: The account is not a PageManager or Admin (or it is frozen).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              forbidden:
                externalValue: ../fixtures/permission-denied.json
      '500':
        description: Wiki tree query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
