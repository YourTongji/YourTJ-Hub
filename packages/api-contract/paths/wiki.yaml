getWikiTree:
  get:
    tags: [Wiki]
    summary: Public wiki page tree across namespaces
    security: []
    operationId: getWikiTree
    responses:
      '200':
        description: Namespace-labeled page tree with an active-page flag for each page.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiTreeResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-tree-success.json
      '500':
        description: Wiki tree query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

listWikiNamespaces:
  get:
    tags: [Wiki]
    summary: List public wiki namespaces with page counts
    security: []
    operationId: listWikiNamespaces
    responses:
      '200':
        description: Namespaces ordered by sort order then name, each with its approved-page count.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiNamespaceListResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-namespaces-success.json
      '500':
        description: Namespace query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

getWikiHome:
  get:
    tags: [Wiki]
    summary: Public wiki home feed with namespaces and recent approved revisions
    security: []
    operationId: getWikiHome
    responses:
      '200':
        description: Namespace overview plus recently updated pages ordered by update time desc.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiHomeResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-home-success.json
      '500':
        description: Wiki home query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

createWikiNamespace:
  post:
    tags: [Wiki Admin]
    summary: Create a wiki namespace (PageManager or Admin only)
    operationId: createWikiNamespace
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/WikiCreateNamespaceRequest
    responses:
      '200':
        description: |
          Namespace created. Business failures are returned as legacy HTTP 200 envelopes:
          malformed bodies degrade to `common.request.invalidParams` (non-strict binding),
          an illegal name is `common.request.invalidParams`, and an existing name is
          `wiki.namespace.nameConflict`.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiNamespaceActionResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-namespace-create-success.json
              invalidParams:
                summary: Malformed body or illegal name (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-namespace-create-invalid-params.json
              conflict:
                summary: Name already exists (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-namespace-create-conflict.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/wiki-unauthenticated.json
      '403':
        description: The account is not a PageManager or Admin (or it is frozen).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              forbidden:
                externalValue: ../fixtures/wiki-namespace-forbidden.json

updateWikiNamespace:
  put:
    tags: [Wiki Admin]
    summary: Update a wiki namespace description (PageManager or Admin only)
    operationId: updateWikiNamespace
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/WikiUpdateNamespaceRequest
    responses:
      '200':
        description: |
          Namespace updated. Business failures are returned as legacy HTTP 200 envelopes:
          request-level validation failures (`common.request.invalidParams`) and an unknown
          namespace (`wiki.namespace.notFound`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiNamespaceActionResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-namespace-update-success.json
              invalidParams:
                summary: Request-level validation failure (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-namespace-update-invalid-params.json
              notFound:
                summary: Unknown namespace (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-namespace-not-found.json
      '400':
        description: Malformed URI or JSON request body (strict binding failure).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/wiki-parse-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/wiki-unauthenticated.json
      '403':
        description: The account is not a PageManager or Admin (or it is frozen).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              forbidden:
                externalValue: ../fixtures/wiki-namespace-forbidden.json

deleteWikiNamespace:
  delete:
    tags: [Wiki Admin]
    summary: Delete a wiki namespace (PageManager or Admin only)
    operationId: deleteWikiNamespace
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    responses:
      '200':
        description: |
          Namespace deleted. Business failures are returned as legacy HTTP 200 envelopes:
          an unknown namespace (`wiki.namespace.notFound`) and a namespace that still
          contains pages (`wiki.namespace.hasPages`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiNamespaceActionResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-namespace-delete-success.json
              notFound:
                summary: Unknown namespace (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-namespace-not-found.json
              hasPages:
                summary: Namespace still contains pages (legacy HTTP 200 envelope).
                externalValue: ../fixtures/wiki-namespace-has-pages.json
      '400':
        description: Malformed URI (strict binding failure).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/wiki-parse-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/wiki-unauthenticated.json
      '403':
        description: The account is not a PageManager or Admin (or it is frozen).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              forbidden:
                externalValue: ../fixtures/wiki-namespace-forbidden.json

