listAdminWikiRevisions:
  get:
    tags: [Wiki Admin]
    summary: List wiki revision history with page path (PageManager or Admin only)
    operationId: listAdminWikiRevisions
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    parameters:
      - name: pageId
        in: query
        required: false
        schema:
          type: integer
          format: uint64
          minimum: 1
        description: When present, only revisions of this page are listed (per-page version history for the diff/rollback view).
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-based page number for the revision history; values below 1 are treated as 1.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Page size for the revision history. The server uses the default 20 for values <= 0 or > 100; the schema accepts 1..100 to reflect tolerated input.
    responses:
      '200':
        description: |
          Revision history (all revisions; write-publish means every revision is an
          approved published version) ordered by creation time desc, paginated by the
          `page`/`pageSize` query parameters (page defaults to 1, pageSize defaults to 20).
          Each page returns a `list` of revisions plus `page`, `pageSize`, and `hasNext`
          paging metadata so consumers can detect the next page. This listing feeds the
          admin version-history view: pick any two revisions for the diff endpoint or a
          target revision for the rollback endpoint.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WikiAdminRevisionListResponse
            examples:
              success:
                externalValue: ../fixtures/wiki-admin-revisions-success.json
              empty:
                summary: Empty history for an unknown page id (legacy HTTP 200 envelope, empty list).
                externalValue: ../fixtures/wiki-admin-revisions-empty.json
      '400':
        description: Malformed query string (strict binding failure).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/wiki-parse-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/wiki-unauthenticated.json
      '403':
        description: The account is not a PageManager or Admin (or it is frozen).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              forbidden:
                externalValue: ../fixtures/wiki-namespace-forbidden.json
