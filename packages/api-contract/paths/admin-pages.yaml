adminGetAnnouncement:
  get:
    tags: [Admin]
    summary: Read the announcement configuration
    operationId: adminGetAnnouncement
    description: |
      Admin console operation gated by the `PageManager` role permission
      (Admin role is a superset); callers without it fail with HTTP 403 and
      `permission.denied`. Returns the stored announcement configuration, or
      the built-in default configuration when nothing has been saved yet.
      `publishedAt` and `items` are omitted when empty; when `items` is
      non-empty it takes precedence over the single-announcement `content`
      on the public site. JSON binding is lenient: query string and body are
      ignored.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Announcement configuration (stored configuration or the built-in default).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminAnnouncementResponse
            examples:
              success:
                externalValue: ../fixtures/admin-announcement-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/admin-announcement-unauthenticated.json
      '403':
        description: Frozen account, or caller lacks the PageManager permission.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/admin-announcement-forbidden.json
              permissionDenied:
                externalValue: ../fixtures/admin-announcement-permission-denied.json

adminSaveAnnouncement:
  post:
    tags: [Admin]
    summary: Replace the announcement configuration
    operationId: adminSaveAnnouncement
    description: |
      Admin console operation gated by the `PageManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`. Replaces
      the whole announcement configuration with the submitted value and
      clears the announcement cache. The server overwrites `publishedAt`
      with the current time on every save. Although `settings` carries a
      `required` validation tag, struct-level `required` never fails, so a
      missing or malformed body (lenient binding) is saved as a zero-value
      configuration with a server-stamped `publishedAt`. There is no
      reachable validation failure.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminSaveAnnouncementRequest
    responses:
      '200':
        description: Configuration saved (`result` is the string `success`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminPageConfigSaveResponse
            examples:
              success:
                externalValue: ../fixtures/admin-save-announcement-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/admin-save-announcement-unauthenticated.json
      '403':
        description: Frozen account, or caller lacks the PageManager permission.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/admin-save-announcement-forbidden.json
              permissionDenied:
                externalValue: ../fixtures/admin-save-announcement-permission-denied.json
