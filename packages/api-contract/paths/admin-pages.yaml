adminGetFriendLinks:
  get:
    tags: [Admin]
    summary: Read the friend-links page configuration
    operationId: adminGetFriendLinks
    description: |
      Admin console operation gated by the `PageManager` role permission
      (Admin role is a superset); callers without it fail with HTTP 403 and
      `permission.denied` (params permission=<localized permission name>,
      `页面管理` in zh). Returns the stored friend-link groups, or the built-in
      default configuration when nothing has been saved yet. Groups with a
      null `links` array are normalized to an empty array. JSON binding is
      lenient: query string and body are ignored.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Friend-link groups (stored configuration or the built-in default).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminFriendLinksResponse
            examples:
              success:
                externalValue: ../fixtures/admin-friend-links-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: Frozen account, or caller lacks the PageManager permission.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-announcement-permission-denied.json

adminSaveFriendLinks:
  post:
    tags: [Admin]
    summary: Replace the friend-links page configuration
    operationId: adminSaveFriendLinks
    description: |
      Admin console operation gated by the `PageManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`. Replaces
      the whole friend-links configuration with the submitted groups and
      clears the friend-links cache. Groups with a null `links` array are
      normalized to an empty array before persistence. URL fields are then
      validated under the shared admin URL policy (issue #409): values are
      trimmed and HTML-entity-decoded; each link `url` must be an absolute
      http(s) URL with a host and each `logoUrl` may be a site-relative path
      or an absolute http(s) URL. Dangerous schemes
      (javascript:/data:/vbscript:/file:), protocol-relative `//`,
      control-character/entity disguises, pure port/no-host forms such as
      `https://:443` and overlong values are rejected; empty values are
      valid. A rejected field fails the request with HTTP 200 `code: 1`,
      messageCode `admin.url.invalid` and params `field` naming the first
      offending field (e.g. `linksInfo[0].links[0].url`); nothing is
      persisted. There are no request validation tags: JSON binding is
      lenient, so a malformed or empty body binds to zero values and is
      saved as-is (a null group list).
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminSaveFriendLinksRequest
    responses:
      '200':
        description: Configuration saved (`result` is the string `success`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminPageConfigSaveResponse
            examples:
              success:
                externalValue: ../fixtures/admin-agent-disable-success.json
              invalidUrl:
                externalValue: ../fixtures/admin-url-invalid.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the PageManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-announcement-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

