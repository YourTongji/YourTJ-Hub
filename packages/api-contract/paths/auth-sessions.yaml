logout:
  post:
    tags: [Authentication]
    summary: Log out and revoke the current session
    operationId: logout
    security: []
    description: |
      Session is optional. When the request carries a valid session token (cookie or Bearer), the
      server revokes that session record, so the token immediately stops authenticating. An absent,
      unverifiable, or already-revoked token is treated as already logged out, which makes this
      operation idempotent. The `access_token` cookie is cleared whenever the logout handler runs,
      including the rare `session.revoke.failed` business failure (HTTP 200 with `code: 1`). A
      cross-site cookie POST (missing or mismatched Origin/Referer) is rejected by the CSRF gate
      before the handler with HTTP 403 `auth.csrf.rejected` and the cookie is left untouched.
    responses:
      '200':
        description: Logout completed (or the caller was already logged out), or a revocation failure.
        headers:
          Set-Cookie:
            description: Expires the HTTP-only `access_token` session cookie whenever the logout handler runs.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/LogoutResponse
            examples:
              success:
                externalValue: ../fixtures/logout-success.json
      '403':
        description: >-
          Cross-site cookie-authenticated POST rejected by the CSRF gate (missing or mismatched
          Origin/Referer, issue #406). The session cookie is not cleared on this path.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

listSessions:
  get:
    tags: [Authentication]
    summary: List the authenticated user's sessions
    operationId: listSessions
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      Returns only non-expired session rows of the caller, newest first, marking the session that
      carries the current token. `ipMasked` never exposes the stored raw address: parseable values
      hide the last IPv4 octet or the IPv6 interface ID, while unparseable values are returned as an
      empty string. Frozen accounts are intentionally not rejected here so they can still inspect
      and revoke their sessions.
    responses:
      '200':
        description: Session list, or a legacy business failure envelope (`session.list.failed`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SessionListResponse
            examples:
              success:
                externalValue: ../fixtures/sessions-list-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json

revokeSession:
  post:
    tags: [Authentication]
    summary: Revoke one of the authenticated user's sessions
    operationId: revokeSession
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      Revokes the session with the given ID, which must belong to the caller. The session carrying
      the current token cannot be revoked this way (`session.current.notRevocable`) — use logout or
      revoke-all instead. Revocation takes effect immediately: the revoked token gets 401 on its
      next request. Malformed JSON, a missing `id`, or a zero `id` are rejected as
      `common.request.invalidParams` (still a legacy HTTP 200 envelope), which keeps them
      distinguishable from revoking a session that does not exist (`session.notFound`). Frozen
      accounts are not rejected here either, so they can still cut off their other sessions.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/RevokeSessionRequest
    responses:
      '200':
        description: Revocation result or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SessionMessageResponse
            examples:
              success:
                externalValue: ../fixtures/sessions-revoke-success.json
              currentSessionNotRevocable:
                externalValue: ../fixtures/sessions-revoke-current.json
              sessionNotFound:
                externalValue: ../fixtures/sessions-revoke-not-found.json
              invalidRequest:
                summary: Malformed JSON or a missing/zero `id`.
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Cross-site cookie-authenticated POST rejected by the CSRF gate (missing or mismatched
          Origin/Referer, issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

revokeAllSessions:
  post:
    tags: [Authentication]
    summary: Revoke every session of the authenticated user
    operationId: revokeAllSessions
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      Atomically deletes all session records of the caller, including the one carrying the current
      token, and increments the account's token version as a second layer of invalidation. If either
      database operation fails, neither change is committed and the endpoint returns
      `session.revoke.failed`. Every existing token of the account gets 401 on its next request
      after a successful revocation; the client must log in again afterwards. Frozen accounts are
      not rejected here either.
    responses:
      '200':
        description: All sessions revoked, or a legacy business failure envelope (`session.revoke.failed`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SessionMessageResponse
            examples:
              success:
                externalValue: ../fixtures/sessions-revoke-all-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Cross-site cookie-authenticated POST rejected by the CSRF gate (missing or mismatched
          Origin/Referer, issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

mobileWebSession:
  get:
    tags: [Authentication]
    summary: Establish an embedded admin browser session from a native bearer
    operationId: mobileWebSession
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: target
        schema:
          type: string
          enum: [admin, moderation, courseManagement, courseReviews]
          default: admin
        description: Fixed workspace destination; each target checks its existing permissions.
    description: |
      First-party mobile WebView handoff. Requires an explicit valid human Bearer session and
      at least one admin permission (admin), moderation-workbench access (moderation), or the
      independent CourseManager/Admin permission (courseManagement and courseReviews).
      Cookie-only authentication is rejected. Installs the same
      session as an HttpOnly, SameSite=Lax cookie (Secure on HTTPS deployments), then redirects
      exclusively to /admin, /moderation, /moderation/courses or /moderation/course-reviews.
      Arbitrary redirect targets are never accepted; no token appears in the URL,
      response body, or New-Token header. Responses are no-store. Normal admin role, revocation,
      writable-account, and CSRF checks continue to apply to all subsequent operations.
    responses:
      '303':
        description: Browser session installed; follow the fixed same-origin admin redirect.
        headers:
          Location:
            schema:
              type: string
              enum: [/admin, /moderation, /moderation/courses, /moderation/course-reviews]
          Set-Cookie:
            schema:
              type: string
            description: HttpOnly access_token session cookie.
          Cache-Control:
            schema:
              type: string
              const: no-store
      '400':
        description: Unsupported workspace target.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '401':
        description: Missing, invalid, expired, revoked, or cookie-only credential.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: The authenticated user has no permission for the selected workspace.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '429':
        description: Login rate limit exceeded.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
