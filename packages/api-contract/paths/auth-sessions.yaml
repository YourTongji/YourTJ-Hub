logout:
  post:
    tags: [Authentication]
    summary: Log out and revoke the current session
    operationId: logout
    security: []
    description: |
      Session is optional. When the request carries a valid session token (cookie or Bearer), the
      server revokes that session record, so the token immediately stops authenticating. An absent,
      unverifiable, or already-revoked token is treated as already logged out, which makes this
      operation idempotent. The `access_token` cookie is cleared on the success and
      already-logged-out paths; the rare `session.revoke.failed` business failure (HTTP 200 with
      `code: 1`) currently returns before the cookie is cleared (tracked in issue #79).
    responses:
      '200':
        description: Logout completed (or the caller was already logged out), or a revocation failure.
        headers:
          Set-Cookie:
            description: Expires the HTTP-only `access_token` session cookie on the success and already-logged-out paths.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/LogoutResponse
            examples:
              success:
                externalValue: ../fixtures/logout-success.json

listSessions:
  get:
    tags: [Authentication]
    summary: List the authenticated user's sessions
    operationId: listSessions
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      Returns all stored session rows of the caller, newest first, marking the session that carries
      the current token; expired rows may appear until housekeeping removes them (tracked in issue
      #79). Parseable addresses in `ipMasked` are privacy-masked (the last IPv4 octet or the IPv6
      interface ID is hidden); unparseable stored values are currently echoed as-is (tracked in
      issue #79). Frozen accounts are intentionally not rejected here so they can still inspect and
      revoke their sessions.
    responses:
      '200':
        description: Session list, or a legacy business failure envelope (`session.list.failed`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SessionListResponse
            examples:
              success:
                externalValue: ../fixtures/sessions-list-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/sessions-unauthenticated.json

revokeSession:
  post:
    tags: [Authentication]
    summary: Revoke one of the authenticated user's sessions
    operationId: revokeSession
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      Revokes the session with the given ID, which must belong to the caller. The session carrying
      the current token cannot be revoked this way (`session.current.notRevocable`) — use logout or
      revoke-all instead. Revocation takes effect immediately: the revoked token gets 401 on its
      next request. Malformed JSON, a missing `id`, or a zero `id` are rejected as
      `common.request.invalidParams` (still a legacy HTTP 200 envelope), which keeps them
      distinguishable from revoking a session that does not exist (`session.notFound`). Frozen
      accounts are not rejected here either, so they can still cut off their other sessions.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/RevokeSessionRequest
    responses:
      '200':
        description: Revocation result or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SessionMessageResponse
            examples:
              success:
                externalValue: ../fixtures/sessions-revoke-success.json
              currentSessionNotRevocable:
                externalValue: ../fixtures/sessions-revoke-current.json
              sessionNotFound:
                externalValue: ../fixtures/sessions-revoke-not-found.json
              invalidRequest:
                summary: Malformed JSON or a missing/zero `id`.
                externalValue: ../fixtures/sessions-revoke-invalid.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/sessions-unauthenticated.json

revokeAllSessions:
  post:
    tags: [Authentication]
    summary: Revoke every session of the authenticated user
    operationId: revokeAllSessions
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      Deletes all session records of the caller, including the one carrying the current token, and
      increments the account's token version as a second layer of invalidation; the increment is
      currently best-effort (not transactional with the deletion, tracked in issue #79). Every
      existing token of the account gets 401 on its next request; the client must log in again
      afterwards. Frozen accounts are not rejected here either.
    responses:
      '200':
        description: All sessions revoked, or a legacy business failure envelope (`session.revoke.failed`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SessionMessageResponse
            examples:
              success:
                externalValue: ../fixtures/sessions-revoke-all-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/sessions-unauthenticated.json
