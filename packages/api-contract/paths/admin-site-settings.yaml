adminSaveSiteTheme:
  post:
    tags: [Admin]
    summary: Stage site theme changes as an unpublished draft
    operationId: adminSaveSiteTheme
    description: |
      Admin console operation gated by the `SiteManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`. Does
      NOT touch the published themes: the submitted `enabled`/`themes`
      become the `prepublish` draft on top of the currently stored
      configuration, with a server-stamped RFC 3339 `updatedAt`. The whole
      configuration is normalized (same rules as adminGetSiteTheme) before
      persistence; a draft with an empty theme list is dropped by
      normalization. The Go struct tags `settings` with
      `validate:"required"`, but struct-level required never fails, so a
      missing or malformed body stages an empty draft that normalization
      then drops. The response is the full normalized configuration after
      staging (including the new draft). Use adminPublishSiteTheme to
      promote the draft.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminSaveSiteThemeRequest
    responses:
      '200':
        description: Full normalized theme configuration after staging the draft.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminSiteThemeResponse
            examples:
              success:
                externalValue: ../fixtures/admin-save-site-theme-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the SiteManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-ai-summary-settings-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

adminPublishSiteTheme:
  post:
    tags: [Admin]
    summary: Publish the staged site theme draft
    operationId: adminPublishSiteTheme
    description: |
      Admin console operation gated by the `SiteManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`.
      Promotes the staged `prepublish` draft written by adminSaveSiteTheme:
      `enabled`/`themes` are copied to the published configuration,
      `publishedAt` is stamped with the current RFC 3339 time, the draft is
      cleared, and the normalized result is persisted. When no draft exists
      the operation is a no-op: nothing is saved and the response is simply
      the current normalized configuration. JSON binding is lenient: query
      string and body are ignored.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Full normalized theme configuration after publishing (or the current configuration when no draft exists).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminSiteThemeResponse
            examples:
              success:
                externalValue: ../fixtures/admin-publish-site-theme-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the SiteManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
