adminSaveSiteSettings:
  post:
    tags: [Admin]
    summary: Replace the site settings
    operationId: adminSaveSiteSettings
    description: |
      Admin console operation gated by the `SiteManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`.
      Replaces the whole site-settings configuration with the submitted
      value and clears the site-settings and llms.txt caches. URL fields
      are validated before persistence under the shared admin URL policy
      (issue #409): values are trimmed and HTML-entity-decoded, then
      `siteUrl` must be an absolute http(s) URL with a host while
      `siteLogo` may be a site-relative path or an absolute http(s) URL.
      Dangerous schemes (javascript:/data:/vbscript:/file:),
      protocol-relative `//`, control-character/entity disguises, pure
      port/no-host forms such as `https://:443` and overlong values are
      rejected; empty values are valid. A rejected field fails the request
      with HTTP 200 `code: 1`, messageCode `admin.url.invalid` and params
      `field` naming the first offending field (`settings.siteUrl` or
      `settings.siteLogo`); nothing is persisted. JSON binding stays
      lenient: a missing/malformed body binds to zero values (empty URL
      fields, hence valid) and is saved as-is.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminSaveSiteSettingsRequest
    responses:
      '200':
        description: Configuration saved (`result` is the string `success`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminPageConfigSaveResponse
            examples:
              success:
                externalValue: ../fixtures/admin-agent-disable-success.json
              invalidUrl:
                externalValue: ../fixtures/admin-url-invalid.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the SiteManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-ai-summary-settings-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

