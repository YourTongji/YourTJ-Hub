adminSaveOnesystemSettings:
  post:
    tags: [Admin]
    summary: Store or clear the 一系统 sync credential
    operationId: adminSaveOnesystemSettings
    description: |
      Admin console operation gated by the `SiteManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`. The
      submitted plaintext cookie is trimmed, encrypted with a
      purpose-scoped AES-256-GCM key derived from `app.signingKey`, and
      only the ciphertext is persisted (the plaintext exists only for the
      duration of the request). An empty/blank cookie clears the stored
      credential. A cookie longer than 4096 characters fails request
      validation with HTTP 200 and `common.request.invalidParams`. If
      encryption itself fails (signingKey misconfigured) the response is a
      generic HTTP 200 `code: 1` failure with no `messageCode` — the
      internal error detail is not exposed.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminSaveOnesystemSettingsRequest
    responses:
      '200':
        description: "Credential stored/cleared (`result` is the string `success`), or a `code: 1` business failure (validation or encryption failure)."
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminPageConfigSaveResponse
            examples:
              success:
                externalValue: ../fixtures/admin-agent-disable-success.json
              cookieTooLong:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the SiteManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
