adminGetServerVersion:
  get:
    tags: [Admin]
    summary: Read the build metadata of the running binary
    operationId: adminGetServerVersion
    description: |
      Admin console operation gated by the `SiteManager` role permission
      (Admin role is a superset); callers without it fail with HTTP 403 and
      `permission.denied` (params permission=<localized permission name>,
      `站点管理` in zh). Read-only: returns the release metadata compiled
      into the binary (build-time ldflags with a Go build-info fallback).
      JSON binding is lenient: query string and body are ignored.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Build metadata (version/commit/buildDate/mode).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminServerVersionResponse
            examples:
              success:
                externalValue: ../fixtures/admin-server-version-success.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: Frozen account, or caller lacks the SiteManager permission.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-ai-summary-settings-permission-denied.json

