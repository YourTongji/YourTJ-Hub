myDecorations:
  get:
    tags:
    - User
    summary: Read the account decoration catalog, entitlements and effective equipment
    operationId: myDecorations
    description: Read the authenticated account's decoration catalog, entitlements and
      equipment. Frozen and pending accounts may read. This GET has no writable-account
      or administration guard and is exempt from cookie CSRF checks. Business failures
      use HTTP 200; inspect code. Catalog availability does not confer ownership.
    security:
    - bearerAuth: []
    - accessTokenCookie: []
    responses:
      '200':
        description: Success or business failure.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/DecorationStateResponse
            examples:
              success:
                externalValue: ../fixtures/decoration-state-empty.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing or invalid session.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              failure:
                externalValue: ../fixtures/auth-required.json
equipDecorations:
  post:
    tags:
    - User
    summary: Equip or remove each owned decoration slot
    operationId: equipDecorations
    description: Hub is the sole decoration entitlement/equipment owner. First release
      grants are administrator-only. Catalog availability does not confer ownership.
      Disabled or unowned selections are rejected. Public projections omit anonymous
      owner cosmetics. Business failures use HTTP 200; inspect code. Writes are CSRF
      protected for cookies and require a writable account. Admin permissions are
      checked independently. Grant/revoke requestKey is durable and retries cannot
      resurrect a revoked grant; changing input for a reused key fails.
    security:
    - bearerAuth: []
    - accessTokenCookie: []
    responses:
      '200':
        description: Success or business failure.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/DecorationStateResponse
            examples:
              success:
                externalValue: ../fixtures/decoration-state-equipped.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing or invalid session.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              failure:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: Frozen/pending account, or missing administration permission.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              failure:
                externalValue: ../fixtures/permission-denied.json
      '400':
        description: Malformed JSON/query or body exceeds 4096 bytes.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              failure:
                externalValue: ../fixtures/parse-failed.json
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/DecorationEquipped
