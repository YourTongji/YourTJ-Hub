writeTopic:
  post:
    tags: [Forum]
    summary: Create or update a topic and its first post
    operationId: writeTopic
    description: |
      Creates a topic and its first post, or updates an existing topic when `topicId`
      is set. Length rules use rendered visible text (see `WriteTopicRequest.content`).
      Request bodies over 2 MiB are rejected with HTTP 400 `common.request.parseFailed`
      before binding; JSON binding is otherwise lenient, so a malformed body within the
      limit binds to zero values and fails as `common.request.invalidParams` (HTTP 200).
      Content moderation (issue #975): the existing sensitive-word gate runs first; when the
      admin-configured AI image/text moderation is enabled in `enforce` mode the request
      waits for a synchronous decision. A block fails with `content.aiModeration.blocked`
      (or `content.aiModeration.externalImageBlocked` when non-site images are disallowed)
      and nothing is written; a review result (or any model failure) stores the content as
      pending review and the success envelope carries `messageCode`
      `content.moderation.pendingReview` (also used for sensitive-word review). In `deferred`
      mode the request does not wait: the content is stored as pending and the envelope carries
      `content.moderation.checking`; a background decision then publishes it, rejects it (the
      author is notified), or leaves it for a reviewer. Disallowed non-site images are still
      rejected synchronously. Images referenced by pending content are not publicly readable
      until approval.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/WriteTopicRequest
    responses:
      '200':
        description: Normal topic result or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WriteTopicResponse
            examples:
              success:
                externalValue: ../fixtures/topic-write-success.json
              pendingReview:
                summary: Content stored as pending review (sensitive-word or AI moderation).
                externalValue: ../fixtures/topic-write-pending-review.json
              checking:
                summary: Deferred AI moderation stored the content as pending and is checking it in the background.
                externalValue: ../fixtures/topic-write-checking.json
              aiBlocked:
                summary: AI moderation blocked the publish; nothing was written.
                externalValue: ../fixtures/topic-write-ai-blocked.json
              aiExternalImageBlocked:
                summary: Site policy disallows non-site images while AI moderation is enabled.
                externalValue: ../fixtures/topic-write-ai-external-image-blocked.json
              invalidRequest:
                summary: Current route behavior for malformed or incomplete JSON.
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
      '429':
        description: Topic-writing rate limit exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
            examples:
              rateLimited:
                externalValue: ../fixtures/topic-write-rate-limited.json
