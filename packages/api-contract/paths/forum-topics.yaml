writeTopic:
  post:
    tags: [Forum]
    summary: Create or update a topic and its first post
    operationId: writeTopic
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/WriteTopicRequest
    responses:
      '200':
        description: Normal topic result or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/WriteTopicResponse
            examples:
              success:
                externalValue: ../fixtures/topic-write-success.json
              invalidRequest:
                summary: Current route behavior for malformed or incomplete JSON.
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
      '429':
        description: Topic-writing rate limit exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
            examples:
              rateLimited:
                externalValue: ../fixtures/topic-write-rate-limited.json
