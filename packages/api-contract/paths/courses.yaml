listCourses:
  get:
    tags: [Forum]
    summary: List the course catalog with optional filters
    security: []
    operationId: listCourses
    parameters:
      - name: keyword
        in: query
        schema:
          type: string
          description: Free-text keyword matched against normalized name, primary code, aliases, pinyin, and initials.
      - name: department
        in: query
        schema:
          type: array
          items:
            type: string
          description: Department name. May repeat; multiple values are OR-joined (union) within this field.
      - name: term
        in: query
        schema:
          type: array
          items:
            type: string
          description: Term code such as 2025-2026-1. May repeat; multiple values are OR-joined (union) within this field.
      - name: campus
        in: query
        schema:
          type: array
          items:
            type: string
          description: Campus. May repeat; multiple values are OR-joined (union) within this field.
      - name: instructor
        in: query
        schema:
          type: array
          items:
            type: string
          description: Teacher name matched against course_instructor name, normalized name, pinyin, and initials. May repeat or be comma-separated; OR-joined (union) within this field.
      - name: onlyWithReviews
        in: query
        schema:
          type: boolean
          description: When true, return only courses that have at least one visible review. Accepts true/1/on (case-insensitive) as truthy values.
      - name: sortBy
        in: query
        schema:
          type: string
          description: Sort order. "rating" sorts by average rating descending with unrated courses last; any other value or empty keeps the default id-descending order.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
          description: 1-based page number. Out-of-range values are clamped to 1 rather than rejected.
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
          description: Page size. Out-of-range values are clamped to 1..50 rather than rejected.
    responses:
      '200':
        description: One page of canonical courses with stable id-desc ordering.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CourseListResponse
            examples:
              success:
                externalValue: ../fixtures/course-list-success.json
      '400':
        description: Malformed query parameters.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/parse-failed.json
      '500':
        description: Catalog query failed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

getCourse:
  get:
    tags: [Forum]
    summary: Get one canonical course with offerings, terms, and instructors
    security: []
    operationId: getCourse
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
    responses:
      '200':
        description: Course detail with offerings grouped by term.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CourseDetailResponse
            examples:
              success:
                externalValue: ../fixtures/course-detail-success.json
      '400':
        description: Malformed course id.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '404':
        description: Course does not exist or is hidden.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              notFound:
                externalValue: ../fixtures/course-not-found.json
      '500':
        description: Course detail query failed (aliases, offerings, instructors, or terms).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              internalError:
                externalValue: ../fixtures/course-internal-error.json

getCourseRelated:
  get:
    tags: [Forum]
    summary: Related courses and teachers for a canonical course
    security: []
    operationId: getCourseRelated
    description: |
      Public read endpoint. Returns up to 5 other visible courses sharing any teacher with the
      requested course (`teacherOtherCourses`) and up to 5 course cards with the same
      primary_code but a different (code, teacher) identity (`sameCourseOtherTeachers`), each
      with rating stats. With the composite identity model, same-code different-teacher rows are
      independent course cards, so both blocks return the same card structure.
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
    responses:
      '200':
        description: Related courses and same-course other-teacher offerings, each list ordered by review count desc and capped at 5.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CourseRelatedResponse
            examples:
              success:
                externalValue: ../fixtures/course-related-success.json
              empty:
                summary: A course with no related teachers or same-course other-teacher offerings.
                externalValue: ../fixtures/course-related-empty.json
      '400':
        description: Malformed or zero course id.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/parse-failed.json
              invalidParams:
                summary: courseId parses as 0 and is rejected by the controller guard.
                externalValue: ../fixtures/course-related-invalid-params.json
      '404':
        description: Course does not exist or is hidden.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              notFound:
                externalValue: ../fixtures/course-not-found.json
      '500':
        description: Related query failed (instructors, stats, terms, or offerings).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              internalError:
                externalValue: ../fixtures/course-internal-error.json

bookmarkCourse:
  post:
    tags: [Forum]
    summary: Bookmark or unbookmark a course
    operationId: bookmarkCourse
    description: |
      Set-semantics and idempotent: repeating the same transition returns true without
      double counting. Unknown or hidden course ids fail with `course.notFound` (HTTP 404);
      a malformed body binds to zero values and fails validation as
      `common.request.invalidParams` on HTTP 200 — this route binds non-strictly
      (`UpButterReq`), so validation failures return the legacy 200 envelope
      rather than 400.
      Course bookmarking reuses the project's
      bookmark semantics (action 1 = bookmark, action 2 = unbookmark).
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/CourseBookmarkRequest
    responses:
      '200':
        description: |
          Bookmark applied (or already in the target state). A malformed body or a zero
          course id also returns HTTP 200 with `common.request.invalidParams`, because this
          route binds non-strictly — clients must branch on `code`, not on the HTTP status.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/InteractionResponse
            examples:
              success:
                externalValue: ../fixtures/result-true.json
              invalidRequest:
                summary: Validation failure (malformed body, or courseId 0) — HTTP 200 legacy envelope.
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '404':
        description: Course does not exist or is hidden.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              notFound:
                externalValue: ../fixtures/course-bookmark-not-found.json
      '429':
        description: Course bookmark rate limit (action `course.bookmark`) exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
            examples:
              rateLimited:
                externalValue: ../fixtures/course-bookmark-rate-limited.json

getCourseSummary:
  get:
    tags: [Forum]
    summary: Get the AI-generated summary of a course (B7, issue #181)
    security: []
    operationId: getCourseSummary
    description: |
      Public read endpoint. Returns the cached AI summary when available (status `cached`),
      generates and persists a fresh one on first request (status `generated`), or reports
      `insufficient_data` when the course has no visible reviews with content (a single
      visible review is enough to generate).
      When the feature is disabled the endpoint returns status `disabled` (HTTP 200).
      `?refresh=true` forces regeneration, subject to per-course and global generation rate
      limits (HTTP 429 with a `Retry-After` header). Generation failure is HTTP 500 and never
      affects the course page main flow. The summary schema is provider-independent
      (OpenAI-compatible chat/completions; qwen/OpenRouter/local Ollama are configuration-only).
      `?check=true` runs a read-only preflight (no generation, no rate-limit consumption) that
      returns `cached` / `insufficient_data` / `none` / `disabled`; it is used by the client on
      mount to decide whether to auto-expand the card or keep it collapsed until first expand.
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: uint64
          minimum: 1
      - name: refresh
        in: query
        schema:
          type: boolean
          default: false
          description: When true, force a fresh generation instead of returning the DB cache.
      - name: check
        in: query
        schema:
          type: boolean
          default: false
          description: |
            When true, run a read-only preflight: no generation happens and no rate-limit
            quota is consumed. Returns `cached` / `insufficient_data` / `none` / `disabled`.
            Mutually exclusive in intent with `refresh` (check wins when both are set).
    responses:
      '200':
        description: |
          Summary result. `status` is one of `cached` / `generated` / `insufficient_data` /
          `disabled`; `summary` is present for `cached` and `generated`.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CourseSummaryResponse
            examples:
              cached:
                summary: An existing summary served from the DB cache.
                externalValue: ../fixtures/course-summary-cached.json
              generated:
                summary: A freshly generated summary persisted to the DB.
                externalValue: ../fixtures/course-summary-generated.json
              insufficientData:
                summary: No visible reviews with content; nothing is persisted.
                externalValue: ../fixtures/course-summary-insufficient-data.json
              disabled:
                summary: The AI summary feature is disabled.
                externalValue: ../fixtures/course-summary-disabled.json
      '400':
        description: Malformed or zero course id.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              parseFailed:
                externalValue: ../fixtures/parse-failed.json
      '404':
        description: Course does not exist or is hidden.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              notFound:
                externalValue: ../fixtures/course-not-found.json
      '429':
        description: |
          Generation rate limit hit (global per-minute or per-course 10-minute window).
          The `Retry-After` header carries the seconds until the window resets; the body
          params carry the same value as `retryAfterSeconds` for clients that cannot read headers.
        headers:
          Retry-After:
            description: Seconds until the rate-limit window resets. Integer seconds as specified by RFC 9110.
            schema:
              type: integer
              format: int32
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
            examples:
              rateLimited:
                externalValue: ../fixtures/course-summary-rate-limited.json
      '500':
        description: LLM provider failure, timeout, or unparsable output. Nothing is persisted.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              internalError:
                externalValue: ../fixtures/course-internal-error.json
