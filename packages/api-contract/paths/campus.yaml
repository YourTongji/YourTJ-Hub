  "dataset": {
    "get": {
      "tags": [
        "Campus"
      ],
      "summary": "campusDataset",
      "operationId": "campusDataset",
      "security": [
        {
          "bearerAuth": []
        },
        {
          "accessTokenCookie": []
        }
      ],
      "description": "Private Tongji connection. One forum account and one official identity are mutually unique. Tokens are never returned. Authorization confirmation is session-bound and one-use. Refresh expiry reserves the binding. The profile dataset exposes only the authenticated student’s own name for a greeting. Academic datasets can be loaded on demand. The today dataset uses the current Asia/Shanghai date and published holiday/makeup rules, sharing original teaching-date semantics with calendar export. Makeup uses the source date week and weekday, replaces target-day classes and removes source-day classes. It always applies adjustments independently of the export switch. Failed rules or incomplete source dates produce an error, never an unadjusted or empty fallback. teachingDay describes the date and adjustment; events retain original day/weeks and must not be filtered again by clients.",
      "responses": {
        "200": {
          "description": "Successful private response; Cache-Control: private, no-store.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CampusDatasetResponse"
              },
              "examples": {
                "success": {
                  "externalValue": "../fixtures/campus-dataset-success.json"
                },
                "today": {
                  "externalValue": "../fixtures/campus-today-success.json"
                }
              }
            }
          }
        },
        "default": {
          "description": "Session, CSRF, writable-account, expired authorization, identity conflict or upstream failure.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../components/schemas.yaml#/ApiFailure"
              }
            }
          }
        },
        "401": {
          "description": "Missing, invalid or revoked forum session.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../components/schemas.yaml#/ApiFailure"
              }
            }
          }
        }
      },
      "parameters": [
        {
          "in": "path",
          "name": "dataset",
          "required": true,
          "schema": {
            "type": "string",
            "enum": [
              "calendar",
              "timetable",
              "grades",
              "summary",
              "cet",
              "terms",
              "messages",
              "sports",
              "health",
              "arrangements",
              "profile",
              "today"
            ]
          }
        }
      ]
    }
  },
  "callback": {
    "get": {
      "tags": [
        "Campus"
      ],
      "summary": "Complete Tongji campus binding or forum sign-in",
      "operationId": "campusCallback",
      "security": [
        {
          "bearerAuth": []
        },
        {
          "accessTokenCookie": []
        },
        {
          "tongjiLoginCookie": []
        }
      ],
      "description": "Uses the purpose of server-issued state. Binding/replace/reauthorize requires the original writable forum session and explicit campus confirmation. Login state instead requires the same browser's HttpOnly yourtj_tongji_login cookie, expires after ten minutes, and is consumed once before exchange. Both verify PKCE S256, nonce, RS256 issuer/audience and the school identity. Login reuses the mutually unique binding or, only for a never-bound identity, prepares a short-lived registration proof. The user then chooses username/password at /register/tongji; final submission atomically creates an activated ordinary account with student-ID@tongji.edu.cn, the chosen password hash, and encrypted campus credentials. No further email verification is required. No account or forum session is created before submission. New registrations honor signup/domain/daily-quota policy. Daily quota is serialized with password registration; account closure does not release the creation-day slot. A retained identity fingerprint prevents repeat automatic registration after unlink, replacement or closure; accountExists directs the user to recover/sign into an existing account and bind explicitly. Existing or freshly staged email claims are never auto-linked; frozen, bot and deleted accounts cannot sign in. The original safe local redirect (including the mobile OIDC bridge) is stored server-side; callback redirects are ignored. Every handled response scrubs authorization parameters and uses private, no-store and no-referrer. Rejected guards never exchange the code.",
      "parameters": [
        {
          "in": "query",
          "name": "state",
          "schema": {
            "type": "string"
          }
        },
        {
          "in": "query",
          "name": "code",
          "schema": {
            "type": "string"
          }
        },
        {
          "in": "query",
          "name": "error",
          "schema": {
            "type": "string"
          }
        }
      ],
      "responses": {
        "303": {
          "description": "Binding returns to /campus?authorization=ready|failed. Sign-in returns existing accounts to the server-stored local destination with a forum session. New identities receive a registration-only HttpOnly cookie and visit /register/tongji without a forum session. Failures return to /login?tongjiNotice=failed|unavailable|accountExists|signupDisabled|accountUnavailable. No school credential appears in Location.",
          "headers": {
            "Location": {
              "schema": {
                "type": "string"
              }
            },
            "Cache-Control": {
              "schema": {
                "type": "string",
                "enum": [
                  "private, no-store"
                ]
              }
            },
            "Referrer-Policy": {
              "schema": {
                "type": "string",
                "enum": [
                  "no-referrer"
                ]
              }
            }
          }
        }
      }
    }
  },
