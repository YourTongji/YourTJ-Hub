                    ],
                    "properties": {
                      "url": {
                        "type": "string",
                        "format": "uri"
                      }
                    },
                    "additionalProperties": false
                  }
                }
              }
            }
          }
        },
        "default": {
          "description": "Session, CSRF, writable-account, expired authorization, identity conflict or upstream failure.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../components/schemas.yaml#/ApiFailure"
              }
            }
          }
        },
        "401": {
          "description": "Missing, invalid or revoked forum session.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../components/schemas.yaml#/ApiFailure"
              }
            }
          }
        }
      },
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "required": [
                "mode"
