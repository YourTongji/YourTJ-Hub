adminStickerMarketUpload:
  post:
    tags: [Admin]
    summary: Add images to an uploaded market pack
    operationId: adminStickerMarketUpload
    description: |
      Admin console operation gated by the `SiteManager` role permission;
      callers without it fail with HTTP 403 and `permission.denied`.
      Bare gin handler with the standard envelope. Accepts one image or a
      zip archive (multipart `file`, the same limits as official imports)
      for the uploaded pack `packId`. Each image passes the upload image
      policy, AVIF is converted as for imports, and the result is stored
      once by content hash. An image the pack already holds is counted as
      skipped; a pack holds at most 500 stickers (`tooManyFiles`).
      Per-image failures (`tooLarge`, `invalidImage`, `saveFailed`) are
      reported in `result.failed`. New stickers get a generated `m_` token
      and their file stem as label, and append after existing ones; the
      pack summary and cover are recomputed. Failures (HTTP 200): missing
      `file` → `upload.file.missing`; over 32MB →
      `admin.sticker.importTooLarge`; neither image nor zip →
      `admin.sticker.importInvalidZip`; unknown or synchronized pack →
      `admin.sticker.notFound`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [packId, file]
            properties:
              packId:
                type: integer
                format: uint64
                minimum: 1
                description: Uploaded pack that receives the images.
              file:
                type: string
                format: binary
                description: One image, or a zip archive of images (≤32MB, ≤500 entries).
    responses:
      '200':
        description: "Upload outcome and the updated pack, or a legacy business failure envelope."
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminStickerMarketUploadResponse
            examples:
              success:
                externalValue: ../fixtures/admin-sticker-market-upload-success.json
              fileMissing:
                externalValue: ../fixtures/admin-img-upload-file-missing.json
              importInvalidZip:
                externalValue: ../fixtures/admin-sticker-import-invalid-zip.json
              packNotFound:
                externalValue: ../fixtures/admin-sticker-not-found.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the SiteManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-ai-summary-settings-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
