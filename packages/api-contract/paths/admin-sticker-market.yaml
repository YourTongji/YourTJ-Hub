adminStickerMarket:
  get:
    tags: [Admin]
    summary: List the sticker market catalog with local state
    operationId: adminStickerMarket
    description: |
      Admin console operation gated by the `SiteManager` role permission
      (Admin role is a superset); callers without it fail with HTTP 403 and
      `permission.denied`. Returns one page of the synchronized market catalog
      (issue #1429) with each pack's import and publication state, plus the source,
      whether the market is enabled and the last successful sync time. Packs keep
      upstream order. Upstream image URLs are never returned; covers are local images.
      `pageSize` outside 1-100 falls back to 50. A database failure returns
      `common.operation.failed`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    parameters:
      - name: topic
        in: query
        schema:
          type: string
        description: Upstream category id; empty lists every category.
      - name: q
        in: query
        schema:
          type: string
        description: Case-insensitive pack name substring.
      - name: status
        in: query
        schema:
          type: string
          enum: ['', imported, published, new, queued, importing, ready, partial, failed]
        description: Empty lists every pack; `imported` keeps packs with stored stickers; `published` keeps visible packs; other values match the import state.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    responses:
      '200':
        description: Catalog page or stable business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminStickerMarketPageResponse
            examples:
              success:
                externalValue: ../fixtures/admin-sticker-market-success.json
      '400':
        description: A non-numeric query value fails query binding.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              failure:
                externalValue: ../fixtures/parse-failed.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the SiteManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-ai-summary-settings-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

adminStickerMarketSync:
  post:
    tags: [Admin]
    summary: Refresh the sticker market catalog
    operationId: adminStickerMarketSync
    description: |
      Admin console operation gated by the `SiteManager` role permission
      (Admin role is a superset); callers without it fail with HTTP 403 and
      `permission.denied`. The server fetches the market index (topics and every
      catalog page) from the configured HTTPS origin through the bounded fetch client:
      no proxy, public addresses only, redirects kept on the index host, bounded size
      and time. Every page is read before anything is written, so a failure keeps the
      last complete snapshot and fails with `admin.sticker.market.unavailable`. Groups
      the complete catalog no longer lists are marked `missing`; their stored stickers
      stay. Sync never downloads images or publishes packs. A concurrent sync fails with
      `admin.sticker.market.busy`; a disabled market fails with
      `admin.sticker.market.disabled`. The request body is ignored. Recorded in the
      operation log.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Sync summary or stable business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminStickerMarketSyncResponse
            examples:
              success:
                externalValue: ../fixtures/admin-sticker-market-sync-success.json
              unavailable:
                externalValue: ../fixtures/admin-sticker-market-unavailable.json
              busy:
                externalValue: ../fixtures/admin-sticker-market-busy.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the SiteManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-ai-summary-settings-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

adminStickerMarketPack:
  get:
    tags: [Admin]
    summary: Review one market pack before publishing
    operationId: adminStickerMarketPack
    description: |
      Admin console operation gated by the `SiteManager` role permission
      (Admin role is a superset); callers without it fail with HTTP 403 and
      `permission.denied`. Returns the pack with every recorded upstream item: the
      local sticker, its stored image, whether it is enabled, and a stable failure
      reason for items that could not be stored. Unknown ids fail with
      `admin.sticker.notFound`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    parameters:
      - name: id
        in: query
        required: true
        schema:
