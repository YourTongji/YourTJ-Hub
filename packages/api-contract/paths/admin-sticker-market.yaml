adminStickerMarketImport:
  post:
    tags: [Admin]
    summary: Import one market pack
    operationId: adminStickerMarketImport
    description: |
      Admin console operation gated by the `SiteManager` role permission
      (Admin role is a superset); callers without it fail with HTTP 403 and
      `permission.denied`. Queues a background download of the pack's current
      upstream items, at most the first 500. The worker fetches only HTTPS images on
      the configured host allowlist, validates them by their bytes (PNG, JPEG, GIF,
      WebP; at most 4 MiB and 4096 px per side) and stores each distinct image once,
      named by its SHA-256, so packs and stickers that share an image share one object.
      Items that already have a local sticker are never downloaded again and keep
      their image. Each stored item becomes a shared sticker with a stable `m_` token.
      Importing does not publish. A pack that is already queued or importing fails
      with `admin.sticker.market.busy`; unknown ids fail with `admin.sticker.notFound`.
      Recorded in the operation log.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminStickerMarketPackRequest
    responses:
      '200':
        description: Queued pack or stable business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminStickerMarketPackResponse
            examples:
              success:
                externalValue: ../fixtures/admin-sticker-market-import-success.json
              busy:
                externalValue: ../fixtures/admin-sticker-market-busy.json
              notFound:
                externalValue: ../fixtures/admin-sticker-not-found.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the SiteManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              permissionDenied:
                externalValue: ../fixtures/admin-ai-summary-settings-permission-denied.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

adminStickerMarketPackSave:
  post:
    tags: [Admin]
    summary: Publish, hide or reorder one market pack
    operationId: adminStickerMarketPackSave
    description: |
      Admin console operation gated by the `SiteManager` role permission
      (Admin role is a superset); callers without it fail with HTTP 403 and
      `permission.denied`. Sets whether the pack appears in the market and in
      subscribers' pickers, and its order among published packs. Publishing requires at
      least one stored sticker and otherwise fails with `admin.sticker.market.notReady`.
      Hiding keeps subscriptions and never breaks stickers that were already sent.
      Unknown ids fail with `admin.sticker.notFound`. Recorded in the operation log.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminStickerMarketPackSaveRequest
    responses:
      '200':
        description: Saved pack or stable business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminStickerMarketPackResponse
            examples:
              success:
                externalValue: ../fixtures/admin-sticker-market-pack-save-success.json
              notReady:
                externalValue: ../fixtures/admin-sticker-market-not-ready.json
              notFound:
                externalValue: ../fixtures/admin-sticker-not-found.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Frozen account, or caller lacks the SiteManager permission.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
