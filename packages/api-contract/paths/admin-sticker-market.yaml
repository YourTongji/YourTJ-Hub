adminStickerMarketItemSave:
  post:
    tags: [Admin]
    summary: Withdraw or restore one market sticker
    operationId: adminStickerMarketItemSave
    description: |
      Admin console operation gated by the `SiteManager` role permission
      (Admin role is a superset); callers without it fail with HTTP 403 and
      `permission.denied`. Disabling a market sticker removes it from every pack
      and picker, prevents new use and stops its sent tokens from resolving, like a
      disabled official sticker; enabling restores it. Ids that are not market stickers
      fail with `admin.sticker.notFound`. Recorded in the operation log.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminStickerMarketItemSaveRequest
    responses:
      '200':
        description: Result or stable business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ContentActionResponse
            examples:
              success:
                externalValue: ../fixtures/my-sticker-action-success.json
              notFound:
                externalValue: ../fixtures/admin-sticker-not-found.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
