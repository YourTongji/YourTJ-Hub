followUser:
  post:
    tags: [Forum]
    summary: Follow or unfollow a user
    operationId: followUser
    description: |
      Set-semantics and idempotent: repeating the same transition returns true without
      double counting. JSON binding is lenient: a malformed body binds to zero values
      and the request then fails as `user.notFound` (HTTP 200) rather than a 400.
      Business failures: `user.notFound`, `common.request.invalidParams`.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/FollowUserRequest
    responses:
      '200':
        description: Follow state applied, or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/InteractionResponse
            examples:
              success:
                externalValue: ../fixtures/result-true.json
              userNotFound:
                externalValue: ../fixtures/admin-save-user-badges-user-not-found.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
      '429':
        description: Interaction rate limit (action `interact`) exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
            examples:
              rateLimited:
                externalValue: ../fixtures/account-close-rate-limited.json

createReport:
  post:
    tags: [Forum]
    summary: Report a topic or post to moderators
    operationId: createReport
    description: |
      Files a moderation report against a visible topic or post and snapshots the
      target content as evidence at creation time. One open report per reporter and
      target: a second report for the same target fails with `report.duplicate`
      (HTTP 200). Reporting own content fails with `report.ownContent`; an unknown or
      not-viewable target fails with `report.targetInvalid`. JSON binding is lenient:
      a malformed body binds to zero values and fails validation as
      `common.request.invalidParams` (HTTP 200).
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/CreateReportRequest
    responses:
      '200':
        description: Report created, or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/InteractionResponse
            examples:
              success:
                externalValue: ../fixtures/result-true.json
              targetInvalid:
                externalValue: ../fixtures/course-review-report-target-invalid.json
              duplicate:
                externalValue: ../fixtures/course-review-report-duplicate.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
      '429':
        description: Interaction rate limit (action `interact`) exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
            examples:
              rateLimited:
                externalValue: ../fixtures/account-close-rate-limited.json
