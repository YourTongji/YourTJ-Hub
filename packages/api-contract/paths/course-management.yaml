adminCourseMerge:
  post:
    tags: [Forum]
    summary: Confirm equivalence and physically merge a course into another (CourseManager/Admin)
    operationId: adminCourseMerge
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      CourseManager-scoped write. Human-confirmed physical merge of an EQUIVALENT/RENAMED_FROM
      candidate: offerings (with their reviews and instructor links) move from the from-course to
      the to-course, aliases migrate with conflict skipping, the from-course is hidden, the
      candidate becomes merged with a merge snapshot, and search/stat rebuilds are enqueued.
      Reversible via `adminCourseMergeUndo`. Writes an audit log entry.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminCourseRelationActionRequest
    responses:
      '200':
        description: Merge counts (offerings moved, aliases migrated/skipped), or a business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminCourseMergeResponse
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '403':
        description: >-
          Cross-site cookie-authenticated request rejected by the CSRF gate (missing or
          mismatched Origin/Referer, issue #406). The session cookie is not cleared.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
      '404':
        description: Candidate or a referenced course does not exist.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '409':
        description: Candidate not mergeable, already merged, blocked by another pending merge, or target hidden.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

adminCourseMergeUndo:
  post:
    tags: [Forum]
    summary: Undo a confirmed course merge (CourseManager/Admin)
    operationId: adminCourseMergeUndo
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      CourseManager-scoped write. Reverses a merged candidate from its merge snapshot: offerings
      move back to the from-course, aliases move back, the from-course becomes visible again, and
      the candidate returns to approved. Writes an audit log entry.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminCourseRelationActionRequest
    responses:
      '200':
        description: Undo counts (offerings moved back), or a business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminCourseMergeResponse
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '403':
        description: >-
          Cross-site cookie-authenticated request rejected by the CSRF gate (missing or
          mismatched Origin/Referer, issue #406). The session cookie is not cleared.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
      '404':
        description: Candidate does not exist.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '409':
        description: Candidate was never merged.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
