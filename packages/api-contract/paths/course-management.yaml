adminCourseRelationApprove:
  post:
    tags: [Forum]
    summary: Approve a non-merge lineage candidate (CourseManager/Admin)
    operationId: adminCourseRelationApprove
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    description: |
      CourseManager-scoped write. Marks a SPLIT_FROM/MERGED_FROM/RELATED candidate approved
      (pending → approved). EQUIVALENT/RENAMED_FROM candidates must go through the merge
      operation (`adminCourseMerge`); passing one here is a 409 `course.relation.notMerge`
      business failure. Writes an audit log entry.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/AdminCourseRelationActionRequest
    responses:
      '200':
        description: The updated lineage candidate, or a business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/AdminCourseRelationItemResponse
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '403':
        description: >-
          Cross-site cookie-authenticated request rejected by the CSRF gate (missing or
          mismatched Origin/Referer, issue #406). The session cookie is not cleared.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
      '404':
        description: Candidate does not exist.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '409':
        description: Candidate type is not approvable (EQUIVALENT/RENAMED_FROM must merge).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure

