moderationUpdateTopicStatus:
  post:
    tags: [Forum]
    summary: Ban or unban a topic from the moderation workbench
    operationId: moderationUpdateTopicStatus
    description: |
      Moderator workbench operation. Authorization is decided inside the controller
      (`CanModerateAnyCategory`: Admin, global moderator, or a moderator of one of the
      topic's categories) — it does NOT use the role-permission middleware, so a
      caller without moderation scope fails with HTTP 200 and `permission.denied`,
      not 403. Unknown topics fail with `topic.notFound` (HTTP 200) before the
      permission check. The operation is idempotent: re-applying the current status
      returns true. JSON binding is lenient: a malformed body binds to zero values
      and fails validation as `common.request.invalidParams` (HTTP 200). Other
      business failures: `common.operation.failed` (HTTP 200).
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ModerationTopicStatusRequest
    responses:
      '200':
        description: Status applied, or a legacy business failure envelope (`topic.notFound` / `permission.denied` / `common.operation.failed` / `common.request.invalidParams`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ModerationActionResponse
            examples:
              success:
                externalValue: ../fixtures/result-true.json
              permissionDenied:
                externalValue: ../fixtures/permission-denied.json
              topicNotFound:
                externalValue: ../fixtures/admin-topic-categories-edit-topic-not-found.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

