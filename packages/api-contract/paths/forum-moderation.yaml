viewDeletedContent:
  post:
    tags: [Forum]
    summary: View the raw content of a deleted topic or post (audited)
    operationId: viewDeletedContent
    description: |
      Moderator workbench operation. Authorization is decided inside the controller
      in two steps (`CanAccessModeration`, then `CanModerateAnyCategory` against the
      content's categories) — it does NOT use the role-permission middleware, so a
      caller without moderation scope fails with HTTP 200 and `permission.denied`,
      not 403. The audit reason is mandatory and every view is written to the
      moderation log. Since the deletion final state is data retention
      (MADR-0021, issue #555), permanently purged content is returned here —
      bodies/titles are retained exactly so moderators can recover them with
      this audited view; only unknown or still-visible content fails with
      `topic.notFound` / `post.notFound` (HTTP 200). JSON binding is lenient:
      a malformed body binds to zero values and fails validation as
      `common.request.invalidParams` (HTTP 200), which is also returned for a blank
      reason or an unknown contentType.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ViewDeletedContentRequest
    responses:
      '200':
        description: Deleted content view, or a legacy business failure envelope (`topic.notFound` / `post.notFound` / `permission.denied` / `common.request.invalidParams`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ViewDeletedContentResponse
            examples:
              success:
                externalValue: ../fixtures/moderation-view-deleted-content-success.json
              permissionDenied:
                externalValue: ../fixtures/permission-denied.json
              topicNotFound:
                externalValue: ../fixtures/admin-topic-categories-edit-topic-not-found.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json

listModerationReviewQueue:
