listModerationReports:
  post:
    tags: [Forum]
    summary: Page through the moderation report queue
    operationId: listModerationReports
    description: |
      Read endpoint of the moderation workbench. Authorization is decided inside the
      controller (`CanAccessModeration`: Admin or any moderator grant) — a caller
      without moderation access fails with HTTP 200 and `permission.denied`, not 403.
      Results are restricted to the caller's category scope; the optional category
      filter is intersected with that scope. This route is mounted without the
      writable-account middleware, so frozen accounts can still read the queue.
      JSON binding is lenient: a malformed body binds to zero values and returns the
      first page of open reports; an invalid status filter fails validation as
      `common.request.invalidParams` (HTTP 200).
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ModerationReportListRequest
    responses:
      '200':
        description: Report page, or a legacy business failure envelope (`permission.denied` / `common.request.invalidParams`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ModerationReportListResponse
            examples:
              success:
                externalValue: ../fixtures/moderation-reports-success.json
              permissionDenied:
                externalValue: ../fixtures/permission-denied.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Cross-site cookie-authenticated request rejected by the CSRF gate (missing or
          mismatched Origin/Referer, issue #406). The session cookie is not cleared.
        content:
          application/json:
