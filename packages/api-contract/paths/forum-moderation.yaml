listModerationLogs:
  post:
    tags: [Forum]
    summary: Page through the moderation audit log
    operationId: listModerationLogs
    description: |
      Read endpoint of the moderation workbench. Authorization is decided inside the
      controller (`CanAccessModeration` plus a non-empty moderation scope) — a caller
      without moderation access fails with HTTP 200 and `permission.denied`, not 403.
      Entries are restricted to the caller's category scope; Admins and global
      moderators see all entries. This route is mounted without the writable-account
      middleware, so frozen accounts can still read the log. JSON binding is lenient:
      a malformed body binds to zero values and returns the first page.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ModerationLogListRequest
    responses:
      '200':
        description: Log page, or a legacy business failure envelope (`permission.denied`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ModerationLogListResponse
            examples:
              success:
                externalValue: ../fixtures/moderation-logs-success.json
              permissionDenied:
                externalValue: ../fixtures/permission-denied.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json

viewDeletedContent:
  post:
    tags: [Forum]
    summary: View the raw content of a deleted topic or post (audited)
    operationId: viewDeletedContent
    description: |
      Moderator workbench operation. Authorization is decided inside the controller
      in two steps (`CanAccessModeration`, then `CanModerateAnyCategory` against the
      content's categories) — it does NOT use the role-permission middleware, so a
      caller without moderation scope fails with HTTP 200 and `permission.denied`,
      not 403. The audit reason is mandatory and every view is written to the
      moderation log. Unknown, still-visible, or permanently purged content fails
      with `topic.notFound` / `post.notFound` (HTTP 200). JSON binding is lenient:
      a malformed body binds to zero values and fails validation as
      `common.request.invalidParams` (HTTP 200), which is also returned for a blank
      reason or an unknown contentType.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ViewDeletedContentRequest
    responses:
      '200':
        description: Deleted content view, or a legacy business failure envelope (`topic.notFound` / `post.notFound` / `permission.denied` / `common.request.invalidParams`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ViewDeletedContentResponse
            examples:
              success:
                externalValue: ../fixtures/moderation-view-deleted-content-success.json
              permissionDenied:
                externalValue: ../fixtures/permission-denied.json
              topicNotFound:
                externalValue: ../fixtures/admin-topic-categories-edit-topic-not-found.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: Authenticated account is frozen or its account information cannot be resolved.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
