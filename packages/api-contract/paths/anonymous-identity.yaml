getAnonymousIdentityState:
  get:
    tags: [Forum]
    summary: getAnonymousIdentityState
    operationId: getAnonymousIdentityState
    description: >-
      Private, no-store response. One persona per numeric owner, shared across clients.
      State reads share the configurable interaction rate limit with persona writes.
      New names freely combine embedded action, scene/object and animal components as six Han characters (phrase6-v1); existing names and persisted batches remain unchanged.
      Shanghai calendar day allows ten idempotent batches of ten distinct words.
      Confirmation preserves UID and avatar and locks the name until the next calendar anniversary.
      Reveal requires an explicit permission 7 grant, a reason, and a committed private audit;
      Admin and moderator permissions alone do not grant reveal.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    responses:
      '200':
        description: Success or business failure
        content:
          application/json:
            schema:
              $ref: ../components/anonymous-identity.yaml#/getAnonymousIdentityStateResponse
            examples:
              success:
                externalValue: ../fixtures/anonymous-state-success.json
      '401':
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '403':
        description: Frozen account, write eligibility or CSRF rejected
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
      '429':
        description: Interaction rate limited
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
