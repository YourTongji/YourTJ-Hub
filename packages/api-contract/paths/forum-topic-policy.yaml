updateTopicAgentReplies:
  post:
    tags: [Forum]
    summary: Set the own topic robot reply policy
    operationId: updateTopicAgentReplies
    description: |
      Immediately sets the robot reply policy of an active ordinary forum topic.
      Only its author may change it; Wiki and deleted topics cannot be changed.
      Does not edit content or enter moderation. Repeated values are idempotent.
      Both true and false must be explicitly supplied. Missing values return
      `common.request.invalidParams`. Non-owners and unsupported topics return
      `topic.operationDenied`; missing topics return `topic.notFound`.
      A database error returns `common.operation.failed`. Business failures use
      HTTP 200 with code 1. Bot identities cannot bypass the policy by role or transport.
    security:
      - bearerAuth: []
      - accessTokenCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/UpdateTopicAgentRepliesRequest
    responses:
      '200':
        description: Status applied (or already in the target state), or a legacy business failure envelope.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/InteractionResponse
            examples:
              success:
                externalValue: ../fixtures/result-true.json
              topicNotFound:
                externalValue: ../fixtures/admin-topic-categories-edit-topic-not-found.json
              invalidParams:
                externalValue: ../fixtures/invalid-params.json
      '401':
        description: Missing, invalid, expired, or revoked access token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              unauthenticated:
                externalValue: ../fixtures/auth-required.json
      '403':
        description: >-
          Authenticated account is frozen or its account information cannot be resolved.
          A cross-site cookie-authenticated request (missing or mismatched Origin/Referer) is rejected
          by the CSRF gate before the handler with HTTP 403 `auth.csrf.rejected`; the session cookie
          is not cleared (issue #406).
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ApiFailure
            examples:
              frozenAccount:
                externalValue: ../fixtures/account-frozen.json
              csrfRejected:
                externalValue: ../fixtures/csrf-rejected.json
      '429':
        description: Interaction rate limit (action `interact`) exceeded.
        headers:
          Retry-After:
            required: true
            schema:
              type: integer
              minimum: 1
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/RateLimitedFailure
            examples:
              rateLimited:
                externalValue: ../fixtures/account-close-rate-limited.json
